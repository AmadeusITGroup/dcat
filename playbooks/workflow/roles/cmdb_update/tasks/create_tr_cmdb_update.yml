---   
    - name: "Handling Create TR- Win@proach for CMDB Update task "
      vars:
        input: "{{ lookup('file','config.json') | from_json }}"
      block:
        - name: generate output files for every module
          file:
            path: "{{ item }}"
            state: touch
            mode: 0644
          with_items:
            - vm_cmdb_success.yml
            - vm_cmdb_failure.yml    
            - vm_cmdb_stat_final.json
            - record_cmdb_stat.json
            - deco_hosts.txt
            - record_cmdb_upd.json
          no_log: true

        - set_fact:
            file_cmdb_suc: "vm_cmdb_success.yml"            

        - name: Create the list
          set_fact: 
            host_data: "{{ my_string.split(',') }}" 

        - name: set env data
          set_fact:
            env_data: "{{ hostvars.localhost.env_data.msg }}"

        - name: set DEV env variable
          set_fact:
            state_file: "{{ input.dev.state_file_url }}"
            lookup_file: "{{ input.dev.lookup_file }}"
            ipam_grid: "{{ input.dev.ipam_grid }}" 
            synergon_url: "{{ input.dev.synergon_url }}" 
            cmdb_url_update: "{{ input.dev.cmdb_url_update }}" 
            nas_box: "{{ input.dev.nas_box }}"
            ipam_network_view: "{{ input.dev.ipam_network_view }}"
            dns_grid: "{{ input.dev.dns_grid }}"
            dns_network_view: "{{ input.dev.dns_network_view }}"
            dev_box_a: "{{ input.dev.dev_box_a }}"
            dev_box_b: "{{ input.dev.dev_box_b }}"
            winaproach_category: "{{ input.dev.winaproach_category }}"
            ptr_system: "{{ input.dev.ptr_system }}"
            bird_api: "{{ input.dev.bird_api }}"
          run_once: True
          delegate_to: localhost
          when: env_data == "dev"

        - name: set PROD env variable
          set_fact:
            state_file: "{{ input.prod.state_file_url }}"
            lookup_file: "{{ input.prod.lookup_file }}"
            ipam_grid: "{{ input.prod.ipam_grid }}"
            synergon_url: "{{ input.prod.synergon_url }}"
            cmdb_url_update: "{{ input.prod.cmdb_url_update }}"
            ipam_network_view: "{{ input.prod.ipam_network_view }}"
            dns_network_view: "{{ input.prod.dns_network_view }}"
            dns_grid: "{{ input.prod.dns_grid }}"
            nas_box: "{{ input.prod.nas_box }}"
            prod_box_c: "{{ input.prod.prod_box_c }}"
            prod_box_d: "{{ input.prod.prod_box_d }}"
            prod_box_e: "{{ input.prod.prod_box_e }}"
            prod_box_f: "{{ input.prod.prod_box_f }}"
            prod_box_g: "{{ input.prod.prod_box_g }}"
            winaproach_category: "{{ input.prod.winaproach_category }}"
            ptr_system: "{{ input.prod.ptr_system }}"
            bird_api: "{{ input.prod.bird_api }}" 
          run_once: True
          delegate_to: localhost                                       
          when: env_data == "prod"


        # - name: Display the JSON file content
        #   shell: cat winaproach_category.yml
        #   delegate_to: localhost
        #   register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ winaproach_category }}" 
          delegate_to: localhost

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_system: "{{ ptr_system }}" 
          delegate_to: localhost

        # - name: Display the JSON file content
        #   shell: cat bird_api.yml
        #   delegate_to: localhost
        #   register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ bird_api }}" 
          delegate_to: localhost                     

        - debug:
            var: host_data

        - name: TR creation for CMDB Update task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT : cmdb update to DECO in Progress"
            ci: "{{ host_data }}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id_cmdb_update
          delegate_to: localhost

        # - name: "Custom module [CREATE TR]"
        #   create_tr:
        #     record_type: "TR"
        #     title: "DECO - cmdb status update"
        #     assignee_name: "DecoP112686"
        #     assignee_group: "DINFDECO"           
        #     severity: "4"
        #     overview: "DECO - cmdb status update"
        #     parent_id: "{{ cr }}"            
        #     username: "{{ winaproach_username }}"    
        #     password: "{{ winaproach_password }}"
        #   delegate_to: localhost  
        #   no_log: False
        #   register: create_tr_output

        # - set_fact:
        #     record_id_cmdb_up: "{{ create_tr_output.record_id }}"
                      
      
        - debug:
            var: ticket_id_cmdb_update

        - set_fact:
            record_id_cmdb_up: "{{ticket_id_cmdb_update.id.ticketId}}"
  
    
        - copy:
            content: '{{ record_id_cmdb_up|to_json }}'
            dest: record_cmdb_upd.json
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - cmdb update TR"

    - name: "Handling Create TR- Win@proach for CMDB Update task - retry 1 "
      block:


        - name: Display the JSON file content for cmdb update
          shell: cat record_cmdb_upd.json
          delegate_to: localhost
          register: TR_result_cmdb_up  

        - name: save the Json data to a Variable as a Fact for cmdb update
          set_fact:
            record_id_cmdb_up: "{{ TR_result_cmdb_up.stdout[1:-1] }}"
          delegate_to: localhost

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_id_cmdb_up == ""                                  


        # - name: Display the JSON file content
        #   shell: cat winaproach_category.yml
        #   delegate_to: localhost
        #   register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ winaproach_category }}" 
          delegate_to: localhost 

        # - name: Display the JSON file content
        #   shell: cat bird_api.yml
        #   delegate_to: localhost
        #   register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ bird_api }}" 
          delegate_to: localhost                    

        - name: TR creation for CMDB Update task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT : cmdb update to DECO in Progress"
            ci: "{{ host_data }}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id_cmdb_update
          delegate_to: localhost
          when: record_id_cmdb_up == ""
           

        - set_fact:
            record_id_cmdb_update: "{{ticket_id_cmdb_update.id.ticketId}}"
          when: record_id_cmdb_up == ""  
   
    
        - copy:
            content: '{{ record_id_cmdb_update|to_json }}'
            dest: record_cmdb_upd.json
          delegate_to: localhost
          when: record_id_cmdb_up == ""

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - cmdb update TR"

    - name: "Handling Create TR- Win@proach for CMDB Update task -retry 2 "
      block:

        - name: Display the JSON file content for cmdb update
          shell: cat record_cmdb_upd.json
          delegate_to: localhost
          register: TR_result_cmdb_up  

        - name: save the Json data to a Variable as a Fact for cmdb update
          set_fact:
            record_id_cmdb_up: "{{ TR_result_cmdb_up.stdout[1:-1] }}"
          delegate_to: localhost

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_id_cmdb_up == ""                                 


        # - name: Display the JSON file content
        #   shell: cat winaproach_category.yml
        #   delegate_to: localhost
        #   register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ winaproach_category }}" 
          delegate_to: localhost

        # - name: Display the JSON file content
        #   shell: cat bird_api.yml
        #   delegate_to: localhost
        #   register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ bird_api }}" 
          delegate_to: localhost
          

        - name: TR creation for CMDB Update task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT : cmdb update to DECO in Progress"
            ci: "{{ host_data }}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id_cmdb_update
          delegate_to: localhost
          when: record_id_cmdb_up == ""
          

        - set_fact:
            record_id_cmdb_update: "{{ticket_id_cmdb_update.id.ticketId}}"
          when: record_id_cmdb_up == ""
    
    
        - copy:
            content: '{{ record_id_cmdb_update|to_json }}'
            dest: record_cmdb_upd.json
          delegate_to: localhost
          when: record_id_cmdb_up == ""

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - cmdb update TR"                        

    - name: "Handling Start Implementation- Win@proach cmdb update TR "
      block:
        - name: Display the JSON file content for cmdb update
          shell: cat record_cmdb_upd.json
          delegate_to: localhost
          register: TR_result_cmdb_up  

        - name: save the Json data to a Variable as a Fact for cmdb update
          set_fact:
            record_id_cmdb_up: "{{ TR_result_cmdb_up.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_cmdb_up == "" 

        - name: Sleep for 62 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 62
          delegate_to: localhost

          delegate_to: localhost
        - name: Start Implementation for CMDB update TR
          winaproach:
            system: prod
            type: task_record
            operation: start_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_cmdb_up }}"
          register: start_implementation
          delegate_to: localhost
        
    
      rescue:
        - name: dump test output in the rescue block cmdb update
          debug:
            msg: "Failed to Start Implementation on VM DECO - CMDB update :'{{ record_id_cmdb_up }}'"