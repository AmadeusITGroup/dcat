---
- name: "server_shutdown cleanup"
  hosts: physicaldeco
  gather_facts: no    
  tasks: 
    - name: server_shutdown cleanup
      ansible.builtin.import_role:
        name: server_shutdown_bgp
        tasks_from: filter_hostlist_server_shutdown.yml

- name: "Create TR for server_shutdown cleanup"
  hosts: localhost
  gather_facts: no
  vars:
    graceperiod_flag: True
  tasks:
    - name: server_shutdown cleanup
      ansible.builtin.import_role:
        name: server_shutdown_bgp
        tasks_from: create_tr_server_shutdown.yml

- name: "server_shutdown cleanup"
  hosts: physicaldeco
  gather_facts: no   
  tasks: 
    - name: server_shutdown cleanup
      ansible.builtin.import_role:
        name: server_shutdown_bgp
        tasks_from: server_shutdown_main.yml
      when: shutdown_bgp is defined and (shutdown_bgp == "F") and san_info_fetch is defined and (san_info_fetch == "T") and cmdb_fetch_bgp is defined and (cmdb_fetch_bgp == "T")

- name: "Add info TR for server_shutdown cleanup"
  hosts: localhost
  gather_facts: no
  vars:   
    graceperiod_flag: True
  tasks:
    - name: server_shutdown cleanup
      ansible.builtin.import_role:
        name: server_shutdown_bgp
        tasks_from: add_info_server_shutdown.yml