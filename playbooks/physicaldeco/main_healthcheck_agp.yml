- name: "Create TR for healthcheck second trigger"
  hosts: localhost
  gather_facts: no
  vars:
    graceperiod_flag: False
  tasks:
    - name: healthcheck second trigger
      ansible.builtin.import_role:
        name: healthcheck_agp
        tasks_from: create_tr_health_check.yml

    - name: healthcheck second trigger
      ansible.builtin.import_role:
        name: healthcheck_agp
        tasks_from: add_info_healthcheck.yml

    - name: healthcheck second trigger
