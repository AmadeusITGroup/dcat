- name: "healthcheck second trigger"
  hosts: localhost
  gather_facts: no
  vars:
    graceperiod_flag: False   
  tasks:
    - name: healthcheck second trigger
      ansible.builtin.import_role:
        name: healthcheck_agp
        tasks_from: health_check.yml

    - name: healthcheck second trigger
      ansible.builtin.import_role:
        name: healthcheck_agp
        tasks_from: health_check_network_validation.yml       

