---             
    - name: "Handling node list, TR and retention days"
      throttle: 1
      block:
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      


        - name: Display the JSON file content
          shell: cat record_for_poweron.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_poweron: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost        

        - meta: end_host
          when: record_for_poweron == ""      

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}"

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "Check entry for DECO server"
          azure_update_ref_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost
 
        - set_fact:
            serial_status: '{{ idem_status.module_update.serial }}'

        - name: Check ILO endpoints
          uri:
            url: https://ilo{{ serial_status }}.<server_fqdn>
            validate_certs: False
          register: ilo_status
          delegate_to: localhost
          ignore_errors: yes
      
      
        - set_fact:
            ilo_result: "{{ ilo_status.status }}"
          
        - debug:
            var: ilo_result
      
        - set_fact:
            username: "{{ user_iloadm }}"
          when: ilo_result == '200'
        
        - set_fact:
            password: "{{ password_iloadm }}"
          when: ilo_result == '200'

        - set_fact:
            ilohost: "{{ 'ilo'+ serial_status +'.<server_fqdn>' }}"
          when: ilo_result == '200'          
      

        - name: Power on server from ILO
          poweron_ilo:
            hostname: "{{ ilohost }}"
            username: "{{ username }}"
            password: "{{ password }}"
          register: poweron_info
          delegate_to: localhost 

        - set_fact:
            result: "{{ poweron_info.Status }}"

        - debug:
            var: result       

        - name: Sleep for 300 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 310
          delegate_to: localhost

        - set_fact:
             poweron_status: "Success"
          when: result is search("power already|powering on")
          
        - name: "Pass phy data's"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully poweredon" >> phy_list.yml   
          delegate_to: localhost 
          when: result is search("power already|powering on")
                            
        - name: "update entry for DECO server for fqdn "
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "poweron"
            status: "T"          
          register: update_status
          delegate_to: localhost          
          when: poweron_status == "Success"                           
        
      rescue:
        - debug:
            var: phy_result 

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}"

        - name: "Pass phy data's"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to power on" >> phy_list.yml   
          delegate_to: localhost