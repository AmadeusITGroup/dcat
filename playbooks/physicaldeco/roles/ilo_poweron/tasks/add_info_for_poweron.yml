--- 
    - name: "Handling TR record_id"
      block:

        - set_fact:
            record_for_poweron: ""

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""       
      

        - name: Display the JSON file content
          shell: cat record_for_poweron.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_poweron: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost        

        - meta: end_host
          when: record_for_poweron == ""

        - name: phy_host list
          shell: cat phy_list.yml
          delegate_to: localhost
          register: phy_result              

        - name: save the phy list to a Variable as a Fact
          set_fact:
            phy_poweron: "{{ phy_result.stdout }}" 
          delegate_to: localhost
            
        - meta: end_host
          when: phy_poweron == ""
        
        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the DECO results for poweron from ILO - physical servers"
            form3: "***********************************************************************"            
        - set_fact:
            content_poweron_success: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ phy_poweron }}"
          
        
      rescue:
        - debug:
            var: 'phy_poweron'

    - name: "Handling add message in TR"
      block: 

        - name: phy_host list
          shell: cat phy_list.yml
          delegate_to: localhost
          register: phy_result              

        - name: save the phy list to a Variable as a Fact
          set_fact:
            phy_poweron: "{{ phy_result.stdout }}" 
          delegate_to: localhost

        - meta: end_host
          when: phy_poweron == ""

        - name: Display the JSON file content
          shell: cat record_for_poweron.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_poweron: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost       
               
        - name: save the phy list to a Variable as a Fact
          set_fact:
            winaproach_user: "{{ winaproach_username }}"
          delegate_to: localhost


        - name: save the phy list to a Variable as a Fact
          set_fact:
            winaproach_password: "{{ winaproach_password }}"
          delegate_to: localhost          
        
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{record_for_poweron}}"
            message: "{{ content_poweron_success }}"             
            username: "{{ winaproach_user }}"     
            password: "{{ winaproach_password }}" 
          delegate_to: localhost
          register: add_msg_output
                                  
        - name: "Test custome module [CLOSE TR]"
          close_tr:
            record_id: "{{record_for_poweron}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost
          register: close_tr_output

      rescue:
        - debug:
            var: 'add_msg_output'