--- 
    - name: Handle the error
      throttle: 1
      block:       
        - set_fact:
            file_failure_fqdn: "fqdn_failure_phy.yml"
            file_suc_fqdn: "fqdn_success_phy.yml"

        - name: Display the JSON file content
          shell: cat record_for_fetch_fqdn_ph.json
          delegate_to: localhost
          register: TR_result_fqdn_fetch_ph

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_fqdn_fetch_ph: "{{ TR_result_fqdn_fetch_ph.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_fqdn_fetch_ph== ""    
          
        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "Test CMDB custom module"
          fqdn_fetch_cmdb:
            conn_str: "{{ private_endpoint_connection_string }}"
            server_name: '{{ inventory_hostname |lower }}'
            cmdb_server: "{{ cmdb_url_update }}"
            user_name: "{{ emdb_username }}"
            pass_word: "{{ emdb_password }}" 
          delegate_to: localhost
          register: output_fqdn
          until: '"Exception" not in output_fqdn.cmdb_result_fqdn'
          retries: 3
          delay: 30

        - set_fact:
            vm_cmdb_status: "{{output_fqdn.cmdb_result_fqdn}}"

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                  
        - set_fact:
            time: "{{tstamp.stdout}}"  

#### succcess path of bmc module with updating fqdn in state file ####

        - set_fact:
            server_fqdn: "{{ inventory_hostname}}.{{vm_cmdb_status }}"
          when: vm_cmdb_status is not search("Exception|Unable")

        - debug:
            var: server_fqdn

        - name: "host list for success of fqdn"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully fetched fqdn of the server from bmc {{server_fqdn}} ." >> {{file_suc_fqdn}}                    
          delegate_to: localhost 
          when: vm_cmdb_status is not search("Exception|Unable") 

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server for fqdn "
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "fqdn_info"
            status: "{{server_fqdn}}"           
          register: update_status
          delegate_to: localhost  
          when: vm_cmdb_status is not search("Exception|Unable")

        - meta: end_host
          when: vm_cmdb_status is not search("Exception|Unable") 

  #### failure path of bmc module followed by fallback to rtu check and updating state file ####

        - name: get fqdn from CMDB RTU
          fqdn_fetch_rtu:
            host: "{{ inventory_hostname }}"
            cmdb_rtu: "{{ cmdb_rtu }}"
          register: fqdn_name
          delegate_to: localhost
          when: vm_cmdb_status is search("Exception|Unable")          

        - set_fact:
            rtu_fqdn: "{{ fqdn_name.rtu_status_fqdn.fqdn }}"   

        - debug:
            var: rtu_fqdn

        - name: "host list for failure cmdb and rtu"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], rtu exception- {{ rtu_fqdn }}." >> {{file_failure_fqdn}}                    
          delegate_to: localhost                    
          when: rtu_fqdn is search("Exception|No Entry")

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_fqdn_failure.txt                  
          delegate_to: localhost
          when: rtu_fqdn is search("Exception|No Entry")

        - name: "host list for failure cmdb and rtu"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], bmc exception- {{ vm_cmdb_status }}." >> {{file_failure_fqdn}}                    
          delegate_to: localhost                    
          when: rtu_fqdn is search("Exception|No Entry")

        - meta: end_host
          when:  rtu_fqdn is search("Exception|No Entry")

        - name: "host list for success from rtu"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully fetched fqdn of the server from rtu {{ rtu_fqdn }}." >> {{file_suc_fqdn}}                    
          delegate_to: localhost 
          when:  rtu_fqdn is not search("Exception|No Entry") 

        - name: "update entry for DECO server for fqdn "
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "fqdn_info"
            status: "{{rtu_fqdn}}"            
          register: update_status
          delegate_to: localhost  
          when:  rtu_fqdn is not search("Exception|No Entry")   


      rescue:
        - name: when above one throws error the below task should execute
          debug:
             msg: "Exception occurred but rescued - check errors for CMDB_Fetch module"

                  

##################################################################################
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                  
        - set_fact:
            time: "{{tstamp.stdout}}"  

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_fqdn_failure.txt                  
          delegate_to: localhost

        - name: "physical failure host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], fetch cmdb module failed while fetching server name.either connection or access issue or server not found " >> {{file_failure_fqdn}}                    
          delegate_to: localhost          

