---             
    - name: "Handling Task Record"
      throttle: 1
      block:
        - name: Setting new variables for the task as facts
          set_fact:
            fqdn_server: ""
            ip_address_server: ""
      
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat record_for_firewall.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_firewall: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost        

        - meta: end_host
          when: record_for_firewall == ""      

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}"      
       
        # fetching information from FQDN and IP
        - name: "Fetch information from server for Firewall Decomission"
          storage_state_value_fetch:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            # status: "T"           
          register: storage_state_value
          delegate_to: localhost

        - name: get fqdn from CMDB RTU
          fqdn_fetch_rtu:
            host: "{{ inventory_hostname }}"
            cmdb_rtu: "{{ cmdb_rtu }}"
          register: fqdn_name
          delegate_to: localhost                  

        - name: "Passing host information to be written"
          set_fact:
            fqdn_server: "{{ fqdn_name.rtu_status_fqdn.fqdn }}" #"{{ storage_state_value.host_info.fqdn }}" # "{{ storage_state_value.host_info.module_update.fqdn }}"
            ip_address_server: "{{ fqdn_name.rtu_status_fqdn.ip }}"   #"{{ storage_state_value.host_info.ip }}" # "{{ storage_state_value.host_info.module_update.ip }}"
          delegate_to: localhost

        - name: "Pass phy data's"
          shell: echo "{{ inventory_hostname }} -> {{ fqdn_server }} - {{ ip_address_server }} , [INFO], :qualified for firewall decomission" >> phy_list_firewall.yml
          delegate_to: localhost 
          when: (fqdn_server | length > 0) and (ip_address_server | length > 0)

        - name: "Handling Failure in phy data's"
          shell: echo "{{ inventory_hostname }} [ERROR], :unable to fetch fqdn and ip addresses for the hostlist." >> phy_list_firewall.yml
          delegate_to: localhost 
          when: (fqdn_server | length == 0) and (ip_address_server | length == 0) 

        - name: Display the JSON file content
          shell: cat record_for_firewall.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_firewall: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost                

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        # - name: "update entry for DECO server for cmdb duplicate check"
        #   azure_update_module_vals_phy:
        #     connection_string: "{{ private_endpoint_connection_string }}"
        #     hostname: "{{inventory_hostname}}"
        #     module_name: "firewall"
        #     status: "T"           
        #   register: update_status
        #   delegate_to: localhost          

      rescue:
        - debug:
            var: phy_result