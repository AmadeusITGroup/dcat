          when: create_tr_output.record_id is defined and create_tr_output.record_id is not none

        - set_fact:
            record_jump: "{{create_tr_output.record_id}}"
          run_once: True   
          when: net_fetch is search("ERROR") 

        - set_fact:
            form1: "************************************************************************"
            form2: "Below are Network jump server({{NETWORK_SWITCH_FQDN}}) SSH connectivity issue details which needs support"
            form3: "************************************************************************"
          run_once: True  
        - set_fact:
            content_phy_ssh_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ network_fail }}"
          run_once: True  
          when: net_fetch is search("ERROR")                  

        - name: Update Task main cisco
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: update_overview
            username: "{{ network_usergroup }}"     
            password: "{{ network_grouppass }}"
            fields:
              task_id: "{{ record_jump }}"
              text: "{{ content_phy_ssh_fail }}"
          delegate_to: localhost
          run_once: True     
          register: update
          when: net_fetch is search("ERROR")

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost             


              ############################################################################################################
        - name: read yaml file from the specific location 
          set_fact:
            file_content: "{{lookup('file', 'machinegroups.yml')}}"

        - name: split the file content
          set_fact:
            lines: "{{file_content.split('\n')}}"

        - name: convert the lines in the file to dict
          set_fact:
            res_dict: "{{ res_dict | default({}) | combine({ item.split('\t')[0]: item.split('\t')[1] }) }}"
          loop: "{{ lines }}"


        - name: find which key is preset in the log
          set_fact: 
            present_key: "{{ present_key | default([]) + [item] }}"
          loop: "{{ res_dict.keys() }}"
          when: content_phy_ssh_fail is defined and item in content_phy_ssh_fail

        - name: print the corresponded  value of the key present
          set_fact:
            allowner_name: "{{ allowner_name | default({}) | combine({item:res_dict[item]}) }}"
          loop: "{{ present_key }}"
          when: content_phy_ssh_fail is defined

        - name: all owners with format
          set_fact:
            all_owner_Final: | 
              {% for key,value in allowner_name.items()%}
              {{ key }} : {{ value }}
              {% endfor %}
          when: content_phy_ssh_fail is defined

        - set_fact:
            Requester_group: "Requester_group: {{requester_group}}"
            Requester_name: "Requester_name: {{requester_name}}"

        - name: "writing output to File"
          shell: echo -e "{{content_phy_ssh_fail}}\n\n{{Requester_group}}\n{{Requester_name}}\n\nOwner group Details below:\n{{all_owner_Final}}" > groups_ptr.yml
          delegate_to: localhost
          when: content_phy_ssh_fail is defined

        - name: Display the JSON file content
          shell: cat groups_ptr.yml
          delegate_to: localhost
          register: result_groups
          when: content_phy_ssh_fail is defined

        - name: save the Json data to a Variable as a Fact
          set_fact:
            support_groups: "{{ result_groups.stdout }}" 
          delegate_to: localhost
          when: content_phy_ssh_fail is defined


        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ network_usergroup }}" 
            password: "{{ network_grouppass }}"
            ptr_title: "CSTY:DECO:DCAT: PHYSCIAL DECO: Network jump server-muccws11 SSH connectivity issue referring to failed TR - {{ record_jump }}"
            tr_map: "{{ record_jump }}"
            assignee_group: "DINFDECO"  
            ptr_logs: "{{ support_groups }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"
          delegate_to: localhost           
          register: ptr_phy_ssh_fail
          run_once: True
          until: '"Successfully" in ptr_phy_ssh_fail.msg'
          retries: 3
          delay: 10
          when: net_fetch is search("ERROR") 
        
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ inventory_hostname }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_phy_ssh_fail.id }}"
            event: "Physical DECO: Network jump server-muccws11 SSH connectivity failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          register: ptr_add
          when: net_fetch is search("ERROR")

        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ network_usergroup }}"
            password: "{{ network_grouppass }}"
            task_id: "{{ record_jump }}"
            prob_id: "{{ ptr_phy_ssh_fail.id }}"
          delegate_to: localhost                     
          register: update_overview 
          run_once: True 
          when: net_fetch is search("ERROR")                   

        # - name: "VM host list"
        #   shell: echo "{{ network_fail }}" >> net_jump.yml                   	
        #   delegate_to: localhost
        #   when: net_fetch is search("ERROR")

        - meta: end_host
          when: net_fetch is search("ERROR")                             

