---
# - name: "This playbook is to fetch network switch port data"
#   hosts: all
#   throttle: 1
#   gather_facts: no            
    - name: "This playbook is to fetch network switch port data"
      throttle: 1
      block:
     
    
  ####collect VM list####

  # tasks:             
    # - name: "Network switch port fetch"
    #   block:

      #   - name: "VM host list"
      #     shell: echo '{{inventory_hostname}}' >> net_list.yml                  	
      #     delegate_to: localhost

        - set_fact:
            swit: ""                                            

        - name: "network fetch"
          network_ssh:
            hostname: "{{NETWORK_SWITCH_FQDN}}"
            ph_server: "{{ inventory_hostname }}"
            username: "{{ network_username }}"
            password: "{{ network_password }}"          
          register: net_fetch
          delegate_to: localhost

        - set_fact:
            swit: "{{ net_fetch.sw_name | join(', ') }}"
          #when: net_fetch is search("muc")   

        - debug: 
            msg: "{{ swit }}"
          #when: net_fetch is search("muc")              
                    
        - set_fact:
            sw: "{{ swit | regex_findall('([a-z0-9-]+).run.cfg') | unique }}"
          #when: net_fetch is search("muc")   

        - debug: 
            msg: "{{ sw }}"
          #when: net_fetch is search("muc")       



        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}" 

        - name: "Debug time "
          debug:
            var: time    

        - set_fact:
            "{{ 'network_no_sw_' + inventory_hostname }}": "!{{ inventory_hostname }}, {{ time }}, [INFO], :Network no switches for the CI {{ inventory_hostname }} needs manual intervention"
          when: swit == "" and net_fetch is not search("ERROR")

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: Physical DECO - Network Switch port details - no switches - {{ inventory_hostname }}"
            assignee_name: "LANAu117138" #"LANAu117138" #"DecoP112686"
            assignee_group: "OIPSVSE"    #"OIPSVSE"   #"DINFDECO"            
            severity: "4"
            overview: "Physical Deco - Network Switch port details - No Switches for CI {{ inventory_hostname }}"
            parent_id: "{{ cr }}"            
            username: "{{ network_usergroup }}"     
            password: "{{ network_grouppass }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: swit == "" and net_fetch is not search("ERROR") 

        - name: "Save TR ID for LAN Deco"
          shell: echo "{{ create_tr_output.record_id }}" >> lan_deco_tr_number.txt
          delegate_to: localhost
          when: create_tr_output.record_id is defined and create_tr_output.record_id is not none

        - set_fact:
            "{{ 'record_no_sw_' + inventory_hostname }}": "{{create_tr_output.record_id}}" 
          when: swit == "" and net_fetch is not search("ERROR")         

        - name: Update Task main cisco
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: update_overview
            username: "{{ network_usergroup }}"     
            password: "{{ network_grouppass }}"
            fields:
              task_id: "{{ vars['record_no_sw_' + inventory_hostname ] }}"
              text: "{{ vars['network_no_sw_' + inventory_hostname] }}"
          delegate_to: localhost     
          register: update
          when: swit == "" and net_fetch is not search("ERROR")                    

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server for cmdb duplicate check"
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "network"
            status: "T"           
          register: update_status
          delegate_to: localhost  
          when: swit == "" and net_fetch is not search("ERROR")        

        # - meta: end_host
        #   when: swit == "" and net_fetch is not search("ERROR")

        - set_fact:
            network_fail: "!{{NETWORK_SWITCH_FQDN}}, {{ time }}, [ERROR], :Network unable to ssh from AWX to the jump server {{NETWORK_SWITCH_FQDN}} using ptr1 account, needs attentions"
          run_once: True
          when: net_fetch is search("ERROR")

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: Physical DECO - Network Switch port details - Jump server-muccws11 issue"
            assignee_name: "LANAu117138" #"LANAu117138" #"DecoP112686"
            assignee_group: "OIPSVSE"    #"OIPSVSE"   #"DINFDECO"            
            severity: "4"
            overview: "Physical Deco - Network Switch port details - Jump server({{NETWORK_SWITCH_FQDN}}) issue"
            parent_id: "{{ cr }}"            
            username: "{{ network_usergroup }}"     
            password: "{{ network_grouppass }}"
          delegate_to: localhost  
          no_log: False
          run_once: True
          register: create_tr_output
