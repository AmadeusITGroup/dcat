    - name: "Network switch port fetch"
      throttle: 1
      block:                       


        - name: "network fetch"
          network_ssh_switch:
            hostname: "{{NETWORK_SWITCH_FQDN}}"
            ph_server: "{{ inventory_hostname }}"
            username: "{{ network_username }}"
            password: "{{ network_password }}"
            switch: "{{ item }}"
          loop: "{{ sw }}"             
          register: net_fetch
          delegate_to: localhost
          when: sw != "" and sw is search("muc")

        - debug:
            var: net_fetch          


        - set_fact: 
            yep: "{{ yep | default([]) + item.resp }}"
          loop: "{{ net_fetch.results }}"

        - debug: 
            msg: "{{ yep }}"

        - debug:
            msg: "{{ yep | type_debug }}"

        - name: "Switch_port fetch"
          network_filter:
            swt_port: "{{ yep }}" 
          register: st_po
          delegate_to: localhost

        - set_fact:
            final: "{{ st_po.res  | unique }}"

        - debug: 
            var: final


######################################################################################

        - name: "Pass vm data's- cisco sw"
          shell: echo '{{item.sw}},' >> cisco_sw_yes_list.yml
          delegate_to: localhost
          loop: "{{ final  }}"
          when: item.port is search("Et|Po") and item.sw is not search("muc-az") and item.sw is search("muc")

        - name: VM_host list
          shell: cat cisco_sw_yes_list.yml
          delegate_to: localhost
          register: vm_result_fail

        - name: save the vm list to a Variable as a Fact
          set_fact:
            cisco_sw_yes_list: "{{ vm_result_fail.stdout }}" 
          delegate_to: localhost

        - debug:
            var: cisco_sw_yes_list 

        - name: "Pass vm data's- cisco sw"
          shell: echo '{{item.sw}},' >> cisco_sw_no_list.yml
          delegate_to: localhost
          loop: "{{ final  }}"
          when: (item.port == "" or item.port is search("Permission denied")) and item.sw is not search("muc-az") and item.sw is search("muc") and cisco_sw_yes_list is not search("{{ item.sw }}")
                    

        - name: VM_host list
          shell: cat cisco_sw_no_list.yml
          delegate_to: localhost
          register: vm_result_fail

        - name: save the vm list to a Variable as a Fact
          set_fact:
            cisco_sw_no_list: "{{ vm_result_fail.stdout }}" 
          delegate_to: localhost

        - debug:
            var: cisco_sw_no_list

        - name: Convert variables yes and no to lists
          set_fact:
            list_yes: "{{ cisco_sw_yes_list.split(',') }}"
            list_no: "{{ cisco_sw_no_list.split(',') }}" 

        - name: Remove yes data from no
          set_fact:
            list_no: "{{ list_no | difference(list_yes) | list }}" 
       

        - name: Get unique values in no
          set_fact:
            unique_list_no: "{{ list_no | unique }}"

        - name: Convert the unique list back to a string
          set_fact:
            cisco_no_sw: "{{ unique_list_no | join(',') }}"           

        - name: Debug 
          debug:
            var: cisco_no_sw                                            

#############################################################################################     

        - name: "Pass vm data's- arista sw"
          shell: echo '{{item.sw}},' >> arista_sw_yes_list.yml
          delegate_to: localhost
          loop: "{{ final  }}"
          when: item.port is search("Et|Po") and item.sw is search("muc-az")

        - name: VM_host list
          shell: cat arista_sw_yes_list.yml
          delegate_to: localhost
          register: vm_result_fail

        - name: save the vm list to a Variable as a Fact
          set_fact:
            arista_sw_yes_list: "{{ vm_result_fail.stdout }}" 
          delegate_to: localhost

        - debug:
            var: arista_sw_yes_list

        - name: "Pass vm data's- arista sw"
          shell: echo '{{item.sw}},' >> arista_sw_no_list.yml
          delegate_to: localhost
          loop: "{{ final  }}"
          when: (item.port == "" or item.port is search("Permission denied")) and item.sw is search("muc-az") and arista_sw_yes_list is not search("{{ item.sw }}")            

        - name: VM_host list
          shell: cat arista_sw_no_list.yml
          delegate_to: localhost
          register: vm_result_fail

        - name: save the vm list to a Variable as a Fact
          set_fact:
            arista_sw_no_list: "{{ vm_result_fail.stdout }}" 
          delegate_to: localhost

        - debug:
            var: arista_sw_no_list

        - name: Convert variables yes and no to lists
          set_fact:
            list_yes: "{{ arista_sw_yes_list.split(',') }}"
            list_no: "{{ arista_sw_no_list.split(',') }}" 

        - name: Remove yes data from no
          set_fact:
            list_no: "{{ list_no | difference(list_yes) | list }}"  

        - name: Get unique values in no
          set_fact:
            unique_list_no: "{{ list_no | unique }}"

        - name: Convert the unique list back to a string
          set_fact:
            arista_no_sw: "{{ unique_list_no | join(',') }}"
           

        - name: Debug 
          debug:
            var: arista_no_sw

        - name: "Switch status"
          network_switch_seg:
            hostname: "{{NETWORK_SWITCH_FQDN}}"
            ph_server: "{{ inventory_hostname }}"
            username: "{{ network_username }}"
            password: "{{ network_password }}"
            switch: "{{ item }}"
          loop: "{{ sw }}"             
          register: switch_seg
          delegate_to: localhost
          when: sw != "" and sw is search("muc")

        - name: Extract stat values
          set_fact:
            stat_values: "{{ switch_seg.results | json_query('[].stat') }}"

        - name: Debug stat values
          debug:
            var: stat_values
                                                          

        - name: Generate switch and port information
          set_fact:
            switch_port_info_arista: {}
          #when: final is search("muc-az")  

        - name: Populate switch and port information
          set_fact:
            switch_port_info_arista: "{{ switch_port_info_arista | default({}) | combine({item.sw: switch_port_info_arista[item.sw] | default([]) + [item.port]}) }}"
          loop: "{{ final }}"
          when: item.sw is search("muc-az") and item.port is not search("Permission denied") and item.port != ""


        - debug:
            var: switch_port_info_arista 
          #when: final is search("muc-az")


        - name: Generate switch and port information
          set_fact:
            arista_out: "{{ arista_out | default({}) | combine({item.key: item.value | reject('equalto', '') | list | zip_longest([inventory_hostname] * (item.value | length)) | list}) }}"
          loop: "{{ switch_port_info_arista | dict2items }}"
          when: final is search("muc-az") and final is not search("Permission denied") and switch_port_info_arista != {}

