      ####Adding Info to TR   

    - name: "Network final output"
      block: 
        - set_fact:
             content_net_arista: "***** Physical network Arista switch_port details shared below ***** \n" #======================================================================" #\nServerName         Switch_ID       Switch_Port        TR\n======================================================================" 

        - name: Display the JSON file content
          shell: cat record_net_arista.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_net_arista: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_net_arista == "" 
          

        - name: VM_host list
          shell: cat sw_arista_info_final.yml
          delegate_to: localhost
          register: vm_result_arista              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            sw_arista_info_final: "{{ vm_result_arista.stdout }}" 
          delegate_to: localhost
            
        - name: "Debug output"
          debug:
            var: sw_arista_info_final

        - name: "Network merge 1"
          shell: echo "{{ content_net_arista }}" >> network_tr_arista.yml                  	
          delegate_to: localhost
          when: sw_arista_info_final != ""          

        - name: "Network merge 1"
          shell: echo "{{ sw_arista_info_final }}" >> network_tr_arista.yml                  	
          delegate_to: localhost
          when: sw_arista_info_final != "" 



#################################################################################################

        - name: VM_host list
          shell: cat net_fail_arista.yml
          delegate_to: localhost
          register: vm_result_fail             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            net_fail_arista: "{{ vm_result_fail.stdout }}" 
          delegate_to: localhost
            
        - name: "Debug output"
          debug:
            var: net_fail_arista

        - name: "Network merge 1"
          shell: echo "Below are the list of failures and reasons for network Arista switch_port details" >> network_tr_arista.yml                  	
          delegate_to: localhost
          when: net_fail_arista != ""          

        - name: "Network merge 1"
          shell: echo "{{ net_fail_arista }}" >> network_tr_arista.yml                  	
          delegate_to: localhost
          when: net_fail_arista != ""


        - name: VM_host list
          shell: cat network_tr_arista.yml
          delegate_to: localhost
          register: vm_result
          #when: sw_arista_info != "" or net_fail_arista != ""           

        - name: save the vm list to a Variable as a Fact
          set_fact:
            network_tr_arista: "{{ vm_result.stdout }}" 
          delegate_to: localhost
          #when: sw_arista_info != "" or net_fail_arista != "" 
            
        - name: "Debug output"
          debug:
            var: network_tr_arista
          #when: sw_arista_info != "" or net_fail_arista != ""
                      

    
        - name: Update Task
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: update_overview
            username: "DecoP112686" #"{{ winaproach_username }}"     
            password: "opFCtCpIMzmC" #"{{ winAproach_password }}"
            fields:
              task_id: "{{ record_net_arista }}"
              text: "{{ network_tr_arista }}"
          register: update
          when: network_tr_arista != ""

        - name: dump test output
          debug:
            msg: '{{ update }}'
          when: network_tr_arista != ""   

      rescue:
        - debug:
            var: 'network_tr_arista' 

