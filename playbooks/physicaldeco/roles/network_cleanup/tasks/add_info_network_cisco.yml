---
# - name: "This playbook is to fetch IP and Port details from csv and add content in TR"
#   hosts: localhost
#   gather_facts: no  
#   vars: 
#     json_net: "record_success_network.json"    
#     csv: "sw_cisco_info.csv"
#     content_net: "***** Physical network Cisco switch_port details shared below ***** \n\n======================================================================\nServerName        Switch_ID        Switch_Port            TR\n======================================================================"
#   tasks:      
      ####Adding Info to TR   

    - name: "Handling csv"
      block:

        - set_fact:
            json_net: "record_success_network.json"    
            csv: "sw_cisco_info.csv"
            content_net: "***** Physical network Cisco switch_port details shared below ***** \n\n======================================================================\nServerName        Switch_ID        Switch_Port            TR\n======================================================================"
        

        - name: Display the JSON file content
          shell: cat record_net_cisco.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_net_cisco: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_net_cisco == "" 

        - name: read csv
          read_csv:
            path: "{{csv}}"
            key: port
          register: csv_content
   
        
        - set_fact:
            content_net:  |
              {{content_net}}                          
              {{item.value.server_name+'          '+item.value.sw_name+'        '+item.value.port+'         '+item.value.tr}}
          loop: "{{ csv_content.dict|dict2items }}"
          when: item.value.sw_name is search("muc")

        - debug:
            var: content_net
          when: content_net is search("muc")

        - name: "Network merge 1"
          shell: echo "{{ content_net }}" >> network_tr_cisco_final.yml                  	
          delegate_to: localhost
          when: content_net is search("muc")                          

        
      rescue:
        - debug:
            var: 'content_net'

    - name: "Handling TR record_id"
      block:

        - name: VM_host list
          shell: cat network_no_sw.yml
          delegate_to: localhost
          register: network_no_sw              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            network_no_sw: "{{ network_no_sw.stdout }}" 
          delegate_to: localhost
            
        - name: "Network merge 2"
          shell: echo "{{ network_no_sw }}" >> network_tr_cisco_suc.yml                 	
          delegate_to: localhost
          when: network_no_sw != ""

        - name: VM_host list
          shell: cat network_tr_cisco_suc.yml
          delegate_to: localhost
          register: network_tr_cisco_suc              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            network_tr_cisco_suc: "{{ network_tr_cisco_suc.stdout }}" 
          delegate_to: localhost                
                                                                   
         
        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the list of servers with no switches:"
            form3: "***********************************************************************"
        - set_fact:
            content_suc_net_no_sw: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ network_tr_cisco_suc }}"
          when: network_tr_cisco_suc != "" 

        - name: "Network merge 2"
          shell: echo "{{ content_suc_net_no_sw }}" >> network_tr_cisco_final.yml                 	
          delegate_to: localhost
          when: network_tr_cisco_suc != "" 
                 


      rescue:
        - debug:
            var: 'network_no_sw'            

    - name: "Handling TR record_id"
      block:

        - name: VM_host list
          shell: cat net_fail_cisco.yml
          delegate_to: localhost
          register: vm_result              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            net_fail_cisco: "{{ vm_result.stdout }}" 
          delegate_to: localhost
            
        - name: "Network merge 2"
          shell: echo "{{ net_fail_cisco }}" >> network_tr_cisco_fail.yml                 	
          delegate_to: localhost
          when: net_fail_cisco != ""

        - name: VM_host list
          shell: cat net_jump.yml
          delegate_to: localhost
          register: net_result              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            net_jump: "{{ net_result.stdout }}" 
          delegate_to: localhost    

        - name: "Network merge 2"
          shell: echo "{{ net_jump }}" >> network_tr_cisco_fail.yml                 	
          delegate_to: localhost
          when: net_jump != ""               

        # - meta: end_host
        #   when: vm_net == ""

        - name: VM_host list
          shell: cat network_tr_cisco_fail.yml
          delegate_to: localhost
          register: network_tr_cisco_fail              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            network_tr_cisco_fail: "{{ network_tr_cisco_fail.stdout }}" 
          delegate_to: localhost                
                                                                   
         
        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the list of failures and reasons for network Cisco and other switch_port details:"
            form3: "***********************************************************************"
        - set_fact:
            content_excep_net: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ network_tr_cisco_fail }}"
          when: network_tr_cisco_fail != "" 

        - name: "Network merge 2"
          shell: echo "{{ content_excep_net }}" >> network_tr_cisco_final.yml                 	
          delegate_to: localhost
          when: network_tr_cisco_fail != "" 
                 


      rescue:
        - debug:
            var: 'net_fail_cisco'

    ###################################################################################################

    - name: "Network final output"
      block:   

        - name: VM_host list
          shell: cat network_tr_cisco_final.yml
          delegate_to: localhost
          register: net_result              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            net_output: "{{ net_result.stdout }}" 
          delegate_to: localhost 

    
        - name: Display the JSON file content
          shell: cat record_net_cisco.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_net_cisco: "{{ TR_result.stdout | from_json }}" 
          delegate_to: localhost    
    
        - name: Update Task
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: update_overview
            username: "DecoP112686" #"{{ winaproach_username }}"     
            password: "opFCtCpIMzmC" #"{{ winAproach_password }}"
            fields:
              task_id: "{{ record_net_cisco }}"
              text: "{{ net_output }}"
          register: update
          when: net_output != ""

        - name: dump test output
          debug:
            msg: '{{ update }}' 
          when: net_output != ""  

      rescue:
        - debug:
            var: 'net_output' 

