          delegate_to: localhost 



################# LOGGER UPDATE TO TR ###################
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{record_id_logger}}"
            message: "{{ log_network }}"           #"{{final_net_logger}}"             
            username: "{{ winaproach_user }}"
            password: "{{ winaproach_password }}"          
          delegate_to: localhost
          register: add_msg_output_log

        - name: "Debug output"
          debug:
