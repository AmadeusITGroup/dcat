    - name: "Logger and Create/Update TR- Win@proach "
      block:     

        - name: "Set header"
          shell: echo > network_failure.yml            
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > record_failure_network.json           
          run_once: true
          delegate_to: localhost 

        - name: "Set header"
          shell: echo > final_network.yml          
          run_once: true
          delegate_to: localhost


        # - name: "Set header"
        #   shell: echo > server_info.csv                
        #   run_once: true
        #   delegate_to: localhost   
        

        - name: "Set header"
          shell: echo > record_net.json               
          run_once: true
          delegate_to: localhost 


        - name: "Set header"
          shell: echo > final_network.yml           
          run_once: true
          delegate_to: localhost
         

        - name: "Set header"
          shell: echo > network_success.yml            
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > network_log.yml                
          run_once: true
          delegate_to: localhost  

        - name: "Set header"
          shell: echo > output_network_log.yml         
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > network_tr.yml         
          run_once: true
          delegate_to: localhost                

      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check network logger "         
