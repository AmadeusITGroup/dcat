        - set_fact: 
            ilo_reconfig: '{{idem_status.module_update.ilo_reconfig}}'

        - copy:
            content: '{{ ilo_reconfig|to_json }}'
            dest: idem_ilo_reconfig.json
          delegate_to: localhost
          when: ilo_reconfig == "F" 

        - copy:
            content: '{{ ilo_reconfig|to_json }}'
            dest: idem_ilo_reconfig_pre.json
          delegate_to: localhost
          when: ilo_reconfig == "T"    
            
