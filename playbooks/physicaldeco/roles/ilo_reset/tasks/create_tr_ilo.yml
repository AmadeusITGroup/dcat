---    
    - name: "Handling Create TR- Win@proach "
      block: 

        - set_fact:
            ilo_record_id: ""
            ilo_success: "ilo_success.yml"

        # - name: Display the JSON file content
        #   shell: cat record_healthcheck.json
        #   delegate_to: localhost
        #   register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
        #   delegate_to: localhost

        # - meta: end_host
        #   when: record_id_healthcheck != ""

        # - name: Display the JSON file content
        #   shell: cat idem_network_pre.json
        #   delegate_to: localhost
        #   register: result_app_cmdb_network

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     idem_ilo_check_network_flag: "{{ result_app_cmdb_network.stdout }}" 
        #   delegate_to: localhost

        # - meta: end_host
        #   when: idem_ilo_check_network_flag == "F"
  

        # - name: Display the JSON file content
        #   shell: cat idem_ilo_check.json
        #   delegate_to: localhost
        #   register: result_app_cmdb

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     idem_ilo_check_flag: "{{ result_app_cmdb.stdout }}" 
        #   delegate_to: localhost

        # - meta: end_host
        #   when: idem_ilo_check_flag == "T"       

        - name: VM_host list
          shell: cat host_list_ilo.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            phy_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: phy_hostlist == ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost                    

        - name: TR creation for ILO/DISK Cleanup task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "ilo disk cleanup"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: PHYSICAL DECO : ILO/DISK Cleanup"
            ci: "{{ phy_hostlist }}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id
          delegate_to: localhost
        
        - set_fact:
            ilo_record_id: "{{ticket_id.id.ticketId}}"
    
        - copy:
            content: '{{ ilo_record_id|to_json }}'
            dest: record_ilo.json
          delegate_to: localhost

    
      rescue:
        - debug:
            msg: "Failed to Create VM DECO - ilo validation TR"

