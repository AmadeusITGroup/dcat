---
    - name: Initiating the ILO reset and disk Cleanup Module
      throttle: 1
      block:
        - set_fact:
            ilo_success: "ilo_success.yml"
            ilo_failure: "ilo_failure.yml"

        - name: Display the JSON file content
          shell: cat record_ilo.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            ilo_record_id: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost         

        - meta: end_host
          when: ilo_record_id == "" 

        - name: VM_host list
          shell: cat host_list_ilo.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            phy_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: phy_hostlist == ""

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: get fqdn from CMDB RTU
          fqdn_fetch_rtu:
            host: "{{ inventory_hostname }}"
            cmdb_rtu: "{{ cmdb_rtu }}"
          register: fqdn_name
          delegate_to: localhost

        - set_fact:
            fqdn: "{{ fqdn_name.rtu_status_fqdn.fqdn }}"          

        - name: "check the packaged availablity"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo rpm -qa | grep hponcfg"
          register: RPM_status
          delegate_to: localhost

        - name: "Show the installed package"
          debug:
            var: RPM_status.status
          when: RPM_status.status is search("hponcfg")

        - name: "Copy package to target host"
          copy_package:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            package: hponcfg-5.6.0-0.x86_64.rpm
          register: copy_status
          when: RPM_status.status is not search("hponcfg")
          delegate_to: localhost
                              
        - name: "Install the hponcfg package"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo yum -y install hponcfg-5.6.0-0.x86_64.rpm"
          register: hponcfg_install
          delegate_to: localhost
          when: RPM_status.status is not search("hponcfg")

        - name: "check the packaged availablity after install"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo rpm -qa | grep hponcfg"
          register: RPM_status_after_install
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ilo_reset_failure.txt                  
          delegate_to: localhost
          when: RPM_status_after_install.status is not search("hponcfg")

        - name: "ILO reset Failed for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - unable to install hponcfg package on host" >> {{ilo_failure}}                    
          delegate_to: localhost
          when: RPM_status_after_install.status is not search("hponcfg")

        - meta: end_host
          when: RPM_status_after_install.status is not search("hponcfg")

        - name: "Reset Factory setting for ILO"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo /sbin/hponcfg -r"
          register: hponcfg_status
          delegate_to: localhost
          when: RPM_status_after_install.status is search("hponcfg")
      
        # - name: "Get the status"
        #   debug:
        #     var: hponcfg_status
        #   when: hponcfg_install.status is defined

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ilo_reset_failure.txt                  
          delegate_to: localhost
          when: >
            hponcfg_status.status is not defined or 
            'ERROR' in (hponcfg_status.status | join(' '))

        - name: "ILO reset Failed for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - unable to reset ILO to factory defaults for host." >> {{ilo_failure}}                    
          delegate_to: localhost
          when: >
            hponcfg_status.status is not defined or 
            'ERROR' in (hponcfg_status.status | join(' '))

        - meta: end_host
          when: >
            hponcfg_status.status is not defined or 
            'ERROR' in (hponcfg_status.status | join(' '))

        - name: "ILO reset Sucess for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO] - ILO reset completed successfully for host" >> {{ilo_success}}                    
          delegate_to: localhost
          when: >
            hponcfg_status.status is defined and
            'The Management Processor has been rebooted' in (hponcfg_status.status | join(' ')) and
            'ERROR' not in (hponcfg_status.status | join(' '))

        - name: "DISK wipe: Initiate"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo rm -rf /boot/*"
          delegate_to: localhost
          register: disk_wipe
      
        - name: "DISK wipe: Validate"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo ls /boot/vmlinuz* /boot/grub* /boot/init*"
          delegate_to: localhost
          register: disk_wipe_validate_result
          when: disk_wipe.status is defined
    
        - debug:
            var: disk_wipe_validate_result.status
    
        - name: Clean disk wipe validation output
          set_fact:
            cleaned_disk_status: "{{ disk_wipe_validate_result.status | map('trim') | list }}"
          when: disk_wipe_validate_result.status is defined
    
        - debug:
            var: cleaned_disk_status
          when: disk_wipe_validate_result.status is defined
              
        - name: "Disk Wipe Success for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO] - Disk Wipe Completed for host" >> {{ ilo_success }}
          delegate_to: localhost
          when: >
            cleaned_disk_status is defined and
            'ls: cannot access /boot/vmlinuz*: No such file or directory' in cleaned_disk_status and
            'ls: cannot access /boot/grub*: No such file or directory' in cleaned_disk_status and
            'ls: cannot access /boot/init*: No such file or directory' in cleaned_disk_status
    
        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ilo_reset_failure.txt
          delegate_to: localhost
          when: >
            cleaned_disk_status is not defined or
            'ls: cannot access /boot/vmlinuz*: No such file or directory' not in cleaned_disk_status or
            'ls: cannot access /boot/grub*: No such file or directory' not in cleaned_disk_status or
            'ls: cannot access /boot/init*: No such file or directory' not in cleaned_disk_status
    
        - name: "Disk Wipe Failed for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - Disk Wipe Failed for host." >> {{ ilo_failure }}
          delegate_to: localhost
          when: >
            cleaned_disk_status is not defined or
            'ls: cannot access /boot/vmlinuz*: No such file or directory' not in cleaned_disk_status or
            'ls: cannot access /boot/grub*: No such file or directory' not in cleaned_disk_status or
            'ls: cannot access /boot/init*: No such file or directory' not in cleaned_disk_status
    
        - meta: end_host
          when: >
            cleaned_disk_status is not defined or
            'ls: cannot access /boot/vmlinuz*: No such file or directory' not in cleaned_disk_status or
            'ls: cannot access /boot/grub*: No such file or directory' not in cleaned_disk_status or
            'ls: cannot access /boot/init*: No such file or directory' not in cleaned_disk_status

