        # - name: "get Serial Number"
        #   get_serial:
        #     hostname: '{{ fqdn }}'
        #     username: "{{ remote_username }}"
        #     password: "{{ remote_keyfile }}"
        #   register: serial_num
        #   delegate_to: localhost

        # - set_fact:
        #   serial_num: "{{ serial_num.status }}"

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost   

        - name: "Check entry for DECO server for filter hostlist for cmdb duplicate list"
          azure_update_ref_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost

        - set_fact:
            serial_num: "{{ idem_status.module_update.serial }}"

        - name: Remove any leftover ILO XML from /tmp
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: sudo rm -f /tmp/{{ item }}
          loop:
            - ilo_all_Add_User_Administrator.xml
            - ilo_all_Mod_Network_Settings.xml
          delegate_to: localhost

            
        - name: Copy configuration files to remote server
          copy_over_ssh:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            key_filename: "{{ remote_keyfile }}"
            src: "{{ role_path }}/templates/{{ template_item }}.j2"
            dest: "/tmp/{{ template_item }}"
            variables:
              serial_num: "{{ serial_num }}"
              user_iloadm: "{{ user_iloadm }}"
              password_iloadm: "{{ password_iloadm }}" 
          loop:
            - ilo_all_Add_User_Administrator.xml
            - ilo_all_Mod_Network_Settings.xml
          loop_control:
            loop_var: template_item
          delegate_to: localhost

        - name: Configure the iLO
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: sudo /sbin/hponcfg -f /tmp/{{ item }}
          register: ILO_configure_status
          loop:
            - ilo_all_Mod_Network_Settings.xml
            - ilo_all_Add_User_Administrator.xml
          delegate_to: localhost
          retries: 5
          delay: 30
          until: "'POST in progress' not in (ILO_configure_status.results | map(attribute='status') | list | join(' '))"

        - debug:
            var: ILO_configure_status

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "ILO configure Failed for host - {{ inventory_hostname }}"
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - unable to configure ILO for host" >> {{ ilo_failure }}
          delegate_to: localhost
          when: >
            ILO_configure_status is not defined or
            ILO_configure_status.results is not defined or
            (ILO_configure_status.results | selectattr('status', 'defined') | selectattr('status', 'search', 'Script succeeded') | list | length < 2) 
        
        - name: "ILO configure Failed for host - {{ inventory_hostname }}"
          shell: |
            echo "{{ inventory_hostname }} Failure" >> phy_ilo_reset_failure.txt
          delegate_to: localhost
          when: >
            ILO_configure_status is not defined or
            ILO_configure_status.results is not defined or
            (ILO_configure_status.results | selectattr('status', 'defined') | selectattr('status', 'search', 'Script succeeded') | list | length < 2) 

        - meta: end_host
          when: >
            ILO_configure_status is not defined or
            ILO_configure_status.results is not defined or
            (ILO_configure_status.results | selectattr('status', 'defined') | selectattr('status', 'search', 'Script succeeded') | list | length < 2) 


        - name: "ILO reset Success for host - {{ inventory_hostname }}"
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [INFO] - ILO re-configure completed for host" >> {{ ilo_success }}
          delegate_to: localhost
          when:
            - ILO_configure_status is defined
            - ILO_configure_status.results is defined
            - ILO_configure_status.results | selectattr('status', 'defined') | selectattr('status', 'search', 'Script succeeded') | list | length == 2

        - name: "update entry for DECO server for for ILO reset"
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "ilo"
            status: "T"            
          register: update_status_info_state
          delegate_to: localhost
          when:
            - ILO_configure_status is defined
            - ILO_configure_status.results is defined
            - ILO_configure_status.results | selectattr('status', 'defined') | selectattr('status', 'search', 'Script succeeded') | list | length == 2

      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors for ilo reset module"  

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"        

        - name: "Failure information to file in rescue block"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Kindly check ILO reset module for physical servers. Failed due to abrupt/undefined failures, please check the relevant AWX logs." >> {{ilo_failure}}                    
          delegate_to: localhost