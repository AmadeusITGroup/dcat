---
    - name: Initiating Server Shutdown Command
      throttle: 1
      block:
        - set_fact:
            shutdown_success: "shutdown_success.yml"
            shutdown_failure: "shutdown_failure.yml"

        - name: get fqdn from CMDB RTU
          fqdn_fetch_rtu:
            host: "{{ inventory_hostname }}"
            cmdb_rtu: "{{ cmdb_rtu }}"
          register: fqdn_name
          delegate_to: localhost          

        - set_fact:
            fqdn: "{{ fqdn_name.rtu_status_fqdn.fqdn }}"

        - name: "Check entry for DECO server for filter hostlist for cmdb duplicate list"
          azure_update_ref_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost

        - set_fact:
            serial_status: '{{ idem_status.module_update.serial }}'

        - set_fact:
            ilohost: "{{ 'ilo'+ serial_status +'.<server_fqdn>' }}"

        - name: "Shutdown Host"
          ilo_commands:
            hostname: "{{ fqdn }}"
            ilo_url: "{{ ilohost }}"
            ilo_username: "{{ user_iloadm }}"
            ilo_password: "{{ password_iloadm }}"
            username: "{{ remote_username }}" 
            password: "{{ remote_keyfile }}" 
            command: "sudo /sbin/shutdown -h now" #"sudo /sbin/poweroff -f -f"  #"sudo /sbin/poweroff -f" #"sudo systemctl poweroff"
          register: server_shutdown
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"
            
        - name: "Server Shutdown Success for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO] - Server Shutdown Completed for host - Powered Off" >> {{shutdown_success}}                    
          delegate_to: localhost
          when: '"Exception" not in server_shutdown.status'

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_server_shutdown_bgp_failure.txt                  
          delegate_to: localhost
          when: server_shutdown.status is not defined

        - name: "Server Shutdown Failed for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - Server Shutdown Failed for host" >> {{shutdown_failure}}                    
          delegate_to: localhost
          when: '"Exception" in server_shutdown.status'

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server for Shutdown before graceperiod"
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "shutdown_bgp"
            status: "T"           
          register: update_status_info_state
          delegate_to: localhost
          when: '"Exception" not in server_shutdown.status'

      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors for ilo reset module"  

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_server_shutdown_bgp_failure.txt                  
          delegate_to: localhost

        - name: "Failure information to file in rescue block"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Kindly check server shutdown module for physical servers" >> {{shutdown_failure}}                    
          delegate_to: localhost