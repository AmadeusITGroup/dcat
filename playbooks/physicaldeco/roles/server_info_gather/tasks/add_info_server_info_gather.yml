---    

#   tasks:    
        
    - name: "Handling TR record_id to update and close the TR for Server info gather "
      block:
      
        - set_fact: 
            file_server_info_success: "server_info_success.yml"
            file_server_info_failure: "server_info_failure.yml"  
            file_server_info_fin: "server_info_final.yml"                        

        - name: Display the JSON file content
          shell: cat record_for_server_info_gather.json
          delegate_to: localhost
          register: TR_result_server_info_gather 

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_server_info_gather: "{{ TR_result_server_info_gather.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_server_info_gather == ""      

 #############  success info gathering ##########################
        - name : handling error in the success block
          block:
            - name: Display the JSON file content
              shell: cat server_info_success.yml
              delegate_to: localhost
              register: result_server_info_gather_suc

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_server_info_gather_suc_v: "{{ result_server_info_gather_suc.stdout }}" 
              delegate_to: localhost  

            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for Server information gather - physical servers"
                form3: "***********************************************************************"
            - set_fact:
                content_server_info_gather_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_server_info_gather_suc_v }}" 
              when: result_server_info_gather_suc_v != ""  


            - name: " Merge Success information to single final file "
              shell: echo "{{content_server_info_gather_suc}}" >> server_info_final.yml                    
              delegate_to: localhost
              when: result_server_info_gather_suc_v != "" 

          rescue:
            - debug:
                msg: "Rescue for no success file found and continue"   
                   
  ####################### Failure info gathering ########################## 
        - name : handling error in the failure block
          block:          
            - name: Display the JSON file content
              shell: cat server_info_failure.yml
              delegate_to: localhost
              register: result_server_info_gather_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_server_info_gather_fail_v: "{{ result_server_info_gather_fail.stdout }}" 
              delegate_to: localhost  
    
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for Server information gather - physical servers"
                form3: "***********************************************************************"
            - set_fact:
                content_server_info_gather_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_server_info_gather_fail_v }}"
              when: result_server_info_gather_fail_v != ""    
       
            - name: " Merge Failure information to to single final file"
              shell: echo "{{ content_server_info_gather_fail }}" >> server_info_final.yml                    
              delegate_to: localhost
              when: result_server_info_gather_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

##########################  merging both failure and success results ###########################

        - name: Display the JSON file content
          shell: cat server_info_final.yml
          delegate_to: localhost
          register: result_server_info_gather_fin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_server_info_gather_fin_v: "{{ result_server_info_gather_fin.stdout }}" 
          delegate_to: localhost  


########################   results added to TR  ############################################
        - name: "add message to TR"
          add_message_to_tr:
            record_id: "{{record_id_server_info_gather}}"
            message: "{{ result_server_info_gather_fin_v }}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost
          register: add_msg_output 


############################# closing TR  ####################            
        - name: "Test custome module [CLOSE TR]"
          close_tr:
            record_id: "{{record_id_server_info_gather}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          register: close_tr_output
          
        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost             

################################ PTR creation ###################################

        - name: read yaml file from the specific location 
          set_fact:
            file_content: "{{lookup('file', 'machinegroups.yml')}}"

        - name: split the file content
          set_fact:
            lines: "{{file_content.split('\n')}}"

        - name: convert the lines in the file to dict
          set_fact:
            res_dict: "{{ res_dict | default({}) | combine({ item.split('\t')[0]: item.split('\t')[1] }) }}"
          loop: "{{ lines }}"


        - name: find which key is preset in the log
          set_fact: 
            present_key: "{{ present_key | default([]) + [item] }}"
          loop: "{{ res_dict.keys() }}"
          when: content_server_info_gather_fail is defined and item in content_server_info_gather_fail

        - name: print the corresponded  value of the key present
          set_fact:
            allowner_name: "{{ allowner_name | default({}) | combine({item:res_dict[item]}) }}"
          loop: "{{ present_key }}"
          when: content_server_info_gather_fail is defined

        - name: all owners with format
          set_fact:
            all_owner_Final: | 
              {% for key,value in allowner_name.items()%}
              {{ key }} : {{ value }}
              {% endfor %}
          when: content_server_info_gather_fail is defined

        - set_fact:
            Requester_group: "Requester_group: {{requester_group}}"
            Requester_name: "Requester_name: {{requester_name}}"

        - name: "writing output to File"
          shell: echo -e "{{content_server_info_gather_fail}}\n\n{{Requester_group}}\n{{Requester_name}}\n\nOwner group Details below:\n{{all_owner_Final}}" > groups_ptr.yml
          delegate_to: localhost
          when: content_server_info_gather_fail is defined

        - name: Display the JSON file content
          shell: cat groups_ptr.yml
          delegate_to: localhost
          register: result_groups
          when: content_server_info_gather_fail is defined

        - name: save the Json data to a Variable as a Fact
          set_fact:
            support_groups: "{{ result_groups.stdout }}" 
          delegate_to: localhost
          when: content_server_info_gather_fail is defined


        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "PHYSICAL DECO: Server info gather details with failed TR - {{ record_id_server_info_gather }}"
            tr_map: "{{ record_id_server_info_gather }}"
            assignee_group:  "DINFDECO" 
            ptr_logs: "{{ support_groups }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"          
          register: ptr_out_server_info_gather
          until: '"Successfully" in ptr_out_server_info_gather.msg'
          retries: 3
          delay: 10
          when: result_server_info_gather_fin_v is search("ERROR")

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: filter owner group
          categorize_servers:
            path: phy_server_gather_info_failure.txt
          delegate_to: localhost
          register: failure_servers_list
          when: result_server_info_gather_fin_v is search("ERROR")

        - debug:
            var: failure_servers_list
          when: result_server_info_gather_fin_v is search("ERROR")

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ item }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_out_server_info_gather.id }}"
            event: "Physical DECO: Server info gather failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          loop: "{{ failure_servers_list.Status.Failure }}"  
          register: ptr_add
          when: result_server_info_gather_fin_v is search("ERROR")

        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_server_info_gather }}"
            prob_id: "{{ ptr_out_server_info_gather.id }}"                   
          register: update_overview  
          when: result_server_info_gather_fin_v is search("ERROR")
       
      rescue:
        - debug:
            msg: "Exception occurred so rescued the main tr result block for Server info gather "