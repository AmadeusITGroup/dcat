---
    - name: Initiating the server info fetch  module task
      throttle: 1
      block:

        - set_fact:
            file_server_info_success: "server_info_success.yml"
            file_server_info_failure: "server_info_failure.yml"             
   
        - name: Display the JSON file content
          shell: cat record_for_server_info_gather.json
          delegate_to: localhost
          register: TR_result_server_info_gather 

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_server_info_gather: "{{ TR_result_server_info_gather.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_server_info_gather == "" 

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost        

        - name: "Check entry for DECO server and fetch wwpn information of host"
          storage_state_value_fetch:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"                        
          register: info_result_host
          delegate_to: localhost 

        - name: get fqdn from CMDB RTU
          fqdn_fetch_rtu:
            host: "{{ inventory_hostname }}"
            cmdb_rtu: "{{ cmdb_rtu }}"
          register: fqdn_name
          delegate_to: localhost          

        - set_fact:
            rtu_fqdn: "{{ fqdn_name.rtu_status_fqdn.fqdn }}"           

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Check if systool is available"
          ilo_commands:
            hostname: '{{ rtu_fqdn }}'
            username: "{{ remote_username  }}"
            password: "{{ remote_keyfile }}"
            command: "which systool"
          register: systool_check
          ignore_errors: yes
          delegate_to: localhost

        - name: "Debug systool_check"
          debug:
            var: systool_check

        - name: Check if systool is not present
          set_fact:
            systool_absent: "{{ systool_check.status | select('search', 'no systool') | list | length > 0 }}"

        - debug:
            var: systool_absent

        - name: Extract systool path and set fact
          set_fact:
            systool_present: "{{ systool_check.status | select('search', '/usr/bin/systool') | list | length > 0 }}"

        - debug:
            var: systool_present
            
        - name: "Install sysfsutils if systool is not available"
          ilo_commands:
            hostname: '{{ rtu_fqdn }}'
            username: "{{ remote_username  }}"
            password: "{{ remote_keyfile }}"
            command: "sudo yum install sysfsutils -y"
          register: result
          delegate_to: localhost
          when: systool_absent

        - debug:
            var: result
            
        - name: "Test custom module for server information gathering"
          gather_info:
            hostname: '{{ rtu_fqdn }}'
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"                            
          delegate_to: localhost
          register: output_gather_info
          # until: '"Exception" not in output.cmdb_check_result' 
          # retries: 3
          # delay: 1
          # ignore_errors: yes

        - debug:
            var: output_gather_info        

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_server_gather_info_failure.txt                  
          delegate_to: localhost
          when: '"ERROR" in output_gather_info.host_result'

        - name: "Failure information to file for exception scenario"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{ output_gather_info.host_result }} " >> {{file_server_info_failure}}                    
          delegate_to: localhost
          when: '"ERROR" in output_gather_info.host_result'

        - meta: end_host
          when: '"ERROR" in output_gather_info.host_result' 

        - set_fact:
            wwpn_host: "{{output_gather_info.host_result.WWPN}}"
          when: output_gather_info.host_result.WWPN is defined 
            
        - set_fact:  
            fqdn_host: "{{output_gather_info.host_result.fqdn}}"
          when: output_gather_info.host_result.fqdn is defined 

        - set_fact:  
            ip_host: "{{output_gather_info.host_result.ip}}"
          when: output_gather_info.host_result.ip is defined

        - set_fact: 
            os_host: "{{output_gather_info.host_result.os_name}}"
          when: output_gather_info.host_result.os_name is defined

        - name: "update entry for DECO server "
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "san_info_fetch"
            status: "T"            
          register: update_status_state_file
          delegate_to: localhost
          when: wwpn_host | length == 0
        
        - name: "Always print the value of host_wwpns at the end"
          debug:
            msg: "Final value of host_wwpns is: {{ wwpn_host }}"
          when: wwpn_host | length != 0

        - name: "update entry for DECO server "
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "san_cleanup"
            status: "T"          
          register: update_status_state_file
          delegate_to: localhost
          when: wwpn_host | length == 0

        - name: "Get NVME data"
          nvme_check:
            hostname: '{{ rtu_fqdn }}'
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
          register: nvme_data
          delegate_to: localhost

        - set_fact:
            nvme_out: "{{ nvme_data.status }}"

        - set_fact:
            nvme_status: "NVME present"
          when: nvme_out is search('present')

        - debug:
            var: rtu_fqdn

        - debug:
            var: fqdn_host

        - name: Compare FQDN between RTU & info gathered
          set_fact:
            fqdn_host: "NA"
          when: rtu_fqdn != fqdn_host

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_server_gather_info_failure.txt                  
          delegate_to: localhost
          when: rtu_fqdn != fqdn_host

        - name: "Failure information to file for NA in any of the output scenario"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], FQDN mismatch in server and RTU or BMC" >> {{file_server_info_failure}}                    
          delegate_to: localhost
          when: rtu_fqdn != fqdn_host

        # - name: "get Serial Number"
        #   get_serial:
        #     hostname: '{{ rtu_fqdn }}'
        #     username: "{{ remote_username }}"
        #     password: "{{ remote_keyfile }}"
        #   register: serial_num
        #   delegate_to: localhost

        # - set_fact:
        #     serial_num: "{{ serial_num.status }}"

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost   

        - name: "Check entry for DECO server for filter hostlist for cmdb duplicate list"
          azure_update_ref_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost

        - set_fact:
            serial_num: "{{ idem_status.module_update.serial }}"

        - debug:
            var: serial_num

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_server_gather_info_failure.txt                  
          delegate_to: localhost
          when: serial_num is search("ERROR")

        - name: "Failure information to file for NA in any of the output scenario"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{ output_gather_info.host_result | to_yaml }} " >> {{file_server_info_failure}}                    
          delegate_to: localhost
          when: (wwpn_host== "NA" and nvme_status != "present") or fqdn_host== "NA" or ip_host== "NA" or os_host== "NA"

        - name: "Failure information to file for NA in any of the output scenario"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{ serial_num }} " >> {{file_server_info_failure}}                    
          delegate_to: localhost
          when: serial_num is search("ERROR")

        - name: "update entry for DECO server for ILO reset"
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "serial"
            status: "{{serial_num}}"           
          register: update_status_info_state
          delegate_to: localhost
          when: serial_num is not search("ERROR")

        - meta: end_host
          when: (wwpn_host== "NA" and nvme_status != "present") or fqdn_host== "NA" or ip_host== "NA" or os_host== "NA" or serial_num is search("ERROR")

        - name: "update storage cleanup state file for DECO server"
          storage_state_values_update:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "host_info"
            status: "{{ output_gather_info.host_result }}"               
          register: update_status_info_gather_fetch
          delegate_to: localhost
          when: (wwpn_host== "NA" and nvme_status != "present") or fqdn_host!= "NA" or ip_host!= "NA" or os_host!= "NA"                                       

        - set_fact:
             check_update_flag_server: "{{ update_status_info_gather_fetch.module_update }}"
          when: update_status_info_gather_fetch.module_update is defined      

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_server_gather_info_failure.txt                  
          delegate_to: localhost
          when: check_update_flag_server is defined and check_update_flag_server is not search("successfully")

        - name: "collecting failure info to failure file"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to update the information to state file.{{ check_update_flag_server }}" >> {{file_server_info_failure}}                    
          delegate_to: localhost 
          when: check_update_flag_server is defined and check_update_flag_server is not search("successfully")

        - meta: end_host
          when: check_update_flag_server is defined and check_update_flag_server is not search("successfully")

        - name: "collecting success info to success file"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully fetched server information and updated to state file.{{ output_gather_info.host_result| to_yaml }}" >> {{file_server_info_success}}                    
          delegate_to: localhost 
          when: check_update_flag_server is defined and check_update_flag_server is search("successfully")

        - name: "collecting success info to success file"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Serial no - {{ serial_num }}" >> {{file_server_info_success}}                    
          delegate_to: localhost 
          when: serial_num is not search("ERROR")

        - name: "update entry for DECO server for server info fetch"
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "info"
            status: "T"          
          register: update_status_info_state
          delegate_to: localhost
          when: check_update_flag_server is defined and check_update_flag_server is search("successfully")

        - set_fact:
             check_state_flag_server: "{{ update_status_info_state.state_update }}"
          when: update_status_info_state.state_update is defined 

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_server_gather_info_failure.txt                  
          delegate_to: localhost
          when: check_state_flag_server is defined and check_state_flag_server is not search("successfully")

        - name: "collecting failure info of state file updation "
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to update state file as TRUE.{{ check_state_flag_server }}" >> {{file_server_info_failure}}                    
          delegate_to: localhost 
          when: check_state_flag_server is defined and check_state_flag_server is not search("successfully")         

      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors for server info fetch module"  

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_server_gather_info_failure.txt                  
          delegate_to: localhost

        - name: "Failure information to file in rescue block"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Kindly check server info fetch module for physical servers" >> {{file_server_info_failure}}                    
          delegate_to: localhost