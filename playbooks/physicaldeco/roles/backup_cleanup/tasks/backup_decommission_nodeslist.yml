---             
    - name: "Handling node list, TR and retention days"
      throttle: 1
      block:

        - set_fact:
            csv: "nodes.csv"
            retention_days: "{{ retention_days }}"      

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat record_for_backup.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_backup: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost        

        - meta: end_host
          when: record_for_backup == ""      

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}"      
       

        - name: "Pass phy data's"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], :qualified for backup node decomission" >> phy_list_bkup.yml   
          delegate_to: localhost 


        - name: Display the JSON file content
          shell: cat record_for_backup.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_backup: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost                
                    
        - name: "Pass phy data's"
          shell: echo '{{ inventory_hostname }},{{ record_for_backup }},{{ retention_days }}' >> {{csv}}    
          delegate_to: localhost
         

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server for cmdb duplicate check"
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "backup"
            status: "T"           
          register: update_status
          delegate_to: localhost          
                                      
        
      rescue:
        - debug:
            var: phy_result                

             