- name: Handle Physical DECO - Storage Controller cleanup collect information from state file and svc inventory
  throttle: 1
  block:

    - name: success file info for idem
      block:
        - name: Display the JSON file content
          shell: cat storage_cleanup_success.yml
          delegate_to: localhost
          register: result_storage_cleanup_suc_idem

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_storage_cleanup_suc_v_idem: "{{ result_storage_cleanup_suc_idem.stdout }}" 
          delegate_to: localhost       

      rescue:
        - debug:
            msg: "Rescue for no success file found and continue"  

    - name: failure file info for idem
      block: 
        - name: Display the JSON file content
          shell: cat storage_cleanup_failure.yml
          delegate_to: localhost
          register: result_storage_cleanup_fail_idem

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_storage_cleanup_fail_v_idem: "{{ result_storage_cleanup_fail_idem.stdout }}" 
          delegate_to: localhost      

      rescue:
        - debug:
            msg: "Rescue for no failure file found and continue"     

    - name: Display the JSON file content
      shell: cat private_endpoint_connection_string.yml
      delegate_to: localhost
      register: result_private_endpoint_connection_string

    - name: save the Json data to a Variable as a Fact
      set_fact:
        private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
      delegate_to: localhost

    - name: "update entry for DECO server for cmdb duplicate check"
      azure_update_module_vals_phy:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{inventory_hostname}}"
        module_name: "san_cleanup"
        status: "T"           
      register: update_status_info_state
      delegate_to: localhost  
      when: '"{{inventory_hostname}}" not in result_storage_cleanup_fail_v_idem and "{{inventory_hostname}}" in result_storage_cleanup_suc_v_idem'

    - name: Get timestamp from the system
      shell: "date +%Y-%m-%d"
      delegate_to: localhost
      register: tstamp              
              
    - set_fact:
        time: "{{tstamp.stdout}}"   

    - name: "update entry for DECO server for Closure date"
      azure_update_module_vals_phy:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{inventory_hostname}}"
        module_name: "deco_date"
        status: "{{ time }}"           
      register: update_status_info_date
      delegate_to: localhost  
      when: '"{{inventory_hostname}}" not in result_storage_cleanup_fail_v_idem and "{{inventory_hostname}}" in result_storage_cleanup_suc_v_idem'

    - debug:
        var: "{{ update_status_info_date }}"
        
    - set_fact:
        check_state_flag_server: "{{ update_status_info_state.state_update }}"
      when: update_status_info_state.state_update is defined 

    - name: "Write Failure host to file"
      shell: echo "{{ inventory_hostname }} Failure" >> phy_storage_cleanup_failure.txt                  
      delegate_to: localhost
      when: check_state_flag_server is defined and check_state_flag_server is not search("successfully")

    - name: "collecting failure info of state file updation "
      shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to update state file as TRUE.{{ check_state_flag_server }}" >> {{file_server_info_failure}}                    
      delegate_to: localhost 
      when: check_state_flag_server is defined and check_state_flag_server is not search("successfully")          
                
  rescue: 
    - name: When above one throws error the below task should execute
      debug:
        msg: "Exception occurred but rescued - check errors on fetch storage systems module" 

    - name: Get timestamp from the system
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      register: tstamp  
    
    - set_fact:
        time: "{{tstamp.stdout}}"

    - name: "Write Failure host to file"
      shell: echo "{{ inventory_hostname }} Failure" >> phy_storage_cleanup_failure.txt                  
      delegate_to: localhost 

    - name: "writing failure file in fetch svc names module for storage cleanup"
      shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Check errors on fetch svc names module." >> {{file_storage_cleanup_fail}}                    
      delegate_to: localhost   

