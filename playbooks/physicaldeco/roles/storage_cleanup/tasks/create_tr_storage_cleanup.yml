--- 
    - name: "Handling Create TR- Win@proach for Storage cleanup task "
      block:     

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: physical host list
          shell: cat host_list_storage_cleanup.yml
          delegate_to: localhost
          register: hostlist_phy            

        - name: save the physical servers list to a variable
          set_fact:
            phy_hostlist: "{{ hostlist_phy.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: phy_hostlist == ""

        - name: Display the JSON file content of winapproach category
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost 

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: PHYSICAL DECO : Storage cleanup"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "PHYSICAL DECO : Storage cleanup"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output   

        - set_fact:
            record_id_storage_cleanup_phy: "{{create_tr_output.record_id}}"               
     

        - debug:
            var: record_id_storage_cleanup_phy 
  
    
        - copy:
            content: '{{ record_id_storage_cleanup_phy|to_json }}'
            dest: record_storage_cleanup_phy.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_id_storage_cleanup_phy }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create physical DECO - Storage cleanup TR"

    - name: "Handling Create TR- Win@proach for Storage cleanup task - retry 1 "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content for Storage cleanup
          shell: cat record_storage_cleanup_phy.json
          delegate_to: localhost
          register: TR_result_storage_cleanup_phy

        - name: save the Json data to a Variable as a Fact for Storage cleanup
          set_fact:
            record_id_storage_cleanup_phy: "{{ TR_result_storage_cleanup_phy.stdout[1:-1] }}"
          delegate_to: localhost

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_id_storage_cleanup_phy == ""                                  

        - name: physical_host list
          shell: cat host_list_storage_cleanup.yml
          delegate_to: localhost
          register: hostlist_phy             

        - name: save the physical list to a Variable as a Fact
          set_fact:
            phy_hostlist: "{{ hostlist_phy.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: phy_hostlist == ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost  

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: PHYSICAL DECO : Storage cleanup"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "PHYSICAL DECO : Storage cleanup"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_id_storage_cleanup_phy == ""   

        - set_fact:
            record_id_storage_cleanup_phy: "{{create_tr_output.record_id}}"          
          when: record_id_storage_cleanup_phy == ""
    
        - copy:
            content: '{{ record_id_storage_cleanup_phy|to_json }}'
            dest: record_storage_cleanup_phy.json
          delegate_to: localhost
          when: record_id_storage_cleanup_phy == ""

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_id_storage_cleanup_phy }}"
          register: add_document
          delegate_to: localhost
          when: record_id_storage_cleanup_phy == ""

      rescue:
        - debug:
            msg: "Failed to Create PHYSICAL DECO - Storage cleanup TR"

