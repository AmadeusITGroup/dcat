---          
    - name: "Handling TR record_id for implementation and validation result for storage cleanup task"
      block:
 #############  success info gathering ##########################
        - name : handling error in the success block
          block:
            - set_fact:
                file_storage_cleanup_fail: "storage_cleanup_failure.yml"
                file_storage_cleanup_suc: "storage_cleanup_success.yml"
                file_storage_cleanup_fin : "storage_cleanup_final.yml"
                file_attach_storage_san: "info_san.txt"
                file_attach_storage_controller: "Info_Host_Volume.txt"                     

            - name: Display the JSON file content for storage cleanup this is TR number
              shell: cat record_storage_cleanup_phy.json
              delegate_to: localhost
              register: TR_result_storage_cleanup  

            - name: save the Json data to a Variable as a Fact for storage cleanup
              set_fact:
                record_id_storage_cleanup: "{{ TR_result_storage_cleanup.stdout[1:-1] }}"
              delegate_to: localhost         

            - meta: end_host
              when: record_id_storage_cleanup == ""

            - name: Display the JSON file content
              shell: cat storage_cleanup_success.yml
              delegate_to: localhost
              register: result_storage_cleanup_suc

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_storage_cleanup_suc_v: "{{ result_storage_cleanup_suc.stdout }}" 
              delegate_to: localhost  
     
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for storage cleanup- physical servers"
                form3: "***********************************************************************"
            - set_fact:
                content_storage_cleanup_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_storage_cleanup_suc_v }}"
              when: result_storage_cleanup_suc_v != ""   
            

            - name: " Merge Success information to single final file "
              shell: echo "{{content_storage_cleanup_suc}}" >> storage_cleanup_final.yml                    
              delegate_to: localhost
              when: result_storage_cleanup_suc_v != ""

          rescue:
            - debug:
                msg: "Rescue for no success file found and continue"      
  ####################### Failure info gathering ########################## 
        - name : handling error in the failure block
          block:          
            - name: Display the JSON file content
              shell: cat storage_cleanup_failure.yml
              delegate_to: localhost
              register: result_storage_cleanup_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_storage_cleanup_fail_v: "{{ result_storage_cleanup_fail.stdout }}" 
              delegate_to: localhost  
      
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for storage cleanup- physical servers"
                form3: "***********************************************************************"
            - set_fact:
                content_storage_cleanup_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_storage_cleanup_fail_v }}"
              when: result_storage_cleanup_fail_v != ""    
         
  
            - name: " Merge Failure information to to single final file"
              shell: echo "{{ content_storage_cleanup_fail }}" >> storage_cleanup_final.yml                   
              delegate_to: localhost
              when: result_storage_cleanup_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

##########################  merging both failure and success results ###########################

        - name: Display the JSON file content
          shell: cat storage_cleanup_final.yml
          delegate_to: localhost
          register: result_storage_cleanup_fin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_storage_cleanup_fin_v: "{{ result_storage_cleanup_fin.stdout }}" 
          delegate_to: localhost 

        - name: Display the JSON file content
          shell: cat file_storage_cleanup_suc_vol.yml
          delegate_to: localhost
          register: result_storage_cleanup_vol_s

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_file_storage_cleanup_suc_vol: "{{ result_storage_cleanup_vol_s.stdout }}" 
          delegate_to: localhost           
           

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost 

######################### Adding attachment to the TR ###################################
        - name: "Add attachments to TR"
          block:              

            - name: Get stats about the SAN INFO file to be attached
              stat:
                path: info_san.txt
              register: storage_info_file_san

            - name: Get stats about the STORAGE CONTROLLER file to be attached
              stat:
                path: Info_Host_Volume.txt
              register: storage_info_file_controller

            - name: "Add attachments to TR "
              add_attachment_to_tr:
                record_id: "{{record_id_storage_cleanup}}"
                attachments: "{{ file_attach_storage_san }}"             
                username: "{{ winaproach_username }}"     
                password: "{{ winaproach_password }}"                       
              delegate_to: localhost
              register: add_attachment_output_san_storage
              when :  storage_info_file_san.stat.exists

            - name: "Add attachments to TR "
              add_attachment_to_tr:
                record_id: "{{record_id_storage_cleanup}}"
                attachments: "{{ file_attach_storage_controller }}"             
                username: "{{ winaproach_username }}"     
                password: "{{ winaproach_password }}"                       
              delegate_to: localhost
              register: add_attachment_output_controller_storage
              when :  storage_info_file_controller.stat.exists

            - name: "Add message to TR"
              add_message_to_tr:
                record_id: "{{ record_id_storage_cleanup }}"
                message: "{{ result_storage_cleanup_fin_v }}"             
                username: "DecoP112686"     
                password: "opFCtCpIMzmC" 
              delegate_to: localhost
              register: add_msg_output
              when :  storage_info_file_controller.stat.exists

            - name: "Test custome module [CLOSE TR]"
              close_tr:
                record_id: "{{ record_id_storage_cleanup }}"
                username: "DecoP112686"
                password: "opFCtCpIMzmC"
              register: close_tr_output


          rescue:
            - debug:
                msg: "Unable to add attachments to the TR"           
########################  closing implementation as failed  ############################################
        # - name: Implementation Failed that is closing the implementation as failed
        #   winaproach:
        #     system: prod #"{{ winaproach_env }}"
