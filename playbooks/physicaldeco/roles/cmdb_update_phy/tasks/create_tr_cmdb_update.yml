--- 
    - name: "Handling Create TR- Win@proach for CMDB Update task "
      block:     

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: physical host list
          shell: cat host_list_cmdb_update_phy.yml
          delegate_to: localhost
          register: hostlist_phy            

        - name: save the physical list to a Variable as a Fact
          set_fact:
            phy_hostlist: "{{ hostlist_phy.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: phy_hostlist == ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost
          
        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost                     

        - name: TR creation for CMDB Update task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: PHYSICAL DECO : cmdb update"
            ci: "{{ phy_hostlist}}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id_cmdb_update_phy
          delegate_to: localhost

        - debug:
            var: ticket_id_cmdb_update_phy      

        - set_fact:
            record_id_cmdb_up_phy: "{{ticket_id_cmdb_update_phy.id.ticketId}}"
  
    
        - copy:
            content: '{{ record_id_cmdb_up_phy|to_json }}'
            dest: record_cmdb_update_phy.json
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create physical DECO - cmdb update TR"

    - name: "Handling Create TR- Win@proach for CMDB Update task - retry 1 "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

