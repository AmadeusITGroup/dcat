    - name: "Handling Start Implementation- Win@proach cmdb update TR "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content for cmdb update
          shell: cat record_cmdb_update_phy.json
          delegate_to: localhost
          register: TR_result_cmdb_up_phy

        - name: save the Json data to a Variable as a Fact for cmdb update
          set_fact:
            record_id_cmdb_up_phy: "{{ TR_result_cmdb_up_phy.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_cmdb_up_phy== "" 

        - name: Sleep for 62 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 62
          delegate_to: localhost

          delegate_to: localhost
        - name: Start Implementation for CMDB update TR
          winaproach:
            system: prod
            type: task_record
            operation: start_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_cmdb_up_phy }}"
          register: start_implementation
          delegate_to: localhost
        
    
      rescue:
        - name: dump test output in the rescue block cmdb update
          debug:
            msg: "Failed to Start Implementation on physical DECO - CMDB update :'{{ record_id_cmdb_up_phy }}'"
