          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost                    

        - name: TR creation for CMDB Update task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: PHYSICAL DECO : cmdb update"
            ci: "{{ phy_hostlist }}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id_cmdb_update_phy
          delegate_to: localhost
          when: record_id_cmdb_up_phy == ""
           

        - set_fact:
            record_id_cmdb_update_phy: "{{ticket_id_cmdb_update_phy.id.ticketId}}"
          when: record_id_cmdb_up_phy == ""  
   
    
        - copy:
            content: '{{ record_id_cmdb_update_phy|to_json }}'
            dest: record_cmdb_update_phy.json
          delegate_to: localhost
          when: record_id_cmdb_up_phy == ""

      rescue:
        - debug:
            msg: "Failed to Create PHYSICAL DECO - cmdb update TR"

