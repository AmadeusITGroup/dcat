---
# - name: "This playbook is to Create TR for CMDB duplicate check task"
#   hosts: all
#   gather_facts: no
#   vars:
#     record_cmdb_dup_info: ""
#     graceperiod_flag: false
#     cmdb_dup_check: False   #### state file variable
#     backup: true  ### state file variable of previous module


  # tasks: 
    - name: "Handling Create TR- Win@proach for CMDB duplicate check  "
      block: 
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Physical_host list
          shell: cat host_list_cmdb_duplicate_check.yml
          delegate_to: localhost
          register: hostlist_physical             

        - name: save the physical list to a Variable as a Fact
          set_fact:
            physical_hostlist: "{{ hostlist_physical.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: physical_hostlist == ""       

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: PHYSICAL DECO - CMDB duplicate check"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"   #"DINFDECO"            
            severity: "4"
            overview: "PHYSICAL DECO - CMDB duplicate check"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
       
        - set_fact:
            record_cmdb_dup_info: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_cmdb_dup_info|to_json }}'
            dest: record_for_cmdb_dup_info.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_cmdb_dup_info }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create PHYSICAL DECO - for CMDB duplicate check "

