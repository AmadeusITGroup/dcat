---
# - name: "This playbook is to add backup info in TR"
#   hosts: localhost
#   gather_facts: no  
#   vars:
#     graceperiod_flag: true
        
#   tasks:      
      ####Adding Info to TR  
    - name: "Handling TR record_id"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""    

        - name: Display the JSON file content
          shell: cat record_doc_agp.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_doc_agp: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost        

        - meta: end_host
          when: record_doc_agp == ""

        - name: VM_host list
          shell: cat success_vm_agp.yml
          delegate_to: localhost
          register: vm_result_suc              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_success_agp: "{{ vm_result_suc.stdout }}" 
          delegate_to: localhost


        - name: VM_host list
          shell: cat failure_vm_agp.yml
          delegate_to: localhost
          register: vm_result_fai              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_fail_agp: "{{ vm_result_fai.stdout }}" 
          delegate_to: localhost

        - meta: end_host
          when: vm_success_agp == "" and vm_fail_agp == "" 
        
        - set_fact:
            form1: "***********************************************************************"
            form2: "Following are Success Physical list After graceperiod"
            form3: "***********************************************************************"            
        - set_fact:
            doc_content_success: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ vm_success_agp }}"
          when: vm_success_agp != "" 

        - name: " Merge failure information to single final file "
          shell: echo "{{doc_content_success}}" >> doc_agp_final.yml                    
          delegate_to: localhost
          when: vm_success_agp != ""

        - name: VM_host list
          shell: cat failure_vm_agp.yml
          delegate_to: localhost
          register: vm_result_fai              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_fail_agp: "{{ vm_result_fai.stdout }}" 
          delegate_to: localhost

        - name: Split the string into lines
          set_fact:
            vm_fail_line: "{{ vm_fail_agp.split('\n') }}"

        - name: Convert the list to a set to remove duplicates
          set_fact:
            vm_fail_list: "{{ vm_fail_line | unique }}"

        - name: Join the lines back into a single string
          set_fact:
            vm_fail_agp: "{{ vm_fail_list | join('\n') }}"                     

        - set_fact:
            form1: "***********************************************************************"
            form2: "Following are Failure Physical list After graceperiod"
            form3: "***********************************************************************"            
        - set_fact:
            doc_content_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ vm_fail_agp }}"
          when: vm_fail_agp != "" 


        - name: " Merge failure information to single final file "
          shell: echo "{{doc_content_fail}}" >> doc_agp_final.yml                    
          delegate_to: localhost
          when: vm_fail_agp != ""           
          
            
      rescue:
        - debug:
            msg: "unable to collect success/fail VM list"

    - name: "Handling add message in TR"
      block: 

        - name: VM_host list
          shell: cat doc_agp_final.yml
          delegate_to: localhost
          register: vm_result              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            doc_agp_fin: "{{ vm_result.stdout }}" 
          delegate_to: localhost
         

        - meta: end_host
          when: doc_agp_fin == ""

        - name: Display the JSON file content
          shell: cat record_doc_agp.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_doc_agp: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost           
        
        
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{record_doc_agp}}"
            message: "{{ doc_agp_fin }}"             
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}" 
          delegate_to: localhost
          register: add_msg_output
                                  

      rescue:
        - debug:
            var: 'add_msg_output'

    - name: "Close TR"
      block:  
        
        - name: Display the JSON file content
          shell: cat record_doc_agp.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_doc_agp: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: record_doc_agp == ""

        - name: "Test custome module [CLOSE TR]"
          close_tr:
            record_id: "{{record_doc_agp}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          register: close_tr_output

        - name: awx creds username to var
          set_fact:
            awx_username: "{{ auth_username }}"
          delegate_to: localhost

        - name: awx creds password to var
          set_fact:
            awx_pass: "{{ auth_password }}"
          delegate_to: localhost
        
        - name: "Gather AWX & CI DETAILS"
          gather_awx_ci_details:
            cr: "{{ cr }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          register: awx_ci_details
          delegate_to: localhost 
            
        - debug:
            var: awx_ci_details
            
        - debug:
            var: awx_ci_details.create_entity_result.awx_jobs

        - debug:
            var: awx_ci_details.create_entity_result.ci_list

        - set_fact:
            awx_job_list: '{{ awx_ci_details.create_entity_result.awx_jobs }}'

        - set_fact:
            server_list: '{{ awx_ci_details.create_entity_result.ci_list }}'   

        - name: Display the JSON file content
          shell: cat awx_instance.yml
          delegate_to: localhost
          register: result_awx_instance
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            awx_instance: "{{ result_awx_instance.stdout }}"
          delegate_to: localhost        
      
        - name: "check AWX JOB DETAILS"
          gather_awx_job_closure_details:
            awx_jobs: '{{ awx_job_list }}'
            curr_awx_job: '{{ tower_job_id }}'
            awx_instance: '{{ awx_instance }}'
            awx_username: '{{ awx_username }}'
            awx_password: '{{ awx_pass }}'
          register: awx_job_completion_status
          delegate_to: localhost  
        
        - debug:
            var: awx_job_completion_status.create_entity_result

        # - name: "Check CI DETAILS"
        #   gather_ci_completion:
        #     ci_list: "{{server_list }}"
        #     cmdb_server: "{{ cmdb_url_update }}"
        #     user_name: "{{ emdb_username }}"
        #     pass_word: "{{ emdb_password }}"
        #   register: ci_completion_status
        #   delegate_to: localhost

        - name: "Retrieve Original CI List from Associated CR"
          create_ci_list_final:
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}" 
            win_target: "WIN@PROACH_URL"
            cr: "{{ cr }}"
          register: all_cis
          delegate_to: localhost

        - name: "Check if CMDB Update is performed on all CIs through Azure Table"
          block:
            - name: Display the JSON file content
              shell: cat private_endpoint_connection_string.yml
              delegate_to: localhost
              register: result_private_endpoint_connection_string
                        
            - name: save the Json data to a Variable as a Fact
              set_fact:
                private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
              delegate_to: localhost  

            - set_fact:
                close_ritm: T
                fail_fast: false
            
            - name: Check CMDB update for each CI item
              include_tasks: check_cmdb_final.yml
              vars:
                conn_string : "{{ private_endpoint_connection_string }}"
              loop: "{{ all_cis.ci_list }}"
              loop_control:
                loop_var: ci_item
              when: not fail_fast
# Complete success
        - name: Check snow api call back
          update_snow:
            action: Phase2
            ritm_number: "{{ ritm_number }}"
            status: Running
            comments: Trigger-2 of decommission is successfully completed for all the CIs. All the servers have been decommissioned and CMDB status changed to "End of Life & Obsolete". SAN cleanup will be performed after 24hrs.
            username: "{{ SN_USERNAME }}"
            password: "{{ SN_PASSWORD }}"
          run_once: True  
          register: api_result
          when: doc_agp_fin is search("Success") and doc_agp_fin is not search("Failure") and close_ritm == "T"
# For partial success
        - name: Check snow api call back
          update_snow:
            action: Phase2
            ritm_number: "{{ ritm_number }}"
            status: Waiting
            comments: Trigger-2 of decommission is successfully completed for the CIs {{ vm_success_agp }}. Waiting for other servers to get decommissioned.
            username: "{{ SN_USERNAME }}"
            password: "{{ SN_PASSWORD }}"
          run_once: True  
          register: api_result
          when: doc_agp_fin is search("Success") and doc_agp_fin is not search("Failure") and (close_ritm == "F" or awx_job_completion_status.create_entity_result != "SUCCESS")
# For any failures in current run
        - name: Check snow api call back
          update_snow:
            action: Phase2 
            ritm_number: "{{ ritm_number }}"
            status: Waiting
            comments: Trigger-2 of decommission has failed investigation in progress for the following ci's {{ vm_fail_agp }}.
            username: "{{ SN_USERNAME }}"
            password: "{{ SN_PASSWORD }}" 
          run_once: True  
          register: api_result
          when: doc_agp_fin is search("Failure")
                                  

      rescue:
        - debug:
            var: close_tr_output      


            
        
            
             
