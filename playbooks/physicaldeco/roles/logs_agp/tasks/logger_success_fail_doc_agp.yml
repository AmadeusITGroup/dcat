    - name: "Logger and Create/Update TR- Win@proach "
      block:

        - name: Display the JSON file content
          shell: cat record_doc_agp.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_doc_agp: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost        

        - meta: end_host
          when: record_doc_agp == ""      

        - name: VM_host list
          shell: cat doc_agp_final.yml
          delegate_to: localhost
          register: doc_agp_result              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            doc_agp: "{{ doc_agp_result.stdout }}" 
          delegate_to: localhost

        - meta: end_host
          when: doc_agp == ""

        - name: VM_host list
          shell: cat record_id_logger.json
          delegate_to: localhost
          register: record_result              

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id: "{{ record_result.stdout }}"
          delegate_to: localhost          
           

################# CREATE TR ################
        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "PHYSICAL DECO -LOGGER AFTER GRACE PERIOD"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"
            severity: "4"
            overview: "PHYSICAL DECO -LOGGER AFTER GRACE PERIOD"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_id == ""
          

        - set_fact:
            record_id_logger: "{{create_tr_output.record_id}}"
          when: record_id == ""  
           
      
 
        - copy:
            content: '{{ record_id_logger|to_json }}'
            dest: record_id_logger.json
          delegate_to: localhost                   
          when: record_id == ""   

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_id_logger }}"
          register: add_document
          delegate_to: localhost 
          when: record_id == ""         
            
