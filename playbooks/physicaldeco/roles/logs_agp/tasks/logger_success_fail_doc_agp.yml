    - name: "Logger and Create/Update TR- Win@proach "
      block:     

        - name: "Set header"
          shell: echo > record_doc_agp.json         
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > doc_agp_final.yml         
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > success_vm_agp.yml         
          run_once: true
          delegate_to: localhost  

        - name: "Set header"
          shell: echo > failure_vm_agp.yml          
          run_once: true
          delegate_to: localhost           
               
      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check suucess_fail_doc agp logger "       
