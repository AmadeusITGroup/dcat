---
# - name: "SAN Storage Cleanup 
#          NOTE: IF THE SERVER IS SHUTDOWN SAN STORAGE CLEANUP WILL NOT PROCESS"
#   hosts: all
#   gather_facts: no
#   connection: local
#   throttle: 1
#   vars:
#       file_info_storage_phy: "info_storage_phy.txt" 
#       file_success_storage_info: "success_storage_info.yml" 
#       file_failure_storage_info: "failure_storage_info.yml" 
#       filtered_output: []
#       filtered_output_no_info: []
#       #switch_ip: ["10.82.108.102","10.82.108.102"]
 
#   tasks:
    - name: Handle SAN Storage Cleanup Errors
      throttle: 1
      block:

        - name: Display the JSON file content
          shell: cat record_for_storage_info_fetch.json
          delegate_to: localhost
          register: TR_result_storage_info_fetch 

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_storage_info_fetch: "{{ TR_result_storage_info_fetch.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_storage_info_fetch== ""

        - set_fact:
            env_data: "{{ hostvars.localhost.env_data.msg }}"
          

        - set_fact:
            file_success_storage_info: "storage_info_fetch_success.yml"
            file_failure_storage_info: "storage_info_fetch_failure.yml" 
            file_storage_info_final: "storage_fetch_information_final.txt"
            file_info_storage_phy: "info_storage_phy.txt"   
            filtered_output: []
            filtered_output_no_info: []
            alias_host: []
            file_wwpn: "wwpn{{ inventory_hostname }}.txt"
            current_host: "{{ inventory_hostname }}"
            #module_update: []

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
      
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "Check entry for DECO server and fetch wwpn information of host"
          storage_state_value_fetch:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"                        
          register: info_result_host
          delegate_to: localhost     

        - debug:
            var: info_result_host

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
              time: "{{tstamp.stdout}}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_san_info_failure.txt                  
          delegate_to: localhost
          when: info_result_host.module_update is search("Error")

        - name: "unable to fetch data from state file writing to failure file"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], unable to fetch data from state file.{{ info_result_host.module_update }}" >> {{file_failure_san}}                    
          delegate_to: localhost   
          when: info_result_host.module_update is search("Error")

        - meta: end_host
          when: info_result_host.module_update is search("Error")

        - name: "Host WWPN - Output"
          set_fact:
            host_wwpns_info: "{{ info_result_host.module_update.host_info}}"

        - set_fact:
            host_wwpns: "{{ host_wwpns_info.WWPN }}"


        - debug:
            msg: "{{ host_wwpns | length }}"

        # - name: "Always print the value of host_wwpns at the end"
        #   debug:
        #     msg: "Final value of host_wwpns is: {{ host_wwpns }}"

        # - name: "Print the length of the variable"
        #   debug:
        #     msg: "The length of host_wwpns is: {{ host_wwpns | length }}"

        - name: "collecting host wwpn to info file"
          shell: echo "{{ inventory_hostname }}, host wwpn - {{ host_wwpns| to_json }}." >> {{file_info_storage_phy}}                    
          delegate_to: localhost 

        - name: converting each wwpn into the format with colon
          set_fact:
            formatted_wwpn: "{{formatted_wwpn | default([]) + [item | regex_replace('(\\w{2})','\\1:')]}}"
          loop:  "{{host_wwpns}}"        

        - name: removing the trailing colons
          set_fact: 
            formatted_wwpn: "{{formatted_wwpn | map('regex_replace','(:$)','') | list}}"

        - debug:
            var: formatted_wwpn 

        - name: creating a file
          file:
            path: "{{file_wwpn}}"
            state: touch 
          delegate_to: localhost
          register: file_create

        - name: write elements to the file
          lineinfile:
            path: "{{file_wwpn}}"    
            line: "{{ item }}"
          with_items: "{{ formatted_wwpn }}"
          delegate_to: localhost
          register: file_output


        - set_fact:
            broc_file: brocade_inventory.yml
          when: env_data == "prod"                      

        - set_fact:
            broc_file: brocade_inventory_dev.yml
          when: env_data == "dev"  


        - name: Fetching all the switch IPs into list variable- Read YAML file
          slurp:
            path: "{{ broc_file }}"
          delegate_to: localhost
          register: switch_ip_yaml_file

        - name: Extract IP adresses to list
          set_fact:
            decoded_out: "{{ switch_ip_yaml_file.content| b64decode | from_yaml }}" #| map(attribute='server_ip') | list }}"
  
        - set_fact:
            switch_ip_list : "{{ decoded_out | regex_findall('\\bserver_ip=([\\d.]+)')}}"    

        - debug:
            var: switch_ip_list                      
                            
         
        - name: "Custom module for fetching the info" 
          storage_switch_host_info_fetch:
            host: "{{ switch_ip_list }}"
            hostname: "{{ inventory_hostname }}"
            username: "{{ synergon_username }}"
            password: "{{ synergon_password }}"            
          delegate_to: localhost
          register: storage_cleanup_info
          when: env_data == "prod" 

        - name: "Custom module for fetching the info" 
          storage_switch_host_info_fetch_dev:
            host: "{{ switch_ip_list }}"
            hostname: "{{ inventory_hostname }}"
            username: "{{ synergon_username }}"
            password: "{{ synergon_password }}"            
          delegate_to: localhost
          register: storage_cleanup_info_dev
          when: env_data == "dev"           

        - debug:
            var: storage_cleanup_info 

        - name: getting the values to store in the state file
          set_fact:
            info_state_file: "{{ storage_cleanup_info.status }}"
          when: env_data == "prod"
          
        - name: Getting value to store in state file
          set_fact:
            info_state_file: "{{ storage_cleanup_info_dev.status }}"
          when: env_data == "dev"

        - name: "Debug hostclustername output"
          debug:
            var: info_state_file

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: collecting if any exception occurred
          shell: echo "{{ inventory_hostname }}, {{ info_state_file }}." >> {{file_failure_storage_info}}                    
          delegate_to: localhost 
          when: '"Exception" in info_state_file'

        - meta: end_host
          when: '"Exception" in info_state_file'   

        - name: "collecting data to info file"
          shell: echo "{{ inventory_hostname }}, {{ info_state_file | to_json}}." >> {{file_info_storage_phy}}                    
          delegate_to: localhost 
          when: info_state_file!=[]  

        - name: getting the values which doesnt contain no device 
          set_fact:
            info_state: "{{ info_state_file | map('reject','search','no device')| map('list') | list }}"
          delegate_to: localhost 

        - name: filtering empty sublists if any
          set_fact:
            info_state_final: "{{ info_state |reject('equalto',[])|map('list') | list }}"    

        - name: "Debug hostclustername output"
          debug:
            var: info_state

        - name: "Debug hostclustername output"
          debug:
            var: info_state_final       

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_san_info_failure.txt                  
          delegate_to: localhost
          when: info_state_final == []     

        - name: Writing all the no device info to failure file 
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], no device found for any of the switches kindly verify ." >> {{file_failure_storage_info}}                    
          delegate_to: localhost 
          when: info_state_final ==[]

        - meta: end_host
          when: info_state_final ==[]

        - name: getting the values which contain no information for any of the parameters 
          set_fact:
            information_result: "{{ info_state_final | map('select','search','no information')|map('list') | list }}"

        - name: filtering empty sublists if any
          set_fact:
            information_result_final: "{{ information_result |reject('equalto',[])|map('list') | list }}"  

        - name: "Debug hostclustername output"
          debug:
            var: information_result

        - name: "Debug hostclustername output"
          debug:
            var: information_result_final    

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_san_info_failure.txt                  
          delegate_to: localhost
          when: information_result_final == []        
        
        - name: Writing all failure file when there is no information in any of the parameter
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], no information found kindly verify the attachment ." >> {{file_failure_storage_info}}                    
          delegate_to: localhost 
          when: information_result_final !=[] 


        - name: flatten the list
          set_fact: 
            flat_list: "{{info_state_final | flatten(levels=1)}}"

        - debug:
            var: flat_list   

        - name: "collecting data only with infomation  to info file final"
          shell: echo "{{ inventory_hostname }},storage information- {{flat_list | to_json}}." >> {{file_storage_info_final}}                    
          delegate_to: localhost 

        - meta: end_host
          when: information_result_final !=[]           

 ##################  validation for the zones and aliases if it has hostname if not there is mismatch in configuration######################
        - name: checking if the aliases has the hostname 
          set_fact:
            alias_host: "{{ flat_list | map(attribute=4) | list | flatten(levels=1)}}" 

        - name: checking if the aliases has the hostname 
          set_fact:
            alias_host_map: "{{ alias_host | reject('search',current_host) | list }}"

        - name: checking if the zones has the hostname 
          set_fact:
            zone_host: "{{ flat_list | map(attribute=5) | list | flatten(levels=1)}}"

        - name: checking if the zones has the hostname 
          set_fact:
            zone_host_map: "{{ zone_host | reject('search',current_host) | list }}"

        - debug: 
            var: alias_host  

        - debug: 
            var: alias_host_map 

        - debug: 
            var: zone_host 

        - debug: 
            var: zone_host_map   

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_san_info_failure.txt                  
          delegate_to: localhost
          when: alias_host_map != [] or zone_host_map != []                                   

        - name: Writing all failure file when there is no information in any of the parameter
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], There is configuration mismatch in the switches when validated the wwpns Kindly check the attachment file storage_fetch_information_final ." >> {{file_failure_storage_info}}                    
          delegate_to: localhost 
          when: alias_host_map !=[] or zone_host_map !=[] 

        - meta: end_host
          when: alias_host_map !=[] or zone_host_map !=[]

        - name: "update storage cleanup state file for DECO server"
          storage_state_values_update:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "info_storage_cleanup"
            status: "{{ flat_list }}"               
          register: update_status_info_storage_cleanup
          delegate_to: localhost
          when: flat_list is defined and flat_list != []

        - debug:
            var: update_status_info_storage_cleanup  

        - set_fact:
             check_update_flag: "{{ update_status_info_storage_cleanup.module_update }}"
          when: update_status_info_storage_cleanup.module_update is defined        


        - debug:
            var: check_update_flag     

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_san_info_failure.txt                  
          delegate_to: localhost
          when: check_update_flag is defined and check_update_flag is not search("successfully")

        - name: "collecting failure info to failure file"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to update the information to state file.{{ check_update_flag }}" >> {{file_failure_storage_info}}                    
          delegate_to: localhost 
          when: check_update_flag is defined and check_update_flag is not search("successfully")

        - meta: end_host
          when: check_update_flag is defined and check_update_flag is not search("successfully")           

        - name: "collecting success info to success file"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully fetched storage information and updated to state file." >> {{file_success_storage_info}}                    
          delegate_to: localhost 
          when: check_update_flag is defined and check_update_flag is search("successfully")

        - name: "update entry for DECO server "
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "san_info_fetch"
            status: "T"            
          register: update_status_state_file
          delegate_to: localhost
          when: check_update_flag is defined and check_update_flag is search("successfully") #and (alias_host_map ==[] or zone_host_map ==[]))

        - set_fact:
             check_state_flag: "{{ update_status_state_file.state_update }}"
          when: update_status_state_file.state_update is defined 

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_san_info_failure.txt                  
          delegate_to: localhost
          when: check_state_flag is defined and check_state_flag is not search("successfully")

        - name: "collecting failure info of state file updation "
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to update state file as TRUE.{{ check_state_flag }}" >> {{file_failure_storage_info}}                    
          delegate_to: localhost 
          when: check_state_flag is defined and check_state_flag is not search("successfully")

        - debug:
            var: update_status_state_file

      rescue: 
        - name: When above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors on san_storage_cleanup_main" 

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp 

        - set_fact:
              time: "{{tstamp.stdout}}"
        
        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_san_info_failure.txt                  
          delegate_to: localhost
              
        - name: "collecting failure info to failure file"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], check errors on san_storage_cleanup_wwpn_info_gather module." >> {{file_failure_storage_info}}                    
          delegate_to: localhost  
  