        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
        #   delegate_to: localhost

        # - meta: end_host
        #   when: record_id_healthcheck != ""

        - name: "Check entry for DECO server"
          update_ref:
            hostname: "{{inventory_hostname}}"
            artifacts_user: "{{ artifacts_user }}"
            artifacts_password: "{{ artifacts_password }}"
            state_file_url: "{{ state_file }}"
            lookup_file: "{{ lookup_file }}"
          register: idem_status
          delegate_to: localhost
        

        - set_fact: 
            monitoring: '{{idem_status.module_update.monitoring}}'                 

        - set_fact: 
            cmdb_fetch_bgp: '{{idem_status.module_update.cmdb_fetch_bgp}}'         

        - name: "PHYSICAL list"
          shell: echo "{{ inventory_hostname }}," >> {{ host_list }}                   
          delegate_to: localhost
          when: monitoring == false and cmdb_fetch_bgp == true                 
            
      rescue:
        - debug:
            msg: "Failed to fect hostlist for PHYSICAL DISABLE MONITORING PROCESS"      

