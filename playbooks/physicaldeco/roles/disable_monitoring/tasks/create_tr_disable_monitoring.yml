---    
    - name: "Handling Create TR- Win@proach "
      block: 

        - set_fact:
        # - name: Display the JSON file content
        #   shell: cat record_healthcheck.json
        #   delegate_to: localhost
        #   register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
        #   delegate_to: localhost

        # - meta: end_host
        #   when: record_id_healthcheck != ""

        - name: Display the JSON file content
          shell: cat idem_disable_monitoring_pre.json
          delegate_to: localhost
          register: result_disable_monitoring

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_dns_check_network_flag: "{{ result_disable_monitoring.stdout }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_dns_check_network_flag == false
  

        - name: Display the JSON file content
          shell: cat idem_disable_monitoring.json
          delegate_to: localhost
          register: result_app_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_dns_check_flag: "{{ result_app_cmdb.stdout }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_dns_check_flag == true       

        - name: VM_host list
          shell: cat host_list_disable_monitoring.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost          

        - name: create TR
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco dns ipam"
            cr_id: "{{ cr }}"
            ticket_title: "VM DECO: IPAM Cleanup"
            ci: "{{ vm_hostlist }}"
          register: ticket_id
          delegate_to: localhost
        
        - set_fact:
            dns_record_id: "{{ticket_id.id.ticketId}}"
    

        - copy:
            content: '{{ dns_record_id|to_json }}'
            dest: record_dns.json
          delegate_to: localhost

    
      rescue:
        - debug:
            msg: "Failed to Create VM DECO - Disable Monitoring TR"

