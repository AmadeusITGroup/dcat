---     
    - name: "Close TR"
      block:        
        - name: VM_host list
          shell: cat record_vm_logger.json
          delegate_to: localhost
          register: vm_result             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            record_vm_logger: "{{ vm_result.stdout[1:-1] }}"  
          delegate_to: localhost


        - name: "Test custome module [CLOSE TR]"
          close_tr:
            record_id: "{{record_vm_logger}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          register: close_tr_output

      rescue:
        - debug:
            var: close_tr_output

    - name: clearing the files and json
      block:                    

        - name: "Set header"
          shell: echo > record_vm_logger.json        
          run_once: true
          delegate_to: localhost
                    
      rescue:
        - debug:
            msg: " exception occured while clearing the files and json in logger,Rescued in close logger"        
