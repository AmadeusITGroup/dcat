---
# - name: "This playbook is to Create TR for success_fail_documentation bgp"
#   hosts: localhost
#   gather_facts: no
#   vars:
#     graceperiod_flag: False

#   #### TR creatation #####

#   tasks:    
    - name: "Handling Create TR- Win@proach "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: VM_host list
          shell: cat success_vm_bgp.yml
          delegate_to: localhost
          register: vm_result_suc              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_success_bgp: "{{ vm_result_suc.stdout }}" 
          delegate_to: localhost


        - name: VM_host list
          shell: cat failure_vm_bgp.yml
          delegate_to: localhost
          register: vm_result_fai              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_fail_bgp: "{{ vm_result_fai.stdout }}" 
          delegate_to: localhost

        - meta: end_host
          when: vm_success_bgp == "" and vm_fail_bgp == ""                   
        

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: PHYSICAL DECO - Success/Failed list of Physical Before graceperiod"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "PHYSICAL DECO - Success/Failed list of Physical Before graceperiod"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
        
        - set_fact:
            record_doc_bgp: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_doc_bgp|to_json }}'
            dest: record_doc_bgp.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_doc_bgp }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create docuemntation TR for Physical DECO - Success/Failed list of Physical's Before graceperiod"

    - name: "Handling Create TR- Win@proach -1 "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

