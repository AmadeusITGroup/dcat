---
# - name: Playbook for DECO Health check_SAN 
#   hosts: localhost
#   gather_facts: no
#   vars:
#     graceperiod_flag: true

#   tasks:

    - name: "Deco Health check status SAN"
      block:

        - name: Display the JSON file content
          shell: cat san_box_agp_list.yml
          delegate_to: localhost
          register: result_state_file_agp                   

        - name: save the Json data to a Variable as a Fact
          set_fact:
            san_box_agp_list: "{{ result_state_file_agp.stdout }}" 
          delegate_to: localhost


        - name: "Deco Health check status SAN"
          healthcheck_phy_san:
            username: "{{ synergon_username }}"
            password: "{{ synergon_password }}" 
            ipaddr: "{{ item }}"
          loop: "{{ san_box_agp_list }}"                 
          delegate_to: localhost                       
          register: san_validation
          until: '"Successfully" in san_validation.msg'
          retries: 3
          delay: 10

        - set_fact:
            san_res : "{{ san_validation.results }}"


        - debug:
            var: san_res

        - debug:
            msg: "{{ san_res | type_debug }}"


        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                      
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "SAN validation success - Prod"
          shell: echo "#SAN Switches, {{ time }}, [INFO], :SAN Switch {{ item }} SSH connectivity is enabled" >> san_switches_success.yml   
          delegate_to: localhost 
          loop: "{{ san_box_agp_list }}"         
          when: san_res is search("Successfully ssh to SAN box {{ item }}") and san_res is not search("mucfsp054|mucfsp154")

        - name: "SAN validation success - Dev"
          shell: echo "#SAN Switches, {{ time }}, [INFO], :SAN Switch {{ item }} SSH connectivity is enabled" >> san_switches_success.yml   
          delegate_to: localhost 
          loop: "{{ san_box_agp_list }}"         
          when: san_res is search("Successfully ssh to SAN box {{ item }}") and san_res is search("mucfsp054|mucfsp154")

        - name: "SAN validation failure"
          shell: echo "!SAN Switches, {{ time }}, [ERROR], :SAN Switch {{ item }} SSH connectivity has issue either connection or credential issue" >> san_switches_fail.yml
          delegate_to: localhost
          loop: "{{ san_box_agp_list }}"
          when: san_res is search("Failed to ssh {{ item }}") and san_res is search("ERROR")                    

      rescue:
        - debug:
            var: san_validation         
            
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                          
        - set_fact:
            time: "{{tstamp.stdout}}"        

        - name: "SAN validation failure"
          shell: echo "!SAN Switches, {{ time }}, [ERROR], :SAN Switch {{ item }} SSH connectivity has issue either connection or credential issue" >> san_switches_fail.yml
          delegate_to: localhost
          loop: "{{ san_box_agp_list }}"
          when: san_res is search("Failed to ssh {{ item }}") and san_res is search("ERROR")                    


