      ####Adding Info to TR 

    - name: "Handling TR record_id"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck == ""   


        - name: Display the JSON file content
          shell: cat check_artifacts_success.yml
          delegate_to: localhost
          register: result_check_arti_suc

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_artifacts_success: "{{ result_check_arti_suc.stdout }}" 
          delegate_to: localhost 

        - name: "adding up the healthcheck issue"
          shell: echo "{{ check_artifacts_success }}" >> check_final_success.yml                    
          delegate_to: localhost            
          when: check_artifacts_success != ""     
               

        - name: Display the JSON file content
          shell: cat check_remedy_success.yml
          delegate_to: localhost
          register: result_check_remedy_succ

        - name: save the Json data to a Variable as a Fact
          set_fact:
