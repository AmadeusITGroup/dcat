          delegate_to: localhost

        - name: "adding up the healthcheck issue"
          shell: echo "{{ check_remedy_success }}" >> check_final_success.yml                    
          delegate_to: localhost            
          when: check_remedy_success != ""            
           

        - name: Display the JSON file content
          shell: cat check_ipam_success.yml
          delegate_to: localhost
          register: result_check_ipam_succ

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_ipam_success: "{{ result_check_ipam_succ.stdout }}" 
          delegate_to: localhost 

        - name: "adding up the healthcheck issue"
          shell: echo "{{ check_ipam_success }}" >> check_final_success.yml                    
          delegate_to: localhost            
          when: check_ipam_success != "" 

#########################################################
        - name: Display the JSON file content
          shell: cat san_switches_success.yml
          delegate_to: localhost
          register: result_san_switches_success

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_san: "{{ result_san_switches_success.stdout }}" 
          delegate_to: localhost 

        - name: "adding up the healthcheck issue"
          shell: echo "{{ check_san }}" >> check_final_success.yml                    
          delegate_to: localhost            
          when: check_san != ""

        - name: Display the JSON file content
          shell: cat network_healthcheck_success.yml
          delegate_to: localhost
          register: result_network_healthcheck_success

        - name: save the Json data to a Variable as a Fact
          set_fact:
            network_healthcheck_success: "{{ result_network_healthcheck_success.stdout }}" 
          delegate_to: localhost 

        - name: "adding up the healthcheck issue"
          shell: echo "{{ network_healthcheck_success }}" >> check_final_success.yml                    
          delegate_to: localhost            
          when: network_healthcheck_success != ""

        - name: Display the JSON file content
          shell: cat phy_ssh_success.yml
          delegate_to: localhost
          register: result_phy_ssh_success

        - name: save the Json data to a Variable as a Fact
          set_fact:
            phy_ssh_success: "{{ result_phy_ssh_success.stdout }}" 
          delegate_to: localhost 

        - name: "adding up the healthcheck issue"
          shell: echo "{{ phy_ssh_success }}" >> check_final_success.yml                    
          delegate_to: localhost            
          when: phy_ssh_success != ""                                                                             


        - name: Display the JSON file content
          shell: cat check_final_success.yml
          delegate_to: localhost
          register: result_check_final_suc

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_final_success: "{{ result_check_final_suc.stdout }}" 
          delegate_to: localhost                                                                                          
        
        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the DECO results for API checks - physical servers"
            form3: "***********************************************************************"            
        - set_fact:
            content_check_final_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_final_success }}"
          when: check_final_success != ""  
          

      rescue:
        - debug:
            var: 'check_final_success'

    - name: "Handling add message in TR"
      block: 

        - name: VM_host list
          shell: cat check_final_success.yml
          delegate_to: localhost
          register: vm_result              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_check_final_suc: "{{ vm_result.stdout }}" 
          delegate_to: localhost     

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck == ""              
     
       
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{ record_id_healthcheck }}"
            message: "{{ content_check_final_suc }}"             
            username: "DecoP112686"     
            password: "opFCtCpIMzmC" 
          delegate_to: localhost
          register: add_msg_output
          when: vm_check_final_suc != ""
                                

      rescue:
        - debug:
            var: add_msg_output            

