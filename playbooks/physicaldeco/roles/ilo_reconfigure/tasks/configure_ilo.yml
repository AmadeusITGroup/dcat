        - name: "check the packaged availablity"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo rpm -qa | grep hponcfg"
          register: RPM_status
          delegate_to: localhost

        - name: "Show the installed package"
          debug:
            var: RPM_status.status
          when: RPM_status.status is search("hponcfg")

        - name: "Copy package to target host"
          copy_package:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            package: hponcfg-5.6.0-0.x86_64.rpm
          register: copy_status
          when: RPM_status.status is not search("hponcfg")
          delegate_to: localhost
                              
        - name: "Install the hponcfg package"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo yum -y install hponcfg-5.6.0-0.x86_64.rpm"
          register: hponcfg_install
          delegate_to: localhost
          when: RPM_status.status is not search("hponcfg")

        - name: "check the packaged availablity after install"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo rpm -qa | grep hponcfg"
          register: RPM_status_after_install
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "ILO reset Failed for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - unable to install hponcfg package on host for DCAT iLO reconfigure operations." >> {{ilo_failure}}                    
          delegate_to: localhost
          when: RPM_status_after_install.status is not search("hponcfg")

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ilo_reconf_failure.txt                  
          delegate_to: localhost
          when: RPM_status_after_install.status is not search("hponcfg")

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ilo_reconf_failure.txt                  
          delegate_to: localhost
          when: RPM_status_after_install.status is not search("hponcfg")

        - meta: end_host
          when: RPM_status_after_install.status is not search("hponcfg")

        - name: "Reset Factory setting for ILO"
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: "sudo /sbin/hponcfg -r"
          register: hponcfg_status
          delegate_to: localhost
          when: RPM_status_after_install.status is search("hponcfg")

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "ILO reset Failed for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - unable to reset ILO to factory settings for host." >> {{ilo_failure}}                    
          delegate_to: localhost
          when: >
            hponcfg_status.status is not defined or 
            'ERROR' in (hponcfg_status.status | join(' '))

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ilo_reconf_failure.txt                  
          delegate_to: localhost
          when: >
            hponcfg_status.status is not defined or 
            'ERROR' in (hponcfg_status.status | join(' '))

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ilo_reconf_failure.txt                  
          delegate_to: localhost
          when: hponcfg_status.status is not defined

        - meta: end_host
          when: >
            hponcfg_status.status is not defined or 
            'ERROR' in (hponcfg_status.status | join(' '))

        - name: "ILO reset Sucess for host - {{ inventory_hostname }}"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO] - ILO reset step completed successfully for host." >> {{ilo_success}}                    
          delegate_to: localhost
          when: >
            hponcfg_status.status is defined and
            'The Management Processor has been rebooted' in (hponcfg_status.status | join(' ')) and
            'ERROR' not in (hponcfg_status.status | join(' '))

        - name: Configure the iLO
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: sudo /sbin/hponcfg -f /tmp/{{ item }}
          register: ILO_configure_status
          loop:
            - ilo_all_Mod_Network_Settings.xml
            - ilo_all_Add_User_Administrator.xml
          delegate_to: localhost
          retries: 5
          delay: 30
          until: "'POST in progress' not in (ILO_configure_status.results | map(attribute='status') | list | join(' '))"

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        # - name: "ILO configure Failed for host - {{ inventory_hostname }}"
        #   shell: |
        #     echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - unable to configure ILO for host" >> {{ ilo_failure }}
        #   delegate_to: localhost
        #   when: ILO_configure_status is not defined or ILO_configure_status.status is not defined

        # - meta: end_host
        #   when: ILO_configure_status is not defined or ILO_configure_status.status is not defined

        # - name: "ILO reset Success for host - {{ inventory_hostname }}"
        #   shell: |
        #     echo "{{ inventory_hostname }}, {{ time }}, [INFO] - ILO re-configure completed for host" >> {{ ilo_success }}
        #   delegate_to: localhost
        #   when: ILO_configure_status is defined and ILO_configure_status.status is defined

        # - name: "ILO configure Failed for host - {{ inventory_hostname }}"
        #   shell: |
        #     echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - unable to configure ILO for host" >> {{ ilo_failure }}
        #   delegate_to: localhost
        #   when: 
        #     - ILO_configure_status is not defined
        #     - or ILO_configure_status.status is not defined
        #     - or "'Script succeeded' not in ILO_configure_status.status | join(' ')"

        # - meta: end_host
        #   when: 
        #     - ILO_configure_status is not defined
        #     - or ILO_configure_status.status is not defined
        #     - or "'Script succeeded' not in ILO_configure_status.status | join(' ')"


        - name: "ILO configure Failed for host - {{ inventory_hostname }}"
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - unable to configure new DCAT ILO settings for host." >> {{ ilo_failure }}
          delegate_to: localhost
          when: >
            ILO_configure_status is not defined or
            ILO_configure_status.results is not defined or
            not ('Script succeeded' in (ILO_configure_status.results | map(attribute='status') | list | join(' ')))

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ilo_reconf_failure.txt                  
          delegate_to: localhost
          when: >
            ILO_configure_status is not defined or
            ILO_configure_status.results is not defined or
            not ('Script succeeded' in (ILO_configure_status.results | map(attribute='status') | list | join(' ')))

        - meta: end_host
          when: >
            ILO_configure_status is not defined or
            ILO_configure_status.results is not defined or
            not ('Script succeeded' in (ILO_configure_status.results | map(attribute='status') | list | join(' ')))



        # - name: "ILO reset Success for host - {{ inventory_hostname }}"
        #   shell: |
        #     echo "{{ inventory_hostname }}, {{ time }}, [INFO] - ILO re-configure completed for host" >> {{ ilo_success }}
        #   delegate_to: localhost
        #   when: 
        #     - ILO_configure_status is defined
        #     - ILO_configure_status.status is defined
        #     - "'Script succeeded' in ILO_configure_status.status | join(' ')"

        - name: "ILO reset Success for host - {{ inventory_hostname }}"
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [INFO] - ILO re-configure completed for host successfully." >> {{ ilo_success }}
          delegate_to: localhost
          when: 
            - ILO_configure_status is defined
            - ILO_configure_status.results is defined
            - ILO_configure_status.results | map(attribute='status') | list is not none
            - "'Script succeeded' in (ILO_configure_status.results | map(attribute='status') | list | join(' '))"

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server for ilo reconfig"
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "ilo_reconfig"
            status: "T"            
          register: update_status
          delegate_to: localhost  
          when: 
            - ILO_configure_status is defined
            - ILO_configure_status.results is defined
            - ILO_configure_status.results | map(attribute='status') | list is not none
            - "'Script succeeded' in (ILO_configure_status.results | map(attribute='status') | list | join(' '))"

      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors for ilo reconfigure module for errors"  

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Failure information to file in rescue block"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR],  Witnessed abrupt Failures, rescued the flow! Kindly check ilo reconfigure module for errors" >> {{ilo_failure}}                    
          delegate_to: localhost