---
    - name: Initiating the ILO reconfigure
      throttle: 1
      block:
        - name: VM_host list
          shell: cat host_list_ilo_reconfig.yml
          delegate_to: localhost
          register: hostlist_phy              

        - name: save the Phy list to a Variable as a Fact
          set_fact:
            phy_hostlist: "{{ hostlist_phy.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: phy_hostlist == ""
          
        - set_fact:
            ilo_success: "ilo_reconfig_success.yml"
            ilo_failure: "ilo_reconfig_failure.yml"

        - name: get fqdn from CMDB RTU
          fqdn_fetch_rtu:
            host: "{{ inventory_hostname }}"
            cmdb_rtu: "{{ cmdb_rtu }}"
          register: fqdn_name
          delegate_to: localhost

        - set_fact:
            fqdn: "{{ fqdn_name.rtu_status_fqdn.fqdn }}" 

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost   

        - name: "Check entry for DECO server for filter hostlist for cmdb duplicate list"
          azure_update_ref_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost

        - set_fact:
            serial_num: "{{ idem_status.module_update.serial }}"   

        # - name: "get Serial Number"
        #   get_serial:
        #     hostname: '{{ fqdn }}'
        #     username: "{{ remote_username }}"
        #     password: "{{ remote_keyfile }}"
        #   register: serial_num
        #   delegate_to: localhost

        - name: Remove any leftover ILO XML from /tmp
          ilo_commands:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
            command: sudo rm -f /tmp/{{ item }}
          loop:
            - ilo_all_Add_User_Administrator.xml
            - ilo_all_Mod_Network_Settings.xml
          delegate_to: localhost

            
        - name: Copy configuration files to remote server
          copy_over_ssh:
            hostname: "{{ fqdn }}"
            username: "{{ remote_username }}"
            key_filename: "{{ remote_keyfile }}"
            src: "{{ role_path }}/templates/{{ template_item }}.j2"
            dest: "/tmp/{{ template_item }}"
            variables:
              serial_num: "{{ serial_num }}"
              user_iloadm: "{{ user_iloadm }}"
              password_iloadm: "{{ password_iloadm }}" 
          loop:
            - ilo_all_Add_User_Administrator.xml
            - ilo_all_Mod_Network_Settings.xml
          loop_control:
            loop_var: template_item
          delegate_to: localhost


        # - name: Check if iLO user already exists
        #   ilo_commands:
        #     hostname: "{{ fqdn }}"
        #     username: "{{ remote_username }}"
        #     password: "{{ remote_keyfile }}"
        #     command: "sudo /sbin/hponcfg -w /tmp/ilo_user_list.xml"
        #   register: user_check
        #   delegate_to: localhost
        #   ignore_errors: yes

        # - name: Check if the user exists in the iLO configuration
        #   ilo_commands:
        #     hostname: "{{ fqdn }}"
        #     username: "{{ remote_username }}"
        #     password: "{{ remote_keyfile }}"
        #     command: "grep 'USER_NAME = \"{{ user_iloadm }}\"' /tmp/ilo_user_list.xml"
        #   register: user_exists
        #   delegate_to: localhost
        #   ignore_errors: yes

        # - name: ILO User status
        #   debug:
        #     msg: >
        #       "The user '{{ user_iloadm }}' exists in the iLO configuration: 
        #       {{ user_exists.status | length > 0 }}"
        #   delegate_to: localhost

        # - name: Delete iLO user if it exists
        #   ilo_commands:
        #     hostname: "{{ fqdn }}"
        #     username: "{{ remote_username }}"
        #     password: "{{ remote_keyfile }}"
        #     command: "sudo /sbin/hponcfg -f /tmp/ilo_Delete_User.xml"
        #   register: ilo_delete_status
