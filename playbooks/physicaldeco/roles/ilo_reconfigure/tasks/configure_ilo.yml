        # - name: ILO User deletion status
        #   debug:
        #     msg: >
        #       "The user '{{ user_iloadm }}' was successfully deleted from the iLO configuration."
        #   when: user_exists.status | length > 0
        #   delegate_to: localhost

        # - name: ILO User deletion status
        #   debug:
        #     msg: "The user '{{ user_iloadm }}' was successfully deleted from the iLO configuration."
        #   when: 
        #     - user_exists.status | length > 0
        #     - ilo_delete_status.status is search("Script succeeded")
        #   delegate_to: localhost

        # - name: Fail if iLO user deletion was not successful
        #   fail:
        #     msg: "iLO user deletion failed! Check logs for details."
        #   when: 
        #     - user_exists.status | length > 0
