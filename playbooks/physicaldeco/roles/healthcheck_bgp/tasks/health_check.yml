    - name: "Deco Health check status"
      block:

        - name: Display the JSON file content
          shell: cat cmdb_rtu.yml
          delegate_to: localhost
          register: result_cmdb_rtu

        - name: save the Json data to a Variable as a Fact
          set_fact:
            cmdb_rtu: "{{ result_cmdb_rtu.stdout }}" 
          delegate_to: localhost       

        - name: Check if cmdbrtu api up or not
          uri:
            url: https://{{ cmdb_rtu }}                
          register: result_cmdb
          until: "result_cmdb.status == 200"
          retries: 3
          delay: 10

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                      
        - set_fact:
            time: "{{tstamp.stdout}}"            

        - name: "cmdb_rtu status"
          shell: echo "#cmdb_rtu - {{ time }}, [INFO], "{{CMDB_URL}}"  is up and running, good to proceed with Physical Deco" >> check_remedy_success.yml   
          delegate_to: localhost           

      rescue:
        - debug:
            msg: "cmdb-RTU is unavaiable"

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                      
        - set_fact:
            time: "{{tstamp.stdout}}"            

        - name: "cmdb_rtu status"
          shell: echo "!cmdb_rtu - {{ time }}, [ERROR], "{{CMDB_URL}}"  is down currently after 3 retries needs attention" >> check_remedy.yml   
          delegate_to: localhost      

