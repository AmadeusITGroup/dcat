    - name: "Handling PTR record_id for PYHSICAL deco"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck == ""       

        - name: Display the JSON file content
          shell: cat san_switches_fail.yml
          delegate_to: localhost
          register: result_check_san

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_san_fail: "{{ result_check_san.stdout }}" 
          delegate_to: localhost     


        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the Storage SAN Switches error which needs support"
            form3: "***********************************************************************"
        - set_fact:
            content_check_san: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_san_fail }}"
          when: check_san_fail != ""

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost                    

############################################################################################################

        - name: find which key is preset in the log
          set_fact: 
            present_key1: "{{ present_key1 | default([]) + [item] }}"
          loop: "{{ res_dict.keys() }}"
          when: content_check_san is defined and item in content_check_san

        - name: print the corresponded  value of the key present
          set_fact:
            allowner_name1: "{{ allowner_name1 | default({}) | combine({item:res_dict[item]}) }}"
          loop: "{{ present_key1 }}"
          when: content_check_san is defined

        - name: all owners with format
          set_fact:
            all_owner_Final1: | 
              {% for key,value in allowner_name1.items()%}
              {{ key }} : {{ value }}
              {% endfor %}
          when: content_check_san is defined

        - name: "writing output to File"
          shell: echo -e "{{content_check_san}}\n\n{{Requester_group}}\n{{Requester_name}}\n\nOwner group Details below:\n{{all_owner_Final1}}" > groups_ptr.yml
          delegate_to: localhost
          when: content_check_san is defined

        - name: Display the JSON file content
          shell: cat groups_ptr.yml
          delegate_to: localhost
          register: result_groups1
          when: content_check_san is defined

        - name: save the Json data to a Variable as a Fact
          set_fact:
            support_groups1: "{{ result_groups1.stdout }}" 
          delegate_to: localhost
          when: content_check_san is defined

        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "DecoP112686"
            password: "opFCtCpIMzmC"
            ptr_title: "PYHSICAL DECO: Service health check Storage SAN Switches referring to failed TR - {{ record_id_healthcheck }}"
            tr_map: "{{ record_id_healthcheck }}"
            assignee_group: "DINFDECO" #"OSX04SMG"  
            ptr_logs: "{{ support_groups1 }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"         
          register: ptr_check_san_fail
          until: '"Successfully" in ptr_check_san_fail.msg'
          retries: 3
          delay: 10
          when: check_san_fail != ""

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "DecoP112686"
            password: "opFCtCpIMzmC"
            task_id: "{{ record_id_healthcheck }}"
            prob_id: "{{ ptr_check_san_fail.id }}"                   
          register: update_overview  
          when: check_san_fail != "" 

      rescue:
        - debug:
            msg: "Exception occurred PTR service health check - Storage NAS"                               
############################################################################################################


