      ####Adding Info to TR  
    - name: "Handling TR record_id"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck_ssh.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_healthcheck_ssh: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_healthcheck_ssh == "" 
             

        - name: Display the JSON file content
          shell: cat phy_ssh_fail.yml
          delegate_to: localhost
          register: result_check_linux

        - name: save the Json data to a Variable as a Fact
          set_fact:
            phy_ssh_fail: "{{ result_check_linux.stdout }}" 
          delegate_to: localhost

        - name: "adding up the healthcheck issue"
          shell: echo "{{ phy_ssh_fail }}" >> check_final_ssh.yml                    
          delegate_to: localhost            
          when: phy_ssh_fail != ""            



        - name: Display the JSON file content
          shell: cat check_final_ssh.yml
          delegate_to: localhost
          register: result_check_final

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_final_ssh: "{{ result_check_final.stdout }}" 
          delegate_to: localhost                                                                                          

        - meta: end_host
          when: check_final_ssh == ""
        
        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the DECO results for SSH Validation - physical servers"
            form3: "***********************************************************************"            
        - set_fact:
            content_check_final_ssh: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_final_ssh }}"
          when: check_final_ssh != ""  
          

      rescue:
        - debug:
            var: 'check_final_ssh'

    - name: "Handling add message in TR"
      block: 

        - name: PHYSICAL_host list
          shell: cat check_final_ssh.yml
          delegate_to: localhost
          register: PHYSICAL_result              

        - name: save the PHYSICAL list to a Variable as a Fact
          set_fact:
            PHYSICAL_check_final_ssh: "{{ PHYSICAL_result.stdout }}" 
          delegate_to: localhost     

        - meta: end_host
          when: PHYSICAL_check_final_ssh == ""

        - name: Display the JSON file content
          shell: cat record_healthcheck_ssh.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_healthcheck_ssh: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_healthcheck_ssh == ""              
     
       
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{ record_healthcheck_ssh }}"
            message: "{{ content_check_final_ssh }}"             
            username: "DecoP112686"     
            password: "opFCtCpIMzmC" 
          delegate_to: localhost
          register: add_msg_output
                                   

      rescue:
        - debug:
            var: 'add_msg_output'

    - name: "Close TR"
      block:  
        
        - name: PHYSICAL_host list
          shell: cat record_healthcheck_ssh.json
          delegate_to: localhost
          register: PHYSICAL_result             

        - name: save the PHYSICAL list to a Variable as a Fact
          set_fact:
            record_healthcheck_ssh: "{{ PHYSICAL_result.stdout[1:-1] }}"  
          delegate_to: localhost


        - name: "Test custome module [CLOSE TR]"
          close_tr:
            record_id: "{{ record_healthcheck_ssh }}"
            username: "DecoP112686"
            password: "opFCtCpIMzmC"
          register: close_tr_output
        
