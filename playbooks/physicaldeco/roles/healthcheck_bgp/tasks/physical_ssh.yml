---

#   tasks:
    - name: "handle the error before grace period vcenter search for vm"
      throttle: 1
      block:
        - name: get fqdn from CMDB RTU
          get_fqdn:
            host: "{{ inventory_hostname }}"
            cmdb_rtu: "{{CMDB_URL}}"
          register: fqdn_name
          delegate_to: localhost

        - set_fact:
            rtu_fqdn: "{{ fqdn_name.status }}"


        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                      
        - set_fact:
            time: "{{tstamp.stdout}}"   

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ssh_failure.txt                  
          delegate_to: localhost 
          when: rtu_fqdn == "NA"    

        - name: "Unable to fetch FQDN"
          shell: echo "#{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to fetch FQDN for {{ inventory_hostname }}" >> phy_fqdn_fail.yml   
          delegate_to: localhost         
          when: rtu_fqdn == "NA"

        - meta: end_host
          when: rtu_fqdn == "NA"

        - name: "Test custom module for server information gathering"
          gather_info_hc:
            hostname: "{{ rtu_fqdn }}"
            username: "{{ remote_username  }}"
            key_filename: "{{ remote_keyfile }}"                       
          delegate_to: localhost
          register: output_gather_info

        - set_fact:
            vmname: "{{ output_gather_info.host_result }}"


        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                      
        - set_fact:
            time: "{{tstamp.stdout}}"        

        - name: "SSH success"
          shell: echo "#{{ inventory_hostname }}, {{ time }}, [INFO], :SSH connectivity is enabled for {{ inventory_hostname }}" >> phy_ssh_success.yml   
          delegate_to: localhost         
          when: vmname is not search("ERROR")

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ssh_failure.txt                  
          delegate_to: localhost 
          when: vmname is search("ERROR")

        - name: "SSH fail"
          shell: echo "!{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to SSH Physical server {{ inventory_hostname }}, either connection or credential issue" >> phy_ssh_fail.yml                   
          delegate_to: localhost         
          when: vmname is search("ERROR") 

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost  

        - name: "get Serial Number"
          cmdb_fetch_dcm_serial:
            conn_str: "{{ private_endpoint_connection_string }}"
            server_name: '{{ inventory_hostname }}'
            cmdb_server: "{{ cmdb_url_update }}"
            user_name: "{{ emdb_username }}"
            pass_word: "{{ emdb_password }}" 
          register: serial_num
          delegate_to: localhost

        - set_fact:
            serial_status: "{{ serial_num.Status }}"

        - name: "update entry for DECO server for ILO reset"
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "serial"
            status: "{{ serial_status }}"           
          register: update_status_info_state
          delegate_to: localhost

        - debug:
            var: serial_status
            
        - name: Check ILO endpoints
          uri:
            url: https://ilo{{ serial_status }}.<server_fqdn>
            validate_certs: False
          register: ilo_status
          delegate_to: localhost
          ignore_errors: yes
      
      
        - set_fact:
            ilo_result: "{{ ilo_status.status }}"
          
        - debug:
            var: ilo_result
      
        - set_fact:
            username: "{{ user_iloroot }}"
          when: ilo_result == '200'
        
        - set_fact:
            password: "{{ password_iloroot }}"
          when: ilo_result == '200'

        - set_fact:
            ilohost: "{{ 'ilo'+ serial_status +'.<server_fqdn>' }}"
          when: ilo_result == '200'          
      
        - name: Check that you can connect (GET) to a page and it returns a status 200
          uri:
            url: https://{{ inventory_hostname +'rib.<server_fqdn>' }}
            validate_certs: False
          register: rib_status
          delegate_to: localhost
          ignore_errors: yes
      
        - set_fact:
            rib_result: "{{ rib_status.status }}"
      
        - set_fact:
            username: "{{ user_iloadm }}"
          when: rib_result == '200'
      
        - set_fact:
            password: "{{ password_iloadm }}"
          when: rib_result == '200'

        - set_fact:
            ilohost: "{{ inventory_hostname +'rib.<server_fqdn>t' }}"
          when: rib_result == '200'          
                                

        - name: Power on server from ILO
          poweron_ilo:
            hostname: "{{ ilohost }}"
            username: "{{ username }}"
            password: "{{ password }}"
          register: poweron_info
          delegate_to: localhost 

        - set_fact:
            result: "{{ poweron_info.Status }}"

        - debug:
            var: result       

        - set_fact:
             poweron_status: "Success"
          when: result is search("power already|powering on")
          
        - name: "Pass phy data's"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully poweredon" >> phy_ssh_success.yml   
          delegate_to: localhost 
          when: result is search("power already|powering on")

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> phy_ssh_failure.txt                  
          delegate_to: localhost 
          when: result is not search("power already|powering on")


        - name: "Pass phy data's"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to power on" >> phy_ssh_success.yml   
          delegate_to: localhost 
          when: result is not search("power already|powering on")     

      rescue: 
      - name: rescue on SSH connection issue - Physical Linux
        debug:
          msg: "rescue SSH connection issue - Physical Linux" 


      - name: Get timestamp from the system
        shell: "date +%Y-%m-%d/%H:%M"
        delegate_to: localhost
        register: tstamp  
                        
      - set_fact:
          time: "{{tstamp.stdout}}"

      - name: Display the JSON file content
        shell: cat phy_ssh_success.yml
        delegate_to: localhost
        register: result_phy_ssh_success

      - name: save the Json data to a Variable as a Fact
        set_fact:
          phy_ssh_success: "{{ result_phy_ssh_success.stdout }}" 
        delegate_to: localhost                   

      - name: "Write Failure host to file"
        shell: echo "{{ inventory_hostname }} Failure" >> phy_ssh_failure.txt                  
        delegate_to: localhost 
        when: phy_ssh_success is not search("{{ inventory_hostname }}")

      - name: "VM host list failure to file before grace period"
        shell: echo "!{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to SSH Physical server {{ inventory_hostname }}, either connection or credential issue" >> phy_ssh_fail.yml                   
        delegate_to: localhost
        when: phy_ssh_success is not search("{{ inventory_hostname }}")    