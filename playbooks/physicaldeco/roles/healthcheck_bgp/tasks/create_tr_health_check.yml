#   tasks:    
    - name: "Handling Create TR- Win@proach for health check task "
      block:

        - name: Display the JSON file content
          shell: cat check_artifacts.yml
          delegate_to: localhost
          register: result_check_arti

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_artifacts: "{{ result_check_arti.stdout }}" 
          delegate_to: localhost

    

        - name: Display the JSON file content
          shell: cat san_switches_success.yml
          delegate_to: localhost
          register: result_check_san

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_san: "{{ result_check_san.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat check_remedy.yml
          delegate_to: localhost
          register: result_check_remedy

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_remedy: "{{ result_check_remedy.stdout }}" 
          delegate_to: localhost


        - name: Display the JSON file content
          shell: cat check_artifacts_success.yml
          delegate_to: localhost
          register: result_check_arti_suc

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_artifacts_success: "{{ result_check_arti_suc.stdout }}" 
          delegate_to: localhost 


        - name: Display the JSON file content
          shell: cat check_remedy_success.yml
          delegate_to: localhost
          register: result_check_remedy_succ

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_remedy_success: "{{ result_check_remedy_succ.stdout }}" 
          delegate_to: localhost 


        - name: Display the JSON file content
          shell: cat san_switches_fail.yml
          delegate_to: localhost
          register: result_check_san_fail

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_san_fail: "{{ result_check_san_fail.stdout }}" 
          delegate_to: localhost 

                                                                                                  

        - meta: end_host
          when: check_artifacts == "" and check_san == "" and check_remedy == "" and check_artifacts_success == "" and check_remedy_success == "" and check_san_fail == ""

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT PHYSICAL DECO : Service health check before grace period"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "3"
            overview: "PHYSICAL DECO - Service health check - CMDB Remedy/RTU - Artifacts Repo - Storage SAN"
            parent_id: "{{ cr }}"             
            username: "DecoP112686"     
            password: "opFCtCpIMzmC"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output          

        - set_fact:
            record_id: "{{create_tr_output.record_id}}"
 
    
        - copy:
            content: '{{ record_id|to_json }}'
            dest: record_healthcheck.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_id }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create Physical DECO - TR"

    - name: "Handling Create TR- Win@proach for health check task - Retry 1"
      block:

        - name: Display the JSON file content
          shell: cat check_artifacts.yml
          delegate_to: localhost
          register: result_check_arti

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_artifacts: "{{ result_check_arti.stdout }}" 
          delegate_to: localhost


        - name: Display the JSON file content
          shell: cat check_remedy.yml
          delegate_to: localhost
          register: result_check_remedy

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_remedy: "{{ result_check_remedy.stdout }}" 
          delegate_to: localhost
                                                 

        - name: Display the JSON file content
          shell: cat san_switches_fail.yml
          delegate_to: localhost
          register: result_check_san_fail

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_san_fail: "{{ result_check_san_fail.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat san_switches_success.yml
          delegate_to: localhost
          register: result_check_san

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_san: "{{ result_check_san.stdout }}" 
          delegate_to: localhost                                         

                                                                                                     
        - meta: end_host
          when: check_artifacts == "" and check_san == "" and check_remedy == "" and check_artifacts_success == "" and check_remedy_success == "" and check_san_fail == ""


        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_id_healthcheck == ""                          

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: PHYSICAL DECO : Service health check before grace period"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "3"
            overview: "PHYSICAL DECO - Service health check - CMDB Remedy/RTU - Artifacts Repo - Storage SAN"
            parent_id: "{{ cr }}"            
            username: "DecoP112686"     
            password: "opFCtCpIMzmC"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output   
          when: record_id_healthcheck == ""       

        - set_fact:
            record_id: "{{create_tr_output.record_id}}"
          when: record_id_healthcheck == ""    

    
        - copy:
            content: '{{ record_id|to_json }}'
            dest: record_healthcheck.json
          delegate_to: localhost
          when: record_id_healthcheck == ""

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_id }}"
          register: add_document
          delegate_to: localhost
          when: record_id_healthcheck == ""

      rescue:
        - debug:
            msg: "Retried and Failed to Create Physical DECO - TR"

