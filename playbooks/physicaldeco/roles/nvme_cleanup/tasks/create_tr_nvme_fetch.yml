---
  # tasks: 
    - name: "Handling Create TR- Win@proach for nvme cleanup  "
      block: 

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""

        - name: Display the JSON file content
          shell: cat nvmeout.yml
          delegate_to: localhost
          register: TR_result_nvmeout 

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_nvmeout: "{{ TR_result_nvmeout.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_nvmeout != ""      

        - name: Physical_host list
          shell: cat host_list_nvme_cleanup.yml
          delegate_to: localhost
          register: hostlist_nvme             

        - name: save the physical list to a Variable as a Fact
          set_fact:
            physical_hostlist: "{{ hostlist_nvme.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: physical_hostlist == ""       

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: PHYSICAL DECO - nvme cleanup"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"   #"DINFDECO"            
            severity: "4"
            overview: "PHYSICAL DECO - nvme cleanup"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
       
        - set_fact:
            record_nvme_cleanup_ph: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_nvme_cleanup_ph|to_json }}'
            dest: record_for_fetch_nvme_cleanup.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_nvme_cleanup_ph }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create PHYSICAL DECO - for nvme cleanup "

