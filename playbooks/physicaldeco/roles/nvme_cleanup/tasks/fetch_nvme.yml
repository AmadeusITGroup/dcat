---
    - name: "Fetching nvme info for the severs "
      block:
       
        - name: "Check entry for DECO server for filter hostlist for storage cleanup for physical servers"
          azure_update_ref_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status
          delegate_to: localhost
 
        - name: printing idem status
          debug:
            var: idem_status

        - set_fact:
            cmdb_update: '{{idem_status.module_update.cmdb_update}}'

        - name: printing cmdb_update status
          debug:
            var: cmdb_update

        - name: get fqdn from CMDB RTU
          fqdn_fetch_rtu:
            host: "{{ inventory_hostname }}"
            cmdb_rtu: "{{ cmdb_rtu }}"
          register: fqdn_name
          delegate_to: localhost          

        - set_fact:
            rtu_fqdn: "{{ fqdn_name.rtu_status_fqdn.fqdn }}"   

        - debug:
            var: rtu_fqdn

        - name: "extracting nvme info"
          nvme_cleanup:
            hostname:  "{{ rtu_fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_keyfile }}"
          delegate_to: localhost
          register: output_nvme_cleanup
  
        - name: nvme info of each machine
          debug:
            var: output_nvme_cleanup

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
        
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost 

        - name: "update entry for nvme cleanup"
          azure_update_module_vals_phy:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nvme_cleanup"
            status: "T"  
          delegate_to: localhost         
          register: update_status

  
        - name: pushing the value to the file
          shell: echo -e "{{output_nvme_cleanup.status}}" >> nvmeout.yml
          delegate_to : localhost
 
      rescue:
        - debug:
            msg: "Failed to Perform nvme cleanup"
