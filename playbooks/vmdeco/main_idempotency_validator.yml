---
- name: "State File Execution - Idempotency"
  hosts: all:vmdeco
  serial: "{{ hostvars.localhost.serial_number.msg }}"
  gather_facts: no
  vars:
    app: ""
    network: ""
    poweroff: ""
    vmdelete: ""
    dns_check: ""
    nas_check: ""
    backup_remove: ""
    cmdb_check: ""
    vm_poweroff_before_gp_check: ""
    vm_status_check_cmdb: ""
    cmdb_stat_check_agp: ""
    nas_validate: ""
    fqdn: ""
    filter_domain: ""
    sshusr: "{{ auth_username }}"
    sshpass: "{{ auth_password }}"
         
  tasks:
    - name: Run FQDN
      ansible.builtin.import_role:
        name: idem
        tasks_from: idempotency_validator.yml