---
- name: "vm poweroff"
  hosts: all:vmdeco
  serial: "{{ hostvars.localhost.serial_number.msg }}"
  gather_facts: no    
  tasks: 
    - name: vm poweroff
      ansible.builtin.import_role:
        name: vmpoweroff
        tasks_from: filter_hostlist_poweroff_bgp.yml

- name: "Create TR for vm poweroff"
  hosts: localhost
  gather_facts: no
  vars:
    record_id_vm_bgp: ""
    graceperiod_flag: False
    vm_poweroff_before_gp_check: "F"
    app: "T"
    nas_validate: ""
  tasks:
    - name: vm poweroff
      ansible.builtin.import_role:
        name: vmpoweroff
        tasks_from: create_tr_vmpoweroff_before_gp.yml

- name: "vm poweroff"
  hosts: all:vmdeco
  serial: "{{ hostvars.localhost.serial_number.msg }}"
  gather_facts: no
  tasks:
    - name: vm poweroff
      ansible.builtin.import_role:
        name: vmpoweroff
        tasks_from: vcenter_details_before_graceperiod.yml
      when: (vm_poweroff_before_gp_check == "F") and vm_poweroff_before_gp_check is defined and (nas_validate != "F") and nas_validate is defined and (vm_status_check_cmdb == "T") and vm_status_check_cmdb is defined

    - name: vm poweroff - Windows
      ansible.builtin.import_role:
        name: vmpoweroff
        tasks_from: vm_poweroff_before_grace_period.yml
      when: ('"Successfully" in v_center_msg') and v_center_msg is defined and (vm_poweroff_before_gp_check == "F") and vm_poweroff_before_gp_check is defined and (nas_validate != "F") and nas_validate is defined and (vm_status_check_cmdb == "T") and vm_status_check_cmdb is defined


- name: "Create TR for vm poweroff"
  hosts: localhost
  gather_facts: no
  vars:
    record_id_vm_bgp: ""
    graceperiod_flag: False
    vm_poweroff_before_gp_check: "F"
    app: "T"
    nas_validate: ""
  tasks:
    - name: vm poweroff
      ansible.builtin.import_role:
        name: vmpoweroff
        tasks_from: add_info_vm_poweroff_before_gp.yml

    - name: vm poweroff
      ansible.builtin.import_role:
        name: vmpoweroff
        tasks_from: vmpoweroff_logging.yml

    - name: vm poweroff
      ansible.builtin.import_role:
        name: vmpoweroff
        tasks_from: logger_vmpoweroff.yml