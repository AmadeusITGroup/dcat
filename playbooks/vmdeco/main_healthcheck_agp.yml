- name: "Create TR for healthcheck second trigger"
  hosts: localhost
  gather_facts: no
  vars:
    graceperiod_flag: True
  tasks:
    - name: healthcheck second trigger
      ansible.builtin.import_role:
        name: healthcheck_agp
        tasks_from: create_tr_health_check_agp.yml

    - name: healthcheck second trigger
      ansible.builtin.import_role:
        name: healthcheck_agp
        tasks_from: add_info_healthcheck_agp.yml

    - name: healthcheck second trigger
      ansible.builtin.import_role:
        name: healthcheck_agp
        tasks_from: create_ptr_health_check_agp.yml