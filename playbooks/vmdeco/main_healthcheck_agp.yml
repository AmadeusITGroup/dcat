---
- name: "healthcheck second trigger"
  hosts: localhost
  gather_facts: no
  vars:
    graceperiod_flag: True
  tasks:
    - name: healthcheck second trigger
      ansible.builtin.import_role:
        name: healthcheck_agp
        tasks_from: health_check_agp.yml


