    - name: "Deco Health check status"
      block:

        - name: Display the JSON file content
          shell: cat prod_box_c.yml
          delegate_to: localhost
          register: result_prod_box_c

        - name: save the Json data to a Variable as a Fact
          set_fact:
            prod_box_c: "{{ result_prod_box_c.stdout }}" 
          delegate_to: localhost        

        - name: Check if storage api up or not
          uri: 
            url: https://{{ prod_box_c }}          
            validate_certs: no                     
          register: result_n0142
          until: "result_n0142.status == 200"
          retries: 3
          delay: 10
          when: prod_box_c != ""

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp
          when: prod_box_c != ""  
                      
        - set_fact:
            time: "{{tstamp.stdout}}"
          when: prod_box_c != ""              

        - name: "Storage NAS status"
          shell: echo "#Storage NAS box - {{ time }}, [INFO], {{ prod_box_c }} is up and running, good to proceed with VM deco trigger 2" >> check_nas_success.yml   
          delegate_to: localhost
          when: prod_box_c != ""          

      rescue:
        - debug:
            msg: "Storage box <storage_box> unavaiable"

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                      
        - set_fact:
            time: "{{tstamp.stdout}}"            

        - name: "Storage NAS status"
          shell: echo "!Storage NAS box - {{ time }}, [ERROR], <storage_box> is down currently after 3 retries needs attention" >> check_nas.yml   
          delegate_to: localhost


