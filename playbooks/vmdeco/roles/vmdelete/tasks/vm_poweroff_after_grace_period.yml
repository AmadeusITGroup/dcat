---
# - name: "powering off and renaming"
#   hosts: all
#   throttle: 1
#   serial: 5
#   gather_facts: no


#   vars: 
#     file_failure_gp: "vm_hostname_failure_gp.yml"
#     graceperiod_flag: ""
#     vmdelete: ""
#     dns_check: ""     

#   tasks:
    - name: Handle the error
      throttle: 1
      block:
    #### NEED TO INCLUDE THE TASK FROM WHERE THE VCENTRE NAME WILL BE FETCHED####
        - set_fact:
            file_failure_gp: "vm_hostname_failure_gp.yml"

        - name: Display the JSON file content
          shell: cat record_vm_del.json
          delegate_to: localhost
          register: TR_result_del  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_vm_del: "{{ TR_result_del.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_vm_del == ""


        - name: awx creds username to var
          set_fact:
            pAccount_user: "{{ paccount_username }}"
          delegate_to: localhost

        - name: awx creds password to var
          set_fact:
            paccount_password: "{{ paccount_password }}"
          delegate_to: localhost
            
        - name: "Gather VM detailed information associated with the given VM"
          vmware_guest_info:
            hostname: '{{ v_center_gp }}'          
            username: "{{ pAccount_user }}"
            password:  "{{ paccount_password }}"
            name: "{{ vm_deletion_name }}"       
            validate_certs: no
            datacenter: ""
          delegate_to: localhost            
          register: vmfacts 

        - name: "Set the state of  to poweroff" 
          vmware_guest_powerstate:
            hostname: '{{ v_center_gp }}'
            username: "{{ pAccount_user }}"
            password:  "{{ paccount_password }}"
            validate_certs: no
           ###folder: "/{{ datacenter_name }} path if required"
            name: '{{ vm_deletion_name }}'
            state: powered-off
          delegate_to: localhost
          register: result            

        - set_fact:
            vm_status: "{{result.instance.hw_power_status}}"         
            # vm_hd_name: "{{new_name.instance.hw_name}}" #poweredOff
            vm_poweroff_msg: "Successfully completed VM poweroff and renaming "

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "vm_poweroff"
            status: "T"          
          register: update_status
          delegate_to: localhost
          when: vm_status =='poweredOff'   
                
 
      rescue: 
        - name: when above one throws error the below task should execute
          debug:
             msg: "Exception occurred but rescued - check errors for vm_poweroff module"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> vm_poweroff_failure_agp.txt                    
          delegate_to: localhost

        - set_fact:
            vm_hd_name: "Failure message for server '{{ inventory_hostname }}':Exception occured while powering off after grace period,Kindly check errors in vm_poweroff module "
            vm_poweroff_msg: "Failure message for server '{{ inventory_hostname }}':Exception occured while powering off after grace period,Kindly check errors in vm_poweroff module after grace period "
            CMDB_RESULT: ""
            output_delete: ""
          #ignore_errors: yes

##################################################################
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"                                

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }},{{ time }}, [ERROR] while powering off  vm after grace period ,Kindly check vm_poweroff module after grace period" >> {{file_failure_gp}}                    
          delegate_to: localhost


        
          
            
