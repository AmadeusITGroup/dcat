---
# - name: "This playbook is to Create TR for VM poweroff and delete"
#   hosts: localhost
#   gather_facts: no
#   vars:
#     record_id_vm_del: ""
#     graceperiod_flag: true
#     poweroff: False
#     vmdelete: False
#     dns_check: true        
    
#       #### TR creation#####  
      
    
#   tasks:    
    - name: "Handling Create TR- Win@proach for VM poweroff and delete task "
      block: 

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat idem_dns_check_pre.json
          delegate_to: localhost
          register: result_app_cmdb_dns

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_vmdelete_dns_flag: "{{ result_app_cmdb_dns.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_vmdelete_dns_flag == "F"          

        - name: Display the JSON file content
          shell: cat idem_vmdelete.json
          delegate_to: localhost
          register: result_app_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_vmdelete_flag: "{{ result_app_cmdb.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_vmdelete_flag == "T"      

        - name: VM_host list
          shell: cat host_list_vm_delete.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost          


        - name: VM_host list
          shell: cat host_list_vm_delete.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost          


        - name: TR creation for VM poweroff and delete task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco shutdown and delete"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: VM DECO : VM poweroff and delete"
            ci: "{{ vm_hostlist }}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id_vm_del
          delegate_to: localhost
        

        - set_fact:
            record_id_vm_delete: "{{ticket_id_vm_del.id.ticketId}}"
  
    
        - copy:
            content: '{{ record_id_vm_delete|to_json }}'
            dest: record_vm_del.json
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - Vm poweroff and delete TR"

