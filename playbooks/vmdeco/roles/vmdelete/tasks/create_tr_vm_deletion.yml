    - name: "Handling Start Implementation- Win@proach Vm poweroff and delete TR "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat record_vm_del.json
          delegate_to: localhost
          register: TR_result_del  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_vm_del: "{{ TR_result_del.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_vm_del == ""  
            
        - name: Sleep for 62 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 62
          delegate_to: localhost

        - name: Start Implementation for VM poweroff and delete TR
          winaproach:
            system: prod
            type: task_record
            operation: start_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_vm_del }}"
          register: start_implementation
          delegate_to: localhost
          
    
      rescue:
        - name: dump test output in the rescue block VM poweroff and delete
          debug:
            msg: "Failed to Start Implementation on VM DECO - VM poweroff and delete TR :'{{ record_id_vm_del }}'"
