---
    - name: handle the error
      throttle: 1
      block:
        - set_fact:
            file_failure_del: "vm_hostname_failure_del.yml"
            file_success_del: "vm_hostname_success_del.yml"

        - name: Display the JSON file content
          shell: cat record_vm_del.json
          delegate_to: localhost
          register: TR_result_del  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_vm_del: "{{ TR_result_del.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_vm_del == ""          

        - include: "reclaim_vm.yml"
          vars:
            hostname: '{{ v_center_gp }}'
            vmname: '{{ vm_deletion_name }}'

        - set_fact:
            output_delete: '{{ result.changed }}'


##################################################################
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"        
                      
        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], vm poweroff and vm deletion has been completed successfully." >> {{file_success_del}}                    
          delegate_to: localhost
          when: output_delete == true

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "vm_delete"
            status: "T"          
          register: update_status
          delegate_to: localhost
          when: output_delete == true

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}" 

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "deco_date"
            status: "{{ time }}"         
          register: update_status
          delegate_to: localhost
          when: output_delete == true

      rescue:
        - name: when vm deletion module throws error the below rescue task should execute
          debug:
             msg: "Exception occurred for server'{{ inventory_hostname }}' - check errors for VM_deletion module."

        - set_fact:
            vm_deletion_msg: "Exception occurred for server-check errors for VM_deletion module."     
            CMDB_RESULT: ""
            output_delete: ""
          #ignore_errors: yes

######################################################################
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> vm_poweroff_failure_agp.txt                    
          delegate_to: localhost

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR],Exception occurred while deleting the vm Kindly check vm_deletion module." >> {{file_failure_del}}                    
          delegate_to: localhost            
           
