---
# - name: "This playbook is to update the implementation,validation result and close the TR for CMDB status check task"
#   hosts: localhost  
#   gather_facts: no  
#   vars:
#     json_cmdb_stat_fail: "record_cmdb_stat_fail.json"
#     file_cmdb_stat_fail: "vm_cmdb_stat_failure.yml"
#     json_cmdb_stat_suc: "record_cmdb_stat_suc.json"
#     file_cmdb_stat_suc: "vm_cmdb_stat_success.yml"
#     file_cmdb_stat_fin : "vm_cmdb_stat_final.yml"    
#     record_id_cmdb_stat: ""
#     cmdb_stat_check_agp: False
#     graceperiod_flag: True
#     vm_poweroff_before_gp_check: true
        
#   tasks:      
        
    - name: "Handling TR record_id for implementation and validation result for CMDB status check"
      block:

        - set_fact:
            json_cmdb_stat_fail: "record_cmdb_stat_fail.json"
            file_cmdb_stat_fail: "vm_cmdb_stat_failure.yml"
            json_cmdb_stat_suc: "record_cmdb_stat_suc.json"
            file_cmdb_stat_suc: "vm_cmdb_stat_success.yml"
            file_cmdb_stat_fin : "vm_cmdb_stat_final.yml"    
            record_id_cmdb_stat: ""
            cmdb_stat_check_agp: "F"
            graceperiod_flag: True
            vm_poweroff_before_gp_check: "T"

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat record_cmdb_stat.json
          delegate_to: localhost
          register: TR_result_cmdb_stat  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_cmdb_stat: "{{ TR_result_cmdb_stat.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_cmdb_stat == ""      

        - name: Display the JSON file content
          shell: cat idem_cmdb_stat_check_agp.json
          delegate_to: localhost
          register: result_app_cmdb_agp

        - name: save the Json data to a Variable as a Fact
          set_fact:
            cmdb_flag_agp: "{{ result_app_cmdb_agp.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: cmdb_flag_agp == "T"

 #############  success info gathering ##########################
        - name : handling error in the success block
          block:
            - name: Display the JSON file content
              shell: cat vm_cmdb_stat_success.yml
              delegate_to: localhost
              register: result_cmdb_stat_suc

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_cmdb_stat_suc_v: "{{ result_cmdb_stat_suc.stdout }}" 
              delegate_to: localhost
    
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for CMDB status check - VM's"
                form3: "***********************************************************************"
            - set_fact:
                content_cmdb_stat_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_cmdb_stat_suc_v }}" 
              when: result_cmdb_stat_suc_v != ""  
              

            - name: " Merge Success information to single final file "
              shell: echo "{{content_cmdb_stat_suc}}" >> vm_cmdb_stat_final.yml                    
              delegate_to: localhost
              when: result_cmdb_stat_suc_v != "" 

          rescue:
            - debug:
                msg: "Rescue for no success file found and continue"   
                   
  ####################### Failure info gathering ########################## 
        - name : handling error in the failure block
          block:          
            - name: Display the JSON file content
              shell: cat vm_cmdb_stat_failure.yml
              delegate_to: localhost
              register: result_cmdb_stat_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_cmdb_stat_fail_v: "{{ result_cmdb_stat_fail.stdout }}" 
              delegate_to: localhost  
    
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for CMDB status check - VM's"
                form3: "***********************************************************************"
            - set_fact:
                content_cmdb_stat_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_cmdb_stat_fail_v }}"
              when: result_cmdb_stat_fail_v != ""    
              

            - name: " Merge Failure information to to single final file"
              shell: echo "{{ content_cmdb_stat_fail }}" >> vm_cmdb_stat_final.yml                    
              delegate_to: localhost
              when: result_cmdb_stat_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

##########################  merging both failure and success results ###########################

        - name: Display the JSON file content
          shell: cat vm_cmdb_stat_final.yml
          delegate_to: localhost
          register: result_cmdb_stat_fin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_cmdb_stat_fin_v: "{{ result_cmdb_stat_fin.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost            

################   PTR CREATION FOR CMDB AND OWNER GROUPS SEPARATELY #############################

        - name: Display the JSON file content
          shell: cat vm_cmdb_stat_failure_cmdb.yml
          delegate_to: localhost
          register: result_check_failure_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_failure_cmdb: "{{ result_check_failure_cmdb.stdout }}" 
          delegate_to: localhost

        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are  failure results for the servers while fetching data from cmdb"
            form3: "***********************************************************************"
        - set_fact:
            content_failure_cmdb: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_failure_cmdb }}"
          when: check_failure_cmdb != ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost          

        - name: Create PTR for cmdb team
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "CSTY::DECO::DCAT::VM DECO: CMDB fetch details with failed TR - {{ record_id_cmdb_stat }}"
            tr_map: "{{ record_id_cmdb_stat }}"
            assignee_group: "DINFDECO"  
            ptr_logs: "{{ content_failure_cmdb }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"
          register: ptr_out_cmdb
          until: '"Successfully" in ptr_out_cmdb.msg'
          retries: 3
          delay: 10
          when: check_failure_cmdb != ""

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: filter owner group
          categorize_servers:
            path: vm_cmdb_stat_failure_agp.txt
          delegate_to: localhost
          register: failure_servers_list
          when: check_failure_cmdb != ""

        - debug:
            var: failure_servers_list
          when: check_failure_cmdb != ""

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ item }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_out_cmdb.id }}"
            event: "VM DECO: cmdb check AGP failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          loop: "{{ failure_servers_list.Status.Failure }}"
          register: ptr_add
          when: check_failure_cmdb != ""

        - name: Update TR with PTR for cmdb team
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_cmdb_stat }}"
            prob_id: "{{ ptr_out_cmdb.id }}"                   
          register: update_overview  
          when: check_failure_cmdb != "" 

        - name: Display the JSON file content
          shell: cat vm_cmdb_stat_failure_owner.yml
          delegate_to: localhost
          register: result_check_failure_owner

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_failure_owner: "{{ result_check_failure_owner.stdout }}" 
          delegate_to: localhost

        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are results for the servers not in deco in progress"
            form3: "***********************************************************************"
        - set_fact:
            content_failure_owner: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_failure_owner}}"
          when: check_failure_owner != ""

        - name: Create PTR for owner
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "CSTY::DECO::DCAT::VM DECO: CMDB fetch details with failed TR - {{ record_id_cmdb_stat }}"
            tr_map: "{{ record_id_cmdb_stat }}"
            assignee_group: "DINFDECO"  
            ptr_logs: "{{ content_failure_owner }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"
          register: ptr_out_owner
          until: '"Successfully" in ptr_out_owner.msg'
          retries: 3
          delay: 10
          when: check_failure_owner != ""

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: filter owner group
          categorize_servers:
            path: vm_cmdb_stat_failure_agp.txt
          delegate_to: localhost
          register: failure_servers_list
          when: check_failure_owner != ""

        - debug:
            var: failure_servers_list
          when: check_failure_owner != ""

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ item }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_out_owner.id }}"
            event: "VM DECO: cmdb check AGP failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          loop: "{{ failure_servers_list.Status.Failure }}"
          register: ptr_add
          when: check_failure_owner != ""

        - name: Update TR with PTR for owner
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_cmdb_stat }}"
            prob_id: "{{ ptr_out_owner.id }}"                   
          register: update_overview  
          when: check_failure_owner != "" 

########################  closing implementation as failed  ############################################
        - name: Implementation Failed that is closing the implementation as failed
          winaproach:
            system: prod
            type: task_record
            operation: fail_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_cmdb_stat }}"
              text: "{{ result_cmdb_stat_fin_v }}"
          register: fail_implementation  
          when: result_cmdb_stat_fin_v is search("ERROR") and result_cmdb_stat_fin_v is not search("INFO")
       
########################  Pending Partial implementation  ############################################
        - name: Implementation partial that is closing the implementation as partial
          tr_partial_imp:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_cmdb_stat }}"
          register: partial_implement
          when: result_cmdb_stat_fin_v is search("ERROR") and result_cmdb_stat_fin_v is search("INFO")  
   
# ########################  Close Partial implementation  ############################################
        - name: Implementation partial that is closing the implementation as partial
          tr_partial_close:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_cmdb_stat }}"
            closing_comment: "{{ result_cmdb_stat_fin_v }}"
          register: close_partial_implement
          when: result_cmdb_stat_fin_v is search("ERROR") and result_cmdb_stat_fin_v is search("INFO")
     
          
############################# closing implementation as success ####################            
        - name: END Implementation that is closing the implementation as success
          winaproach:
            system: prod
            type: task_record
            operation: end_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
                task_id: "{{ record_id_cmdb_stat }}"
                text: "{{ result_cmdb_stat_fin_v }}"
          register: end_implementation
          when: result_cmdb_stat_fin_v is not search("ERROR") and result_cmdb_stat_fin_v is search("INFO")
 

        - name: start Validate Implementation for closing the success TR
          winaproach:
            system: prod
            type: task_record
            operation: validate
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_cmdb_stat }}" 
              text: "{{ result_cmdb_stat_fin_v }}"
          register: validation
          when: result_cmdb_stat_fin_v is not search("ERROR") and result_cmdb_stat_fin_v is search("INFO") 

        
      rescue:
        - debug:
            msg: "Exception occurred so rescued the main tr result block for CMDB status check"





                           
        
            
             