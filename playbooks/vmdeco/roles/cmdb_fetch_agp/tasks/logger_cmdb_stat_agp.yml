---
# - name: "LOGGER MODULE CMDB"
#   hosts: localhost
#   gather_facts: no
#   vars:
#     final_cmdb_stat_log: "final_cmdb_stat_log.yml"   
#     graceperiod_flag: False
#     cmdb_stat_check_agp: False
#     vm_poweroff_before_gp_check: true

#   tasks:    
    - name: "Logger and Create/Update TR- Win@proach "
      block:

        - set_fact:
            final_cmdb_stat_log: "final_cmdb_stat_log.yml"   
            graceperiod_flag: True
            cmdb_stat_check_agp: "F"
            vm_poweroff_before_gp_check: "T"        

        - name: Display the JSON file content
          shell: cat record_cmdb_stat.json
          delegate_to: localhost
          register: TR_result_cmdb_stat  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_cmdb_stat: "{{ TR_result_cmdb_stat.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_cmdb_stat == ""           

        - name: VM_host list
          shell: cat final_cmdb_stat_log.yml
          delegate_to: localhost
          register: vm_result_cmdb             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm: "{{ vm_result_cmdb.stdout }}" 
          delegate_to: localhost

        - meta: end_host
          when: vm == ""

        - name: VM_host list
          shell: cat record_id_logger.json
          delegate_to: localhost
          register: record_result              

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id: "{{ record_result.stdout }}" 
          delegate_to: localhost          


################# CREATE TR ################
        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "VM DECO -LOGGER AFTER GRACE PERIOD"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "VM DECO -LOGGER (CMDB STATUS CHECK - BACKUP - NAS_STORAGE - IP_DNS - VM_POWEROFF_DELETION- CMDB UPDATE)"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_id == ""
        
        - set_fact:
            record_id_logger: "{{create_tr_output.record_id}}"
          when: record_id == ""  
       

        - copy:
            content: '{{ record_id_logger|to_json }}'
            dest: record_id_logger.json
          delegate_to: localhost 
          when: record_id == ""              

################# LOGGER ###################
        - name: VM_host list
          shell: cat record_id_logger.json
          delegate_to: localhost
          register: vm_result             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            record_id_logger: "{{ vm_result.stdout[1:-1] }}"  
          delegate_to: localhost
           

        - name: logger data
          shell: cat final_cmdb_stat_log.yml
          delegate_to: localhost
          register: cmdb_log 
                    

        - name: save the vm list to a Variable as a Fact
          set_fact:
            log_cmdb_stat: "{{ cmdb_log.stdout }}" 
          delegate_to: localhost
               



################# LOGGER UPDATE TO TR ###################
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{record_id_logger}}"
            #record_id: "23733095"
            message: "{{ log_cmdb_stat }}"  #"{{final_cmdb_logger}}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"        
          delegate_to: localhost
          register: add_msg_output_log

      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued -  check cmdb storage logger"            


    - name: clearing the files and json
      block:              

        - name: "Set header"
          shell: echo > vm_cmdb_stat_success.yml         
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > vm_cmdb_stat_failure.yml         
          run_once: true
          delegate_to: localhost 

        - name: "Set header"
          shell: echo > cmdb_stat_log.yml          
          run_once: true
          delegate_to: localhost
              
        - name: "Set header"
          shell: echo > final_cmdb_stat_log.yml       
          run_once: true
          delegate_to: localhost                      

        - name: "Set header"
          shell: echo > output_cmdb_stat_log.yml         
          run_once: true
          delegate_to: localhost 


        - name: "Set header"
          shell: echo > record_cmdb_stat.json        
          run_once: true
          delegate_to: localhost  

        - name: "Set header"
          shell: echo > vm_cmdb_stat_final.json        
          run_once: true
          delegate_to: localhost                                 
                    

      rescue:
        - debug:
            msg: " exception occured while clearing the files and json in logger,Rescued in logger_cmdb file"        
