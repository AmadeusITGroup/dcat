---
# - name: "This playbook is to update and close the TR for nas validation"
#   hosts: localhost  
#   gather_facts: no  
#   vars:
#     json_nas_validate_fail: "record_nas_val_fail.json"
#     json_nas_validate_suc: "record_nas_val_suc.json"
#     file_fail_nas_validate: "nas_validate_failure.yml"
#     file_succ_nas_validate: "nas_validate_success.yml"    
#     file_nas_validate_fin : "nas_validate_final.yml"    
#     record_nas_v: ""
#     graceperiod_flag: true
#     nas_validate: False
#     vm_status_check_cmdb: true 
        
#   tasks:      
        
    - name: "Handling TR record_id to update and close the TR for nas validation"
      block:
      
        - set_fact: 
            json_nas_validate_fail: "record_nas_val_fail.json"
            json_nas_validate_suc: "record_nas_val_suc.json"
            file_fail_nas_validate: "nas_validate_failure.yml"
            file_succ_nas_validate: "nas_validate_success.yml"    
            file_nas_validate_fin : "nas_validate_final.yml"
            file_failure_nas_validate_win: "nas_validate_failure_win.yml"
            file_failure_nas_validate_lin: "nas_validate_failure_lin.yml" 
            file_failure_nas_validate_vm: "check_synergon_nas_fail.yml"              

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""       

        - name: Display the JSON file content
          shell: cat record_for_nas.json
          delegate_to: localhost
          register: TR_result_nasv 

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_nasv: "{{ TR_result_nasv.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_nasv == ""      

        - name: Display the JSON file content
          shell: cat idem_nas_validate.json
          delegate_to: localhost
          register: result_nas

        - name: save the Json data to a Variable as a Fact
          set_fact:
            nas_flag: "{{ result_nas.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: nas_flag == "T" 

 #############  success info gathering ##########################
        - name : handling error in the success block
          block:
            - name: Display the JSON file content
              shell: cat nas_validate_success.yml
              delegate_to: localhost
              register: result_nasv_suc

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_nasv_suc_v: "{{ result_nasv_suc.stdout }}" 
              delegate_to: localhost  
      
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for NAS Validation - VMs"
                form3: "***********************************************************************"
            - set_fact:
                content_nasv_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_nasv_suc_v }}" 
              when: result_nasv_suc_v != ""  


            - name: " Merge Success information to single final file "
              shell: echo "{{content_nasv_suc}}" >> nas_validate_final.yml                    
              delegate_to: localhost
              when: result_nasv_suc_v != "" 

          rescue:
            - debug:
                msg: "Rescue for no success file found and continue"   
                   
  ####################### Failure info gathering ########################## 
        - name : handling error in the failure block
          block:          
            - name: Display the JSON file content
              shell: cat nas_validate_failure.yml
              delegate_to: localhost
              register: result_nasv_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_nasv_fail_v: "{{ result_nasv_fail.stdout }}" 
              delegate_to: localhost  
    
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for NAS Validation - VMs"
                form3: "***********************************************************************"
            - set_fact:
                content_nasv_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_nasv_fail_v }}"
              when: result_nasv_fail_v != ""    
       
            - name: " Merge Failure information to to single final file"
              shell: echo "{{ content_nasv_fail }}" >> nas_validate_final.yml                    
              delegate_to: localhost
              when: result_nasv_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

##########################  merging both failure and success results ###########################

        - name: Display the JSON file content
          shell: cat nas_validate_final.yml
          delegate_to: localhost
          register: result_nasv_fin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_nasv_fin_v: "{{ result_nasv_fin.stdout }}" 
          delegate_to: localhost  


########################   results added to TR  ############################################
        - name: "add message to failed TR"
          add_message_to_tr:
            record_id: "{{record_for_nas}}"
            message: "{{ result_nasv_fin_v }}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost
          register: add_msg_output 



##################  PTR CREATION ############################## 
        - name: Display the JSON file content
          shell: cat nas_validate_failure_lin.yml
          delegate_to: localhost
          register: result_check_failure_lin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_failure_lin: "{{ result_check_failure_lin.stdout }}" 
          delegate_to: localhost

        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are nas validation failure results for the VM's"
            form3: "***********************************************************************"
        - set_fact:
            content_failure_lin: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_failure_lin }}"
          when: check_failure_lin != ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost          

        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "VM DECO: NAS validation with failed TR - {{ record_for_nas}}"
            tr_map: "{{ record_for_nas }}"
            assignee_group: "OLINUX1"  
            ptr_logs: "{{ content_failure_lin }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"
          register: ptr_out_nasv_lin
          until: '"Successfully" in ptr_out_nasv_lin.msg'
          retries: 3
          delay: 10
          when: check_failure_lin != ""

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: filter owner group
          categorize_servers:
            path: vm_nas_validate_failure.txt
          delegate_to: localhost
          register: failure_servers_list
          when: check_failure_lin != ""

        - debug:
            var: failure_servers_list
          when: check_failure_lin != ""

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ item }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_out_nasv_lin.id }}"
            event: "VM DECO: NAS validation failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          loop: "{{ failure_servers_list.Status.Failure }}"
          register: ptr_add
          when: check_failure_lin != ""

        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_for_nas }}"
            prob_id: "{{ ptr_out_nasv_lin.id }}"                   
          register: update_overview  
          when: check_failure_lin != ""     

        - name: Display the JSON file content
          shell: cat nas_validate_failure_win.yml
          delegate_to: localhost
          register: result_check_failure_win

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_failure_win: "{{ result_check_failure_win.stdout }}" 
          delegate_to: localhost

        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are nas validation failure results for the VM's"
            form3: "***********************************************************************"
        - set_fact:
            content_failure_win: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_failure_win}}"
          when: check_failure_win != ""          

        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "VM DECO: NAS validation with failed TR - {{ record_for_nas}}"
            tr_map: "{{ record_for_nas }}"
            assignee_group: "OSX02WIN"  
            ptr_logs: "{{ content_failure_win }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"
          register: ptr_out_nasv_win
          until: '"Successfully" in ptr_out_nasv_win.msg'
          retries: 3
          delay: 10           
          when: check_failure_win != ""

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: filter owner group
          categorize_servers:
            path: vm_nas_validate_failure.txt
          delegate_to: localhost
          register: failure_servers_list
          when: check_failure_win != ""

        - debug:
            var: failure_servers_list
          when: check_failure_win != ""

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ item }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_out_nasv_win.id }}"
            event: "VM DECO: NAS validation failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          loop: "{{ failure_servers_list.Status.Failure }}"
          register: ptr_add
          when: check_failure_win != ""

        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_for_nas }}"
            prob_id: "{{ ptr_out_nasv_win.id }}"                   
          register: update_overview  
          when: check_failure_win != "" 

        - name: Display the JSON file content
          shell: cat check_synergon_nas_fail.yml
          delegate_to: localhost
          register: result_check_synergon_nas

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_synergon_nas: "{{ result_check_synergon_nas.stdout }}" 
          delegate_to: localhost  


        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are nas validation failure results for the VM's "
            form3: "***********************************************************************"
        - set_fact:
            content_check_synergon: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_synergon_nas }}"
          when: check_synergon_nas != ""

        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "VM DECO: NAS validation with failed TR - {{ record_for_nas}}"
            tr_map: "{{ record_for_nas }}"
            assignee_group: "OSP000"  
            ptr_logs: "{{ content_check_synergon }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"
          register: ptr_out_nasv_syn
          until: '"Successfully" in ptr_out_nasv_syn.msg'
          retries: 3
          delay: 10           
          when: check_synergon_nas != "" 

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: filter owner group
          categorize_servers:
            path: vm_nas_validate_failure.txt
          delegate_to: localhost
          register: failure_servers_list
          when: check_synergon_nas != ""

        - debug:
            var: failure_servers_list
          when: check_synergon_nas != ""

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ item }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_out_nasv_syn.id }}"
            event: "VM DECO: NAS validation failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          loop: "{{ failure_servers_list.Status.Failure }}"
          register: ptr_add
          when: check_synergon_nas != ""

        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_for_nas }}"
            prob_id: "{{ ptr_out_nasv_syn.id }}"                   
          register: update_overview  
          when:  check_synergon_nas != ""

############################# closing TR for success ####################            
        - name: "Test custom module [CLOSE TR]"
          close_tr:
            record_id: "{{record_for_nas}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          register: close_tr_output


      rescue:
        - debug:
            msg: "Exception occurred so rescued the main tr result block for nas validation check"





                           
        
            
             