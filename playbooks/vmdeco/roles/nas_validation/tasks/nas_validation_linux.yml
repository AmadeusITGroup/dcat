---
    - name: Handle the error
      throttle: 1
      block:
      
        - set_fact: 
            file_failure_nas_validate: "nas_validate_failure.yml"
            file_suc_nas_validate: "nas_validate_success.yml"
            record_id_nas_validate_json: "record_id_nas_validate.json"  
            file_failure_nas_validate_lin: "nas_validate_failure_lin.yml"     

        - name: Display the JSON file content
          shell: cat record_for_nas.json
          delegate_to: localhost
          register: TR_result_nas_validate  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_nas_validate: "{{ TR_result_nas_validate.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_nas_validate == ""                
          
        - name: "Test nas validation custom module"
          nfs_mount_info:
            hostname: '{{ fqdn }}'  
            username:  "{{ remote_username }}" 
            key_filename: "{{ remote_keyfile }}"
          delegate_to: localhost
          register: result_nas_validate

        - set_fact:
            output_nas_validate: "{{result_nas_validate.status}}"          


        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> vm_nas_validate_failure.txt                    
          delegate_to: localhost
          when: '"Exception" in  output_nas_validate'

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{ output_nas_validate }}" >> {{file_failure_nas_validate}}                    
          delegate_to: localhost                    
          when: '"Exception" in  output_nas_validate'

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Linux vm failed" >> {{file_failure_nas_validate_lin}}                    
          delegate_to: localhost 
          when: '"Exception" in  output_nas_validate'

        - meta: end_host
          when: '"Exception" in  output_nas_validate'


        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], NAS is mounted on the server." >> {{file_suc_nas_validate}}                    
          delegate_to: localhost 
          when: '"NFS present" in output_nas_validate'

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nas_validate"
            status: "present"            
          register: update_status
          delegate_to: localhost
          when: '"NFS present" in output_nas_validate'


        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], No nas is mounted on the server." >> {{file_suc_nas_validate}}                    
          delegate_to: localhost                    
          when: '"no nfs mounted" in  output_nas_validate'

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nas_validate"
            status: "absent"        
          register: update_status
          delegate_to: localhost
          when: '"no nfs mounted" in output_nas_validate'

      rescue:
        - name: when above one throws error the below task should execute
          debug:
             msg: "Exception occurred but rescued - check errors for nas validation module"                    

##################################################################################
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                  
        - set_fact:
            time: "{{tstamp.stdout}}"  

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> vm_nas_validate_failure.txt                    
          delegate_to: localhost

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Linux vm failed kindly check nas validation module either connection or credential issue. " >> {{file_failure_nas_validate}}                    
          delegate_to: localhost          

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Linux vm failed" >> {{file_failure_nas_validate_lin}}                    
          delegate_to: localhost 
