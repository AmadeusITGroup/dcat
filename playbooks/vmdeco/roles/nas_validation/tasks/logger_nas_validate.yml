################# LOGGER UPDATE TO TR ###################
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{record_vm_logger}}"
            message: "{{ log_nas }}"       #"{{final_app_logger}}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"        
          delegate_to: localhost
          register: add_msg_output_log_nas


