---
# - name: "This playbook is to Create TR"
#   hosts: localhost
#   gather_facts: no
#   vars:
#     record_nas_v: ""
#     graceperiod_flag: False
#     nas_validate: False
#     vm_status_check_cmdb: true 
#     before_graceperiod_flag: true

#   #### TR creation #####

#   tasks:    
    - name: "Handling Create TR- Win@proach "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat idem_app_pre.json
          delegate_to: localhost
          register: result_app_nas

        - name: save the Json data to a Variable as a Fact
          set_fact:
           nas_flag_pre: "{{ result_app_nas.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: nas_flag_pre == "F"          
  

        - name: Display the JSON file content
          shell: cat idem_nas_validate.json
          delegate_to: localhost
          register: result_nas

        - name: save the Json data to a Variable as a Fact
          set_fact:
            nas_flag: "{{ result_nas.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: nas_flag == "T"

        - name: VM_host list
          shell: cat host_list_nas_validate.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost  

        - meta: end_host
          when: vm_hostlist == ""             
        

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - NAS validation"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"   #"DINFDECO"            
            severity: "4"
            overview: "VM DECO - NAS validation"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
        
        - set_fact:
            record_nas_v: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_nas_v|to_json }}'
            dest: record_for_nas.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_nas_v }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - NAS validation TR"

