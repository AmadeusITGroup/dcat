---
    - name: Handle the error-Fetching os type of the servers
      throttle: 1
      block:

        - set_fact:
            file_failure_nas_validate: "nas_validate_failure.yml"
            file_suc_nas_validate: "nas_validate_success.yml"
            record_id_nas_validate_json: "record_id_nas_validate.json" 
            file_failure_nas_validate_vm: "check_synergon_nas_fail.yml"        

        - name: Display the JSON file content
          shell: cat record_for_nas.json
          delegate_to: localhost
          register: TR_result_nas_validate  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_nas_validate: "{{ TR_result_nas_validate.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_nas_validate == ""

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "Check entry for DECO server"
          azure_update_ref:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status
          delegate_to: localhost 

        - set_fact: 
            state_os: '{{idem_status.module_update.os}}'           

        - name: awx creds username to var
          set_fact:
            pAccount_user: "{{ paccount_username }}"
          delegate_to: localhost

        - name: awx creds password to var
          set_fact:
            paccount_password: "{{ paccount_password }}"
          delegate_to: localhost

        - set_fact:
            nas_os_detail_result: ""  

        - name: "Gather OS information associated with the given VM"
          vmware_guest_info:
            hostname: '{{ v_center}}'
            username: "{{ pAccount_user }}"
            password:  "{{ paccount_password }}"
            name: "{{ inventory_hostname }}"      
            validate_certs: no
            datacenter: ""
          delegate_to: localhost            
          register: nas_vmfacts
          when: state_os == "F"

        - set_fact:
            nas_os_detail_result: '{{ nas_vmfacts.instance.hw_guest_full_name }}'
          when: state_os == "F"  
 
        - set_fact:
            nas_os_detail_w: "windows"
          when: nas_os_detail_result is search('Windows') and state_os == "F"

        - set_fact:
            nas_os_detail_w: "linux"
          when: nas_os_detail_result is search("Linux|CentOS") and state_os == "F"

        - set_fact:
            nas_os_detail_w: "{{ state_os }}"
          when: state_os is search("linux|windows")    
          
        # nas_validate is marked absent for Windows servers as Nas cleanup will not be performed on Windows servers

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nas_validate"
            status: "absent"    
          register: update_status_w
          delegate_to: localhost
          when: nas_os_detail_w == "windows"

# log failure 
        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to Get information from VCenter" >> {{file_failure_nas_validate}}                    
          delegate_to: localhost
          when: nas_os_detail_result == "" and state_os == "F"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> vm_nas_validate_failure.txt                    
          delegate_to: localhost
          when: nas_os_detail_result == "" and state_os == "F"
          
        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to Get information from VCenter" >> {{file_failure_nas_validate_vm}}                    
          delegate_to: localhost
          when: nas_os_detail_result == "" and state_os == "F"            

      rescue:
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors for os type fetch module"

        - set_fact:
            vm_fetch_os_msg: "Exception occurred while fetching OS type of server for NAS validation. Kindly check fetch_os_type module in NAS storage"

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> vm_nas_validate_failure.txt                    
          delegate_to: localhost

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Exception occurred while fetching OS type of server from vcenter either connection issue to vcenter or server not found . Kindly check fetch_os_type module in NAS validation."  >> {{file_failure_nas_validate}}                    
          delegate_to: localhost

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Exception occurred while fetching OS type of server from vcenter either connection issue to vcenter or server not found . Kindly check fetch_os_type module in NAS validation."  >> {{file_failure_nas_validate_vm}}                    
          delegate_to: localhost
          