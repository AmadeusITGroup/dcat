---
    - name: Handle the error
      ignore_unreachable: true
      throttle: 1
      block:
        - set_fact: 
            file_failure_nas_validate: "nas_validate_failure.yml"
            file_suc_nas_validate: "nas_validate_success.yml"
            record_id_nas_validate_json: "record_id_nas_validate.json"
            file_failure_nas_validate_win: "nas_validate_failure_win.yml"        

        - name: Display the JSON file content
          shell: cat record_for_nas.json
          delegate_to: localhost
          register: TR_result_nas_validate  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_nas_validate: "{{ TR_result_nas_validate.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_nas_validate == ""  

        - set_fact:
            input_vm: "{{inventory_hostname}}"                       
          
        - name: Fetching shares for windows vm      
          win_shell: |
             Invoke-Command -ScriptBlock  { Get-SmbConnection | Where-Object{$_.Credential -cmatch "(?i){{input_vm}}"}} 
            Get-SmbConnection | Where-Object { $_.Credential -cmatch "(?i)$vm" }
          vars:
            ansible_host: "{{ fqdn }}"
            ansible_user: "{{ win_user }}"
            ansible_password: "{{ win_password }}"                           
            ansible_connection: winrm
            ansible_port: 5985
            ansible_winrm_scheme: http
            ansible_shell_type: cmd
            ansible_winrm_server_cert_validation: ignore
            ansible_winrm_transport: ntlm    
          register: result_nas_validate_w

        
        - set_fact:
            output_nas_validate_w: "{{result_nas_validate_w.stdout_lines}}"
          when:  result_nas_validate_w.changed == true


        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], NAS shares present on the server." >> {{file_suc_nas_validate}}                    
          delegate_to: localhost 
          when: output_nas_validate_w != []

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nas_validate"
            status: "present"    
          register: update_status_w
          delegate_to: localhost
          when: output_nas_validate_w != []


        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], No NAS shares on the server." >> {{file_suc_nas_validate}}                    
          delegate_to: localhost                    
          when: output_nas_validate_w == []

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nas_validate"
            status: "absent"            
          register: update_status_w
          delegate_to: localhost
          when: output_nas_validate_w == []

      rescue:
        - name: when above one throws error the below task should execute
          debug:
             msg: "Exception occurred but rescued - check errors for nas shares validation  module .{{ result_nas_validate_w}}"                    

##################################################################################
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  
                  
        - set_fact:
            time: "{{tstamp.stdout}}"  

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> vm_nas_validate_failure.txt                    
          delegate_to: localhost

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Kindly check nas validation  windows module either connection or credential issue. " >> {{file_failure_nas_validate}}                    
          delegate_to: localhost          

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], windows vm failed" >> {{file_failure_nas_validate_win}}                    
          delegate_to: localhost
