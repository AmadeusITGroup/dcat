---
    - name: handle the error for fetch nfs export policy
      throttle: 1 
      block:

        - name: awx creds username to var
          set_fact:
            pAccount_user: "{{ synergon_username }}"
          delegate_to: localhost

        - name: awx creds password to var
          set_fact:
            pAccount_pass: "{{ synergon_password }}"
          delegate_to: localhost

################################### NFS EXPORT POLICY AND RULE FETCH ########################################################################################            
        - name: Gathering  nfs export policy  and rule information
          nas_custom_fetch_rule:
            username: "{{ pAccount_user }}"
            password:  "{{ pAccount_pass }}"
            storage_box: "{{ nas_hostname }}"
            vm_name: "{{ client_match }}"
          delegate_to: localhost
          register: rule_result
          until: '"Exception" not in rule_result.rule_output'
          retries: 7
          delay: 30
                    
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"
############################################################## LOGGING FAILURE + UPDATING STATEFILE TO F ############################################################################################
        - name: "Logging FAILURE for fetch nfs export policy"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Exception occurred while fetching nfs export policy names of server in {{ nas_hostname }} for NAS storage cleanup {{ rule_result.rule_output }} Kindly check fetch_nfs_export_policy module in NAS storage."  >> {{file_failure}}                    
          delegate_to: localhost
          when: rule_result.rule_output is search ("Exception") 
 
        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nasstorage"
            status: "F"                        
          register: update_status
          delegate_to: localhost
          when: rule_result.rule_output is search ("Exception")

        - meta: end_host
          when: rule_result.rule_output is search ("Exception")
          
################################################################# LOGGING SUCCESS (SUCCESSFUL FETCH/ POLICY NOT FOUND) ############################################################################################
        - name: "Logging SUCCESS for fetch nfs export policy"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully fetched nfs export policy names of server in {{ nas_hostname }} for NAS storage cleanup {{ rule_result.rule_output }}"  >> {{file_success}}                    
          delegate_to: localhost
          when: rule_result.rule_output is not search ("Exception") and rule_result.rule_output is not search ("There are no entries")
        
        - name: "Logging SUCCESS for empty fetch nfs export policy"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], There are no entries for nfs export policy names of server in {{ nas_hostname }} for NAS storage cleanup"  >> {{file_success}}                    
          delegate_to: localhost
          when: rule_result.rule_output is search ("There are no entries")

        - set_fact:        
            export_result: '{{rule_result.rule_output  }}'
          when: rule_result.rule_output is not search ("There are no entries")  

        - set_fact:        
            export_result_no_entries: '{{rule_result.rule_output  }}'
          when: rule_result.rule_output is search ("There are no entries")                       
  
        - name:  seggregating all the export policy names of all storage box
          shell: echo "{{ export_result }}">> {{file_export_collect}}                    
          delegate_to: localhost
          register: output
          when: rule_result.rule_output is not search ("There are no entries")
    
############################################################ EXCEPTION HANDLING ########################################################################################################  
      rescue:
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors for nfs_storage_deletion module"

        - set_fact:
            vm_fetch_nfs_msg: "Exception occurred while fetching nfs export policy names of server in {{ nas_hostname }} for NAS storage cleanup Kindly check fetch_nfs_export_policy module in NAS storage"

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Logging FAILURE in case of abrupt failure"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Exception occurred while fetching nfs export policy names of server in {{ nas_hostname }} for NAS storage cleanup Kindly check fetch_nfs_export_policy module in NAS storage."  >> {{file_failure}}                    
          delegate_to: localhost 

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nasstorage"
            status: "F"                           
          register: update_status
          delegate_to: localhost                      
            