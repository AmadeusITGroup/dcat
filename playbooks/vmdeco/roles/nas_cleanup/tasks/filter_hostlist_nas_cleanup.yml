---
#   tasks:
    - name: "Check entry for DECO server"
      throttle: 1
      block:

        - set_fact:
            host_list: host_list_nas_cleanup.yml

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "Check entry for DECO server"
          azure_update_ref:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status
          delegate_to: localhost
       

        - set_fact: 
            nas_check: '{{idem_status.module_update.nasstorage}}'

        - set_fact: 
            filter_domain: '{{idem_status.module_update.filter_domain}}'                               
           
        - set_fact: 
            backup_remove: '{{idem_status.module_update.backup}}'
        
        - set_fact:
            nas_validate: '{{idem_status.module_update.nas_validate}}'

        - name: "VM list"
          shell: echo "{{ inventory_hostname }}," >> {{ host_list }}                   
          delegate_to: localhost
          when: nas_check == "F" and filter_domain == 'MUCMSPDOM' and backup_remove == "T" and nas_validate != "F"             

            
      rescue:
        - debug:
            msg: "Failed to fetch hostlist for Storage - NAS cleanup"      

