    - name: Handle the error if failure file empty in nas cleanup
      throttle: 1
      block:
        - name: read the nas failure file to filter the failure vm
          shell: cat nas_hostname_failure.yml
          delegate_to: localhost
          register: failure_file_check            

        - name: setting value for checking the vm present in the above failure file
          set_fact:
            file_failure_n_check: "{{ failure_file_check.stdout }}" 
          delegate_to: localhost


        - name: read the nas success file to filter the success vm
          shell: cat nas_hostname_success.yml
          delegate_to: localhost
          register: success_file_check            

        - name: setting value for checking the vm present in the above failure file
          set_fact:
            file_success_n_check: "{{ success_file_check.stdout }}" 
          delegate_to: localhost                                   

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                    
        - set_fact:
            time: "{{tstamp.stdout}}" 

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost
                 
        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nasstorage"
            status: "T"              
          register: update_status
          delegate_to: localhost
          when: '"{{inventory_hostname}}" not in file_failure_n_check and "{{inventory_hostname}}" in file_success_n_check'
        
        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "nasstorage"
            status: "T"              
          register: update_status
          delegate_to: localhost
          when: 'nas_os_detail_w == "windows"'

      rescue:
        - name: when updating the idempotency  with server name and ip
          debug:
            msg: "Exception occurred while updating the idempotency for nas storage cleanup or failure success files not found "      
