    - name: "Logger and Create/Update TR- Win@proach "
      block:

        - set_fact: 
            final_nas_log: "final_nas_log.yml"  

        - name: Display the JSON file content for NAS cleanup
          shell: cat record_nas.json
          delegate_to: localhost
          register: TR_result_nas  

        - name: save the Json data to a Variable as a Fact for NAS cleanup
          set_fact:
            record_id_nas: "{{ TR_result_nas.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_nas == ""          

        - name: VM_host list
          shell: cat vm_nas_final.yml
          delegate_to: localhost
          register: vm_result             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm: "{{ vm_result.stdout }}" 
          delegate_to: localhost
         

        - meta: end_host
          when: vm == ""

        - name: VM_host list
          shell: cat record_id_logger.json
          delegate_to: localhost
          register: record_result              

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id: "{{ record_result.stdout }}" 
          delegate_to: localhost          


################# CREATE TR ################
        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "VM DECO -LOGGER"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "VM DECO -LOGGER (NETWORK - BACKUP - NAS_STORAGE - IP_DNS - VM_POWEROFF_DELETION)"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_id == ""
        
        - set_fact:
            record_id_logger: "{{create_tr_output.record_id}}"
          when: record_id == ""  
       

        - copy:
            content: '{{ record_id_logger|to_json }}'
            dest: record_id_logger.json
          delegate_to: localhost 
          when: record_id == "" 

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_id_logger }}"
          register: add_document
          delegate_to: localhost

################# LOGGER ###################
        - name: VM_host list
          shell: cat record_id_logger.json
          delegate_to: localhost
          register: vm_result             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            record_id_logger: "{{ vm_result.stdout[1:-1] }}"  
          delegate_to: localhost
         


        - name: logger data
          shell: cat vm_nas_final.yml
          delegate_to: localhost
          register: nas_log 
                    

        - name: save the vm list to a Variable as a Fact
          set_fact:
            log_nas: "{{ nas_log.stdout }}" 
          delegate_to: localhost
       

