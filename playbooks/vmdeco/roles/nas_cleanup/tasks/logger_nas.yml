################# LOGGER UPDATE TO TR ###################
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{record_id_logger}}"
            #record_id: "23733095"
            message: "{{ log_nas }}"   #"{{final_nas_logger}}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"          
          delegate_to: localhost
          register: add_msg_output_log


      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued -  check nas storage logger " 


    - name: clearing the files and json
      block:              

        - name: "Set header"
          shell: echo > nas_hostname_success.yml         
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > nas_hostname_failure.yml          
          run_once: true
          delegate_to: localhost 
              
        - name: "Set header"
          shell: echo > record_nas.json          
          run_once: true
          delegate_to: localhost                      

        - name: "Set header"
          shell: echo > nas_log.yml          
          run_once: true
          delegate_to: localhost 

        - name: "Set header"
          shell: echo > final_nas_log.yml          
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > output_nas_log.yml          
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > vm_nas_final.yml          
          run_once: true
          delegate_to: localhost          


        - file: path=output_nas_log.yml state=absent
          delegate_to: localhost  

        - file: path=final_nas_log.yml state=absent
          delegate_to: localhost 

        - file: path=nas_log.yml state=absent
          delegate_to: localhost

        - file: path=record_nas_success.json state=absent
          delegate_to: localhost

        - file: path=record_nas_fail.json state=absent
          delegate_to: localhost 

        - file: path=nas_hostname_success.yml state=absent
          delegate_to: localhost 

        - file: path=nas_hostname_failure.yml state=absent
          delegate_to: localhost                                        

      rescue:
        - debug:
            msg: " exception occured while clearing the files and json in logger,Rescued in logger_nas file"        