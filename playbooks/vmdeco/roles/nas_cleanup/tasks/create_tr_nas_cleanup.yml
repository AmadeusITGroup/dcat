---   
    - name: "Handling Create TR- Win@proach for NAS cleanup task "
      block:
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat idem_backup_pre.json
          delegate_to: localhost
          register: result_app_cmdb_backup

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_nas_check_backup_flag: "{{ result_app_cmdb_backup.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_nas_check_backup_flag == "F"          
    

        - name: Display the JSON file content
          shell: cat idem_nas_check.json
          delegate_to: localhost
          register: result_app_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_nas_check_flag: "{{ result_app_cmdb.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_nas_check_flag == "T"            

        - name: VM_host list
          shell: cat host_list_nas_cleanup.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost  

        - meta: end_host
          when: vm_hostlist == ""  

      # Only Assigning TR to Storage Team if there are Volumes to take offline and be deleted

        - name: Extracting storage info TR content from the final result
          shell: cat vm_nas_proceed.yml
          delegate_to: localhost
          register: suc_list_cont
            
        - name: Save to variable- success list
          set_fact:
            vm_nas_ready: "{{ suc_list_cont.stdout }}"
          delegate_to: localhost      
        
        - name: "Custom module [CREATE TR for NAS cleanup]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - NAS Cleanup [Volumes ready to take offline]"
            assignee_name: "DecoP112686"
            assignee_group: "OSX04SMG"            
            severity: "4"
            overview: "VM DECO - VM NAS Cleanup"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_ready_output
          when: vm_nas_ready != ""
        
        - name: "Custom module [CREATE TR for NAS cleanup - no volumes ready to take offline]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - NAS Cleanup [No Volumes to take offline]"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "VM DECO - VM NAS Cleanup"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_empty_output
          when: vm_nas_ready == ""
               
        - name: "Set fact for NAS TR - volumes ready"
          set_fact:
            record_id_nas: "{{ create_tr_ready_output.record_id }}"
          when: vm_nas_ready != ""

        - name: "Set fact for NAS TR - no volumes ready"
          set_fact:
            record_id_nas: "{{ create_tr_empty_output.record_id }}"
          when: vm_nas_ready == ""

        - copy:
            content: '{{ record_id_nas|to_json }}'
            dest: record_nas.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_id_nas }}"
          register: add_document
          delegate_to: localhost
          when: vm_nas_ready == ""

      rescue:
        - name: Failure TR Creation 
          debug:
            msg: "Failed to Create VM DECO - NAS Cleanup TR"

    - name: "Handling Create TR- Win@proach -1 "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat idem_backup_pre.json
          delegate_to: localhost
          register: result_app_cmdb_backup

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_nas_check_backup_flag: "{{ result_app_cmdb_backup.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_nas_check_backup_flag == "F"          
    

        - name: Display the JSON file content
          shell: cat idem_nas_check.json
          delegate_to: localhost
          register: result_app_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_nas_check_flag: "{{ result_app_cmdb.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_nas_check_flag == "T"

        - name: Display the JSON file content for NAS cleanup
          shell: cat record_nas.json
          delegate_to: localhost
          register: TR_result_nas  

        - name: save the Json data to a Variable as a Fact for NAS cleanup
          set_fact:
            record_id_nas: "{{ TR_result_nas.stdout[1:-1] }}"
          delegate_to: localhost

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_id_nas == ""                                

        - name: VM_host list
          shell: cat host_list_nas_cleanup.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""

        - name: "Custom module [CREATE TR For NAS Cleanup]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - NAS Cleanup [Volumes ready to take offline]"
            assignee_name: "DecoP112686"
            assignee_group: "OSX04SMG"           
            severity: "4"
            overview: "VM DECO - VM NAS Cleanup"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_nas_tr_output
          when: record_id_nas == "" and vm_nas_ready != ""
        
        - name: "Custom module [CREATE TR for NAS cleanup - no volumes ready to take offline]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - NAS Cleanup [No Volumes to take offline]"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "VM DECO - VM NAS Cleanup"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_nas_tr_output
          when: record_id_nas == "" and vm_nas_ready == ""
        
        - name: "Set fact for NAS TR - volumes ready"
          set_fact:
            record_id_nasstore: "{{ create_tr_ready_output.record_id }}"
          when: vm_nas_ready != "" and record_id_nas == ""

        - name: "Set fact for NAS TR - no volumes ready"
          set_fact:
            record_id_nasstore: "{{ create_tr_empty_output.record_id }}"
          when: vm_nas_ready == "" and record_id_nas == ""

        - copy:
            content: '{{ record_id_nasstore|to_json }}'
            dest: record_nas.json
          delegate_to: localhost
          when: record_id_nas == "" 
        
        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_id_nasstore }}"
          register: add_document
          delegate_to: localhost
          when: record_id_nas == "" and vm_nas_ready == ""

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - NAS Cleanup TR"

