---    
    - name: "Handling Create TR- Win@proach "
      block:

        - set_fact:
            vm_hostlist_all: "{{ hostvars['localhost']['host_list_data'] }}"

        - debug:
            var: vm_hostlist_all

        - set_fact:
            vm_hostlist: "{{ vm_hostlist_all.ansible_facts.hostdata }}"

        - debug:
            var: vm_hostlist

        - name: create TR
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{WIN@PROACH_BIRD_URL}}"
            template_name: "deco ssh enable"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT - winrm Enabling for Hosts"
            ci: "{{ vm_hostlist }}"
            winaproach_category: "I"
          register: ticket_id
          delegate_to: localhost

        - debug:
            var: ticket_id
         
        - set_fact:
            winrmv_record_id: "{{ticket_id.id.ticketId}}"
        
        - copy:
            content: '{{ winrmv_record_id|to_json }}'
            dest: record_winrm.json
          delegate_to: localhost

    
      rescue:
        - debug:
            msg: "Failed to DECO - winrm Key Enabling TR"

    - name: "Handling Create TR- Win@proach Retry-1 "
      block: 
        - name: Display the JSON file content
          shell: cat record_winrm.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            winrm_record_id: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: winrm_record_id == ""                           

        - meta: end_host
          when: vm_hostlist == ""
          

        - name: create TR
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{WIN@PROACH_BIRD_URL}}"
            template_name: "deco ssh enable"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT - winrm Enabling for Hosts "
            ci: "{{ vm_hostlist }}"
            winaproach_category: "I"
          register: ticket_id
          delegate_to: localhost
          when: winrm_record_id == ""
          
        - set_fact:
            winrmv_record_id: "{{ticket_id.id.ticketId}}"
          when: winrm_record_id == ""    

        - copy:
            content: '{{ winrmv_record_id|to_json }}'
            dest: record_winrm.json
          delegate_to: localhost
          when: winrm_record_id == "" 

      rescue:
        - debug:
            msg: "Retried and Failed to DECO - winrm Key Enabling TR"


    - name: "Handling Create TR- Win@proach Retry-2 "
      block: 
        - name: Display the JSON file content
          shell: cat record_winrm.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            winrm_record_id: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: winrm_record_id == ""                          

        - meta: end_host
          when: vm_hostlist == ""
        
        - name: create TR
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{WIN@PROACH_BIRD_URL}}"
            template_name: "deco winrm enable"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT - winrm Enabling for Hosts "
            ci: "{{ vm_hostlist }}"
            winaproach_category: "I"
          register: ticket_id
          delegate_to: localhost
          when: winrm_record_id == ""
           
        - set_fact:
            winrmv_record_id: "{{ticket_id.id.ticketId}}"
          when: winrm_record_id == ""  
 
        - copy:
            content: '{{ winrmv_record_id|to_json }}'
            dest: record_winrm.json
          delegate_to: localhost
          when: winrm_record_id == "" 

      rescue:
        - debug:
            msg: "Retried and Failed to DECO - winrm Key Enabling TR"                        

    - name: "Handling Start Implementation- Win@proach "
      block:
        - name: Display the JSON file content
          shell: cat record_winrm.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            winrm_record_id: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost       

        - meta: end_host
          when: winrm_record_id == ""                            

        - name: Sleep for 62 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 62
          delegate_to: localhost           

        - name: Start Implementation
          winaproach:
            system: prod
            type: task_record
            operation: start_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ winrm_record_id }}"
          register: start_implementation
          delegate_to: localhost
        
      rescue:
        - debug:
            msg: "Failed to Start Implementation on DECO - winrm Enabling TR :'{{ winrm_record_id }}'"
       