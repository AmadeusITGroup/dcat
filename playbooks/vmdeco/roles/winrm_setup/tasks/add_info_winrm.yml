---    
    - name: "Handling TR record_id for implementation and validation result"
      block:
        - set_fact:
            json_winrm_fail: "record_winrm.json"
            file_winrm_fail: "winrm_key_failure.yml"
            json_winrm_suc: "record_winrm.json"
            file_winrm_suc: "winrm_key_success.yml"
            file_winrm_fin : "winrm_key_final.yml"

        - name: Display the JSON file content
          shell: cat record_winrm.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            winrm_record_id: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost       

        - meta: end_host
          when: winrm_record_id == ""       

####################### Failure info gathering ########################## 
        - name : handling error in the success block
          block:          
            - name: Display the JSON file content
              shell: cat winrm_key_failure.yml
              delegate_to: localhost
              register: result_winrm_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_winrm_fail_v: "{{ result_winrm_fail.stdout }}" 
              delegate_to: localhost  
   
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for WINRM enable - VMs"
                form3: "***********************************************************************"
            - set_fact:
                content_winrm_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_winrm_fail_v }}"
              when:  result_winrm_fail_v != ""
              

            - name: " Merge Failure information to to single final file"
              shell: echo "{{ content_winrm_fail }}" >> winrm_key_final.yml                    
              delegate_to: localhost
              when:  result_winrm_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

#############  success info gathering ##########################
        - name : handling error in the success block
          block:
            - name: Display the JSON file content
              shell: cat winrm_key_success.yml
              delegate_to: localhost
              register: result_winrm_suc

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_winrm_suc_v: "{{ result_winrm_suc.stdout }}" 
              delegate_to: localhost  
      
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for WINRM enable - VMs"
                form3: "***********************************************************************"
            - set_fact:
                content_winrm_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_winrm_suc_v }}" 
              when: result_winrm_suc_v != ""

            - name: " Merge Success information to single final file "
              shell: echo "{{content_winrm_suc}}" >> winrm_key_final.yml                    
              delegate_to: localhost
              when: result_winrm_suc_v != ""

          rescue:
            - debug:
                msg: "Rescue for no success file found and continue"

##########################  merging both failure and success results ###########################

        - name: Display the JSON file content
          shell: cat winrm_key_final.yml
          delegate_to: localhost
          register: result_winrm_fin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_winrm_fin_v: "{{ result_winrm_fin.stdout }}" 
          delegate_to: localhost  


        - name: Display the JSON file content
          shell: cat record_winrm.json
          delegate_to: localhost
          register: TR_result

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_winrm: "{{ TR_result.stdout[1:-1] }}"
          delegate_to: localhost


        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "I"
          delegate_to: localhost                   

#######################  closing implementation as failed  ############################################
        - name: Implementation Failed that is closing the implementation as failed
          winaproach:
            system: prod
            type: task_record
            operation: fail_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_winrm }}"
              text: "{{ result_winrm_fin_v }}"
          register: fail_implementation  
          when: result_winrm_fin_v is search("ERROR") and result_winrm_fin_v is not search("INFO")


        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "DECO: winrm enable failure list and details with failed TR - {{ record_winrm }}"
            tr_map: "{{ record_winrm }}"
            assignee_group: "OLINUX1"  
            ptr_logs: "{{ result_winrm_fin_v }}"
            winaproach_category: "P"
            ptr_system: "PROD"       
          register: ptr_out
          until: '"Successfully" in ptr_out.msg'
          retries: 3
          delay: 10   
          when: result_winrm_fin_v is search("ERROR") and result_winrm_fin_v is not search("INFO")


        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_winrm }}"
            prob_id: "{{ ptr_out.id }}"                   
          register: update_overview  
          when: result_winrm_fin_v is search("ERROR") and result_winrm_fin_v is not search("INFO")          

#######################  Pending Partial implementation  ############################################

        - name: Implementation partial that is closing the implementation as partial
          tr_partial_imp:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_winrm }}"
          register: partial_implement
          when: result_winrm_fin_v is search("ERROR") and result_winrm_fin_v is search("INFO")

# ########################  Close Partial implementation  ############################################
        - name: Implementation partial that is closing the implementation as partial
          tr_partial_close:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_winrm }}"
            closing_comment: "{{ result_winrm_fin_v }}"
          register: close_partial_implement
          when: result_winrm_fin_v is search("ERROR") and result_winrm_fin_v is search("INFO")


        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "DECO: winrm enable failure list and details with partial implemented TR - {{ record_winrm }}"
            tr_map: "{{ record_winrm }}"
            assignee_group: "OLINUX1"  
            ptr_logs: "{{ result_winrm_fin_v }}"
            winaproach_category: "P"
            ptr_system: "PROD"                     
          register: ptr_out
          until: '"Successfully" in ptr_out.msg'
          retries: 3
          delay: 10  
          when: result_winrm_fin_v is search("ERROR") and result_winrm_fin_v is search("INFO")


        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_winrm }}"
            prob_id: "{{ ptr_out.id }}"                   
          register: update_overview  
          when: result_winrm_fin_v is search("ERROR") and result_winrm_fin_v is search("INFO")

############################# closing implementation as success ####################            
        - name: END Implementation that is closing the implementation as success
          winaproach:
            system: prod
            type: task_record
            operation: end_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
                task_id: "{{ record_winrm }}"
                text: "{{ result_winrm_fin_v }}"
          register: end_implementation
          when: result_winrm_fin_v is not search("ERROR") and result_winrm_fin_v is search("INFO")
 

        - name: start Validate Implementation for closing the success TR
          winaproach:
            system: prod
            type: task_record
            operation: validate
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_winrm }}"
              text: "{{ result_winrm_fin_v }}"
          register: validation
          when: result_winrm_fin_v is not search("ERROR") and result_winrm_fin_v is search("INFO") 

        
      rescue:
        - debug:
            msg: "Exception occurred so rescued the main tr result block for winrm enable update" 