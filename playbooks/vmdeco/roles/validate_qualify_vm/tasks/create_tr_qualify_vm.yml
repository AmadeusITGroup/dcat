---  
    - name: "Handling Create TR- Win@proach "
      block:       

        - name: Check snow api call back
          update_snow:
            action: Phase1
            ritm_number: "{{ ritm_number }}"
            status: Started
            comments: Phase-1 of decommission is getting started. we will post the update shortly.
            username: "{{ SN_USERNAME }}"
            password: "{{ SN_PASSWORD }}"
          run_once: True  
          register: api_result

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost


        - name: "Check entry for DECO server"
          final_create_metadata:
            cr: "{{ cr }}"
            awx_job_id: "{{ tower_job_id }}" 
            ritm_number: "{{ ritm_number }}"
            requestor_name: "{{ requester_name }}"
            retention_days: "{{ retention_days }}"
            requestor_group: "{{ requester_group }}"
            pillar: "{{ pillar }}"
            mit_ticket: "{{ mit_ticket }}"
            cmdb: "T"
            connection_string: "{{ private_endpoint_connection_string }}"
          register: metadata_update
          delegate_to: localhost

        - debug:
            var: metadata_update           

      rescue:
        - debug:
            msg: "Failed to fetch information from Servicenowstate" 

    - name: "Handling Create TR- Win@proach "
      block:

        - name: VM_host list
          shell: cat qualified_vm.yml
          delegate_to: localhost
          register: qualified_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            qualified_vm: "{{ qualified_vm.stdout }}" 
          delegate_to: localhost  

        - meta: end_host
          when: qualified_vm == ""             
        

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - Validate powered-off or disconnected VM's"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"   #"DINFDECO"            
            severity: "4"
            overview: "VM DECO - Validate powered-off or disconnected VM's"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
        
        - set_fact:
            record_check_poweroff: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_check_poweroff|to_json }}'
            dest: record_check_poweroff.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_check_poweroff }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - Check poweredoff VM's"

    - name: "Handling Create TR- Win@proach -1 "
