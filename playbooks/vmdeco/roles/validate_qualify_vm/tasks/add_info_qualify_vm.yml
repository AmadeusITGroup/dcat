---     
        
    - name: "Handling TR record_id to update and close the TR for qualified vm"
      block:
                  

        - name: Display the JSON file content
          shell: cat record_check_poweroff.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_check_poweroff: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost          

        - meta: end_host
          when: record_check_poweroff == ""       


        - name: VM_host list
          shell: cat qualified_vm.yml
          delegate_to: localhost
          register: qualified_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            qualified_vm: "{{ qualified_vm.stdout }}" 
          delegate_to: localhost  

        - meta: end_host
          when: qualified_vm == ""     
  
        
        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are powered-off or disconnected VM's will be taken for manual intervention"
            form3: "***********************************************************************"
        - set_fact:
            content_qualified_vm: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ qualified_vm }}" 
          when: qualified_vm != ""  

                   
  
########################   results added to TR  ############################################
        - name: "add message to failed TR"
          add_message_to_tr:
            record_id: "{{record_check_poweroff}}"
            message: "{{ content_qualified_vm }}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost
          register: add_msg_output 


############################# closing TR for success ####################            
        - name: "Test custom module [CLOSE TR]"
          close_tr:
            record_id: "{{record_check_poweroff}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          register: close_tr_output


      rescue:
        - debug:
            msg: "Exception occurred so rescued the main tr result block for powered-off or disconnected VM's"





                           
        
            
             