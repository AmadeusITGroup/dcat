---
   
    - name: "Handling Create TR- Win@proach for dts cleanup hosts "
      block: 
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat idem_backup_pre.json
          delegate_to: localhost
          register: result_dts_backup

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_dts_backup_flag: "{{ result_dts_backup.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_dts_backup_flag == "F"     

        - name: Display the JSON file content
          shell: cat idem_nas_check.json
          delegate_to: localhost
          register: result_dts_cleanup

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_dts_check_flag: "{{ result_dts_cleanup.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_dts_check_flag == "T"  

        - name: VM_host list
          shell: cat host_list_dts_cleanup.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""       

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - NAS cleanup for DTS server requires manual intervention"
            assignee_name: "DecoP112686"
            assignee_group: "OSX04SMG"   #"DINFDECO"            
            severity: "4"
            overview: "VM DECO - NAS cleanup for DTS server requires manual intervention"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
       
        - set_fact:
            record_dts_cleanup: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_dts_cleanup|to_json }}'
            dest: record_for_dts_cleanup.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_dts_cleanup }}"
          register: add_document
          delegate_to: localhost        

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - for dts cleanup "

