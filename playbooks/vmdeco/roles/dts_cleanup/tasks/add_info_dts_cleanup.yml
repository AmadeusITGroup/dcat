---    
        
    - name: "Handling TR record_id to update and close the TR for dts cleanup"
      block:
      
        - set_fact: 
            json_dts_cleanup_fail: "record_dts_cleanup_fail.json"
            json_dts_cleanup_suc: "record_dts_cleanup_suc.json" 
            file_dts_cleanup_fin : "dts_cleanup_final.yml" 
            file_dts_cleanup: "dts_cleanup_hosts.yml"
            file_dts_cleanup_fail: "dts_cleanup_hosts_fail.yml"                         

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""       

        - name: Display the JSON file content
          shell: cat record_for_dts_cleanup.json
          delegate_to: localhost
          register: TR_result_dts_cleanup 

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_dts_cleanup: "{{ TR_result_dts_cleanup.stdout[1:-1] }}"
          delegate_to: localhost         

        - debug:
            var: record_id_dts_cleanup

        - meta: end_host
          when: record_id_dts_cleanup == ""      

 #############  success info gathering ##########################
        - name : handling error in the success block
          block:
            - name: Display the JSON file content
              shell: cat dts_cleanup_hosts.yml
              delegate_to: localhost
              register: result_dts_cleanup_suc

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_dts_cleanup_suc_v: "{{ result_dts_cleanup_suc.stdout }}" 
              delegate_to: localhost  
      
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "NAS cleanup for DTS server requires manual intervention for below VM's"
                form3: "***********************************************************************"
            - set_fact:
                content_dts_cleanup_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_dts_cleanup_suc_v }}" 
              when: result_dts_cleanup_suc_v != ""  


            - name: " Merge Success information to single final file "
              shell: echo "{{content_dts_cleanup_suc}}" >> dts_cleanup_final.yml                    
              delegate_to: localhost
              when: result_dts_cleanup_suc_v != "" 

          rescue:
            - debug:
                msg: "Rescue for no success file found and continue"   
                   
  ####################### Failure info gathering ########################## 
        - name : handling error in the failure block
          block:          
            - name: Display the JSON file content
              shell: cat dts_cleanup_hosts_fail.yml
              delegate_to: localhost
              register: result_dts_cleanup_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_dts_cleanup_fail_v: "{{ result_dts_cleanup_fail.stdout }}" 
              delegate_to: localhost  
    
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "NAS cleanup failure for below DTS servers"
                form3: "***********************************************************************"
            - set_fact:
                content_dts_cleanup_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_dts_cleanup_fail_v }}"
              when: result_dts_cleanup_fail_v != ""    
       
            - name: " Merge Failure information to to single final file"
              shell: echo "{{ content_dts_cleanup_fail }}" >> dts_cleanup_final.yml                    
              delegate_to: localhost
              when: result_dts_cleanup_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

##########################  merging both failure and success results ###########################

        - name: Display the JSON file content
          shell: cat dts_cleanup_final.yml
          delegate_to: localhost
          register: result_dts_cleanup_fin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_dts_cleanup_fin_v: "{{ result_dts_cleanup_fin.stdout }}" 
          delegate_to: localhost  


########################   results added to TR  ############################################
        - name: "add message to failed TR"
          add_message_to_tr:
            record_id: "{{record_for_dts_cleanup}}"
            message: "{{ result_dts_cleanup_fin_v }}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost
          register: add_msg_output 


