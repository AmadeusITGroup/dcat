---
# - name: "NAS DTS vms check and info "
#   hosts: all
#   throttle: 1
#   serial: 5
#   gather_facts: no
#   vars:
#     file_success_dts_nas: "nas_dts_success.yml"

#   tasks:
    - name: "NAS DTS vms check and info task execution"
      throttle: 1
      block:

        - set_fact:
            file_dts_cleanup: "dts_cleanup_hosts.yml"
            file_dts_cleanup_fail: "dts_cleanup_hosts_fail.yml"

        - name: Display the JSON file content
          shell: cat record_for_dts_cleanup.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_dts_cleanup: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost  

        - meta: end_host
          when: record_for_dts_cleanup == "" 

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}"       

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], VM belongs to DTS vcenter.Kindly perform the manual storage clean up." >> {{file_dts_cleanup}}                	
          delegate_to: localhost
          when: filter_domain == "DTS"

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "update entry for DECO server for nas dts server info"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "nasstorage"
            status: "T"           
          register: update_status
          delegate_to: localhost
          when: filter_domain == "DTS"

      rescue:
        - debug:
            msg: 'Exception at nas_dts_server_info.yml file' 

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}"       

        - name: "VM host list"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], DTS server for manual clean up .State file might not be updated for the storage cleanup." >> {{file_dts_cleanup_fail}}                	
          delegate_to: localhost
          when: filter_domain == "DTS"