---
# - name: "This playbook is to Create TR for CMDB Update task"
#   hosts: localhost
#   gather_facts: no
#   vars:
#     file_cmdb_suc: "vm_cmdb_success.yml"
#     record_id_cmdb_up: ""
#     graceperiod_flag: true
#     cmdb_check: False
#     vmdelete: true        
    
#       #### TR creation #####    
#   tasks:    
    - name: "Handling Create TR- Win@proach for CMDB Update task "
      block:

        - set_fact:
            file_cmdb_suc: "vm_cmdb_success.yml"       

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat idem_vmdelete_pre.json
          delegate_to: localhost
          register: result_del_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_cmdb_update_del_flag: "{{ result_del_cmdb.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_cmdb_update_del_flag == "F"          
     

        - name: Display the JSON file content
          shell: cat idem_cmdb_update.json
          delegate_to: localhost
          register: result_app_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_cmdb_update_flag: "{{ result_app_cmdb.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_cmdb_update_flag == "T"             

        - name: VM_host list
          shell: cat host_list_cmdb_update.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost                     

        - name: TR creation for CMDB Update task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: VM DECO : cmdb update"
            ci: "{{ vm_hostlist}}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id_cmdb_update
          delegate_to: localhost
      

        - set_fact:
            record_id_cmdb_up: "{{ticket_id_cmdb_update.id.ticketId}}"
  
    
        - copy:
            content: '{{ record_id_cmdb_up|to_json }}'
            dest: record_cmdb_upd.json
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - cmdb update TR"

    - name: "Handling Create TR- Win@proach for CMDB Update task - retry 1 "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
