        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost 

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost                    

        - name: TR creation for CMDB Update task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: VM DECO : cmdb update"
            ci: "{{ vm_hostlist }}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id_cmdb_update
          delegate_to: localhost
          when: record_id_cmdb_up == ""
           

        - set_fact:
            record_id_cmdb_update: "{{ticket_id_cmdb_update.id.ticketId}}"
          when: record_id_cmdb_up == ""  
   
    
        - copy:
            content: '{{ record_id_cmdb_update|to_json }}'
            dest: record_cmdb_upd.json
          delegate_to: localhost
          when: record_id_cmdb_up == ""

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - cmdb update TR"

