---
    - name: "Fetch FQDN for hosts"
      throttle: 1
      block:

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "Check entry for DECO server"
          azure_update_ref:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status
          delegate_to: localhost

        - set_fact: 
            fqdn: '{{idem_status.module_update.fqdn}}'

        - meta: end_host
          when: fqdn != "" and fqdn != "F"

        - set_fact:
            fqdn_results: "vm_fqdn_results.yml"
          
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""

        - name: Display the JSON vcenter file content
          shell: cat check_vcenter.yml
          delegate_to: localhost
          register: result_check_vcenter

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_vcenter: "{{ result_check_vcenter.stdout }}" 
          delegate_to: localhost

        - meta: end_host
          when: '"{{ inventory_hostname }}" in check_vcenter'                     

        - name: Display the JSON file content
          shell: cat failure_vm_bgp.yml
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            vm_list: "{{ TR_result_healthcheck.stdout }}"
          delegate_to: localhost

        - meta: end_host
          when: '"{{ inventory_hostname }}" in vm_list'


        - name: fetch FQDN
          fetch_fqdn_synergon:
            vmname: "{{ inventory_hostname }}"
            synergon_api: '{{ synergon_url }}'
          delegate_to: localhost            
          register: results
          until: '"Successfully" in results.msg'
          retries: 3
          delay: 10 

        - debug:
            var: results

        - name: set results to file
          set_fact:
            result: "{{ results.msg }}"
            
        - name: "VM host list"
          shell: echo "{{ result }}" >> {{ fqdn_results }}                	
          delegate_to: localhost
          when: result is search("INFO")

        - name: "VM host list"
          shell: echo "{{ result }}" >> vm_fqdn_error.yml                	
          delegate_to: localhost
          when: result is search("ERROR")

        - set_fact:
            fqdn_info: "{{ results.host_fqdn }}"          

        - meta: end_host
          when: fqdn_info == ""                    

        - name: "update entry for DECO server"
          azure_update_module_vals:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "fqdn"
            status: "{{ results.host_fqdn }}"           
          register: update_status
          delegate_to: localhost
          when: results.host_fqdn is defined


      rescue:
        - debug:
            var: 'results' 

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}" 


        - set_fact:
            fqdn_error: "{{ hostname }}, {{ time }}, [ERROR], :Unable to Fetch FQDN for HOST:  {{ hostname }}"

        - name: "Write Failure host to file"
          shell: echo "{{ inventory_hostname }} Failure" >> fqdn_failure_vm.txt              
          delegate_to: localhost                
                                     
        - name: "VM host list"
          shell: echo "{{ fqdn_error }}" >> vm_fqdn_error.yml                	
          delegate_to: localhost