---
    - name: "Handling Create TR- Win@proach "
      block:          
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""

        - name: Display the JSON file content
          shell: cat vm_fqdn_results.yml
          delegate_to: localhost
          register: fqdn_data
        
        - name: save the Json data to a Variable as a Fact
          set_fact:
            fqdn_record: "{{ fqdn_data.stdout }}" 
          delegate_to: localhost         

        - meta: end_host
          when: fqdn_record == ""

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - FQDN Validation"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "VM DECO - FQDN Validation"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost
          no_log: False
          register: create_tr_output
        
        - set_fact:
            record_fqdn: "{{create_tr_output.record_id}}"
            

        - copy:
            content: '{{ record_fqdn|to_json }}'
            dest: record_for_fqdn.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_fqdn }}"
          register: add_document
          delegate_to: localhost

        - name: grep FQDN content
          shell: cat vm_fqdn_results.yml
          delegate_to: localhost
          register: fqdn_result              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_fqdn: "{{ fqdn_result.stdout }}" 
          delegate_to: localhost

        # - meta: end_host
        #   when: vm_fqdn == ""

        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the DECO results for FQDN status - VM's"
            form3: "***********************************************************************"
            form4: "***********************************************************************"            
        - set_fact:
            content_fqdn_success: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ vm_fqdn +'\n'+ form4 }}"

        - name: "Add message to FQDN TR"
          add_message_to_tr:
            record_id: "{{ record_fqdn }}"
            message: "{{ content_fqdn_success }}"             
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}" 
          delegate_to: localhost
          register: add_msg_output

        - name: grep FQDN content
          shell: cat vm_fqdn_error.yml
          delegate_to: localhost
          register: fqdn_result_error              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_fqdn_error: "{{ fqdn_result_error.stdout }}" 
          delegate_to: localhost          

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost           

################################ PTR creation ###################################
        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "CSTY:DECO:DCAT: VM DECO: Fetch FQDN issue details with failed TR - {{ record_fqdn }}"
            tr_map: "{{ record_fqdn }}"
            assignee_group: "OSP000"  
            ptr_logs: "{{ vm_fqdn_error }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"         
          register: ptr_out_domain
          until: '"Successfully" in ptr_out_domain.msg'
          retries: 3
          delay: 10
          when: vm_fqdn_error is search("ERROR")
        
        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: filter owner group
          categorize_servers:
            path: fqdn_failure_vm.txt
          delegate_to: localhost
          register: failure_servers_list
          when: vm_fqdn_error is search("ERROR")

        - debug:
            var: failure_servers_list
          when: vm_fqdn_error is search("ERROR")

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ item }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_out_domain.id }}"
            event: "VM DECO: Fetch FQDN failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          loop: "{{ failure_servers_list.Status.Failure }}"
          register: ptr_add
          when: vm_fqdn_error is search("ERROR")


        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_fqdn }}"
            prob_id: "{{ ptr_out_domain.id }}"                   
          register: update_overview  
          when: vm_fqdn_error is search("ERROR")     

        - name: "Test custome module [CLOSE TR]"
          close_tr:
            record_id: "{{record_fqdn}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          register: close_tr_output     


      rescue:
        - debug:
            msg: "Failed to Create VM DECO - FQDN check TR"
