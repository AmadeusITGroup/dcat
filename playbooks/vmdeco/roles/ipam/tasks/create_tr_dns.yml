            dest: record_dns.json
          delegate_to: localhost
          when: dns_record_id == "" 

    
      rescue:
        - debug:
            msg: "Failed to Create VM DECO - dns validation TR"            


    - name: "Handling Start Implementation- Win@proach "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""


        - name: Display the JSON file content
          shell: cat record_dns.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            dns_record_id: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost         

        - meta: end_host
          when: dns_record_id == ""                            

        - name: Sleep for 62 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 62
          delegate_to: localhost           

        - name: Start Implementation
          winaproach:
            system: prod
            type: task_record
            operation: start_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ dns_record_id }}"
          register: start_implementation
          delegate_to: localhost
          
    
      rescue:
        - debug:
            msg: "Failed to Start Implementation on VM DECO - DNS Validation TR :'{{ dns_record_id }}'"
       
