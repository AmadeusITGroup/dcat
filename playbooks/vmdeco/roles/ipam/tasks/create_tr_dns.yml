---
# - name: "This playbook is to Create TR for dns IPAM Cleanup"
#   hosts: localhost
#   gather_facts: no
#   vars:
#     dns_success: "dns_success.yml"    
#     dns_record_id: ""
#     dns_check: False
#     graceperiod_flag: true
#     nas_check: true    
    
#       #### TR creatation#####    
#   tasks:    
    - name: "Handling Create TR- Win@proach "
      block: 

        - set_fact:
            dns_record_id: ""
            dns_success: "dns_success.yml"

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""

        - name: Display the JSON file content 
          shell: cat idem_nas_check_pre.json
          delegate_to: localhost
          register: result_app_cmdb_nas

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_dns_check_nas_flag: "{{ result_app_cmdb_nas.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_dns_check_nas_flag == "F"
  

        - name: Display the JSON file content
          shell: cat idem_dns_check.json
          delegate_to: localhost
          register: result_app_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_dns_check_flag: "{{ result_app_cmdb.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_dns_check_flag == "T"       

        - name: VM_host list
          shell: cat host_list_ip_dns.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost                     

        - name: create TR
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco dns ipam"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: VM DECO: IPAM Cleanup"
            ci: "{{ vm_hostlist }}"
            winaproach_category: "{{ win_category }}"
          register: ticket_id
          delegate_to: localhost
        
        - set_fact:
            dns_record_id: "{{ticket_id.id.ticketId}}"
    

        - copy:
            content: '{{ dns_record_id|to_json }}'
            dest: record_dns.json
          delegate_to: localhost

    
      rescue:
        - debug:
            msg: "Failed to Create VM DECO - dns validation TR"

    - name: "Handling Create TR- Win@proach  -retry 1"
      block: 

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""

        - name: Display the JSON file content 
          shell: cat idem_nas_check_pre.json
          delegate_to: localhost
          register: result_app_cmdb_nas

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_dns_check_nas_flag: "{{ result_app_cmdb_nas.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_dns_check_nas_flag == "F"
  

        - name: Display the JSON file content
          shell: cat idem_dns_check.json
          delegate_to: localhost
          register: result_app_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_dns_check_flag: "{{ result_app_cmdb.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_dns_check_flag == "T"

        - name: Display the JSON file content
          shell: cat record_dns.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            dns_record_id: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: dns_record_id == ""

        - name: VM_host list
          shell: cat host_list_ip_dns.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
