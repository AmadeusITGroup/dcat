    - name: "Logger and Create/Update TR- Win@proach "
      block:

        - set_fact:
            dns_log: "dns_log.yml"
            json_dns: "record_dns_fail.json"
            file_dns_fail: "dns_hostname_exception.yml" 
            graceperiod_flag: True
            dns_check: "F"
            nas_check: "T"

        - name: Display the JSON file content
          shell: cat record_dns.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            dns_record_id: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost         

        - meta: end_host
          when: dns_record_id == "" 


        - name: VM_host list
          shell: cat vm_dns_final.yml
          delegate_to: localhost
          register: dns_result              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            dns: "{{ dns_result.stdout }}" 
          delegate_to: localhost
           

        - meta: end_host
          when: dns == ""

        - name: VM_host list
          shell: cat record_id_logger.json
          delegate_to: localhost
          register: record_result              

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id: "{{ record_result.stdout }}" 
          delegate_to: localhost          


################# CREATE TR ################
        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "VM DECO -LOGGER"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "VM DECO -LOGGER (NETWORK - BACKUP - NAS_STORAGE - IP_DNS - VM_POWEROFF_DELETION)"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_id == ""
        
        - set_fact:
            record_id_logger: "{{create_tr_output.record_id}}"
          when: record_id == ""  
       

        - copy:
            content: '{{ record_id_logger|to_json }}'
            dest: record_id_logger.json
          delegate_to: localhost 
          when: record_id == ""                    
                
            
        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_id_logger }}"
          register: add_document
          delegate_to: localhost

################# LOGGER ###################
        - name: VM_host list
          shell: cat record_id_logger.json
          delegate_to: localhost
          register: vm_result             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            record_id_logger: "{{ vm_result.stdout[1:-1] }}"  
          delegate_to: localhost

        - name: logger data
          shell: cat vm_dns_final.yml
          delegate_to: localhost
          register: dns_log 
                    

        - name: save the vm list to a Variable as a Fact
          set_fact:
            log_dns: "{{ dns_log.stdout }}" 
          delegate_to: localhost
       

