        - name: save the vm list to a Variable as a Fact
          set_fact:
            winaproach_user: "{{ winaproach_username }}"
          delegate_to: localhost


        - name: save the vm list to a Variable as a Fact
          set_fact:
            winaproach_password: "{{ winaproach_password }}"
          delegate_to: localhost      



################# LOGGER UPDATE TO TR ###################
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{ record_id_logger }}"
            message: "{{ log_dns }}"           
            username: "{{ winaproach_user }}"
            password: "{{ winaproach_password }}"         
          delegate_to: localhost
          register: add_msg_output_log


      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check dns logger "


    - name: "Logger and Create/Update TR- Win@proach "
      block:     

        - name: "Set header"
          shell: echo > dns_hostname_exception.yml          
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > record_dns.json          
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > dns_hostname_success.yml          
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > vm_dns_final.yml        
          run_once: true
          delegate_to: localhost  

        - name: "Set header"
          shell: echo > dns_log.yml          
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > final_dns.yml          
          run_once: true
          delegate_to: localhost    
               
      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check dns logger "       
