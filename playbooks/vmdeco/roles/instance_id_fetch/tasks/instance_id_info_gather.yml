---
        - name: module for instance id fetch
          throttle: 1
          block:  

            - set_fact:
                file_instanceid: "instanceid_success.yml"
                file_instanceid_fail: "instanceid_fail.yml"

            - name: Display the JSON file content
              shell: cat record_for_instanceid.json
              delegate_to: localhost
              register: TR_result_instanceid 

            - name: save the Json data to a Variable as a Fact
              set_fact:
                record_id_instanceid: "{{ TR_result_instanceid.stdout[1:-1] }}"
              delegate_to: localhost         

            - meta: end_host
              when: record_id_instanceid == ""                

            - name: "Test custom module fetch instance id "
              fetch_vcentre_instance_id:
                vmname: '{{ inventory_hostname }}'     
                synergon_api: '{{ synergon_url }}'
              delegate_to: localhost            
              register: vcenter_output      
              until: '"Exception" not in vcenter_output.ci_instance_id'
              retries: 3
              delay: 30
              ignore_errors: yes

            - set_fact:
                v_instance_id: "{{vcenter_output.ci_instance_id}}"                 

            - name: Get timestamp from the system
              shell: "date +%Y-%m-%d/%H:%M"
              delegate_to: localhost
              register: tstamp  
                          
            - set_fact:
                time: "{{tstamp.stdout}}" 

            - name: "VM host list failure to file "
              shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{v_instance_id}}" >> {{file_instanceid_fail}}                    
              delegate_to: localhost 
              when: v_instance_id is defined and v_instance_id is search("Unable|Exception|multiple")

            - name: "Write Failure host to file"
              shell: echo "{{ inventory_hostname }} Failure" >> instanceid_failure_vm.txt              
              delegate_to: localhost
              when: v_instance_id is defined and v_instance_id is search("Unable|Exception|multiple")

            - meta: end_host
              when: v_instance_id is defined and v_instance_id is search("Unable|Exception|multiple")

            - name: Display the JSON file content
              shell: cat private_endpoint_connection_string.yml
              delegate_to: localhost
              register: result_private_endpoint_connection_string
        
            - name: save the Json data to a Variable as a Fact
              set_fact:
                private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
              delegate_to: localhost

            - name: "update entry for DECO server for the fetched instance id"
              azure_update_module_vals:
                connection_string: "{{ private_endpoint_connection_string }}"
                hostname: "{{ inventory_hostname }}"
                module_name: "instanceid"
                status: "{{ v_instance_id }}"           
              register: update_status
              delegate_to: localhost
              when: v_instance_id is defined and v_instance_id is not search("Unable|Exception|multiple")

            - name: "VM host list info"
              shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], successfully fetched instance id for the server,{{ v_instance_id }} ." >> {{file_instanceid}}                    
              delegate_to: localhost 
              when: v_instance_id is defined and v_instance_id is not search("Unable|Exception|multiple")
           

          rescue: 
            - name: when after grace period module throws error the below task should execute
              debug:
                msg: "Exception occurred while fetching instance id from synergon"

            - name: Get timestamp from the system
              shell: "date +%Y-%m-%d/%H:%M"
              delegate_to: localhost
              register: tstamp  
                  
            - set_fact:
                time: "{{tstamp.stdout}}" 

            - name: "Write Failure host to file"
              shell: echo "{{ inventory_hostname }} Failure" >> instanceid_failure_vm.txt              
              delegate_to: localhost                          

            - name: "VM host list"
              shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to fetch instance id.kindly check."  >> {{file_instanceid_fail}}                    
              delegate_to: localhost    
