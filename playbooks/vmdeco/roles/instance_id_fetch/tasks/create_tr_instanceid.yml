        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""

        - name: Display the JSON file content
          shell: cat record_for_instanceid.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_instanceid: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost          


        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_for_instanceid == "" 

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - instance id fetch"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"   #"DINFDECO"            
            severity: "4"
            overview: "VM DECO - instance id fetch"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_for_instanceid == "" 

        - set_fact:
            record_instanceid: "{{create_tr_output.record_id}}"
          when: record_for_instanceid == "" 

        - copy:
            content: '{{ record_instanceid|to_json }}'
            dest: record_for_instanceid.json
          delegate_to: localhost
          when: record_for_instanceid == "" 

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_instanceid }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Retried and Failed to Create VM DECO -for instance id fetch check TR"

