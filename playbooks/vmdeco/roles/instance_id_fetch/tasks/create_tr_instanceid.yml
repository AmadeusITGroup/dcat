---
   
    - name: "Handling Create TR- Win@proach for instance id fetch "
      block: 
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat fqdn_pre.json
          delegate_to: localhost
          register: result_po_bf_fqdn

        - name: save the Json data to a Variable as a Fact
          set_fact:
            fqdn_po_flag_pre: "{{ result_po_bf_fqdn.stdout[1:-1] }}" 
          delegate_to: localhost


        - meta: end_host
          when: fqdn_po_flag_pre == "F"     

        - name: Display the JSON file content
          shell: cat idem_instanceid.json
          delegate_to: localhost
          register: result_instanceid

        - name: save the Json data to a Variable as a Fact
          set_fact:
            instanceid_flag: "{{ result_instanceid.stdout[1:-1] }}" 
          delegate_to: localhost
          

        - meta: end_host
          when: instanceid_flag == "T"

        - name: VM_host list
          shell: cat host_list_instanceid.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""       

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - instance id fetch"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"   #"DINFDECO"            
            severity: "4"
            overview: "VM DECO - instance id fetch"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
       
        - set_fact:
            record_instanceid: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_instanceid|to_json }}'
            dest: record_for_instanceid.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_instanceid }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - instance id fetch"

    - name: "Handling Create TR- Win@proach for instance id fetch - Retry 1"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat fqdn_pre.json
