---
    - name: "Check entry for DECO server"
      throttle: 1
      block:
        # - name: Display the JSON file content
        #   shell: cat record_healthcheck.json
        #   delegate_to: localhost
        #   register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
        #   delegate_to: localhost

        # - meta: end_host
        #   when: record_id_healthcheck != ""      

        # - name: Display the JSON file content
        #   shell: cat failure_vm_bgp.yml
        #   delegate_to: localhost
        #   register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     vm_list: "{{ TR_result_healthcheck.stdout }}"
        #   delegate_to: localhost

        # - meta: end_host
        #   when: '"{{ inventory_hostname }}" in vm_list'
        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "Check entry for DECO server"
          azure_update_ref:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status
          delegate_to: localhost   
            
        - debug:
            var: idem_status

        - set_fact: 
            app: '{{idem_status.module_update.app_validation}}'

        - debug:
            var: app    

        - copy:
            content: '{{ app|to_json }}'
            dest: idem_app.json
          delegate_to: localhost
          when: app == "F"

        - copy:
            content: '{{ app|to_json }}'
            dest: idem_app_pre.json
          delegate_to: localhost
          when: app == "T"

        - set_fact: 
            network: '{{idem_status.module_update.network }}'

        - copy:
            content: '{{ network|to_json }}'
            dest: idem_network.json
          delegate_to: localhost
          when: network == "F"

        - copy:
            content: '{{ network|to_json }}'
            dest: idem_network_pre.json
          delegate_to: localhost
          when: network == "T"         

        - set_fact: 
            poweroff: '{{idem_status.module_update.vm_poweroff }}'

        - copy:
            content: '{{ poweroff|to_json }}'
            dest: idem_poweroff.json
          delegate_to: localhost
          when: poweroff == "F" 

        - copy:
            content: '{{ poweroff|to_json }}'
            dest: idem_poweroff_pre.json
          delegate_to: localhost
          when: poweroff == "T"                     

        - set_fact: 
            vmdelete: '{{idem_status.module_update.vm_delete}}'

        - copy:
            content: '{{ vmdelete|to_json }}'
            dest: idem_vmdelete.json
          delegate_to: localhost
          when: vmdelete == "F"

        - copy:
            content: '{{ vmdelete|to_json }}'
            dest: idem_vmdelete_pre.json
          delegate_to: localhost
          when: vmdelete == "T"                        

        - set_fact: 
            dns_check: '{{idem_status.module_update.dns}}'

        - copy:
            content: '{{ dns_check|to_json }}'
            dest: idem_dns_check.json
          delegate_to: localhost
          when: dns_check == "F" 

        - copy:
            content: '{{ dns_check|to_json }}'
            dest: idem_dns_check_pre.json
          delegate_to: localhost
          when: dns_check == "T"                      

        - set_fact: 
            nas_check: '{{ idem_status.module_update.nasstorage }}'

        - copy:
            content: '{{ nas_check|to_json }}'
            dest: idem_nas_check.json
          delegate_to: localhost 
          when: nas_check == "F" 

        - copy:
            content: '{{ nas_check|to_json }}'
            dest: idem_nas_check_pre.json
          delegate_to: localhost 
          when: nas_check == "T"


        # - set_fact: 
        #     san_check: '{{idem_status.module_update.sanstorage}}'

        # - copy:
        #     content: '{{ san_check|to_json }}'
        #     dest: idem_san_check.json
        #   delegate_to: localhost
        #   when: san_check == false  

        # - copy:
        #     content: '{{ san_check|to_json }}'
        #     dest: idem_san_check_pre.json
        #   delegate_to: localhost
        #   when: san_check == true                    

        - set_fact: 
            backup_remove: '{{idem_status.module_update.backup}}'

        - copy:
            content: '{{ backup_remove|to_json }}'
            dest: idem_backup.json
          delegate_to: localhost
          when: backup_remove == "F" 

        - copy:
            content: '{{ backup_remove|to_json }}'
            dest: idem_backup_pre.json
          delegate_to: localhost
          when: backup_remove == "T"                     

        - set_fact: 
            cmdb_check: '{{idem_status.module_update.cmdb}}'

        - copy:
            content: '{{ cmdb_check|to_json }}'
            dest: idem_cmdb_update.json
          delegate_to: localhost
          when: cmdb_check == "F"

        - copy:
            content: '{{ cmdb_check|to_json }}'
            dest: idem_cmdb_update_pre.json
          delegate_to: localhost
          when: cmdb_check == "T"                        

        - set_fact: 
            vm_poweroff_before_gp_check: '{{idem_status.module_update.vm_poweroff_before_gp}}'

        - copy:
            content: '{{ vm_poweroff_before_gp_check|to_json }}'
            dest: idem_vm_poweroff_before_gp_check.json
          delegate_to: localhost 
          when: vm_poweroff_before_gp_check == "F"   

        - copy:
            content: '{{ vm_poweroff_before_gp_check|to_json }}'
            dest: idem_vm_poweroff_before_gp_check_pre.json
          delegate_to: localhost 
          when: vm_poweroff_before_gp_check == "T"                    

        - set_fact: 
            vm_status_check_cmdb: '{{idem_status.module_update.vm_status_check_cmdb}}'
            
        - copy:
            content: '{{ vm_status_check_cmdb|to_json }}'
            dest: idem_vm_stat_cmdb.json
          delegate_to: localhost                                      
          when: vm_status_check_cmdb == "F"

        - copy:
            content: '{{ vm_status_check_cmdb|to_json }}'
            dest: idem_vm_stat_cmdb_pre.json
          delegate_to: localhost                                      
          when: vm_status_check_cmdb == "T"                     

        - set_fact: 
            cmdb_stat_check_agp: '{{idem_status.module_update.cmdb_stat_check_agp}}'
            
        - copy:
            content: '{{ cmdb_stat_check_agp|to_json }}'
            dest: idem_cmdb_stat_check_agp.json
          delegate_to: localhost                                      
          when: cmdb_stat_check_agp == "F"

        - copy:
            content: '{{ cmdb_stat_check_agp|to_json }}'
            dest: idem_cmdb_stat_check_agp_pre.json
          delegate_to: localhost
          when: cmdb_stat_check_agp == "T"

        - set_fact: 
            nas_validate: '{{idem_status.module_update.nas_validate}}'
            
        - copy:
            content: '{{ nas_validate|to_json }}'
            dest: idem_nas_validate.json
          delegate_to: localhost                                      
          when: nas_validate == "F"

        - copy:
            content: '{{ nas_validate|to_json }}'
            dest: idem_nas_validate_pre.json
          delegate_to: localhost                                      
          when: nas_validate == 'absent' or nas_validate == 'present' or nas_validate == 'dtsserver'         

        - set_fact: 
            fqdn: '{{idem_status.module_update.fqdn}}'
            
        - copy:
            content: '{{ fqdn|to_json }}'
            dest: fqdn.json
          delegate_to: localhost                                      
          when: fqdn == "F"

        - copy:
            content: '{{ fqdn|to_json }}'
            dest: fqdn_pre.json
          delegate_to: localhost                                      
          when: fqdn != "F"

        - set_fact: 
            filter_domain: '{{idem_status.module_update.filter_domain}}'
            
        - copy:
            content: '{{ filter_domain|to_json }}'
            dest: idem_filter_domain.json
          delegate_to: localhost                                      
          when: filter_domain == "F"

        - copy:
            content: '{{ filter_domain|to_json }}'
            dest: idem_filter_domain_pre.json
          delegate_to: localhost                                      
          when: filter_domain != "F"

        - set_fact: 
            instanceid: '{{idem_status.module_update.instanceid}}'
            
        - copy:
            content: '{{ instanceid|to_json }}'
            dest: idem_instanceid.json
          delegate_to: localhost                                      
          when: instanceid == "F"

        - copy:
            content: '{{ instanceid|to_json }}'
            dest: idem_instanceid_pre.json
          delegate_to: localhost                                      
          when: instanceid != "F" 

        - set_fact: 
            os: '{{idem_status.module_update.os}}'
            
        - copy:
            content: '{{ os|to_json }}'
            dest: idem_os.json
          delegate_to: localhost                                      
          when: os == "F"

        - copy:
            content: '{{ os|to_json }}'
            dest: idem_os_pre.json
          delegate_to: localhost                                      
          when: os != "F" 

        - set_fact: 
            os_fetch_status: '{{idem_status.module_update.os_fetch_status}}'
            
        - copy:
            content: '{{ os_fetch_status|to_json }}'
            dest: idem_os_fetch_status.json
          delegate_to: localhost                                      
          when: os_fetch_status == "F"

        - copy:
            content: '{{ os|to_json }}'
            dest: idem_os_pre.json
          delegate_to: localhost                                      
          when: os_fetch_status != "F"           

      rescue:
        - debug:
            msg: "Unable to reach state file for host {{inventory_hostname}} "

        - meta: end_host
             




