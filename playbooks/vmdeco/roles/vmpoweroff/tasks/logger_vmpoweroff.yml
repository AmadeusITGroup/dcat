################# LOGGER UPDATE TO TR ###################
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{record_vm_logger}}"
            message: "{{ log_vm }}"  #"{{final_vm_logger}}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"       
          delegate_to: localhost
          register: add_msg_output_log


      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check VM logger "            

    - name: clearing the files and json
      block:              

        - name: "Set header"
          shell: echo > vm_hostname_success.yml         
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > record_vm_bgp.json          
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > vm_bgp_final.json          
          run_once: true
          delegate_to: localhost          

              
        - name: "Set header"
          shell: echo > vm_tr_log.yml          
          run_once: true
          delegate_to: localhost                      

        - name: "Set header"
          shell: echo > final_vm_tr.yml          
          run_once: true
          delegate_to: localhost 

        - name: "Set header"
          shell: echo > vc_hostname_failure.yml          
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > vm_log.yml          
          run_once: true
          delegate_to: localhost

        - name: "Set header"
          shell: echo > output_vm_log.yml          
          run_once: true
          delegate_to: localhost       
       

        - name: "Set header"
          shell: echo > final_vm.yml          
          run_once: true
          delegate_to: localhost 
          
        - name: "Set header"
          shell: echo > vm_hostname_failure.yml          
          run_once: true
          delegate_to: localhost                                      
                    

      rescue:
        - debug:
            msg: " exception occured while clearing the files and json in logger,Rescued in logger_nas file"        

