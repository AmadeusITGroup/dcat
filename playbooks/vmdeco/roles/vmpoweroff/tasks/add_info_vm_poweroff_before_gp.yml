---
# - name: "This playbook is to update the implementation,validation result and close the TR for VM poweroff and rename"
#   hosts: localhost
#   gather_facts: no  
  # vars:
  #   file_vc_bgp_fail: "vc_hostname_failure.yml"
  #   file_vm_bgp_fail: "vm_hostname_failure.yml"
  #   json_vm_bgp: "record_vm_bgp.json"
  #   file_vm_bgp_suc: "vm_hostname_success.yml"
  #   file_vm_bgp_fin : "vm_bgp_final.yml"    
  #   before_graceperiod_flag: true
  #   graceperiod_flag: False
  #   vm_poweroff_before_gp_check: False 
  #   record_id_vm_bgp : ""
  #   app: true
  #   nas_validate: ""
        
  # tasks: 

    - name: "Handling TR record_id for implementation and validation result"
      block:

        - set_fact:
            file_vc_bgp_fail: "vc_hostname_failure.yml"
            file_vm_bgp_fail: "vm_hostname_failure.yml"
            json_vm_bgp: "record_vm_bgp.json"
            file_vm_bgp_suc: "vm_hostname_success.yml"
            file_vm_bgp_fin : "vm_bgp_final.yml"              

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""          
        
        - name: Display the JSON file content
          shell: cat record_vm_bgp.json
          delegate_to: localhost
          register: TR_result_rename  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_vm_bgp: "{{ TR_result_rename.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_vm_bgp == ""       

        - name: Display the JSON file content
          shell: cat idem_vm_poweroff_before_gp_check.json
          delegate_to: localhost
          register: result_app_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_vm_poweroff_before_gp_check_flag: "{{ result_app_cmdb.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_vm_poweroff_before_gp_check_flag == "T" 
                
 #############  success info gathering ##########################
        - name : handling error in the success block
          block:
            - name: Display the JSON file content
              shell: cat vm_hostname_success.yml
              delegate_to: localhost
              register: result_vm_bgp_suc

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_vm_bgp_suc_v: "{{ result_vm_bgp_suc.stdout }}" 
              delegate_to: localhost  
   
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for VM Poweroff & Rename (hostname_to_be_deleted) - VMs"
                form3: "***********************************************************************"
            - set_fact:
                content_vm_bgp_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_vm_bgp_suc_v }}" 
              when: result_vm_bgp_suc_v != ""


            - name: " Merge Success information to single final file "
              shell: echo "{{content_vm_bgp_suc}}" >> vm_bgp_final.yml                    
              delegate_to: localhost
              when: result_vm_bgp_suc_v != ""

          rescue:
            - debug:
                msg: "Rescue for no success file found and continue"      
  ####################### Failure info gathering ########################## 
        - name : handling error in the failure block
          block:          
            - name: Display the JSON file content
              shell: cat vm_hostname_failure.yml
              delegate_to: localhost
              register: result_vm_bgp_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_vm_bgp_fail_v: "{{ result_vm_bgp_fail.stdout }}" 
              delegate_to: localhost  
      
                          
            - name: " Merge Failure information to to single final file"
              shell: echo "{{ result_vm_bgp_fail_v }}" >> vm_bgp_fail_final.yml                    
              delegate_to: localhost
              when: result_vm_bgp_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

  ####################### Failure info gathering for Vcenter ########################## 
        - name : handling error in the failure block
          block:          
            - name: Display the JSON file content
              shell: cat vc_hostname_failure.yml
              delegate_to: localhost
              register: result_vc_bgp_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_vc_bgp_fail_v: "{{ result_vc_bgp_fail.stdout }}" 
              delegate_to: localhost  
   
            
            - name: " Merge Failure information to to single final file"
              shell: echo "{{ result_vc_bgp_fail_v }}" >> vm_bgp_fail_final.yml                   
              delegate_to: localhost
              when: result_vc_bgp_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

#####################  reading the final failure file ##########################
        - name : handling error in the reading the final failure file block
          block:
            - name: Display the JSON file content
              shell: cat vm_bgp_fail_final.yml
              delegate_to: localhost
              register: result_vm_bgp_rd

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_vm_bgp_rd_v: "{{ result_vm_bgp_rd.stdout }}" 
              delegate_to: localhost  
     
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the DECO results for VM Poweroff & Rename (hostname_to_be_deleted) - VMs"
                form3: "***********************************************************************"
            - set_fact:
                content_vm_bgp_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_vm_bgp_rd_v }}" 
              when: result_vm_bgp_rd_v != ""


            - name: " Merge failure information to single final file "
              shell: echo "{{content_vm_bgp_fail}}" >> vm_bgp_final.yml                    
              delegate_to: localhost
              when: result_vm_bgp_rd_v != ""

          rescue:
            - debug:
                msg: "Rescue the final failure file when not found and continue"                

##########################  merging both failure and success results ###########################

        - name: Display the JSON file content
          shell: cat vm_bgp_final.yml
          delegate_to: localhost
          register: result_vm_bgp_fin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_vm_bgp_fin_v: "{{ result_vm_bgp_fin.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost            


########################  closing implementation as failed  ############################################

        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "VM DECO: VM poweroff before grace period failure list and details with failed TR - {{ record_id_vm_bgp }}"
            tr_map: "{{ record_id_vm_bgp }}"
            assignee_group: "OSP000" #"DINFDECO"  
            ptr_logs: "{{ content_vm_bgp_fail }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"         
          register: ptr_out_vm_bgp
          until: '"Successfully" in ptr_out_vm_bgp.msg'
          retries: 3
          delay: 10          
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is not search("INFO")

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: filter owner group
          categorize_servers:
            path: vm_poweroff_validate_failure.txt
          delegate_to: localhost
          register: failure_servers_list
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is not search("INFO")

        - debug:
            var: failure_servers_list
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is not search("INFO")

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ item }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_out_vm_bgp.id }}"
            event: "VM DECO: VM Poweroff BGP failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          loop: "{{ failure_servers_list.Status.Failure }}"
          register: ptr_add
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is not search("INFO")
     

        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_vm_bgp }}"
            prob_id: "{{ ptr_out_vm_bgp.id }}"                   
          register: update_overview  
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is not search("INFO")            

        - name: Implementation Failed that is closing the implementation as failed
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: fail_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_vm_bgp }}" #"{{ record_id }}"
              text: "{{ result_vm_bgp_fin_v }}"
          register: fail_implementation  
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is not search("INFO")

########################  Pending Partial implementation  ############################################
        - name: Implementation partial that is closing the implementation as partial
          tr_partial_imp:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_vm_bgp }}"
          register: partial_implement
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is search("INFO")

  

# ########################  Close Partial implementation  ############################################
        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "VM DECO: VM poweroff before grace period failure list and details with partially implemented TR - {{ record_id_vm_bgp }}"
            tr_map: "{{ record_id_vm_bgp }}"
            assignee_group: "OSP000" #"DINFDECO"  
            ptr_logs: "{{ content_vm_bgp_fail }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"         
          register: ptr_out_vm_bgp
          until: '"Successfully" in ptr_out_vm_bgp.msg'
          retries: 3
          delay: 10          
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is search("INFO")

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: filter owner group
          categorize_servers:
            path: vm_poweroff_validate_failure.txt
          delegate_to: localhost
          register: failure_servers_list
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is search("INFO")

        - debug:
            var: failure_servers_list
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is search("INFO")

        - name: "Send data to azure table"
          send_ptr_info_to_azure:
            ci: "{{ item }}"
            cr: "{{ cr }}"
            event_number: "{{ ptr_out_vm_bgp.id }}"
            event: "VM DECO: VM Poweroff BGP failure"
            event_status: "open"
            created_on: "{{ time }}"
            last_update: "{{ time }}"
            connection_string: "{{ private_endpoint_connection_string }}" 
          loop: "{{ failure_servers_list.Status.Failure }}"
          register: ptr_add
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is search("INFO")
                   

        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_vm_bgp }}"
            prob_id: "{{ ptr_out_vm_bgp.id }}"                   
          register: update_overview  
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is search("INFO") 

        - name: Implementation partial that is closing the implementation as partial
          tr_partial_close:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_vm_bgp }}"
            closing_comment: "{{ result_vm_bgp_fin_v }}"
          register: close_partial_implement
          when: result_vm_bgp_fin_v is search("ERROR") and result_vm_bgp_fin_v is search("INFO")            


############################# closing implementation as success ####################            
        - name: END Implementation that is closing the implementation as success
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: end_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
                task_id: "{{ record_id_vm_bgp }}" #"{{ record_id }}"
                text: "{{ result_vm_bgp_fin_v }}"
          register: end_implementation
          when: result_vm_bgp_fin_v is not search("ERROR") and result_vm_bgp_fin_v is search("INFO")
 

        - name: start Validate Implementation for closing the success TR
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: validate
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_vm_bgp }}" #"{{ record_id }}"
              text: "{{ result_vm_bgp_fin_v }}"
          register: validation
          when: result_vm_bgp_fin_v is not search("ERROR") and result_vm_bgp_fin_v is search("INFO") 

        
      rescue:
        - debug:
            msg: "Exception occurred so rescued the main tr result block for VM poweroff and rename task"





                           
        
            
             