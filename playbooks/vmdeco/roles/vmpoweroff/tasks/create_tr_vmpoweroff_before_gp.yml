    - name: "Handling Start Implementation- Win@proach "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""

        - name: Display the JSON file content
          shell: cat record_vm_bgp.json
          delegate_to: localhost
          register: TR_result_rename  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_vm_bgp: "{{ TR_result_rename.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_vm_bgp == ""             

        - name: Sleep for 62 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 62
          delegate_to: localhost          

        - name: Start Implementation for VM poweroff and rename before graceperiod task
          winaproach:
            system: prod
            type: task_record
            operation: start_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_vm_bgp }}"
          register: start_implementation
          delegate_to: localhost
         
    
      rescue:
        - name: output in the rescue block for VM poweroff and rename before graceperiod task
          debug:
            msg: "Failed to Start Implementation on VM DECO - VM poweroff and rename TR :'{{ record_id_vm_bgp }}'"
