    - name: "Handling Create TR- Win@proach  for VM poweroff and rename before graceperiod task"
      block: 

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat idem_nas_validate_pre.json
          delegate_to: localhost
          register: result_nas_poweroff

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_vm_poweroff_before_gp_check_nas_flag: "{{ result_nas_poweroff.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_vm_poweroff_before_gp_check_nas_flag == "F"          

        - name: Display the JSON file content
          shell: cat idem_vm_poweroff_before_gp_check.json
          delegate_to: localhost
          register: result_app_cmdb

        - name: save the Json data to a Variable as a Fact
          set_fact:
            idem_vm_poweroff_before_gp_check_flag: "{{ result_app_cmdb.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: idem_vm_poweroff_before_gp_check_flag == "T"             

        - name: VM_host list
          shell: cat host_list_poweroff_bgp.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost                       
    
        - name: TR creation for VM poweroff and rename before graceperiod task
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "vm deco shutdown and rename"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: VM DECO : VM poweroff and rename"
            ci: "{{ vm_hostlist }}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id_vm_bgp
          delegate_to: localhost
        

        - set_fact:
            record_id_vm_bgp: "{{ticket_id_vm_bgp.id.ticketId}}"
  

        - copy:
            content: '{{ record_id_vm_bgp|to_json }}'
            dest: record_vm_bgp.json
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - Vm poweroff and rename TR"

