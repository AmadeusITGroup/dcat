    - name: "Handling node list, TR and retention days"
      block:

        - set_fact:
            vm_success: "vm_hostname_success.yml"
            vm_failure: "vm_hostname_failure.yml"
            file_failure_vc: "vc_hostname_failure.yml" 
            final_vm: "final_vm.yml"
            vm_logging: "vm_log.yml"

        - name: Handle the error if success file empty in vm poweroff
          block:

            - name: Display the JSON file content
              shell: cat record_vm_bgp.json
              delegate_to: localhost
              register: TR_result_rename  

            - name: save the Json data to a Variable as a Fact
              set_fact:
                record_id_vm_bgp: "{{ TR_result_rename.stdout[1:-1] }}"
              delegate_to: localhost         

            - meta: end_host
              when: record_id_vm_bgp == ""           

            - name: VM_host list
              shell: cat vm_hostname_success.yml
              delegate_to: localhost
              register: success_vm             

            - name: save the vm list to a Variable as a Fact
              set_fact:
                vm_success: "{{ success_vm.stdout }}" 
              delegate_to: localhost

            - name: "success log list"
              shell: echo '{{vm_success}}' >> final_vm.yml                     
              delegate_to: localhost
              when: vm_success != ""

          rescue:
            - debug:
                msg: "exception occurred as success  file is empty in vm poweroff logging"

        - name: Handle the error if failure vm file empty in vm poweroff
          block:
            - name: VM_host list
              shell: cat vm_hostname_failure.yml
              delegate_to: localhost
              register: failure_vm             

            - name: save the vm list to a Variable as a Fact
              set_fact:
                vm_failure: "{{ failure_vm.stdout }}" 
              delegate_to: localhost

            - name: "success log list"
              shell: echo '{{vm_failure}}' >> final_vm.yml                     
              delegate_to: localhost
              when: vm_failure != "" 

          rescue:
            - debug:
                msg: "exception occurred as failure vm file is empty in vm poweroff"

        - name: Handle the error if failure vc file empty in vm poweroff
          block:
            - name: VM_host list
              shell: cat vc_hostname_failure.yml
              delegate_to: localhost
              register: failure_vc             

            - name: save the vm list to a Variable as a Fact
              set_fact:
                vc_failure: "{{ failure_vc.stdout }}" 
              delegate_to: localhost

            - name: "success log list"
              shell: echo '{{vc_failure}}' >> final_vm.yml                     
              delegate_to: localhost
              when: vc_failure != "" 

          rescue:
            - debug:
                msg: "exception occurred as failure vm file is empty in vm poweroff"

        - name: VM_host list
          shell: cat final_vm.yml
          delegate_to: localhost
          register: vmpoweroff_final             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            final_vmpoweroff: "{{ vmpoweroff_final.stdout_lines }}"
          delegate_to: localhost       


        - name: Find uniqe entries
          shell: cat final_vm.yml | sort -u | uniq -u | grep -v -e '^[[:space:]]*$' > vm_log.yml
          delegate_to: localhost 

      rescue:
        - debug:
            msg: "Exception in vm poweroff logging module "          

                  

                                
                

      
        

        
              

                        
    
    
   
    

    
        
    
        
    