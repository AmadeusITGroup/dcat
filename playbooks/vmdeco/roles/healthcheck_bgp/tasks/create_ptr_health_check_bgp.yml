    - name: "Handling PTR record_id for vm deco"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck == ""       

        - name: Display the JSON file content
          shell: cat check_remedy.yml
          delegate_to: localhost
          register: result_check_remedy

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_remedy: "{{ result_check_remedy.stdout }}" 
          delegate_to: localhost    


        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the BMC remedy(CMDB) error which needs support"
            form3: "***********************************************************************"
        - set_fact:
            content_check_remedy: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_remedy }}"
          when: check_remedy != ""

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost                    

        - name: Create PTR
          problem_tr:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "VM DECO: Service health check BMC remedy(CMDB) referring to failed TR - {{ record_id_healthcheck }}"
            tr_map: "{{ record_id_healthcheck }}"
            assignee_group: "DINFDECO"  
            ptr_logs: "{{ content_check_remedy }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"         
          register: ptr_check_remedy
          until: '"Successfully" in ptr_check_remedy.msg'
          retries: 3
          delay: 10
          when: check_remedy != ""

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
            time: "{{tstamp.stdout}}"

        # - name: "Send data to azure table"
        #   send_ptr_info_to_azure:
        #     ci: "{{ inventory_hostname }}"
        #     cr: "{{ cr }}"
        #     event_number: "{{ ptr_check_remedy.id }}"
        #     event: "VM DECO: Service health check BMC remedy(CMDB) failure"
        #     event_status: "open"
        #     created_on: "{{ time }}"
        #     last_update: "{{ time }}"
        #     connection_string: "{{ private_endpoint_connection_string }}"  
        #   register: ptr_add
        #   when: check_remedy != ""

        - name: Update TR with PTR
          tr_overview:
            win_url: "WIN@PROACH_URL"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_healthcheck }}"
            prob_id: "{{ ptr_check_remedy.id }}"                   
          register: update_overview  
          when: check_remedy != "" 

      rescue:
        - debug:
            msg: "Exception occurred PTR service health check - BMC remedy(CMDB)"                               
############################################################################################################

