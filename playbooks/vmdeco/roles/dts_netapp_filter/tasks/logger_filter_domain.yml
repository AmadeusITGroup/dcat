---  
    - name: "Logger and Create/Update TR- Win@proach for filter domain dts "
      block:

        - name: Display the JSON file content
          shell: cat record_for_filter_domain.json
          delegate_to: localhost
          register: TR_result_filter_domain 

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_filter_domain: "{{ TR_result_filter_domain.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_filter_domain == ""     

        - name: VM_host list
          shell: cat filter_domain_final.yml
          delegate_to: localhost
          register: filter_domain_result              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            filter_domain_v: "{{ filter_domain_result.stdout }}" 
          delegate_to: localhost
          

        - meta: end_host
          when: filter_domain_v == ""

        - name: VM_host list
          shell: cat record_vm_logger.json
          delegate_to: localhost
          register: record_result              

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id: "{{ record_result.stdout }}" 
          delegate_to: localhost          
           

################# CREATE TR ################
        - name: "Custom module [CREATE TR] for logger"
          create_tr:
            record_type: "TR"
            title: "VM DECO -LOGGER BEFORE GRACE PERIOD"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"
            severity: "4"
            overview: "VM DECO -LOGGER BEFORE GRACE PERIOD"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_id == ""
          

        - set_fact:
            record_vm_logger: "{{create_tr_output.record_id}}"
          when: record_id == ""  
           

        - copy:
            content: '{{ record_vm_logger|to_json }}'
            dest: record_vm_logger.json
          delegate_to: localhost                   
          when: record_id == ""            
            

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_vm_logger }}"
          register: add_document
          delegate_to: localhost


################# LOGGER ###################
        - name: VM_host list
          shell: cat record_vm_logger.json
          delegate_to: localhost
          register: vm_result             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            record_vm_logger: "{{ vm_result.stdout[1:-1] }}"  
          delegate_to: localhost

        - name: logger data
          shell: cat filter_domain_final.yml
          delegate_to: localhost
          register: filter_domain_log 
                    

        - name: save the vm list to a Variable as a Fact
          set_fact:
            log_filter_domain: "{{filter_domain_log.stdout }}" 
          delegate_to: localhost


################# LOGGER UPDATE TO TR ###################
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{record_vm_logger}}"
            message: "{{ log_filter_domain }}"       #"{{final_app_logger}}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"        
          delegate_to: localhost
          register: add_msg_output_log_filter_domain


      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check filter_domain logger "