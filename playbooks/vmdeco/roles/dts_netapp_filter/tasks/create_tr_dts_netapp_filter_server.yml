---
   
    - name: "Handling Create TR- Win@proach for dts netapp filter hosts "
      block: 
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: Display the JSON file content
          shell: cat idem_instanceid_pre.json
          delegate_to: localhost
          register: result_po_bf_instanceid

        - name: save the Json data to a Variable as a Fact
          set_fact:
            instanceid_po_flag_pre: "{{ result_po_bf_instanceid.stdout[1:-1] }}" 
          delegate_to: localhost

        - meta: end_host
          when: instanceid_po_flag_pre == "F"     

        - name: Display the JSON file content
          shell: cat idem_filter_domain.json
          delegate_to: localhost
          register: result_filter_domain

        - name: save the Json data to a Variable as a Fact
          set_fact:
            filter_domain_flag: "{{ result_filter_domain.stdout[1:-1] }}" 
          delegate_to: localhost
          

        - meta: end_host
          when: filter_domain_flag == "T"

        - name: VM_host list
          shell: cat host_list_filter_domain.yml
          delegate_to: localhost
          register: hostlist_vm              

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm_hostlist: "{{ hostlist_vm.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: vm_hostlist == ""       

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: VM DECO - Filter domain for dts and mucmspdom"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"   #"DINFDECO"            
            severity: "4"
            overview: "VM DECO - Filter domain for dts and mucmspdom"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
       
        - set_fact:
            record_filter_domain: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_filter_domain|to_json }}'
            dest: record_for_filter_domain.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "WIN@PROACH_URL"
            task_id: "{{ record_filter_domain }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create VM DECO - for dts netapp filter hosts"

    - name: "Handling Create TR- Win@proach for dts netapp filter hosts - Retry 1"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
