---
        - name: vcenter details for filtering the dts and mucmspdom domain
          throttle: 1
          block:  

            - set_fact:
                file_filter_domain: "filter_domain_hosts.yml"
                file_filter_domain_fail: "filter_domain_hosts_fail.yml"

            - name: Display the JSON file content
              shell: cat record_for_filter_domain.json
              delegate_to: localhost
              register: TR_result_filter_domain 

            - name: save the Json data to a Variable as a Fact
              set_fact:
                record_id_filter_domain: "{{ TR_result_filter_domain.stdout[1:-1] }}"
              delegate_to: localhost         

            - meta: end_host
              when: record_id_filter_domain == ""                

            - name: "Test custom module fetch vcenter details before grace period"
              fetch_vcentre:
                vmname: '{{ inventory_hostname }}'     
                synergon_api: '{{ synergon_url }}'
                instance_id_vm: '{{ instanceid }}'
              delegate_to: localhost
              register: vcenter_output                     
              until: '"Successfully" in vcenter_output.msg or "Unable to find" in vcenter_output.msg or "duplicate entries" in vcenter_output.msg'
              retries: 3
              delay: 30

            - debug:
                var: vcenter_output

            - name: Get timestamp from the system
              shell: "date +%Y-%m-%d/%H:%M"
              delegate_to: localhost
              register: tstamp  
                          
            - set_fact:
                time: "{{tstamp.stdout}}" 

            - name: "VM host list failure to file before grace period"
              shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{vcenter_output.msg}}" >> {{file_filter_domain_fail}}                    
              delegate_to: localhost 
              when: '"Successfully" not in vcenter_output.msg'

            - name: "Write Failure host to file"
              shell: echo "{{ inventory_hostname }} Failure" >> vcenter_failure_vm.txt              
              delegate_to: localhost   
              when: '"Successfully" not in vcenter_output.msg'

            - meta: end_host
              when: '"Successfully" not in vcenter_output.msg' 

            - set_fact:
                v_center_gp_before: "{{vcenter_output.vcenter}}" 
                v_center_msg: "{{vcenter_output.msg}}"

            - name: Get timestamp from the system
              shell: "date +%Y-%m-%d/%H:%M"
              delegate_to: localhost
              register: tstamp  
                      
            - set_fact:
                time: "{{tstamp.stdout}}" 

            - name: Display the JSON file content
              shell: cat private_endpoint_connection_string.yml
              delegate_to: localhost
              register: result_private_endpoint_connection_string
        
            - name: save the Json data to a Variable as a Fact
              set_fact:
                private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
              delegate_to: localhost

            - name: "update entry for DECO server for filter domain state to MUCMSPDOM"
              azure_update_module_vals:
                connection_string: "{{ private_endpoint_connection_string }}"
                hostname: "{{ inventory_hostname }}"
                module_name: "filter_domain"
                status: "MUCMSPDOM"           
              register: update_status
              delegate_to: localhost
              when: v_center_gp_before is defined and v_center_gp_before is not search("mucvcdts02|mucvcdts01")

            - name: "VM host list info"
              shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Server belongs to mucmspdom domain." >> {{file_filter_domain}}                    
              delegate_to: localhost 
              when: v_center_gp_before is defined and v_center_gp_before is not search("mucvcdts02|mucvcdts01")

            - name: "update entry for DECO server for filter domain state to DTS"
              azure_update_module_vals:
                connection_string: "{{ private_endpoint_connection_string }}"
                hostname: "{{ inventory_hostname }}"
                module_name: "filter_domain"
                status: "DTS"          
              register: update_status
              delegate_to: localhost
              when: v_center_gp_before is defined and v_center_gp_before is search("mucvcdts02|mucvcdts01")

            - name: "update entry for DECO server for nas validate state file for dts server "
              azure_update_module_vals:
                connection_string: "{{ private_endpoint_connection_string }}"
                hostname: "{{ inventory_hostname }}"
                module_name: "nas_validate"
                status: "dtsserver"          
              register: update_status
              delegate_to: localhost
              when: v_center_gp_before is defined and v_center_gp_before is search("mucvcdts02|mucvcdts01")                                             

            - name: "VM host list"
              shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Server belongs to dts domain." >> {{file_filter_domain}}                    
              delegate_to: localhost 
              when: v_center_gp_before is defined and v_center_gp_before is search("mucvcdts02|mucvcdts01")


          rescue: 
            - name: when after grace period module throws error the below task should execute
              debug:
                msg: "Exception occurred while fetching the vcenter name for filtering the dts and mucmspdom domain hosts"

            - name: Get timestamp from the system
              shell: "date +%Y-%m-%d/%H:%M"
              delegate_to: localhost
              register: tstamp  
                  
            - set_fact:
                time: "{{tstamp.stdout}}"    

            - name: "Write Failure host to file"
              shell: echo "{{ inventory_hostname }} Failure" >> vcenter_failure_vm.txt              
              delegate_to: localhost                          

            - name: "VM host list"
              shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Unable to fetch vcentre name for filtering the domain kindly check."  >> {{file_filter_domain_fail}}                    
              delegate_to: localhost    
