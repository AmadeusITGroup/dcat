- name: Initialize empty list for all blades
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Set empty list for all blades
      set_fact:
        all_blades_combined: []

- name: "cmdb duplicate check"
  # hosts: "{{ target_hosts }}"
  hosts: "enclosures"
  gather_facts: no
  vars:
    synergon_url: "{{ hostvars['localhost']['config_data']['synergon_url'] }}"
  tasks:

    - name: Display the JSON file content
      shell: cat private_endpoint_connection_string.yml
      delegate_to: localhost
      register: result_private_endpoint_connection_string

    - name: save the Json data to a Variable as a Fact
      set_fact:
        private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
      delegate_to: localhost      
            
    - name: Try fetch blades from Azure for this enclosure (primary)
      get_servers_by_enclosure:
        connection_string: "{{ private_endpoint_connection_string }}"
        enclosure_name: "{{ inventory_hostname }}"
      delegate_to: localhost
      register: azure_enclosure_fetch
      failed_when: false

    - name: Debug Azure fetch result
      debug:
        var: azure_enclosure_fetch

    - name: Decide whether to use Azure (non-empty hostnames excluding the enclosure, and no module failure)
      set_fact:
        use_azure: "{{ (azure_enclosure_fetch is defined)
                       and (azure_enclosure_fetch.failed is not defined or azure_enclosure_fetch.failed == false)
                       and (azure_enclosure_fetch.hostnames is defined)
                       and ((azure_enclosure_fetch.hostnames | reject('equalto', inventory_hostname) | list | length) > 0) }}"

    - name: Debug use_azure flag
      debug:
        var: use_azure

    - name: Set enclosure_blades from Azure (exclude enclosure entry)
      set_fact:
        enclosure_blades: "{{ azure_enclosure_fetch.hostnames | reject('equalto', inventory_hostname) | list }}"
      delegate_to: localhost
      when: use_azure

    - name: Debug enclosure_blades (Azure path - pre CMDB check)
      debug:
        var: enclosure_blades
      when: use_azure

    - name: Check CMDB update for each blade (Azure path only)
      azure_update_ref_esxi:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{ item }}"
      loop: "{{ enclosure_blades }}"
      loop_control:
        label: "{{ item }} ({{ inventory_hostname }})"
      register: cmdb_check_results
      delegate_to: localhost
      when:
        - use_azure
        - enclosure_blades is defined
        - enclosure_blades | length > 0

    - name: Debug cmdb_check_results (Azure path)
      debug:
        var: cmdb_check_results
      when: use_azure

    - name: Filter Azure blades where CMDB update == "F"
      set_fact:
        enclosure_blades: "{{ cmdb_check_results.results
                              | selectattr('module_update.cmdb_update', 'equalto', 'F')
                              | map(attribute='item')
                              | list }}"
      delegate_to: localhost
      when:
        - use_azure
        - cmdb_check_results is defined
        - cmdb_check_results.results is defined

    - name: Debug enclosure_blades (Azure path - post CMDB check)
      debug:
        var: enclosure_blades
      when: use_azure





# ===================================================================================================================






    - name: "Check entry for DECO server for filter hostlist for cmdb duplicate list"
      azure_update_ref_esxi:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{inventory_hostname}}"
      register: idem_status 
      delegate_to: localhost
      when:
        - not use_azure

    - name: Save CMDB duplicate check flag
      set_fact: 
        cmdb_dup_check: "{{ idem_status.module_update.cmdb_dup_check }}"
      when:
        - not use_azure    

    - name: Fetch ESXi details
      enclosure_synergon_data_fetch:
        enclosure: "{{ inventory_hostname }}"
        synergon_api: "{{ synergon_url }}"
      delegate_to: localhost
      register: esxi_data
      # when: cmdb_dup_check == "T"    
      when:
        - not use_azure        # ensures mutual exclusivity
        - cmdb_dup_check == "T"              

    - name: Debug esxi_data (Synergon path)
      debug:
        var: esxi_data
      when:
        - not use_azure
        - cmdb_dup_check == "T"

    - name: Store blades in hostvars (Synergon path)
      set_fact:
        enclosure_blades: "{{ esxi_data.esxi_details | map(attribute='ci_name') | list }}"
      when:
        - not use_azure        # ensures mutual exclusivity
        - cmdb_dup_check == "T"
        - esxi_data.esxi_details is defined

    - name: Debug enclosure_blades (Synergon path final)
      debug:
        var: enclosure_blades
      when:
        - not use_azure
        - cmdb_dup_check == "T"


