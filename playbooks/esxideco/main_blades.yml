- name: Aggregate and add blades to group
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Aggregate all blades globally
      set_fact:
        all_blades_combined: "{{ all_blades_combined + hostvars[item]['enclosure_blades'] }}"
      run_once: true
      loop: "{{ groups['enclosures'] }}"
      when: hostvars[item]['enclosure_blades'] is defined

    - name: Debug - Show all fetched Blades
      debug:
        var: all_blades_combined
      run_once: true

    - name: Add blades to dynamic host group
      add_host:
        name: "{{ item }}"
        groups: blades
      loop: "{{ all_blades_combined }}"
      run_once: true


    - name: "Check entry for DECO server"
      final_create_cr:
        ci: "{{ item }}"
        cr: "{{ cr }}"
        connection_string: "{{ private_endpoint_connection_string }}"
      register: create_cr_update
      delegate_to: localhost
      loop: "{{ groups['blades'] }}"
      when: groups['blades'] is defined and (groups['blades'] | length) > 0


    - debug:
        var: create_cr_update
      when: groups['blades'] is defined and (groups['blades'] | length) > 0



