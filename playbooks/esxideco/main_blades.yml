- name: Refresh inventory after adding blades
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Refresh inventory
      meta: refresh_inventory
      run_once: true

- name: Debug - Blades Group After Refresh
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Debug - Blades Group
      debug:
        msg: "Blades in blades group: {{ hostvars | dict2items | selectattr('value.group_names', 'search', 'blades') | map(attribute='key') | list }}"
      run_once: true

    - name: Set target_hosts as blades
      set_fact:
        target_hosts: "blades"


