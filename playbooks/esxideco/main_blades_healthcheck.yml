- name: "Update TR for healthcheck ESXi"
  hosts: localhost
  gather_facts: no
  vars:   
    win_category: "{{ hostvars['localhost']['config_data']['winaproach_category'] }}"
    ptr_sys: "{{ hostvars['localhost']['config_data']['ptr_system'] }}"
  tasks:
    - name: Set local variables from config_data
      set_fact:
        ptr_sys: "{{ config_data.ptr_system }}"
        win_category: "{{ config_data.winaproach_category }}"
        
    - name: Healthcheck create PTR
      ansible.builtin.import_role:
        name: enclosure_esxi_healthcheck
        tasks_from: create_ptr_health_check_blades.yml

    - name: Healthcheck add info
      ansible.builtin.import_role:
        name: enclosure_esxi_healthcheck
        tasks_from: add_info_healthcheck_blades.yml

