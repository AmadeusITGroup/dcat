---
 
    - name: "Handling Create TR- Win@proach for Storage info fetch "
      block: 
        # - name: Display the JSON file content
        #   shell: cat record_healthcheck.json
        #   delegate_to: localhost
        #   register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
        #   delegate_to: localhost

        # - meta: end_host
        #   when: record_id_healthcheck != ""      

        - name: esxi_host list
          shell: cat host_list_storage_info_fetch.yml
          delegate_to: localhost
          register: hostlist_esxi             

        - name: save the esxi list to a Variable as a Fact
          set_fact:
            esxi_hostlist: "{{ hostlist_esxi.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: esxi_hostlist == ""       

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: ESXI RACK DECO - Storage Cleanup"
            assignee_name: "DecoP112686"
            assignee_group: "OSX04SMG"   #"DINFDECO"            
            severity: "4"
            overview: "esxi DECO - Storage info fetch"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
       
        - set_fact:
            record_storage_info_fetch: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_storage_info_fetch|to_json }}'
            dest: record_for_storage_info_fetch.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "{{win_url}}"
            task_id: "{{ record_storage_info_fetch }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create esxi DECO - for Storage info fetch"

    - name: "Handling Create TR- Win@proach forStorage info fetch- Retry 1"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""      

        - name: esxi_host list
          shell: cat host_list_storage_info_fetch.yml
          delegate_to: localhost
          register: hostlist_esxi              

        - name: save the esxi list to a Variable as a Fact
          set_fact:
            esxi_hostlist: "{{ hostlist_esxi.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: esxi_hostlist == ""

        - name: Display the JSON file content
          shell: cat record_for_storage_info_fetch.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_for_storage_info_fetch: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost          


        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_for_storage_info_fetch == "" 

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: ESXI RACK DECO - Storage Cleanup"
            assignee_name: "DecoP112686"
            assignee_group: "OSX04SMG"   #"DINFDECO"            
            severity: "4"
            overview: "esxi DECO - Storage info fetch"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_for_storage_info_fetch == "" 

        - set_fact:
            record_storage_info_fetch: "{{create_tr_output.record_id}}"
          when: record_for_storage_info_fetch == "" 

        - copy:
            content: '{{ record_storage_info_fetch|to_json }}'
            dest: record_for_storage_info_fetch.json
          delegate_to: localhost
          when: create_tr_output is defined

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "{{win_url}}"
            task_id: "{{ record_storage_info_fetch }}"
          register: add_document
          delegate_to: localhost
          when: record_for_storage_info_fetch == "" 

      rescue:
        - debug:
            msg: "Retried and Failed to Create esxi DECO -for Storage info fetch TR"

