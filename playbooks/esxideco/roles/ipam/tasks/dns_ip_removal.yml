---
    - name: "IPAM cleanup "
      throttle: 1
      block:

        - name: Display the JSON file content
          shell: cat record_dns.json
          delegate_to: localhost
          register: TR_dns_esxi

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_dns_esxi: "{{ TR_dns_esxi.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_dns_esxi== ""   

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "Check entry for DECO server from Azure"
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"                        
          register: idem_status
          delegate_to: localhost    

        # - debug:
        #     var: idem_status

        - set_fact: 
            ilo_reset: '{{idem_status.module_update.ilo_reset}}'  

        - set_fact: 
            ipam_cleanup: '{{idem_status.module_update.ipam_cleanup}}'    

        - name: End play for this host
          meta: end_host
          when: ilo_reset != "T" or ipam_cleanup != "F"

        - name: Set required facts
          set_fact:
            nios_provider:
              host: "{{ dns_grid }}"
              # dns_network_view: "{{ dns_network_view }}"
              username: "{{ infoblox_username }}"
              password: "{{ infoblox_password }}"
            hostname: "{{ inventory_hostname }}"  # Change this to target_blade
            dns_success: "esxi_dns_success.yml"
            win_dns_success: "esxi_dns_win_success.yml"
            dns_failed: "esxi_dns_failure.yml"
            graceperiod_flag: True
            dns_check: false
            network: true

        - name: "Host FQDN - Output"
          set_fact:
            fqdn: "{{ idem_status.module_update.fqdn_info}}"

        - name: Fetch ESXi details
          enclosure_synergon_data_fetch:
            enclosure: "{{ inventory_hostname }}"
            synergon_api: "{{ synergon_url }}"
          delegate_to: localhost
          register: esxi_data


        - name: Set fact for extracted ESXi IP
          set_fact:
            ip_address: "{{ esxi_data.esxi_details[0].bladeIp }}"
          when: 
            - esxi_data.esxi_details is defined
            - esxi_data.esxi_details | length > 0      
            
        # - set_fact:
        #     dns_os_detail_result: 'Linux'
        
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}" 

        - name: Release the IP
          # iprelease:
          iprelease_esxi:
            host: "{{ inventory_hostname | lower }}"
            ipaddress: "{{ ip_address }}"
            ipam: "{{ ipam_grid }}"
            username: "{{ infoblox_username }}"
            password: "{{ infoblox_password }}"
            view: "{{ ipam_network_view }}"
          register: iprelease_status
          delegate_to: localhost

        - name: Log Failure - IP release failed
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, {{ iprelease_status.Status }}" >> {{ dns_failed }}
          delegate_to: localhost
          when:
            - iprelease_status.Status is defined
            - iprelease_status.Status is search("ERROR")

        - meta: end_host
          when:
            - iprelease_status.Status is defined
            - iprelease_status.Status is search("ERROR")

        - name: Log Success - IP release status
          shell: |
            echo "{{ hostname }}, {{ time }}, {{ iprelease_status.Status }}" >> {{ dns_success }}
          delegate_to: localhost
          when:
            - iprelease_status.Status is defined
            - iprelease_status.Status is not search("ERROR")

        - name: get associated interfaces for the host from CMDB
          get_associated_ifaces:
            conn_str: "{{ private_endpoint_connection_string }}"
            servername: "{{ inventory_hostname | lower }}"
            ipaddr: "{{ ip_address }}"
            cmdb_server: "{{ cmdb_url_update }}"
            username: "{{ emdb_username }}"
            password: "{{ emdb_password }}"
          register: ifaces_results
          delegate_to: localhost

        - name: Release the interfaces IP
          ifaces_iprelease_esxi:
            host: "{{ inventory_hostname | lower }}"
            ipaddress: "{{ item }}"
            ipam: "{{ ipam_grid }}"
            username: "{{ infoblox_username }}"
            password: "{{ infoblox_password }}"
            view: "{{ ipam_network_view }}"
          with_items: 
             - "{{ ifaces_results.ifaces }}"
          register: ifaces_release
          delegate_to: localhost
          when: '"No interfaces found" not in ifaces_results.ifaces and "No RelLeadInstanceId found" not in ifaces_results.ifaces'

          
        - name: Log Interface IP Release Success
          shell: echo "{{ hostname }}, {{ time }}, INTERFACES CLEANUP INFO {{ ifaces_release.results | selectattr('Status', 'defined') | map(attribute='Status') | list }}" >> {{ dns_success }}
          delegate_to: localhost
          when:
            - '"No interfaces found" not in ifaces_results.ifaces and "No RelLeadInstanceId found" not in ifaces_results.ifaces'
            - (ifaces_release.results | selectattr('Status', 'defined') | map(attribute='Status') | list | join(' ')) is not search("ERROR")

        - name: Log Interface IP Release Failure
          shell: echo "{{ hostname }}, {{ time }}, [ERROR], INTERFACES CLEANUP INFO {{ ifaces_release.results | selectattr('Status', 'defined') | map(attribute='Status') | list }}" >> {{ dns_failed }}
          delegate_to: localhost
          when:
            - '"No interfaces found" not in ifaces_results.ifaces and "No RelLeadInstanceId found" not in ifaces_results.ifaces'
            - (ifaces_release.results | selectattr('Status', 'defined') | map(attribute='Status') | list | join(' ')) is search("ERROR")

        - meta: end_host
          when:
            - '"No interfaces found" not in ifaces_results.ifaces and "No RelLeadInstanceId found" not in ifaces_results.ifaces'
            - (ifaces_release.results | selectattr('Status', 'defined') | map(attribute='Status') | list | join(' ')) is search("ERROR")
            

        - name: Check IPAM host record exist in infoblox
          set_fact:
            host_record: "{{ lookup('nios', 'record:host', filter={'name': fqdn}, provider=nios_provider) }}"
          delegate_to: localhost
          tags: normal
         
        - name: Check IPAM ptr record exist in infoblox
          set_fact:
            ptr_record: "{{ lookup('nios', 'record:ptr', filter={'ptrdname': fqdn}, provider=nios_provider) }}"
          delegate_to: localhost
          tags: normal     

        - name: Check IPAM A record exist in infoblox
          set_fact:
            a_record: "{{ lookup('nios', 'record:a', filter={'name': fqdn}, provider=nios_provider) }}"
          delegate_to: localhost
          tags: normal        

        - name: Log DNS Cleanup Success
          shell: echo "{{ hostname }}, {{ time }}, [INFO], DNS Records Not Available for Host {{ fqdn }}" >> {{ dns_success }}
          delegate_to: localhost
          when:
            - host_record | length < 1
            - ptr_record | length < 1
            - a_record | length < 1

        - name: Update module for IPAM Cleanup success
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "ipam_cleanup"
            status: "T"
          register: update_status
          delegate_to: localhost
          when:
            - host_record | length < 1
            - ptr_record | length < 1
            - a_record | length < 1

        - meta: end_host
          when:
            - host_record | length < 1
            - ptr_record | length < 1
            - a_record | length < 1

        - set_fact:
            host_delete_ok: false
            ptr_delete_ok: false
            a_delete_ok: false

        - name: “No host record to delete → mark success”
          set_fact:
            host_delete_ok: true
          when: host_record | length == 0

        - name: Delete host record
          ipam_record_removal_esxi:
            hostname: "{{ fqdn }}"
            ipam: "{{ dns_grid }}"
            username: "{{ infoblox_username }}"
            password: "{{ infoblox_password }}"
            dns_view: "{{ dns_network_view }}"
            record_type: host
          delegate_to: localhost
          register: host_removal
          when: host_record | length > 0     

        - name: Log Host Record Deletion Success
          shell: echo "{{ hostname }}, {{ time }}, [INFO], {{ host_removal.status }}" >> {{ dns_success }}
          delegate_to: localhost
          when:
            - host_record | length > 0
            - host_removal.status is search("record removed") or host_removal.status is search("record not available")

        - name: Log Host Record Deletion Failure
          shell: echo "{{ hostname }}, {{ time }}, [ERROR], {{ host_removal.status }}" >> {{ dns_failed }}
          delegate_to: localhost
          when:
            - host_record | length > 0
            - host_removal.status is search("record removal failed") or host_removal.status is search("Exception")

        # - set_fact:
        #     host_delete_ok: true
        #   when:
        #     - host_removal.status is search("record removed") or host_removal.status is search("record not available")
        #     - host_record | length > 0

        - name: “Host record deleted → mark success”
          set_fact:
            host_delete_ok: true
          when:
            - host_record | length > 0
            - host_removal is defined
            - "'status' in host_removal"
            - host_removal.status is search("record removed") or host_removal.status is search("record not available")

        - name: “No PTR record to delete → mark success”
          set_fact:
            ptr_delete_ok: true
          when: ptr_record | length == 0

        - name: Delete PTR record
          ipam_record_removal_esxi:
            hostname: "{{ fqdn }}"
            ipam: "{{ dns_grid }}"
            username: "{{ infoblox_username }}"
            password: "{{ infoblox_password }}"
            dns_view: "{{ dns_network_view }}"
            record_type: ptr
          delegate_to: localhost
          register: ptr_removal
          when: ptr_record | length > 0

        - name: Log PTR Record Deletion Success
          shell: echo "{{ hostname }}, {{ time }}, [INFO], {{ ptr_removal.status }}" >> {{ dns_success }}
          delegate_to: localhost
          when:
            - ptr_record | length > 0
            - ptr_removal.status is search("record removed") or ptr_removal.status is search("record not available")

        - name: Log PTR Record Deletion Failure
          shell: echo "{{ hostname }}, {{ time }}, [ERROR], {{ ptr_removal.status }}" >> {{ dns_failed }}
          delegate_to: localhost
          when:
            - ptr_record | length > 0
            - ptr_removal.status is search("record removal failed") or ptr_removal.status is search("Exception")

        # - set_fact:
        #     ptr_delete_ok: true
        #   when:
        #     - ptr_removal.status is search("record removed") or ptr_removal.status is search("record not available")
        #     - ptr_record | length > 0

        - name: “PTR record deleted → mark success”
          set_fact:
            ptr_delete_ok: true
          when:
            - ptr_record | length > 0
            - ptr_removal is defined
            - "'status' in ptr_removal"
            - ptr_removal.status is search("record removed") or ptr_removal.status is search("record not available")

        - name: “No A record to delete → mark success”
          set_fact:
            a_delete_ok: true
          when: a_record | length == 0


        - name: Delete A record
          ipam_record_removal_esxi:
            hostname: "{{ fqdn }}"
            ipam: "{{ dns_grid }}"
            username: "{{ infoblox_username }}"
            password: "{{ infoblox_password }}"
            dns_view: "{{ dns_network_view }}"
            record_type: a
          delegate_to: localhost
          register: a_removal
          when: a_record | length > 0


        - name: Log A Record Deletion Success
          shell: echo "{{ hostname }}, {{ time }}, [INFO], {{ a_removal.status }}" >> {{ dns_success }}
          delegate_to: localhost
          when:
            - a_record | length > 0
            - a_removal.status is search("record removed") or a_removal.status is search("record not available")

        - name: Log A Record Deletion Failure
          shell: echo "{{ hostname }}, {{ time }}, [ERROR], {{ a_removal.status }}" >> {{ dns_failed }}
          delegate_to: localhost
          when:
            - a_record | length > 0
            - a_removal.status is search("record removal failed") or a_removal.status is search("Exception")

        # - set_fact:
        #     a_delete_ok: true
        #   when:
        #     - a_removal.status is search("record removed") or a_removal.status is search("record not available")
        #     - a_record | length > 0       

        - name: “A record deleted → mark success”
          set_fact:
            a_delete_ok: true
          when:
            - a_record | length > 0
            - a_removal is defined
            - "'status' in a_removal"
            - a_removal.status is search("record removed") or a_removal.status is search("record not available")

        - name: "update entry for DECO server for DNS and IPAM cleanup"
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "ipam_cleanup"
            status: "T"           
          register: update_status
          delegate_to: localhost
          when:
            - host_delete_ok | default(false)
            - ptr_delete_ok | default(false)
            - a_delete_ok | default(false)




      rescue:
        - debug:
            var: host_removal

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp  

        - set_fact:
           time: "{{tstamp.stdout}}" 
  
        
        - set_fact:
            dns_error: "{{ hostname }}, {{ time }}, [ERROR], :Unable to Release IP / Remove DNS records for {{ hostname }} - from IPAM"
          #when: host_record                  
                                     
        - name: "ESXI host list"
          shell: echo "{{ dns_error }}" >> {{ dns_failed }}                	
          delegate_to: localhost
          #when: host_record 