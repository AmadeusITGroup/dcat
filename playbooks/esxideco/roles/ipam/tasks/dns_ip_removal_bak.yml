        - name: Release the IP
          iprelease:
            host: "{{ inventory_hostname | lower }}"
            ipaddress: "{{ ip_address }}"
            ipam: "{{ ipam_grid }}"
            username: "{{ infoblox_username }}"
            password: "{{ infoblox_password }}"
            view: "{{ ipam_network_view }}"
          register: iprelease_status
          delegate_to: localhost

        - name: Log Failure - IP release failed
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, {{ iprelease_status.Status }}" >> {{ dns_failed }}
          delegate_to: localhost
          when:
            - iprelease_status.Status is defined
            - iprelease_status.Status is search("ERROR")


        # - set_fact:
        #     dns_status: "{{ hostname }}, {{ time }}, {{ iprelease_status.Status}}"

        
        # - name: "set IP release status"
        #   shell: echo "{{ dns_status }}" >> {{ dns_success }}                  	
