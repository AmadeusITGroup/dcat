        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost      

                 
        - name: "Check entry for DECO server for filter hostlist for FQDN and Vcenter Fetch"
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost

        - set_fact: 
            cmdb_fetch: '{{idem_status.module_update.cmdb_fetch}}'                   
           
        - set_fact: 
            fqdn_info: '{{idem_status.module_update.fqdn_info}}'   

        - set_fact: 
            vcenter_info: '{{idem_status.module_update.vcenter_info}}'

        - set_fact: 
            esxi_type: '{{idem_status.module_update.esxi_type}}'              

        - name: Set enclosure name from module update
          set_fact: 
            enclosure_name: '{{ idem_status.module_update.enclosure_name }}'
 

        # - name: "Esxi server list qualified for cmdb status check"
