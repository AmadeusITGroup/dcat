        #     - esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and (cmdb_fetch != "T" and fqdn_info != "F")

        - name: "Esxi server list qualified for cmdb status check"
          shell: echo "{{ inventory_hostname }}," >> {{ host_list }}
          delegate_to: localhost
          when:
            - (esxi_type in ['HPBlade', 'LenovoBlade'] and cmdb_fetch != "T" and fqdn_info != "F" and vcenter_info != "F" and enclosure_name != "F") or
              (esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and cmdb_fetch != "T" and fqdn_info != "F")


                
