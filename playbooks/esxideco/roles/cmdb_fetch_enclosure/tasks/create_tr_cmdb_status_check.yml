    - name: "Handling Create TR- Win@proach for cmdb fetch task -retry 2 "
      block:

        # - name: Display the JSON file content
        #   shell: cat record_healthcheck.json
        #   delegate_to: localhost
        #   register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
        #   delegate_to: localhost

        # - meta: end_host
        #   when: record_id_healthcheck != ""
          
        - name: Display the JSON file content for CMDB FETCH
          shell: cat record_cmdb_fetch.json
          delegate_to: localhost
          register: TR_result_cmdb_fetch  

        - name: save the Json data to a Variable as a Fact for CMDB FETCH
          set_fact:
            record_id_cmdb_fetch: "{{ TR_result_cmdb_fetch.stdout[1:-1] }}"
          delegate_to: localhost 

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_id_cmdb_fetch == ""   


        - name: TR creation for CMDB FETCH task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO  : cmdb status update"
            ci: "{{ esxi_hostlist }}" 
            winaproach_category: "{{ win_category }}"
          register: ticket_id_cmdb_fetch
          delegate_to: localhost
          when: record_id_cmdb_fetch == ""
       
        - set_fact:
            record_id_cmdb_fetch: "{{ticket_id_cmdb_fetch.id.ticketId}}"
          when: record_id_cmdb_fetch == ""
        
        - copy:
            content: '{{ record_id_cmdb_fetch|to_json }}'
            dest: record_cmdb_fetch.json
          delegate_to: localhost
