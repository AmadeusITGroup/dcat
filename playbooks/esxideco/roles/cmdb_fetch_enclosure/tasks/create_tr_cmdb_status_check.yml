        - name: Empty the record_cmdb_fetch.json file before writing
          copy:
            content: ""
            dest: record_cmdb_fetch.json
          delegate_to: localhost


        - name: esxi_host list
          shell: cat host_list_cmdb_fetch.yml
          delegate_to: localhost
          register: hostlist_cmdb_fetch             

        # - name: save the physical list to a Variable as a Fact
        #   set_fact:
        #     phy_hostlist: "led10211pb02" #"{{ inventory_hostname }}" #"{{ hostlist_cmdb_fetch.stdout[:-1] }}" 
        #   delegate_to: localhost 

        - name: save the esxi list to a Variable as a Fact
          set_fact:
            esxi_hostlist: "{{ hostlist_cmdb_fetch.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: esxi_hostlist == ""  


        # - meta: end_host
        #   when: phy_hostlist == ""   

        # - name: Display the JSON file content
