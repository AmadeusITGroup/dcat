        - name: TR creation for CMDB FETCH task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO  : cmdb status update- Deco in Progress"
            ci: "{{ esxi_hostlist }}" 
            winaproach_category: "{{ win_category }}"
          register: ticket_id_cmdb_fetch
          delegate_to: localhost

        - debug:
            var: ticket_id_cmdb_fetch

        - set_fact:
            record_id_cmdb_fetch: "{{ticket_id_cmdb_fetch.id.ticketId}}"

    
        - copy:
            content: '{{ record_id_cmdb_fetch|to_json }}'
            dest: record_cmdb_fetch.json
          delegate_to: localhost

      rescue:
        - name: TR creation
          debug:
            msg: "Failed to Create ESXI DECO - CMDB FETCH TR" 

