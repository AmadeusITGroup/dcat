---
    - name: Initiating the ILO reset Module
      throttle: 1
      block:

        - name: Display the JSON file content
          shell: cat record_oview_lxca.json
          delegate_to: localhost
          run_once: true
          register: TR_result_oview_lxca_esxi

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_oview_lxca_esxi: "{{ TR_result_oview_lxca_esxi.stdout[1:-1] }}"
          run_once: true
          delegate_to: localhost         

        - meta: end_host
          when: record_id_oview_lxca_esxi == ""  

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          run_once: true
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          run_once: true
          delegate_to: localhost

        - name: "Check entry for DECO server"
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
          register: idem_status
          delegate_to: localhost

        # - debug:
        #     var: idem_status

        - set_fact: 
            server_shutdown: '{{idem_status.module_update.server_shutdown}}'

        - set_fact: 
            oneview_xclarity_removal: '{{idem_status.module_update.oneview_xclarity_removal }}'  

        - set_fact:
            esxi_type: "{{ idem_status.module_update.esxi_type }}"

        - name: End play for this host
          meta: end_host
          when: oneview_xclarity_removal != "F" or server_shutdown != "T"

        - name: Oneview deregister tasks
          include_tasks: oneview_deregister.yml
          when: esxi_type == 'HPBlade'

        - name: LXCA deregister tasks
          include_tasks: lxca_deregister.yml
          when: esxi_type == 'LenovoBlade'
