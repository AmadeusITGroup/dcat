        - name: Debug deletion commands
          debug:
            # msg: "{{ non_boot_partition_deletion_tasks }}"
            msg: "{{ non_boot_partition_deletion_tasks | default([]) }}"


        - name: Delete all partitions on non-boot disks
          ssh_check_esxi_with_pass:
            hostname: "{{ esxi_fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_password }}"
            command: "{{ item }}"
          loop: "{{ non_boot_partition_deletion_tasks }}"
          register: deletion_results
          delegate_to: localhost
          # when: non_boot_partition_deletion_tasks | length > 0
