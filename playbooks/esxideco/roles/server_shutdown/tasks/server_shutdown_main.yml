        - name: Build list of partition deletion tasks per device
          set_fact:
            non_boot_partition_deletion_tasks: >-
              {{ non_boot_partition_deletion_tasks | default([]) +
                (
                  item.0.output.split('\n')
                    | select('match','^[0-9]+')
                    | map('regex_search','^([0-9]+)','\\1')
                    | map('regex_replace','^(.*)$',
                        'partedUtil delete ' ~ item.1 ~ ' \\1')
                    | list
                )
              }}
          loop: "{{ non_boot_parted_tables.results | zip(non_boot_devfs_paths) | list }}"
          loop_control:
            label: "{{ item.1 }}"
          when:
            - item.0.output is defined
            - item.1 is defined
          

