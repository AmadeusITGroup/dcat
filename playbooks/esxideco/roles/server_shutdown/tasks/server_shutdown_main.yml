# Detaching Disk after partition deletion

        - name: "Identify local storage uuid on ESXi"
          ssh_check_esxi_with_pass:
            hostname: "{{ esxi_fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_password }}"
            command: "esxcli storage core device list | awk -F ': ' '/Is Local: true/ {dev_path=$2} /Other UIDs:/ {gsub(/^ +/, \"\"); uids=$2} /Is Boot Device: false/ {if (dev_path && dev_path !~ /cdrom/ && uids ~ /^vml./) print uids}'"
          register: local_disks_uuid
          delegate_to: localhost



        - name: "Set local disks uuid list"
          set_fact:
            local_disks_uuid_list: "{{ local_disks_uuid.output.split('\n') | reject('equalto', '') | list }}"  # Reject empty strings
          when: local_disks_uuid is defined and local_disks_uuid.output is defined and local_disks_uuid.output | length > 0



        - name: "Disable local disk"
          ssh_check_esxi_with_pass:
            hostname: "{{ esxi_fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_password }}"
            command: "esxcli storage core device set --device {{ item }} --state off"
          loop: "{{ local_disks_uuid_list }}"
          # when: local_disks_uuid_list | length > 0
          when: local_disks_uuid_list is defined and local_disks_uuid_list | length > 0
          delegate_to: localhost
          register: disable_disk_results
          ignore_errors: yes

        - name: Identify disks in the detached list
          ssh_check_esxi_with_pass:
            hostname: "{{ esxi_fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_password }}"
            command: "esxcli storage core device detached list | awk '/^vml\\./ {print $1}'"
          register: detached_disks
          delegate_to: localhost

        - name: Build list of detached UUIDs
          set_fact:
            detached_uuid_list: "{{ detached_disks.output.split('\n') | reject('equalto','') | list }}"
          when:
            - detached_disks is defined
            - detached_disks.output is defined
            - detached_disks.output | length > 0

        - name: Remove only truly detached local disks
          ssh_check_esxi_with_pass:
            hostname: "{{ esxi_fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_password }}"
            command: "esxcli storage core device detached remove -d {{ item }}"
          loop: "{{ detached_uuid_list }}"
          register: detach_disk_results
          ignore_errors: yes
          delegate_to: localhost
          when:
            - detached_uuid_list is defined
            - detached_uuid_list | length > 0


        # - name: "Remove detached local disk from ESXi"
        #   ssh_check_esxi_with_pass:
        #     hostname: "{{ esxi_fqdn }}"
        #     username: "{{ remote_username }}"
        #     password: "{{ remote_password }}"
        #     command: "esxcli storage core device detached remove -d {{ item }}"
        #   loop: "{{ local_disks_uuid_list }}"
        #   # when: local_disks_uuid_list | length > 0
        #   when: local_disks_uuid_list is defined and local_disks_uuid_list | length > 0
        #   delegate_to: localhost
        #   register: detach_disk_results
        #   ignore_errors: yes

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"


        - name: Log Success for Local Disk Deletion
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [INFO] - Local storage devices disabled and removed successfully: {{ detach_disk_results.results | map(attribute='msg') | list | join(', ') }}" >> {{ shutdown_success }}
          delegate_to: localhost
          when:
            - detach_disk_results is defined
            - detach_disk_results.results is defined
            # - detach_disk_results.results | selectattr('rc', 'equalto', 0) | list | length == detach_disk_results.results | length
            - detach_disk_results.results | selectattr('status', 'equalto', 'success') | list | length == detach_disk_results.results | length


        - name: Log Failure for Local Disk Deletion
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - One or more local disk detach operations failed: {{ detach_disk_results.results | selectattr('status', 'equalto', 'failure') | map(attribute='msg') | list | join(', ') }}" >> {{ shutdown_failure }}
          delegate_to: localhost
          when:
            - detach_disk_results is defined
            - detach_disk_results.results is defined
            # - detach_disk_results.results | selectattr('rc', 'ne', 0) | list | length > 0
            - detach_disk_results.results | selectattr('failed', 'equalto', true) | list | length > 0


        - meta: end_host
          when:
            - detach_disk_results is defined
            - detach_disk_results.results is defined
            # - detach_disk_results.results | selectattr('rc', 'ne', 0) | list | length > 0
            - detach_disk_results.results | selectattr('failed', 'equalto', true) | list | length > 0



