        - name: "Identify local cdrom-free non-boot storage devices on ESXi"
          ssh_check_esxi_with_pass:
            hostname: "{{ esxi_fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_password }}"
            command: >
              esxcli storage core device list | awk '
              !/^[[:space:]]/ {
                if (dev && is_local && is_not_boot && device_type !~ /CD-ROM/)
                  print dev;
                dev = $1;
                is_local = 0;
                is_not_boot = 0;
                device_type = "";
              }
              /Is Local: true/ { is_local = 1 }
              /Is Boot Device: false/ { is_not_boot = 1 }
              /Device Type:/ {
                gsub(/^ +/, "", $0);
                split($0, parts, ": ");
                device_type = parts[2];
              }
              END {
                if (dev && is_local && is_not_boot && device_type !~ /CD-ROM/)
                  print dev;
              }'
          register: non_boot_disks
          delegate_to: localhost

        - name: Split non-boot disks into a list
          set_fact:
            non_boot_disk_list: "{{ non_boot_disks.output.splitlines() }}"
          when: non_boot_disks is defined and non_boot_disks.output is defined and non_boot_disks.output | length > 0


        - name: Loop through each non-boot disk to get full block info
          ssh_check_esxi_with_pass:
            hostname: "{{ esxi_fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_password }}"
            command: "esxcli storage core device list -d {{ item }}"
          loop: "{{ non_boot_disk_list }}"
          register: non_boot_device_blocks
          delegate_to: localhost
          when: non_boot_disk_list is defined and non_boot_disk_list | length > 0



        - name: Collect Devfs Paths for non-boot disks
          set_fact:
            non_boot_devfs_paths: "{{ (non_boot_devfs_paths | default([])) + (item.output | regex_search('Devfs Path:\\s*(\\S+)', '\\1') | default('') | list) }}"
          when:
            - item is defined
            - item.output is defined
            - item.output | regex_search('Devfs Path:\\s*(\\S+)', '\\1') is not none
          loop: "{{ non_boot_device_blocks.results }}"


        - name: “Get partition table for each non-boot devfs path”
          ssh_check_esxi_with_pass:
            hostname: "{{ esxi_fqdn }}"
            username: "{{ remote_username }}"
            password: "{{ remote_password }}"
            # command: "partedUtil getptbl /vmfs/devices/disks/{{ item }}"
            command: "partedUtil getptbl '{{ item }}'"
          loop: "{{ non_boot_devfs_paths }}"
          register: non_boot_parted_tables
          delegate_to: localhost
          when: non_boot_devfs_paths is defined and non_boot_devfs_paths | length > 0


