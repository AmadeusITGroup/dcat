---
    - name: "Check entry for DECO server"
      throttle: 1
      block:
        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost      
                
        - name: "Check entry for DECO server for filter hostlist for cmdb duplicate list"
          # azure_update_ref_phy:
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost

        - set_fact: 
            cmdb_update: '{{idem_status.module_update.cmdb_update}}' 
      
        - set_fact: 
            deco_date: '{{idem_status.module_update.deco_date}}' 

        # - set_fact:
        #     serial_status: '{{ idem_status.module_update.serial }}'


        # - name: Display the JSON file content
        #   shell: cat failure_vm_agp.yml
        #   delegate_to: localhost
        #   register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     vm_list: "{{ TR_result_healthcheck.stdout }}"
        #   delegate_to: localhost                                   


        - name: "ESXi success list"
          shell: echo "{{ inventory_hostname }}" >> success_esxi.yml                    
          delegate_to: localhost
          when: cmdb_update == "T"

        - name: "ESXi failure list"
          shell: echo "{{ inventory_hostname }}" >> failure_esxi.yml                    
          delegate_to: localhost
          when: cmdb_update == "F" #and ('"{{ inventory_hostname }}" not in vm_list')       

        - meta: end_host
          when: deco_date != "F"

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"                            
             
        - name: "update entry for DECO server for Closure date"
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "deco_date"
            status: "{{ time }}"           
          register: update_status_info_date
          delegate_to: localhost  
          when: cmdb_update == "T"


        # - debug:
        #     var: "{{ update_status_info_date }}"       
        #   when: update_status_info_date is defined

        - debug:
            var: update_status_info_date
          when: update_status_info_date is defined

            
      rescue:
        - debug:
            msg: "Logging Failed, rescue trigerred" 

