---
    - name: Initiating the CMDB update module task
      throttle: 1
      block:
        - set_fact:
            file_cmdb_dup_success: "cmdb_dup_success.yml"
            file_cmdb_dup_failure: "cmdb_dup_failure.yml" 
            CMDB_RESULT: ""      
          run_once: true

        - name: Display the JSON file content for cmdb dupilcate
          shell: cat record_for_cmdb_dup_info.json
          delegate_to: localhost
          run_once: true
          register: TR_result_cmdb_dup

        - name: save the Json data to a Variable as a Fact for cmdb duplicates check
          set_fact:
            record_id_cmdb_dup: "{{ TR_result_cmdb_dup.stdout[1:-1] }}"
          run_once: true
          delegate_to: localhost         

        - meta: end_host
          when: record_id_cmdb_dup== ""

        - name: Display the JSON file content
          shell: cat esxi_ssh_fail.yml
          delegate_to: localhost
          run_once: true
          register: TR_result_esxi_ssh_fail  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ssh_fail: "{{ TR_result_esxi_ssh_fail.stdout }}"
          run_once: true
          delegate_to: localhost

        - meta: end_host
          when: ssh_fail is search("{{ inventory_hostname }}")                  

        - name: "change hostname to lower case"
          set_fact:
            cmdb_dup_name_new: "{{inventory_hostname |lower }}"

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          run_once: true
          register: result_private_endpoint_connection_string

        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          run_once: true
          delegate_to: localhost
                          
        - name: "Test custom module for checking the duplicate entries in cmdb bmc remedy"
          cmdb_check_duplicate:
            conn_str: "{{ private_endpoint_connection_string }}"
            server_name: '{{cmdb_dup_name_new}}'
            cmdb_server: "{{ cmdb_url_update }}"
            user_name: "{{ emdb_username }}"
            pass_word: "{{ emdb_password }}"                               
          delegate_to: localhost
          register: output
          until: '"Exception" not in output.cmdb_check_result' 
          retries: 3
          delay: 1
          ignore_errors: yes

        - debug:
            var: output          

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          run_once: true
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"
          run_once: true

        - name: "Failure information to file for exception scenario"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{ output.cmdb_check_result }} " >> {{file_cmdb_dup_failure}}                    
          delegate_to: localhost
          when: '"successfully" not in output.cmdb_check_result'

        - meta: end_host
          when: '"successfully" not in output.cmdb_check_result'                                 
             
        - name: "Success information to file"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], {{ output.cmdb_check_result }} " >> {{file_cmdb_dup_success}}                    
          delegate_to: localhost
          when: '"successfully" in output.cmdb_check_result'

################################# Update Statefile #################################

        - name: "update entry for DECO server for cmdb duplicate check"
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "cmdb_dup_check"
            status: "T"           
          register: update_status
          delegate_to: localhost
          when: '"successfully" in output.cmdb_check_result'      

      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors for cmdb duplicate check module"  

  #########################################################################    
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          run_once: true
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"
          run_once: true

        - name: "Failure information to file in rescue block"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Kindly check cmdb duplicate check module for esxi servers" >> {{file_cmdb_dup_failure}}                    
          delegate_to: localhost
