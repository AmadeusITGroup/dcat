---
    - name: "Check entry for DECO server"
      throttle: 1    
      block:

        # - name: Display the JSON file content
        #   shell: cat record_healthcheck.json
        #   delegate_to: localhost
        #   register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
        #   delegate_to: localhost

        # - meta: end_host
        #   when: record_id_healthcheck != ""  
          
        - set_fact:
            host_list: "host_list_cmdb_update_esxi.yml"       

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          run_once: true
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          run_once: true
          delegate_to: localhost      

                
        - name: "Check entry for DECO server for filter hostlist for cmdb update"
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost 

        - name: Set ESXi type from idem status
          set_fact: 
            esxi_type: '{{ idem_status.module_update.esxi_type }}'

        - name: Set Vcenter cleanup status from idem status
          set_fact: 
            vcenter_cleanup: '{{ idem_status.module_update.vcenter_cleanup }}'

        - name: Set DCM status from idem status
          set_fact: 
            san_info_fetch: '{{ idem_status.module_update.san_info_fetch }}'

        - name: Set CMDB update status from idem status
          set_fact: 
            cmdb_update: '{{ idem_status.module_update.cmdb_update }}'
     

        # - name: "esxi server list qualified for cmdb update"
        #   shell: echo "{{ inventory_hostname }}," >> {{ host_list }}                   
        #   delegate_to: localhost
        #   # when: cmdb_update == "F" and network == "T" 

        - name: "Empty the host list file before writing"
          copy:
            content: ""
            dest: "{{ host_list }}"
          delegate_to: localhost
          run_once: true


        - name: "esxi server list qualified for cmdb update"
          shell: echo "{{ inventory_hostname }}," >> {{ host_list }}
          delegate_to: localhost
          # when:
          #   - esxi_type in ['HPBlade', 'LenovoBlade'] and cmdb_update == "F" and ipam_cleanup == "T"
          #   - esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and cmdb_update == "F" and dcm == "T"
          when:
            - (esxi_type in ['HPBlade', 'LenovoBlade'] and cmdb_update == "F" and vcenter_cleanup == "T") or (esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and cmdb_update == "F" and san_info_fetch == "T")

            
      rescue:
        - debug:
            msg: "Failed to fetch hostlist for CMDB update"      

