---
    - name: "Check entry for DECO server filterhostlist file in storage fetch info module"
      throttle: 1
      block:
 
        - set_fact:
            host_list: host_list_storage_info_fetch.yml

        # - name: Display the JSON file content
        #  shell: cat record_healthcheck.json
        #  delegate_to: localhost
        #  register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #  set_fact:
        #    record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
        #  delegate_to: localhost

        # - meta: end_host
        #  when: record_id_healthcheck != ""
                          
        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost

        - name: "Check entry for DECO server"
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost
         
        # - set_fact: 
        #     cmdb_fetch_bgp: '{{idem_status.module_update.cmdb_fetch_bgp}}'              
  
        - set_fact: 
            san_info_fetch: '{{idem_status.module_update.san_info_fetch}}'
                 
        - set_fact: 
            server_info: '{{idem_status.module_update.server_info}}'  

        # - name: "Check entry for DECO server and fetch wwpn information of host"
        #   storage_state_value_fetch_esxi:
        #     connection_string: "{{ private_endpoint_connection_string }}"
        #     hostname: "{{inventory_hostname}}"                        
        #   register: info_result_host
        #   delegate_to: localhost     

        # - debug:
        #     var: info_result_host

        # - name: "Host WWPN - Output"
        #   set_fact:
        #     host_wwpns_info: "{{ info_result_host.module_update.host_info}}"
        
        # - name: "update entry for DECO server for Storage fetch "
        #   azure_update_module_vals_esxi:
        #     connection_string: "{{ private_endpoint_connection_string }}"
        #     hostname: "{{inventory_hostname}}"
        #     module_name: "san_info_fetch"
        #     status: "T"          
        #   register: update_status_state_file
        #   delegate_to: localhost
          # when: host_wwpns_info == "F"

        - name: "esxi server list qualified for storage fetch task"
          shell: echo "{{ inventory_hostname }}," >> {{ host_list }}                   
          delegate_to: localhost
          # when: san_info_fetch == "F" and cmdb_fetch_bgp == "T" and host_wwpns_info != "F"    
          when: san_info_fetch == "F" and server_info != "F"         
     

            
      rescue:
        - debug:
            msg: "Failed to fetch hostlist for storage fetch info module"      
