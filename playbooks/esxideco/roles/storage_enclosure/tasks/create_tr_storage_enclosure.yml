- block:

    # ------------------------
    # Set cleaned ESXi host list
    # ------------------------
    - name: Set cleaned ESXi host list
      set_fact:
        esxi_host_list: "{{ hostlist_esxi.stdout_lines | map('regex_replace', ',', '') | list }}"
      when: storage_record_id != ""

    # ------------------------
    # Build TR message content
    # ------------------------
    - name: Build TR message content
      set_fact:
        form1: "***********************************************************************"
        form2: |
          For DCAT ESXi host requests

          Dear Storage teams.

            TR for

            1) Enclosure Storage Cleanup

            2) Storage cleanup for all blades inside the enclosure

        form3: "***********************************************************************"
        form4: "All blades in the below Enclosure have been successfully decommissioned; please proceed with Storage cleanup of the Enclosure and its Blades"
        form5: "***********************************************************************"
        form6: "***********************************************************************"

    # ------------------------
    # Combine content into single fact
    # ------------------------
    - name: Combine all content into one fact
      set_fact:
        content_storage_succ: "{{ form1 + '\n' + form2 + '\n' + form3 + '\n' + form4 + '\n' + form5 + '\n' + form6 + '\n' + (esxi_host_list | join('\n')) }}"
      when: esxi_host_list | length > 0

    # ------------------------
    # Update WinAproach task
    # ------------------------
    - name: Update WinAproach task
      winaproach:
        system: prod
        type: task_record
        operation: update_overview
        username: "{{ winaproach_username }}"
        password: "{{ winAproach_password }}"
        fields:
          task_id: "{{ record_id }}"
          text: "{{ content_storage_succ }}"
      register: update


    - name: Read private endpoint JSON
      shell: cat private_endpoint_connection_string.yml
      delegate_to: localhost
      run_once: true
      register: result_private_endpoint_connection_string
      when: update.json.status == "SUCCESS"

    - name: Set private endpoint connection string
      set_fact:
        private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
      run_once: true
      delegate_to: localhost
      when: update.json.status == "SUCCESS"

    - name: Update DECO server entries for Enclosure storage
      azure_update_module_vals_esxi:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{ item }}"
        module_name: "san_info_fetch"
        status: "T"
      register: update_status
      loop: "{{ esxi_host_list }}"
      delegate_to: localhost
      when: update.json.status == "SUCCESS" and esxi_host_list | length > 0

  rescue:
    - debug:
        msg: "Failed in TR creation for enclosure storage"
