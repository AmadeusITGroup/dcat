---
- name: Execute Create TR task
  block:

    - name: esxi_host list
      shell: cat host_list_enclosure_storage.yml
      delegate_to: localhost
      register: hostlist_esxi             

    - name: save the esxi list to a Variable as a Fact
      set_fact:
        esxi_hostlist: "{{ hostlist_esxi.stdout[:-1] }}" 
      delegate_to: localhost 

    - meta: end_host
      when: esxi_hostlist == ""    
      

    - name: "Custom module [CREATE TR]"
      create_tr:
        record_type: "TR"
        title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO  - Storage Cleanup - Enclosure"
        assignee_name: "DecoP112686"
        assignee_group: "OSX04SMG"  
        severity: "3"
        overview: "CSTY:DECO:DCAT: ESXi DECO - Storage info"
        parent_id: "{{ cr }}"
        username: "{{ winaproach_username }}"     
        password: "{{ winaproach_password }}"
      delegate_to: localhost
      no_log: False
      register: create_tr_output

    - set_fact:
        record_id: "{{ create_tr_output.record_id }}"

    - copy:
        content: '{{ record_id | to_json }}'
        dest: record_encl_stg.json
      delegate_to: localhost

    - name: Adding documentation tag
      tr_documentation:
        username: "{{ winaproach_username }}"
        password: "{{ winaproach_password }}"
        win_url: "{{win_url}}"
        task_id: "{{ record_id }}"
      register: add_document
      delegate_to: localhost

  rescue:
    - debug:
        msg: "Failed to Create ESXi Enclosure Storage DECO - TR"



- name: Retry Create TR for ESXi Enclosure Storage - Attempt 1
  block:
    - name: esxi_host list
      shell: cat host_list_enclosure_storage.yml
      delegate_to: localhost
      register: hostlist_esxi             

    - name: save the esxi list to a Variable as a Fact
      set_fact:
        esxi_hostlist: "{{ hostlist_esxi.stdout[:-1] }}" 
      delegate_to: localhost 

    - meta: end_host
      when: esxi_hostlist == ""

    - name: Display the JSON file content
      shell: cat record_encl_stg.json
      delegate_to: localhost
      register: TR_result

    - name: save the Json data to a Variable as a Fact
      set_fact:
        storage_record_id: "{{ TR_result.stdout[1:-1] }}" 
      delegate_to: localhost

    - name: Sleep for 20 seconds and continue with play
      ansible.builtin.wait_for:
        timeout: 20
      delegate_to: localhost
      when: storage_record_id == "" 

    - name: "Custom module [CREATE TR]"
      create_tr:
        record_type: "TR"
        title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO  - Storage Cleanup - Enclosure"
        assignee_name: "DecoP112686"
        assignee_group: "OSX04SMG"  
        severity: "3"
        overview: "CSTY:DECO:DCAT: ESXi DECO - Storage info"
        parent_id: "{{ cr }}"
        username: "{{ winaproach_username }}"     
        password: "{{ winaproach_password }}"
      delegate_to: localhost
      no_log: False
      register: create_tr_output
      when: storage_record_id == "" 

    - set_fact:
        record_id: "{{ create_tr_output.record_id }}"
      when: storage_record_id == "" 

    - copy:
        content: '{{ record_id | to_json }}'
        dest: record_encl_stg.json
      delegate_to: localhost
      when: create_tr_output is defined


    - name: Adding documentation tag
      tr_documentation:
        username: "{{ winaproach_username }}"
        password: "{{ winaproach_password }}"
        win_url: "{{win_url}}"
        task_id: "{{ record_id }}"
      register: add_document
      delegate_to: localhost

  rescue:
    - debug:
        msg: "Retry 1 Failed - ESXi storage enclosure DECO TR"


