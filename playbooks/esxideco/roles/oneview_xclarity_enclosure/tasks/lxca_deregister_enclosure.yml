    - name: Set task URI fact (async case)
      set_fact:
        unmanage_task_uri: "{{ unmanage_response.location }}"
      when:
        - unmanage_response is defined
        - unmanage_response.location is defined
        - unmanage_response.status is defined and (unmanage_response.status | int) in [200, 201, 202]
      delegate_to: localhost
      ignore_errors: yes

