        url: "{{ lxca_host }}/chassis"
        url_username: "{{ domain_username }}"
        url_password: "{{ domain_password }}"
        force_basic_auth: yes
        validate_certs: no
        dest: "/tmp/chassis_{{ inventory_hostname }}.json"
        mode: '0600'                # Protect credentials in file
        timeout: 60                  # Avoid worker hang on slow API
      delegate_to: localhost
      when: lxca_host is defined

