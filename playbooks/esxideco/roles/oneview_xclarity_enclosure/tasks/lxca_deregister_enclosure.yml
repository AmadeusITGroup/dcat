    - name: Wait for unmanage-job completion
      uri:
        url: "{{ lxca_host }}{{ unmanage_task_uri }}"
        method: GET
        user: "{{ domain_username }}"
        password: "{{ domain_password }}"
        force_basic_auth: yes
        validate_certs: no
        return_content: yes
        status_code: 200
      register: unmanage_status_raw
      until: >
        (
          (unmanage_status_raw.content | default('{}'))
          | from_json
        ).get('taskStatus', '') in ['Completed', 'Warning', 'Error']
      retries: 30
      delay: 10
      when: unmanage_task_uri != ''
      delegate_to: localhost
      ignore_errors: yes



