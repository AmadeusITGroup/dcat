    - name: Extract matching enclosure directly from file
      command: >
        jq -c '.chassisList[]
              | select(.cmmDisplayName | ascii_downcase == "{{ inventory_hostname | lower }}")'
              /tmp/chassis_{{ inventory_hostname }}.json
      register: enclosure_json
      delegate_to: localhost
      changed_when: false
      when: lxca_host is defined

    - name: Set matched_enclosure fact (only the small JSON object)
      set_fact:
        matched_enclosure: "{{ (enclosure_json.stdout | from_json) if enclosure_json.stdout else {} }}"
      when: lxca_host is defined
      delegate_to: localhost

    # - name: Extract enclosure object from extracted list
    #   set_fact:
    #     matched_enclosure: >-
    #       {{
    #         chassis_list
    #         | selectattr('cmmDisplayName', 'match', '(?i)^' + inventory_hostname + '$')
    #         | list
    #         | first
    #       }}
    #   delegate_to: localhost
    #   when: chassis_list is defined and chassis_list | length > 0

    - name: No enclosure found, skip deletion
      debug:
        msg: "No enclosure matching '{{ inventory_hostname }}', skipping enclosure removal."
      when: matched_enclosure is not defined
      delegate_to: localhost

    - name: Get timestamp from the system
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      register: tstamp

    - set_fact:
        time: "{{ tstamp.stdout }}"

    - name: Log Failure - No enclosure found
      shell: |
        echo "{{ inventory_hostname }}, {{ time }}, [INFO] - No enclosure found for blade, skipping deletion." >> {{ oview_lxca_failure }}
      delegate_to: localhost
      when: matched_enclosure is not defined

    - meta: end_host
      when: matched_enclosure is not defined

    - name: Set enclosure UUID
      set_fact:
        enclosure_uuid: "{{ matched_enclosure.uuid }}"
      delegate_to: localhost
      when: matched_enclosure is defined

    - name: Unmanage (deregister) enclosure from LXCA
      uri:
        url: "{{ lxca_host }}/unmanageRequest"
        method: POST
        user: "{{ domain_username }}"
        password: "{{ domain_password }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          endpoints:
            - ipAddresses: ["{{ inventory_hostname }}"]
              type: "Chassis"
              uuid: "{{ enclosure_uuid }}"
          forceUnmanage: true
        status_code: [200, 201, 202]
        return_content: yes
      register: unmanage_response
      delegate_to: localhost
      when: matched_enclosure is defined

