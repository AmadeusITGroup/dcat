    - block:

        - set_fact:
            oview_lxca_success: "oview_lxca_success_enclosure.yml"
            oview_lxca_failure: "oview_lxca_failure_enclosure.yml"
          run_once: true


        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          run_once: true
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          run_once: true
          delegate_to: localhost      
                
        - name: "Check entry for DECO server for filter hostlist for Oneview/xclarity deregister"
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost
        

        # - set_fact: 
        #     server_shutdown: '{{idem_status.module_update.server_shutdown}}'

        - set_fact: 
            oneview_xclarity_info: '{{idem_status.module_update.oneview_xclarity_info }}'  

        - name: Get OneView session token
          uri:
            url: "https://{{ oneview_xclarity_info }}/rest/login-sessions"
            method: POST
            body_format: json
            body:
              userName: "{{ domain_username }}"
              password: "{{ domain_password }}"
              authLoginDomain: "msp.net"
            headers:
              Content-Type: application/json
            return_content: yes
            validate_certs: false
            status_code: 200
          register: login_response
          retries: 3
          delay: 10
          until: login_response.status == 200
          delegate_to: localhost

        - name: Set OneView auth token
          set_fact:
            oneview_auth_token: "{{ login_response.json.sessionID }}"
          delegate_to: localhost

        - name: Fetch all enclosures
          uri:
            url: "https://{{ oneview_xclarity_info }}/rest/enclosures"
            method: GET
            headers:
              auth: "{{ oneview_auth_token }}"
            validate_certs: false
            return_content: yes
            status_code: 200
          register: enclosure_lookup_all
          delegate_to: localhost

        - name: Filter enclosure by name (case‑insensitive)
          set_fact:
            matching_enclosures: >-
              {{
                (enclosure_lookup_all.json.members | default([]))
                | selectattr('name','match','(?i)^' ~ inventory_hostname ~ '$')
                | list
              }}
          delegate_to: localhost
          
        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          run_once: true
          register: tstamp

        - set_fact:
            time: "{{ tstamp.stdout }}"
          run_once: true

        - name: Log Success - enclosure deletion completed
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [INFO] - Enclosure not found in OneView, already deleted" >> {{ oview_lxca_success }}
          when: matching_enclosures | length == 0
          delegate_to: localhost

        - name: "update entry for DECO server for Oneview Deregister "
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "oneview_xclarity_removal"
            status: "T"
          register: update_status_info_state
          delegate_to: localhost
          when: matching_enclosures | length == 0

        - meta: end_host
          when: matching_enclosures | length == 0

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          run_once: true
          register: tstamp

        - set_fact:
            time: "{{ tstamp.stdout }}"
          run_once: true


        # - name: Fail if no matching enclosure found
        #   shell: |
        #     echo "{{ inventory_hostname }}, {{ time ) }}, [ERROR] - No enclosure found, skipping." >> {{ oview_lxca_failure }}
        #   when: matching_enclosures | length == 0
        #   delegate_to: localhost

        # - meta: end_host
        #   when: matching_enclosures | length == 0

        - name: Set enclosure URI from matching enclosure
          set_fact:
            enclosure_uri: "{{ matching_enclosures[0].uri }}"
          delegate_to: localhost

        - name: Fetch enclosure resource to get its ETag
          uri:
            url: "https://{{ oneview_xclarity_info }}{{ enclosure_uri }}"
            method: GET
            headers:
              auth: "{{ oneview_auth_token }}"
            validate_certs: false
            return_content: no
          register: get_enclosure
          delegate_to: localhost

        - name: Deregister (delete) the enclosure
          uri:
            url: "https://{{ oneview_xclarity_info }}{{ enclosure_uri }}?force=true"
            method: DELETE
            headers:
              auth: "{{ oneview_auth_token }}"
              If-Match: "{{ get_enclosure.json.eTag }}"
            validate_certs: false
            status_code: [200, 202]
          register: delete_enclosure
          delegate_to: localhost

        - name: Log Failure - initial delete failed
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - Enclosure delete request failed: {{ delete_enclosure.msg }}" >> {{ oview_lxca_failure }}
          when: delete_enclosure.status not in [200, 202]
          delegate_to: localhost

        - meta: end_host
          when: delete_enclosure.status not in [200, 202]

        - name: Extract delete task URI
          set_fact:
            delete_task_uri: "{{ delete_enclosure.headers.Location | default(delete_enclosure.json.uri) }}"
          when: delete_enclosure.status == 202
          delegate_to: localhost

        - name: Wait for delete enclosure job to finish
          uri:
            url: "https://{{ oneview_xclarity_info }}{{ delete_task_uri }}"
            method: GET
            headers:
              auth: "{{ oneview_auth_token }}"
            validate_certs: false
            return_content: yes
            status_code: 200
          register: delete_task_status
          until: >
            delete_task_status.json.taskState is defined and
            delete_task_status.json.taskState in ['Completed', 'Warning', 'Error']
          retries: 90
          delay: 10
          when: delete_task_uri is defined
          delegate_to: localhost


# =============================================================================
        - name: Verify enclosure is actually deleted
          uri:
            url: "https://{{ oneview_xclarity_info }}{{ delete_task_status.json.associatedResource.resourceUri }}"
            method: GET
            headers:
              auth: "{{ oneview_auth_token }}"
            validate_certs: false
            status_code: [200, 404, 410]
          register: enclosure_lookup
          when: delete_task_status.json.associatedResource.resourceUri is defined
          delegate_to: localhost
          
        - name: Set fact whether enclosure is gone
          set_fact:
            enclosure_deleted: "{{ enclosure_lookup.status in [404, 410] }}"
          when: enclosure_lookup is defined

        - name: Log Success - enclosure deletion completed
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [INFO] - Enclosure deletion completed: {{ delete_task_status.json.taskState }}" >> {{ oview_lxca_success }}
          when:
            - delete_task_status is defined
            - delete_task_status.json.taskState in ['Completed','Warning'] or (enclosure_deleted is defined and enclosure_deleted)
          delegate_to: localhost


        - name: "Update entry for DECO server for OneView LXCA Deregister"
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "oneview_xclarity_removal"
            status: "T"
          register: update_status_info_state
          delegate_to: localhost
          when:
            - delete_enclosure.status in [200,202]
            - delete_task_status is defined
            - delete_task_status.json.taskState in ['Completed','Warning'] or (enclosure_deleted is defined and enclosure_deleted)


        - name: Fail if delete enclosure task errored
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - Enclosure deletion failed: {{ delete_task_status.json.taskState }}" >> {{ oview_lxca_failure }}
          when:
            - delete_task_status is defined
            - delete_task_status.json.taskState == 'Error'
            - not (enclosure_deleted | default(false))
          delegate_to: localhost



        # - name: Log Success - enclosure deletion completed
        #   shell: |
        #     echo "{{ inventory_hostname }}, {{ time }}, [INFO] - Enclosure deletion completed: {{ delete_task_status.json.taskState }}" >> {{ oview_lxca_success }}
        #   when:
        #     - delete_task_status is defined
        #     - delete_task_status.json.taskState in ['Completed','Warning']
        #   delegate_to: localhost

        # - name: "update entry for DECO server for Oneview LXCA Deregister"
        #   azure_update_module_vals_esxi:
        #     connection_string: "{{ private_endpoint_connection_string }}"
        #     hostname: "{{ inventory_hostname }}"
        #     module_name: "oneview_xclarity_removal"
        #     status: "T"
        #   register: update_status_info_state
        #   delegate_to: localhost
        #   when:
        #     - delete_enclosure.status in [200,202]
        #     - delete_task_status is defined
        #     - delete_task_status.json.taskState in ['Completed','Warning']

        # - name: Fail if delete enclosure task errored
        #   shell: |
        #     echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - Enclosure deletion failed: {{ delete_task_status.json.taskState }}" >> {{ oview_lxca_failure }}
        #   when:
        #     - delete_task_status is defined
        #     - delete_task_status.json.taskState == 'Error'
        #   delegate_to: localhost

        - meta: end_host
          when:
            - delete_task_status is defined
            - delete_task_status.json.taskState == 'Error'
            - not (enclosure_deleted | default(false))


      rescue:
        - name: Exception occurred - rescue logging
          debug:
            msg: "Exception during Oneview deregister; see failure log"

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: Log rescue failure
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - Exception during LXCA deregister" >> {{ oview_lxca_failure }}
          delegate_to: localhost
