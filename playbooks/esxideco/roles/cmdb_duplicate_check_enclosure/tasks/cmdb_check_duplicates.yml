- name: Initiating the CMDB update module task
  throttle: 1
  block:

    - set_fact:
        file_cmdb_dup_success: "cmdb_dup_success.yml"
        file_cmdb_dup_failure: "cmdb_dup_failure.yml" 
        CMDB_RESULT: ""      

    - name: Display the JSON file content for cmdb duplicate
      shell: cat record_for_cmdb_dup_info.json
      delegate_to: localhost
      run_once: true
      register: TR_result_cmdb_dup

    - name: Save the JSON data to a variable as a fact for CMDB duplicates check
      set_fact:
        record_id_cmdb_dup: "{{ TR_result_cmdb_dup.stdout[1:-1] }}"
      run_once: true
      delegate_to: localhost         

    - name: End host if no CMDB records are found
      meta: end_host
      when: record_id_cmdb_dup == ""

    - name: Display the JSON file content
      shell: cat private_endpoint_connection_string.yml
      delegate_to: localhost
      run_once: true
      register: result_private_endpoint_connection_string

    - name: save the Json data to a Variable as a Fact
      set_fact:
        private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
      run_once: true
      delegate_to: localhost

    - name: "Check entry for DECO server from Azure"
      azure_update_ref_esxi:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{inventory_hostname}}"                        
      register: idem_status
      delegate_to: localhost    

    # - debug:
    #     var: idem_status

    # - set_fact: 
    #     healthy: '{{idem_status.module_update.healthy}}'  
              
    - set_fact: 
        cmdb_dup_check: '{{idem_status.module_update.cmdb_dup_check}}'  

    - name: End play for this host
      meta: end_host
      # when: healthy != "T" or cmdb_dup_check != "F"
      when: cmdb_dup_check != "F"


    - name: Check duplicate entries for Enclosure in CMDB
      cmdb_check_duplicate:
        conn_str: "{{ private_endpoint_connection_string }}"
        server_name: "{{ inventory_hostname | lower }}"
        cmdb_server: "{{ cmdb_url_update }}"
        user_name: "{{ emdb_username }}"
        pass_word: "{{ emdb_password }}"
      delegate_to: localhost
      register: enclosure_cmdb_check
      retries: 3
      delay: 1
      ignore_errors: yes

    - name: Debug - Enclosure CMDB check result
      debug:
        var: enclosure_cmdb_check     

    - name: Get timestamp from the system
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      register: tstamp              

    - set_fact:
        time: "{{ tstamp.stdout }}"

    - name: Log failure for enclosure in CMDB
      shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{ enclosure_cmdb_check.cmdb_check_result }}" >> {{ file_cmdb_dup_failure }}
      delegate_to: localhost
      when: "'successfully' not in enclosure_cmdb_check.cmdb_check_result"

    - name: End host if enclosure CMDB check failed
      meta: end_host
      when: "'successfully' not in enclosure_cmdb_check.cmdb_check_result"

    - name: Log success for enclosure in CMDB
      shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], {{ enclosure_cmdb_check.cmdb_check_result }}" >> {{ file_cmdb_dup_success }}
      delegate_to: localhost
      when: "'successfully' in enclosure_cmdb_check.cmdb_check_result"

    - name: Load private endpoint connection string
      set_fact:
        private_endpoint_connection_string: "{{ lookup('file', 'private_endpoint_connection_string.yml') }}"
      delegate_to: localhost

    - name: Update entry for Enclosure CMDB duplicate check in Azure Table
      azure_update_module_vals_esxi:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{ inventory_hostname }}"
        module_name: "cmdb_dup_check"
        status: "T"           
      register: update_status
      delegate_to: localhost
      when: "'successfully' in enclosure_cmdb_check.cmdb_check_result"



  rescue: 
    - name: Handle exception - log debug message
      debug:
        msg: "Exception occurred but rescued - check errors for CMDB duplicate check module"  

    - name: Get timestamp from the system
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      run_once: true
      register: tstamp              
              
    - set_fact:
        time: "{{ tstamp.stdout }}"
      run_once: true

    - name: Log failure information in rescue block
      shell: echo "{{ inventory_hostname }}, {{ item.item }}, {{ time }}, [ERROR], {{ item.cmdb_check_result }}" >> {{ file_cmdb_dup_failure }}
      delegate_to: localhost
      when: "'successfully' not in item.cmdb_check_result"
      loop: "{{ output.results }}"
