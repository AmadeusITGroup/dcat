--- 
    - name: "Handling TR record_id to update and close the TR for CMDB duplicate check "
      block:
      
        - set_fact: 
            file_cmdb_dup_success: "cmdb_dup_success.yml"
            file_cmdb_dup_failure: "cmdb_dup_failure.yml"  
            file_cmdb_dup_fin: "cmdb_dup_info_fetch_final.yml"                          

        - name: Display the JSON file content
          shell: cat record_for_cmdb_dup_info.json
          delegate_to: localhost
          register: TR_result_cmdb_dup_info_fetch 

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_cmdb_dup_info_fetch: "{{ TR_result_cmdb_dup_info_fetch.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_cmdb_dup_info_fetch == ""      

 #############  success info gathering ##########################
        - name : handling error in the success block
          block:
            - name: Display the JSON file content
              shell: cat cmdb_dup_success.yml
              delegate_to: localhost
              register: result_cmdb_dup_info_fetch_suc

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_cmdb_dup_info_fetch_suc_v: "{{ result_cmdb_dup_info_fetch_suc.stdout }}" 
              delegate_to: localhost  

            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are CMDB duplicate check success results for the servers"
                form3: "***********************************************************************"
            - set_fact:
                content_cmdb_dup_info_fetch_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_cmdb_dup_info_fetch_suc_v }}" 
              when: result_cmdb_dup_info_fetch_suc_v != ""  


            - name: " Merge Success information to single final file "
              shell: echo "{{content_cmdb_dup_info_fetch_suc}}" >> cmdb_dup_info_fetch_final.yml                    
              delegate_to: localhost
              when: result_cmdb_dup_info_fetch_suc_v != "" 

          rescue:
            - debug:
                msg: "Rescue for no success file found and continue"   
                   
  ####################### Failure info gathering ########################## 
        - name : handling error in the failure block
          block:          
            - name: Display the JSON file content
              shell: cat cmdb_dup_failure.yml
              delegate_to: localhost
              register: result_cmdb_dup_info_fetch_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_cmdb_dup_info_fetch_fail_v: "{{ result_cmdb_dup_info_fetch_fail.stdout }}" 
              delegate_to: localhost  
    
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are CMDB duplicate check failure results for the servers"
                form3: "***********************************************************************"
            - set_fact:
                content_cmdb_dup_info_fetch_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_cmdb_dup_info_fetch_fail_v }}"
              when: result_cmdb_dup_info_fetch_fail_v != ""    
       
            - name: " Merge Failure information to to single final file"
              shell: echo "{{ content_cmdb_dup_info_fetch_fail }}" >> cmdb_dup_info_fetch_final.yml                    
              delegate_to: localhost
              when: result_cmdb_dup_info_fetch_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

##########################  merging both failure and success results ###########################

        - name: Display the JSON file content
          shell: cat cmdb_dup_info_fetch_final.yml
          delegate_to: localhost
          register: result_cmdb_dup_info_fetch_fin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_cmdb_dup_info_fetch_fin_v: "{{ result_cmdb_dup_info_fetch_fin.stdout }}" 
          delegate_to: localhost  


########################   results added to TR  ############################################
        - name: "add message to TR"
          add_message_to_tr:
            record_id: "{{record_id_cmdb_dup_info_fetch}}"
            message: "{{ result_cmdb_dup_info_fetch_fin_v }}"             
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          delegate_to: localhost
          register: add_msg_output 


################################ PTR creation ###################################

        - name: read yaml file from the specific location 
          set_fact:
            file_content: "{{lookup('file', 'machinegroups.yml')}}"

        - name: print the file_content
          debug:
            var: file_content

        - name: split the file content
          set_fact:
            lines: "{{file_content.split('\n')}}"

        - name: print the lines
          debug:
            var: lines

        - name: convert the lines in the file to dict
          set_fact:
            res_dict: "{{ res_dict | default({}) | combine({ item.split('\t')[0]: item.split('\t')[1] }) }}"
          loop: "{{ lines }}"

        - name: find which key is preset in the log
          set_fact: 
            present_key: "{{ present_key | default([]) + [item] }}"
          loop: "{{ res_dict.keys() }}"
          when: content_cmdb_dup_info_fetch_fail is defined and item in content_cmdb_dup_info_fetch_fail

        - name: print the corresponded  value of the key present
          set_fact:
            allowner_name: "{{ allowner_name | default({}) | combine({item:res_dict[item]}) }}"
          loop: "{{ present_key }}"
          when: content_cmdb_dup_info_fetch_fail is defined 

        - name: all owners with format
          set_fact:
            all_owner_Final: | 
              {% for key,value in allowner_name.items()%}
              {{ key }} : {{ value }}
              {% endfor %}
          when: content_cmdb_dup_info_fetch_fail is defined 

        - set_fact:
            Requester_group: "Requester_group: {{requester_group}}"
            Requester_name: "Requester_name: {{requester_name}}"

        - name: "writing output to File"
          shell: echo -e "{{content_cmdb_dup_info_fetch_fail}}\n\n{{Requester_group}}\n{{Requester_name}}\n\nOwner group Details below:\n{{all_owner_Final}}" > groups_ptr.yml
          delegate_to: localhost
          when: content_cmdb_dup_info_fetch_fail is defined 


        - name: Display the JSON file content
          shell: cat groups_ptr.yml
          delegate_to: localhost
          register: result_groups
          when: content_cmdb_dup_info_fetch_fail is defined 


        - name: save the Json data to a Variable as a Fact
          set_fact:
            support_groups: "{{ result_groups.stdout }}" 
          delegate_to: localhost 
          when: content_cmdb_dup_info_fetch_fail is defined 


        - name: Create PTR
          problem_tr:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO: CMDB duplicate check failed TR - {{ record_id_cmdb_dup_info_fetch }}"
            tr_map: "{{ record_id_cmdb_dup_info_fetch }}"
            assignee_group:  "DINFDECO" 
            ptr_logs: "{{ support_groups }}"
            winaproach_category: "{{ win_category }}"
            # ptr_sys: "{{ ptr_sys }}"      
            ptr_system: "{{ ptr_sys }}"              
          register: ptr_out_cmdb_dup_info_fetch
          until: '"Successfully" in ptr_out_cmdb_dup_info_fetch.msg'
          retries: 3
          delay: 10
          when: result_cmdb_dup_info_fetch_fin_v is search("ERROR")

        - name: Update TR with PTR
          tr_overview:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_cmdb_dup_info_fetch }}"
            prob_id: "{{ ptr_out_cmdb_dup_info_fetch.id }}"                   
          register: update_overview  
          when: result_cmdb_dup_info_fetch_fin_v is search("ERROR")

############################# closing TR  ####################            
        - name: "Test custome module [CLOSE TR]"
          close_tr:
            record_id: "{{record_id_cmdb_dup_info_fetch}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
          register: close_tr_output
       
      rescue:
        - debug:
            msg: "Exception occurred so rescued the main tr result block for CMDB duplicate check "