    - block:

        - set_fact:
            ilo_success: "ilo_success.yml"
            ilo_failure: "ilo_failure.yml"

        # - name: Display the JSON file content
        #   shell: cat record_ilo.json
        #   delegate_to: localhost
        #   register: TR_result_ilo_esxi

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     record_id_ilo_esxi: "{{ TR_result_ilo_esxi.stdout[1:-1] }}"
        #   delegate_to: localhost         

        # - meta: end_host
        #   when: record_id_ilo_esxi == ""  

        # - name: Display the JSON file content
        #   shell: cat private_endpoint_connection_string.yml
        #   delegate_to: localhost
        #   register: result_private_endpoint_connection_string
    
        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
        #   delegate_to: localhost

        # - name: "Check entry for DECO server"
        #   azure_update_ref_esxi:
        #     connection_string: "{{ private_endpoint_connection_string }}"
        #     hostname: "{{ inventory_hostname }}"                        
        #   register: idem_status
        #   delegate_to: localhost    

        # - debug:
        #     var: idem_status

        # - set_fact: 
        #     ilo_reset: '{{ idem_status.module_update.ilo_reset }}'

        # - set_fact: 
        #     oneview_xclarity_removal: '{{ idem_status.module_update.oneview_xclarity_removal }}'  

        # - name: End play for this host
        #   meta: end_host
        #   when: ilo_reset != "F" or oneview_xclarity_removal != "T"
          
        - name: Fetch ESXi details from Synergon
          enclosure_synergon_data_fetch:
            enclosure: "{{ inventory_hostname }}"
            synergon_api: "{{ hostvars['localhost']['config_data']['synergon_url'] }}"
          delegate_to: localhost
          register: esxi_data   

        - name: Set serial number for ESXi cluster
          set_fact:
            serial_number: "{{ esxi_data.esxi_details[0].serialNumber }}"
          when: esxi_data.esxi_details is defined and esxi_data.esxi_details | length > 0

        - name: Set enclosure name for blade
          set_fact:
            enclosure_name: "{{ inventory_hostname[:-3] }}"

        - name: Set domain based on vcenter
          set_fact:
            domain: "{{ '.clfra1.net' if esxi_data.esxi_details[0].vcenter == 'fracol1vcsa1' else '.muc.net' }}"


        - name: Check Blade Status on HP Enclosure
          ssh_check_esxi_with_pass:
            hostname: "{{ enclosure_name }}{{ domain }}"
            username: "{{ ansible_user }}"
            password: "{{ ansible_password }}"  
            command: "SHOW SERVER LIST"
          register: hp_blade_status
          delegate_to: localhost
          retries: 3
          delay: 5
          # until: hp_blade_status.status == 'success'
          until: hp_blade_status.status is defined and hp_blade_status.status == "success"
          ignore_errors: true
          when: enclosure_name is defined

        - name: Normalize SHOW SERVER LIST output to upper case
          set_fact:
            upper_output_lines: "{{ hp_blade_status.output.split('\n') | map('upper') | list }}"
          when: hp_blade_status is defined and hp_blade_status.output is defined

        - name: Filter lines matching our serial (case-insensitive)
          set_fact:
            blade_line: >-
              {{
                upper_output_lines
                | select('search', 'ILO' + serial_number.upper())
                | list
              }}
          when:
            - upper_output_lines is defined
            - serial_number is defined

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: Log Failure - Serial not found in enclosure output
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - Serial '{{ serial_number }}' not found in {{ enclosure_name }}." >> {{ ilo_failure }}
          delegate_to: localhost
          when:
            - blade_line is defined
            - blade_line | length == 0
            - serial_number is defined

        - meta: end_host
          when:
            - blade_line is defined
            - blade_line | length == 0
            - serial_number is defined


        - name: Extract bay number
          set_fact:
            blade_bay: "{{ blade_line[0].split()[0] }}"
          when: blade_line is defined and blade_line | length > 0

        - name: Power off blade via OA CLI
          ssh_check_esxi_with_pass:
            hostname: "{{ enclosure_name }}{{ domain }}"
            username: "{{ ansible_user }}"
            password: "{{ ansible_password }}" 
            command: "POWEROFF SERVER {{ blade_bay }}"
          register: poweroff_result
          delegate_to: localhost
          when: blade_bay is defined

        - name: Wait after power off for hardware stabilization
          pause:
            seconds: 30

        - name: ILO Reset on blade bay
          ssh_check_esxi_with_pass:
            hostname: "{{ enclosure_name }}{{ domain }}"
            username: "{{ ansible_user }}"
            password: "{{ ansible_password }}" 
            command: |
              hponcfg {{ blade_bay }} << STARTSTR
              <RIBCL VERSION="2.0">
              <LOGIN USER_LOGIN="Administrator" PASSWORD="password">
                <RIB_INFO MODE="write">
                  <FACTORY_DEFAULTS/>
                </RIB_INFO>
              </LOGIN>
              </RIBCL>
              STARTSTR
          register: hponcfg_ilo_result
          delegate_to: localhost
          ignore_errors: true
          when: blade_bay is defined


        - name: Log Failure - LO Reset failed
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - Failed to Reset ILO on bay {{ blade_bay }} of {{ enclosure_name }}. Output: {{ hponcfg_ilo_result.output | regex_replace('\n', ' ') }}" >> {{ ilo_failure }}
          delegate_to: localhost
          when:
            - hponcfg_ilo_result is defined
            - hponcfg_ilo_result.status != "success"
              or hponcfg_ilo_result.output is not search('STATUS="0x0000"')
              or hponcfg_ilo_result.output is search('STATUS="0x0001"')

        - meta: end_host
          when:
            - hponcfg_ilo_result is defined
            - hponcfg_ilo_result.status != "success"
              or hponcfg_ilo_result.output is not search('STATUS="0x0000"')
              or hponcfg_ilo_result.output is search('STATUS="0x0001"')



        - name: Disable Auto Power on blade bay (retry until iLO reports STATUS="0x0000")
          ssh_check_esxi_with_pass:
            hostname: "{{ enclosure_name }}{{ domain }}" 
            username: "{{ ansible_user }}"
            password: "{{ ansible_password }}" 
            command: |
              hponcfg {{ blade_bay }} << STARTSTR
              <RIBCL VERSION="2.0">
              <LOGIN USER_LOGIN="Administrator" PASSWORD="password">
                <SERVER_INFO MODE="write">
                  <SERVER_AUTO_PWR VALUE="off" />
                </SERVER_INFO>
              </LOGIN>
              </RIBCL>
              STARTSTR
          register: hponcfg_result
          delegate_to: localhost

          retries: 10
          delay: 30

          until: >
            hponcfg_result.output is defined and
            'STATUS="0x0000"' in hponcfg_result.output

          when: blade_bay is defined


        - name: Log Success - Auto Power disabled successfully
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [SUCCESS] - Auto Power disabled on bay {{ blade_bay }} of {{ enclosure_name }}." >> {{ ilo_success }}
          delegate_to: localhost
          when:
            - hponcfg_result is defined
            - hponcfg_result.status == "success"
            - hponcfg_result.output is search('STATUS="0x0000"')
            - hponcfg_result.output is not search('STATUS="0x0001"')

        - name: Log Failure - Auto Power disable failed
          shell: |
            echo "{{ inventory_hostname }}, {{ time }}, [ERROR] - Failed to disable Auto Power on bay {{ blade_bay }} of {{ enclosure_name }}. Output: {{ hponcfg_result.output | regex_replace('\n', ' ') }}" >> {{ ilo_failure }}
          delegate_to: localhost
          when:
            - hponcfg_result is defined
            - hponcfg_result.status != "success"
              or hponcfg_result.output is not search('STATUS="0x0000"')
              or hponcfg_result.output is search('STATUS="0x0001"')

        - meta: end_host
          when:
            - hponcfg_result is defined
            - hponcfg_result.status != "success"
              or hponcfg_result.output is not search('STATUS="0x0000"')
              or hponcfg_result.output is search('STATUS="0x0001"')

        - name: Fetch CI Name for Serial Number from Synergon
          get_ci_from_serial_synergon:
            enclosure: "{{ inventory_hostname }}"
            synergon_api: "{{ hostvars['localhost']['config_data']['synergon_url'] }}"
            serial_number: "{{ serial_number }}"
          register: ci_result
          when: serial_number is defined
          delegate_to: localhost

        # - name: Display CI Name Results
        #   debug:
        #     msg: "{{ item.msg }}"
        #   loop: "{{ ci_results.results }}"
        #   when: ci_results is defined and ci_results.results is defined

        # - name: Display CI Name Result
        #   debug:
        #     msg: "{{ ci_result.msg }}"
        #   when: ci_result is defined and ci_result.msg is defined

        - name: Debug full ci_result
          debug:
            var: ci_result


        # - name: Display CI Name Result
        #   debug:
        #     msg: "Successfully fetched CI name: {{ ci_result.ci_name }}"
        #   when: ci_result is defined and ci_result.ci_name is defined

        - name: Display CI Name Result
          debug:
            msg: "Successfully fetched CI name: {{ ci_result.ci_result.ci_name }}"
          when: ci_result is defined and ci_result.ci_result is defined and ci_result.ci_result.ci_name is defined


        - set_fact:
            ci_name: "{{ ci_result.ci_result.ci_name }}"
          when: ci_result is defined and ci_result.ci_result.ci_name is defined

        # - name: Update entry for ILO Reset for ESXi
        #   azure_update_module_vals_esxi:
        #     connection_string: "{{ private_endpoint_connection_string }}"
        #     hostname: "{{ item.msg }}"
        #     module_name: "ilo_reset"
        #     status: "T"          
        #   register: update_status
        #   delegate_to: localhost  
        #   loop: "{{ ci_results.results }}"
        #   when: ci_results is defined and ci_results.results is defined and item.msg is defined

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost    

        # - name: Update entry for ILO Reset for ESXi
        #   azure_update_module_vals_esxi:
        #     connection_string: "{{ private_endpoint_connection_string }}"
        #     hostname: "{{ ci_result.msg }}"
        #     module_name: "ilo_reset"
        #     status: "T"
        #   register: update_status
        #   delegate_to: localhost
        #   when: ci_result is defined and ci_result.msg is defined

        - name: Update entry for ILO Reset for ESXi
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ ci_name }}"
            module_name: "ilo_reset"
            status: "T"
          register: update_status
          delegate_to: localhost
          when: ci_result is defined and ci_result.ci_result.ci_name is defined

        # - name: Log Success - ILO Reset successfully
        #   shell: |
        #     echo "{{ inventory_hostname }}, {{ time }}, [SUCCESS] - ILO reset done on bay {{ blade_bay }} of {{ enclosure_name }}." >> {{ ilo_success }}
        #   delegate_to: localhost
        #   when: ci_results is defined and ci_results.results is defined and item.msg is defined

        - name: Log Success - ILO Reset successfully
          shell: |
            echo "{{ ci_name }}, {{ time }}, [SUCCESS] - ILO reset done on bay {{ blade_bay }} of {{ enclosure_name }}." >> {{ ilo_success }}
          delegate_to: localhost
          when: ci_result is defined and ci_result.ci_result.ci_name is defined

      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors for ILO Reset module"  

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Failure information to file in rescue block"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Kindly check ILO Reset module for HP esxi servers" >> {{ ilo_failure }}                    
          delegate_to: localhost
