---
    - name: Initiating the ILO reset and disk Cleanup Module
      throttle: 1
      block:
        - set_fact:
            ilo_success: "ilo_success.yml"
            ilo_failure: "ilo_failure.yml"

        # - name: Display the JSON file content
        #   shell: cat record_ilo.json
        #   delegate_to: localhost
        #   register: TR_result
    
        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     ilo_record_id: "{{ TR_result.stdout[1:-1] }}" 
        #   delegate_to: localhost         

        # - meta: end_host
        #   when: ilo_record_id == "" 

        # - name: Display the JSON file content
        #   shell: cat private_endpoint_connection_string.yml
        #   delegate_to: localhost
        #   register: result_private_endpoint_connection_string
    
        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
        #   delegate_to: localhost      

                 
        # - name: "Check entry for DECO server for filter hostlist for FQDN and Vcenter Fetch"
        #   azure_update_ref_esxi:
        #     connection_string: "{{ private_endpoint_connection_string }}"
        #     hostname: "{{inventory_hostname}}"
        #   register: idem_status 
        #   delegate_to: localhost

        # - name: Get timestamp from the system
        #   shell: "date +%Y-%m-%d/%H:%M"
        #   delegate_to: localhost
        #   register: tstamp              
                  
        # - set_fact:
        #     time: "{{tstamp.stdout}}"


        # - set_fact: 
        #     esxi_type: '{{idem_status.module_update.esxi_type}}'   

        # - set_fact: 
        #     nvme_cleanup: '{{idem_status.module_update.nvme_cleanup }}'

        # - set_fact: 
        #     ilo_reset: '{{idem_status.module_update.ilo_reset}}'

        # - set_fact: 
        #     esxi_fqdn: '{{idem_status.module_update.fqdn_info}}'   

        # - name: End play for this host
        #   meta: end_host
        #   when: ilo_reset != "F" or nvme_cleanup != "T"    

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost      

                 
        - name: "Check entry for DECO server from Azure"
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost

        - set_fact: 
            enclosure_name: '{{idem_status.module_update.enclosure_name}}'   

        - name: Extract bay number from inventory_hostname
          set_fact:
            bay_number: "{{ inventory_hostname[-2:] }}"

        - name: Power off Blade
          ssh_check_esxi_with_pass:
            hostname: "{{ enclosure_name }}.muc.net"
            username: "{{ pAccount_username }}"
            password: "{{ pAccount_password }}"
            # remote_username: "{{ elk_user }}"
            # remote_password: "{{ elk_password }}"  
            # domain_username: "{{ pAccount_username }}"
            # domain_password: "{{ pAccount_password }}"
            command: "power -off -T system:blade[{{ bay_number }}]"
          register: power_off_results
          delegate_to: localhost

        - name: Wait after power off for hardware stabilization
          pause:
            seconds: 30

        - name: Check that you can connect (GET) to a page and it returns a status 200 if Lenovo Blade
          uri:
            url: https://{{ inventory_hostname +'rib.muc.net' }} 
            validate_certs: False
          register: rib_status
          delegate_to: localhost
          ignore_errors: yes
          when: esxi_type == 'LenovoBlade'

      
        - set_fact:
            rib_result: "{{ rib_status.status }}"
          when: esxi_type == 'LenovoBlade'

        # - set_fact:
        #     username: "{{ user_iloadm }}"
        #   when: esxi_type == 'LenovoBlade' and rib_result == '200'
      
        # - set_fact:
        #     password: "{{ password_iloadm }}"
        #   when: esxi_type == 'LenovoBlade' and rib_result == '200'

        - set_fact:
            ilohost: "{{ inventory_hostname +'rib.muc.net' }}"
          when: esxi_type == 'LenovoBlade' and rib_result == '200' 

        - name: "IMM Reset Lenovo Blades"
          imm_reset:
            hostname: "{{ ilohost }}"
            username: "{{ domain_username }}"
            password: "{{ domain_password }}"
            command: "restoredefaults"
          register: imm_reset
          delegate_to: localhost
          # when: esxi_type == 'LenovoBlade'
          when:
            - esxi_type == 'LenovoBlade'
            - rib_status.status == 200

        - name: Log Lenovo iLO reset failure
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Failed to reset iLO on Lenovo Blade. {{ imm_reset.stdout | to_yaml }}" >> {{ ilo_failure }}
          delegate_to: localhost
          when: imm_reset.status == "failure" and esxi_type == 'LenovoBlade'

        - meta: end_host
          when: imm_reset.status == "failure" and esxi_type == 'LenovoBlade'

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        # - name: Log Lenovo iLO reset success
        #   shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully reset iLO on Lenovo Blade. {{ imm_reset.stdout | to_yaml }}" >> {{ ilo_success }}
        #   delegate_to: localhost
        #   when: imm_reset.status != "failure" and esxi_type == 'LenovoBlade'

        # - name: Log Lenovo iLO reset success
        #   shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully reset iLO on Lenovo Blade. {{ imm_reset.output | to_yaml }}" >> {{ ilo_success }}
        #   delegate_to: localhost
        #   when: imm_reset.status != "failure" and esxi_type == 'LenovoBlade'


        - name: Log Lenovo iLO reset success
          shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully reset iLO on Lenovo Blade. Output {{ imm_reset.output | quote }}" >> {{ ilo_success }}
          delegate_to: localhost
          when:
            - esxi_type == 'LenovoBlade'
            - imm_reset is defined
            - "'status' in imm_reset"
            - imm_reset.status == 'success'


        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          delegate_to: localhost    


        - name: "update entry for DECO server for for ILO reset"
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "ilo_reset"
            status: "T"            
          register: update_status_info_state
          delegate_to: localhost
          when: imm_reset.status != "failure" and esxi_type == 'LenovoBlade'


      rescue: 
        - name: when above one throws error the below task should execute
          debug:
            msg: "Exception occurred but rescued - check errors for ILO Reset module"  

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              
                  
        - set_fact:
            time: "{{tstamp.stdout}}"

        - name: "Failure information to file in rescue block"
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], Kindly check IMM Reset module for Lenovo esxi servers" >> {{ ilo_failure }}                    
          delegate_to: localhost




