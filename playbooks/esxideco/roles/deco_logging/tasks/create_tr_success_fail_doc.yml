---
   
    - name: "Handling Create TR- Win@proach "
      block:

        - name: Check if success_esxi.yml exists
          stat:
            path: success_esxi.yml
          delegate_to: localhost
          register: success_esxi_file

        - name: Check if failure_esxi.yml exists
          stat:
            path: failure_esxi.yml
          delegate_to: localhost
          register: failure_esxi_file


        - name: ESXi_host success list
          shell: cat success_esxi.yml
          delegate_to: localhost
          register: esxi_result_suc      
          when: success_esxi_file.stat.exists
        

        - name: save the esxi list to a Variable as a Fact
          set_fact:
            esxi_success: "{{ esxi_result_suc.stdout }}" 
          delegate_to: localhost
          when: success_esxi_file.stat.exists


        - name: ESXi_host failure list
          shell: cat failure_esxi.yml
          delegate_to: localhost
          register: esxi_result_fail          
          when: failure_esxi_file.stat.exists


        - name: save the esxi list to a Variable as a Fact
          set_fact:
            esxi_fail: "{{ esxi_result_fail.stdout }}" 
          delegate_to: localhost
          when: failure_esxi_file.stat.exists


        # - meta: end_host
        #   when: esxi_success == "" and esxi_fail == ""                   
        

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO - Success/Failed list of esxi servers"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "ESXi DECO - Success/Failed list of esxi servers"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
        
        - set_fact:
            record_doc_esxi: "{{create_tr_output.record_id}}"
           

        - copy:
            content: '{{ record_doc_esxi|to_json }}'
            dest: record_doc_esxi.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "{{win_url}}"
            task_id: "{{ record_doc_esxi }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create docuemntation TR for ESXi DECO - Success/Failed list of ESXi's"

    - name: "Handling Create TR- Win@proach -1 "
      block:   

        - name: Check if success_esxi.yml exists
          stat:
            path: success_esxi.yml
          delegate_to: localhost
          register: success_esxi_file

        - name: Check if failure_esxi.yml exists
          stat:
            path: failure_esxi.yml
          delegate_to: localhost
          register: failure_esxi_file


        - name: ESXi_host success list
          shell: cat success_esxi.yml
          delegate_to: localhost
          register: esxi_result_suc      
          when: success_esxi_file.stat.exists
        

        - name: save the esxi list to a Variable as a Fact
          set_fact:
            esxi_success: "{{ esxi_result_suc.stdout }}" 
          delegate_to: localhost
          when: success_esxi_file.stat.exists


        - name: ESXi_host failure list
          shell: cat failure_esxi.yml
          delegate_to: localhost
          register: esxi_result_fail          
          when: failure_esxi_file.stat.exists


        - name: save the esxi list to a Variable as a Fact
          set_fact:
            esxi_fail: "{{ esxi_result_fail.stdout }}" 
          delegate_to: localhost
          when: failure_esxi_file.stat.exists

        # - meta: end_host
        #   when: esxi_success == "" and esxi_fail == ""                   
        

        - name: Display the JSON file content
          shell: cat record_doc_esxi.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_doc_esxi: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost          


        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_doc_esxi == ""           
        

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO - Success/Failed list of esxi servers"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "ESXi DECO - Success/Failed list of esxi servers"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_doc_esxi == "" 
        
        - set_fact:
            record_doc_esxi: "{{create_tr_output.record_id}}"
          when: record_doc_esxi == ""                

        - copy:
            content: '{{ record_doc_esxi|to_json }}'
            dest: record_doc_esxi.json
          delegate_to: localhost
          when: create_tr_output is defined

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "{{win_url}}"
            task_id: "{{ record_doc_esxi }}"
          register: add_document
          delegate_to: localhost
          when: record_doc_esxi == ""

      rescue:
        - debug:
            msg: "Failed to Create docuemntation TR for ESXi DECO - Success/Failed list of ESXi's"

