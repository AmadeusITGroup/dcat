---          
    - name: "Handling TR record_id for implementation and validation result"
      block:
 #############  success info gathering ##########################
        - name : handling error in the success block
          block:
            - set_fact:
                file_cmdb_fail: "esxi_cmdb_failure.yml"
                file_cmdb_suc: "esxi_esxi_cmdb_success.yml"
                file_cmdb_fin : cmdb_final.yml"                

            - name: Display the JSON file content for cmdb update this is TR number
              shell: cat record_cmdb_update_esxi.json
              delegate_to: localhost
              register: TR_result_cmdb_up  

            - name: save the Json data to a Variable as a Fact for cmdb update
              set_fact:
                record_id_cmdb_up: "{{ TR_result_cmdb_up.stdout[1:-1] }}"
              delegate_to: localhost         

            - meta: end_host
              when: record_id_cmdb_up == ""

            - name: Display the JSON file content
              shell: cat esxi_cmdb_success.yml 
              delegate_to: localhost
              register: result_cmdb_suc

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_cmdb_suc_v: "{{ result_cmdb_suc.stdout }}" 
              delegate_to: localhost  
     
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the CMDB Update success results for the servers"
                form3: "***********************************************************************"
            - set_fact:
                content_cmdb_suc: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_cmdb_suc_v }}"
              when: result_cmdb_suc_v != ""   
            

            - name: " Merge Success information to single final file "
              shell: echo "{{content_cmdb_suc}}" >> cmdb_final.yml                    
              delegate_to: localhost
              when: result_cmdb_suc_v != ""

          rescue:
            - debug:
                msg: "Rescue for no success file found and continue"      
  ####################### Failure info gathering ########################## 
        - name : handling error in the failure block
          block:          
            - name: Display the JSON file content
              shell: cat esxi_cmdb_failure.yml
              delegate_to: localhost
              register: result_cmdb_fail

            - name: save the Json data to a Variable as a Fact
              set_fact:
                result_cmdb_fail_v: "{{ result_cmdb_fail.stdout }}" 
              delegate_to: localhost  
      
            
            - set_fact:
                form1: "***********************************************************************"
                form2: "Below are the CMDB Update failure results for the servers"
                form3: "***********************************************************************"
            - set_fact:
                content_cmdb_fail: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ result_cmdb_fail_v }}"
              when: result_cmdb_fail_v != ""    
         
  
            - name: " Merge Failure information to to single final file"
              shell: echo "{{ content_cmdb_fail }}" >> cmdb_final.yml                    
              delegate_to: localhost
              when: result_cmdb_fail_v != ""

          rescue:
            - debug:
                msg: "Rescue for no failure file found and continue"

##########################  merging both failure and success results ###########################

        - name: Display the JSON file content
          shell: cat cmdb_final.yml
          delegate_to: localhost
          register: result_cmdb_fin

        - name: save the Json data to a Variable as a Fact
          set_fact:
            result_cmdb_fin_v: "{{ result_cmdb_fin.stdout }}" 
          delegate_to: localhost  

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat ptr_system.yml
          delegate_to: localhost
          register: result_ptr_system

        - name: save the Json data to a Variable as a Fact
          set_fact:
            ptr_sys: "{{ result_ptr_system.stdout }}" 
          delegate_to: localhost 

              ############################################################################################################
        - name: read yaml file from the specific location 
          set_fact:
            file_content: "{{lookup('file', 'machinegroups.yml')}}"

        - name: split the file content
          set_fact:
            lines: "{{file_content.split('\n')}}"

        - name: convert the lines in the file to dict
          set_fact:
            res_dict: "{{ res_dict | default({}) | combine({ item.split('\t')[0]: item.split('\t')[1] }) }}"
          loop: "{{ lines }}"

        - name: find which key is preset in the log
          set_fact: 
            present_key: "{{ present_key | default([]) + [item] }}"
          loop: "{{ res_dict.keys() }}"
          when: content_cmdb_fail is defined and item in content_cmdb_fail

        - name: print the corresponded  value of the key present
          set_fact:
            allowner_name: "{{ allowner_name | default({}) | combine({item:res_dict[item]}) }}"
          loop: "{{ present_key }}"
          when: content_cmdb_fail is defined

        - name: all owners with format
          set_fact:
            all_owner_Final: | 
              {% for key,value in allowner_name.items()%}
              {{ key }} : {{ value }}
              {% endfor %}
          when: content_cmdb_fail is defined

        - set_fact:
            Requester_group: "Requester_group: {{requester_group}}"
            Requester_name: "Requester_name: {{requester_name}}"

        - name: "writing output to File"
          shell: echo -e "{{content_cmdb_fail}}\n\n{{Requester_group}}\n{{Requester_name}}\n\nOwner group Details below:\n{{all_owner_Final}}" > groups_ptr.yml
          delegate_to: localhost
          when: content_cmdb_fail is defined

        - name: Display the JSON file content
          shell: cat groups_ptr.yml
          delegate_to: localhost
          register: result_groups
          when: content_cmdb_fail is defined

        - name: save the Json data to a Variable as a Fact
          set_fact:
            support_groups: "{{ result_groups.stdout }}" 
          delegate_to: localhost
          when: content_cmdb_fail is defined

        - name: Create PTR
          problem_tr:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "ESXI DECO: cmdb update failure list and details with failed TR - {{ record_id_cmdb_up }}"
            tr_map: "{{ record_id_cmdb_up }}"
            assignee_group: "OEA02SNM" #"DINFDECO"  
            ptr_logs: "{{ support_groups }}" 
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"                 
          register: ptr_out_cmdb_up  
          until: '"Successfully" in ptr_out_cmdb_up.msg'
          retries: 3
          delay: 10
          when: result_cmdb_fin_v is search("ERROR") and result_cmdb_fin_v is not search("INFO")

        - name: Update TR with PTR
          tr_overview:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_cmdb_up }}"
            prob_id: "{{ ptr_out_cmdb_up.id }}"                   
          register: update_overview  
          when: result_cmdb_fin_v is search("ERROR") and result_cmdb_fin_v is not search("INFO")             

########################  Pending Partial implementation  ############################################
        - name: Implementation partial that is closing the implementation as partial
          tr_partial_imp:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_cmdb_up }}"
          register: partial_implement
          when: result_cmdb_fin_v is search("ERROR") and result_cmdb_fin_v is search("INFO")
 

# ########################  Close Partial implementation  ############################################
        - name: Implementation partial that is closing the implementation as partial
          tr_partial_close:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_cmdb_up }}"
            closing_comment: "{{ result_cmdb_fin_v }}"
          register: close_partial_implement
          when: result_cmdb_fin_v is search("ERROR") and result_cmdb_fin_v is search("INFO")


  ############################################################################################################

        - name: find which key is preset in the log
          set_fact: 
            present_key1: "{{ present_key1 | default([]) + [item] }}"
          loop: "{{ res_dict.keys() }}"
          when: content_cmdb_fail is defined and item in content_cmdb_fail

        - name: print the corresponded  value of the key present
          set_fact:
            allowner_name1: "{{ allowner_name1 | default({}) | combine({item:res_dict[item]}) }}"
          loop: "{{ present_key1 }}"
          when: content_cmdb_fail is defined

        - name: all owners with format
          set_fact:
            all_owner_Final1: | 
              {% for key,value in allowner_name1.items()%}
              {{ key }} : {{ value }}
              {% endfor %}
          when: content_cmdb_fail is defined

        - name: "writing output to File"
          shell: echo -e "{{content_cmdb_fail}}\n\n{{Requester_group}}\n{{Requester_name}}\n\nOwner group Details below:\n{{all_owner_Final1}}" > groups_ptr.yml
          delegate_to: localhost
          when: content_cmdb_fail is defined

        - name: Display the JSON file content
          shell: cat groups_ptr.yml
          delegate_to: localhost
          register: result_groups1
          when: content_cmdb_fail is defined

        - name: save the Json data to a Variable as a Fact
          set_fact:
            support_groups1: "{{ result_groups1.stdout }}" 
          delegate_to: localhost 
          when: content_cmdb_fail is defined

        - name: Create PTR
          problem_tr:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            ptr_title: "ESXI DECO: cmdb update failure list and details with failed TR - {{ record_id_cmdb_up }}"
            tr_map: "{{ record_id_cmdb_up }}"
            assignee_group: "OEA02SNM" #"DINFDECO"  
            ptr_logs: "{{ support_groups1 }}" 
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"                  
          register: ptr_out_cmdb_up  
          until: '"Successfully" in ptr_out_cmdb_up.msg'
          retries: 3
          delay: 10
          when: result_cmdb_fin_v is search("ERROR") and result_cmdb_fin_v is search("INFO")


        - name: Update TR with PTR
          tr_overview:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_cmdb_up }}"
            prob_id: "{{ ptr_out_cmdb_up.id }}"                   
          register: update_overview  
          when: result_cmdb_fin_v is search("ERROR") and result_cmdb_fin_v is search("INFO")             

############################# closing implementation as success ####################            
        - name: END Implementation that is closing the implementation as success
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: end_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
                task_id: "{{ record_id_cmdb_up }}" #"{{ record_id }}"
                text: "{{ result_cmdb_fin_v }}"
          register: end_implementation
          when: result_cmdb_fin_v is not search("ERROR") and result_cmdb_fin_v is search("INFO")
 

        - name: start Validate Implementation for closing the success TR
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: validate
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_cmdb_up }}" #"{{ record_id }}"
              text: "{{ result_cmdb_fin_v }}"
          register: validation
          when: result_cmdb_fin_v is not search("ERROR") and result_cmdb_fin_v is search("INFO") 

          ########################  closing implementation as failed  ############################################
        - name: Implementation Failed that is closing the implementation as failed
          winaproach:
            system: prod #"{{ winaproach_env }}"
            type: task_record
            operation: fail_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_cmdb_up }}" #"{{ record_id }}"
              text: "{{ result_cmdb_fin_v }}"
          register: fail_implementation  
          when: result_cmdb_fin_v is search("ERROR") and result_cmdb_fin_v is not search("INFO")

        
      rescue:
        - debug:
            msg: "Exception occurred so rescued the main tr result block for CMDB update"

             