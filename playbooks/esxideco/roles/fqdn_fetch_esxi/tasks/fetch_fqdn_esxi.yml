        - name: Log failure for FQDN using lineinfile (append)
          lineinfile:
            path: "{{ file_failure_fqdn }}"
            line: "{{ inventory_hostname }}, {{ time }}, [ERROR], Failed to fetch FQDN for the server from Synergon. Details: {{ esxi_data | to_json }}"
            create: yes
            insertafter: EOF
            mode: '0644'
          delegate_to: localhost
          when: >
            esxi_type not in ['HPEnclosure', 'LenovoEnclosure'] and
            (esxi_data.skipped is not defined or not esxi_data.skipped) and
