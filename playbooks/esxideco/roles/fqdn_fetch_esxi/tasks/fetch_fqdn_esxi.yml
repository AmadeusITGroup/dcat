              esxi_data.failed is defined and esxi_data.failed or
              esxi_data.esxi_details is not defined or
              esxi_data.esxi_details | length == 0 or
              esxi_data.esxi_details[0].fqdn is not defined or
              esxi_data.esxi_details[0].fqdn | trim == "" or
              esxi_data.esxi_details[0].fqdn in ['Exception', 'Unable'] or
