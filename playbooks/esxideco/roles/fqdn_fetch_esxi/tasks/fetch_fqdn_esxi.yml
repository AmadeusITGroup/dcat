        # Success Block
        - name: Log success for ESXi type in CMDB
          shell: echo "{{ inventory_hostname }}, {{ time }}, [SUCCESS], {{ enclosure_cmdb_check.server_type }}" >> {{ file_suc_fqdn }}
          delegate_to: localhost
          when: >
            enclosure_cmdb_check is defined and
            enclosure_cmdb_check.cmdb_check_result is defined and
            'Successfully' in enclosure_cmdb_check.cmdb_check_result

        # - name: Display the JSON file content
        #   shell: cat private_endpoint_connection_string.yml
        #   delegate_to: localhost
        #   register: result_private_endpoint_connection_string
    
        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
        #   delegate_to: localhost 

        - name: "Update ESXi type in Azure table "
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
            module_name: "esxi_type"
            status: "{{ enclosure_cmdb_check.server_type }}"           
          register: update_status_state_file
          delegate_to: localhost
          when: cmdb_dup_check == "T" and esxi_type == "F"

# ==============================================================================================================================
# FQDN Enclosure
# ==============================================================================================================================
             
        - name: "Check esxi type for server from Azure table"
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost

        - name: Set ESXi type from module update
          set_fact: 
            esxi_type: '{{ idem_status.module_update.esxi_type }}'

        - name: Set FQDN info from module update
          set_fact: 
            fqdn_info: '{{ idem_status.module_update.fqdn_info }}'

        - name: Set VCenter info from module update
          set_fact: 
            vcenter_info: '{{ idem_status.module_update.vcenter_info }}'

        - name: Set enclosure name from module update
          set_fact: 
            enclosure_name: '{{ idem_status.module_update.enclosure_name }}'

        - name: Fetch ESXi details
          enclosure_synergon_data_fetch:
            enclosure: "{{ inventory_hostname }}"
            synergon_api: "{{ hostvars['localhost']['config_data']['synergon_url'] }}"
          delegate_to: localhost
          register: esxi_data
          when: esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and cmdb_dup_check == "T" and vcenter_info == "F"


        - name: Debug - Check the content of vcenter_output
          debug:
            var: esxi_data

        - name: Debug vCenter and FQDN values
          debug:
            msg:
              - "vCenter: {{ esxi_data.esxi_details[0].vcenter }}"
          when: esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and cmdb_dup_check == "T" and vcenter_info == "F"

        - name: Set domain based on vcenter
          set_fact:
            domain: "{{ '.clfra1.net' if esxi_data.esxi_details[0].vcenter == 'fracol1vcsa1' else '.muc.net' }}"
          when: esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and cmdb_dup_check == "T" and vcenter_info == "F"



        - name: "Update FQDN for Enclosure in Azure table "
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "fqdn_info"
            status: "{{ inventory_hostname }}{{ domain }}"           
          register: update_status_state_file
          delegate_to: localhost
          # when: esxi_type is HPEnclosure or LenovoEnclosure
          when: esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and cmdb_dup_check == "T" and fqdn_info == "F" 



          
        - name: "Update vcenter name in Azure table"
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "vcenter_info"
            status: "{{ esxi_data.esxi_details[0].vcenter }}"
          register: update_status_state_file
          delegate_to: localhost
          when: esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and cmdb_dup_check == "T" and vcenter_info == "F"

        - name: "Update Enclosure names for Blade in Azure table"
          azure_update_module_vals_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{ inventory_hostname }}"
            module_name: "enclosure_name"
            status: "{{ inventory_hostname }}"
          register: update_status_state_file
          delegate_to: localhost
          when: esxi_type in ['HPEnclosure', 'LenovoEnclosure'] and cmdb_dup_check == "T" and enclosure_name == "F"
    
