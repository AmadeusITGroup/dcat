--- 
    - name: Handle the error
      throttle: 1
      block:       
        - set_fact:
            file_failure_fqdn: "fqdn_failure_esxi.yml"
            file_suc_fqdn: "fqdn_success_esxi.yml"
          run_once: true


        - name: Display the JSON file content
          shell: cat record_for_fetch_fqdn_esxi.json
          delegate_to: localhost
          run_once: true
          register: TR_result_fqdn_fetch_esxi

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_fqdn_fetch_esxi: "{{ TR_result_fqdn_fetch_esxi.stdout[1:-1] }}"
          run_once: true
          delegate_to: localhost         

        - meta: end_host
          when: record_id_fqdn_fetch_esxi== ""   

# ===================================================================================================================================
# Esxi type
# ===================================================================================================================================

        - name: Display the JSON file content
          shell: cat private_endpoint_connection_string.yml
          delegate_to: localhost
          run_once: true
          register: result_private_endpoint_connection_string
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
          run_once: true
          delegate_to: localhost      

                 
        - name: "Check entry for DECO server for filter hostlist for FQDN and Vcenter Fetch"
          azure_update_ref_esxi:
            connection_string: "{{ private_endpoint_connection_string }}"
            hostname: "{{inventory_hostname}}"
          register: idem_status 
          delegate_to: localhost

        - set_fact: 
            cmdb_dup_check: '{{ idem_status.module_update.cmdb_dup_check }}'                   
           

        - set_fact: 
            esxi_type: '{{idem_status.module_update.esxi_type}}'              


        - name: Set FQDN info from module update
          set_fact: 
            fqdn_info: '{{ idem_status.module_update.fqdn_info }}'

        - name: Set VCenter info from module update
          set_fact: 
            vcenter_info: '{{ idem_status.module_update.vcenter_info }}'

        - name: Set enclosure name from module update
          set_fact: 
            enclosure_name: '{{ idem_status.module_update.enclosure_name }}'



        # - name: End play for this host
        #   meta: end_host
        #   when: cmdb_dup_check != "T" or esxi_type != "F" or fqdn_info != "F" or vcenter_info != "F" or enclosure_name != "F"
        #   # when: cmdb_dup_check != "T" or (esxi_type != "F" and fqdn_info != "F" and vcenter_info != "F" and enclosure_name != "F")
        #   # when: cmdb_dup_check != "T"

        - name: End play for this host
          meta: end_host
          when:
            - cmdb_dup_check != "T"
              or
              (esxi_type != "F"
              and fqdn_info != "F"
              and vcenter_info != "F"
              and enclosure_name != "F")



        - name: Check entries for Enclosure in CMDB
          get_esxi_type_cmdb:
            conn_str: "{{ private_endpoint_connection_string }}"
            server_name: "{{ inventory_hostname | lower }}"
            cmdb_server: "{{ cmdb_url_update }}"
            user_name: "{{ emdb_username }}"
            pass_word: "{{ emdb_password }}"
          delegate_to: localhost
          register: enclosure_cmdb_check
          retries: 3
          delay: 1
          ignore_errors: yes
          # when: cmdb_dup_check == "T" and (fqdn_info == "F" or vcenter_info == "F")
          # when: cmdb_dup_check == "T" and esxi_type == "F" #(fqdn_info == "F" or vcenter_info == "F")



        - name: "Debug server_type from CMDB check"
          debug:
            msg: "Server Type: {{ enclosure_cmdb_check.server_type }}"
          # when: cmdb_dup_check == "T" and esxi_type == "F"

        - name: Get timestamp from the system
          shell: "date +%Y-%m-%d/%H:%M"
          delegate_to: localhost
          register: tstamp              

        - set_fact:
            time: "{{ tstamp.stdout }}"

        - name: Log failure for ESXi type in CMDB
          shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{ enclosure_cmdb_check.server_type }}" >> {{ file_failure_fqdn }}
          delegate_to: localhost
          when: >
            enclosure_cmdb_check is defined and
            (enclosure_cmdb_check.cmdb_check_result is not defined or
            'Successfully' not in enclosure_cmdb_check.cmdb_check_result)


        # - name: End host if CMDB check failed
        #   meta: end_host
        #   when: >
        #     enclosure_cmdb_check.cmdb_check_result is not defined or
        #     'Successfully' not in enclosure_cmdb_check.cmdb_check_result
        #   # when: "'Successfully' not in enclosure_cmdb_check.server_type"

        - name: End host if CMDB check failed
          meta: end_host
          when: >
            enclosure_cmdb_check is defined and
            (
              enclosure_cmdb_check.cmdb_check_result is not defined or
              'Successfully' not in enclosure_cmdb_check.cmdb_check_result
            )

        # # Success Block
        # - name: Log success for ESXi type in CMDB
        #   shell: echo "{{ inventory_hostname }}, {{ time }}, [SUCCESS], {{ enclosure_cmdb_check.server_type }}" >> {{ file_suc_fqdn }}
        #   delegate_to: localhost
        #   when: >
        #     enclosure_cmdb_check.cmdb_check_result is defined and
