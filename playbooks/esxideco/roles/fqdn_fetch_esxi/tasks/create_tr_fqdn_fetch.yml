---
  # tasks: 
    - name: "Handling Create TR- Win@proach for ESXI fqdn fetch  "
      block: 
        # - name: Display the JSON file content
        #   shell: cat record_healthcheck.json
        #   delegate_to: localhost
        #   register: TR_result_healthcheck  

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
        #   delegate_to: localhost

        # - meta: end_host
        #   when: record_id_healthcheck != ""      

        - name: ESXi Host list
          shell: cat host_list_fqdn_fetch_esxi.yml
          delegate_to: localhost
          register: hostlist_esxi            

        - name: save the Esxi list to a Variable as a Fact
          set_fact:
            esxi_hostlist: "{{ hostlist_esxi.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: esxi_hostlist == ""       

        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO - fqdn vcenter fetch"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"   #"DINFDECO"            
            severity: "4"
            overview: "ESXI DECO - fqdn fetch"
            parent_id: "{{ cr }}"            
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
       
        - set_fact:
            record_fetch_fqdn_exi: "{{create_tr_output.record_id}}"

        - copy:
            content: '{{ record_fetch_fqdn_exi|to_json }}'
            dest: record_for_fetch_fqdn_esxi.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "{{win_url}}"
            task_id: "{{ record_fetch_fqdn_exi }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create ESXI DECO - for fqdn vcenter fetch "

