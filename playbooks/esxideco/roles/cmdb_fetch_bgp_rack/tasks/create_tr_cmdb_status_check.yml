---
# - name: "This playbook is to Create TR for CMDB FETCH task"
#   hosts: all
#   gather_facts: no
#   vars:
#     record_id_cmdb_fetch: ""
#     graceperiod_flag: true
#     cmdb_fetch_check: False   #### state file variable
#     backup: true  ### state file variable of previous module
       
    
#       #### TR creation  ###########  
      
#  ############## include all state file,filter hosts and health check conditions #################################   
#   tasks:    
    - name: "Handling Create TR- Win@proach for CMDB FETCH task "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""

        - name: physical_host list
          shell: cat host_list_cmdb_fetch_bgp.yml
          delegate_to: localhost
          register: hostlist_cmdb_fetch             

        - name: save the physical list to a Variable as a Fact
          set_fact:
            phy_hostlist: "{{ hostlist_cmdb_fetch.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: phy_hostlist == ""   

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost          

        - name: TR creation for CMDB FETCH task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: ESXI RACK DECO : cmdb status update- Deco in Progress"
            ci: "{{ phy_hostlist }}" 
            winaproach_category: "{{ win_category }}"
          register: ticket_id_cmdb_fetch
          delegate_to: localhost

        - debug:
            var: ticket_id_cmdb_fetch

        - set_fact:
            record_id_cmdb_fetch: "{{ticket_id_cmdb_fetch.id.ticketId}}"

    
        - copy:
            content: '{{ record_id_cmdb_fetch|to_json }}'
            dest: record_cmdb_fetch.json
          delegate_to: localhost

      rescue:
        - name: TR creation
          debug:
            msg: "Failed to Create ESXI DECO - CMDB FETCH TR" 

    - name: "Handling Create TR- Win@proach for CMDB FETCH task - retry -1"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""   
         
        - name: Display the JSON file content for CMDB FETCH
          shell: cat record_cmdb_fetch.json
          delegate_to: localhost
          register: TR_result_cmdb_fetch 

        - name: save the Json data to a Variable as a Fact for CMDB FETCH
          set_fact:
            record_id_cmdb_fetch: "{{ TR_result_cmdb_fetch.stdout[1:-1] }}"
          delegate_to: localhost

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_id_cmdb_fetch == ""                                

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "I" #"{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost          

        - name: TR creation for CMDB FETCH task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: ESXI RACK DECO : cmdb status update- Deco in Progress"
            ci: "{{ phy_hostlist }}" 
            winaproach_category: "{{ win_category }}"
          register: ticket_id_cmdb_fetch
          delegate_to: localhost
          when: record_id_cmdb_fetch == ""
        

        - set_fact:
            record_id_cmdb_fetch_store: "{{ticket_id_cmdb_fetch.id.ticketId}}"
          when: record_id_cmdb_fetch == ""  
    
   
        - copy:
            content: '{{ record_id_cmdb_fetch_store|to_json }}'
            dest: record_cmdb_fetch.json
          delegate_to: localhost
          when: ticket_id_cmdb_fetch is defined

      rescue:
        - name: TR creation
          debug:
            msg: "Failed to Create ESXI DECO - cmdb fetch  TR"

    - name: "Handling Create TR- Win@proach for cmdb fetch task -retry 2 "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""
          
        - name: Display the JSON file content for CMDB FETCH
          shell: cat record_cmdb_fetch.json
          delegate_to: localhost
          register: TR_result_cmdb_fetch  

        - name: save the Json data to a Variable as a Fact for CMDB FETCH
          set_fact:
            record_id_cmdb_fetch: "{{ TR_result_cmdb_fetch.stdout[1:-1] }}"
          delegate_to: localhost 

        - name: Sleep for 20 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 20
          delegate_to: localhost
          when: record_id_cmdb_fetch == ""   

        # - name: Display the JSON file content
        #   shell: cat winaproach_category.yml
        #   delegate_to: localhost
        #   register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "I" #"{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost 

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost                   
                                      
        - name: TR creation for CMDB FETCH task 
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "cmdb status update"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: ESXI RACK DECO : cmdb status update- Deco in Progress"
            ci: "{{ phy_hostlist }}" 
            winaproach_category: "{{ win_category }}"
          register: ticket_id_cmdb_fetch
          delegate_to: localhost
          when: record_id_cmdb_fetch == ""
       

        - set_fact:
            record_id_cmdb_fetch_store: "{{ticket_id_cmdb_fetch.id.ticketId}}"
          when: record_id_cmdb_fetch == "" 
        
        - copy:
            content: '{{ record_id_cmdb_fetch_store|to_json }}'
            dest: record_cmdb_fetch.json
          delegate_to: localhost
          when: ticket_id_cmdb_fetch is defined

      rescue:
        - name: TR creation
          debug:
            msg: "Failed to Create ESXI DECO - CMDB FETCH TR"                                 

    - name: "Handling Start Implementation- Win@proach CMDB FETCH TR "
      block:    

        - name: Display the JSON file content for CMDB FETCH
          shell: cat record_cmdb_fetch.json
          delegate_to: localhost
          register: TR_result_cmdb_fetch 

        - name: save the Json data to a Variable as a Fact for CMDB FETCH
          set_fact:
            record_id_cmdb_fetch: "{{ TR_result_cmdb_fetch.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_cmdb_fetch == ""

        - name: Sleep for 62 seconds and continue with CMDB FETCH start implementation
          ansible.builtin.wait_for:
            timeout: 62
          delegate_to: localhost

        - name: Start Implementation for CMDB FETCH TR
          winaproach:
            system: prod
            type: task_record
            operation: start_implementation
            username: "{{ winaproach_username }}"
            password: "{{ winaproach_password }}"
            fields:
              task_id: "{{ record_id_cmdb_fetch }}"
          register: start_implementation
          delegate_to: localhost
       
    
      rescue:
        - name: dump test output in the rescue block for CMDB FETCH for TR creation module
          debug:
            msg: "Failed to Start Implementation on ESXI DECO - CMDB FETCH:'{{ record_id_cmdb_fetch }}'"