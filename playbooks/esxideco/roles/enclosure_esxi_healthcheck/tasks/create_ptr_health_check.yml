    - name: "Handling PTR record for CMDB healthcheck"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck_enclosure.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck == ""       

        - name: Display the JSON file content
          shell: cat check_remedy_fail.yml
          delegate_to: localhost
          register: result_check_remedy

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_remedy: "{{ result_check_remedy.stdout }}" 
          delegate_to: localhost    


        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the BMC remedy(CMDB) error which needs support"
            form3: "***********************************************************************"
        - set_fact:
            content_check_remedy: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_remedy }}"
          when: check_remedy != ""

        - name: Display the JSON file content
          shell: cat record_healthcheck_enclosure.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - name: read yaml file from the specific location 
          set_fact:
            file_content: "{{lookup('file', 'machinegroups.yml')}}"

        - name: split the file content
          set_fact:
            lines: "{{file_content.split('\n')}}"

        - name: convert the lines in the file to dict
          set_fact:
            res_dict: "{{ res_dict | default({}) | combine({ item.split('\t')[0]: item.split('\t')[1] }) }}"
          loop: "{{ lines }}"

        - name: find which key is preset in the log
          set_fact: 
            present_key2: "{{ present_key2 | default([]) + [item] }}"
          loop: "{{ res_dict.keys() }}"
          when: content_check_remedy is defined and item in content_check_remedy

        - name: print the corresponded  value of the key present
          set_fact:
            allowner_name2: "{{ allowner_name2 | default({}) | combine({item:res_dict[item]}) }}"
          loop: "{{ present_key2 }}"
          when: content_check_remedy is defined

        - name: all owners with format
          set_fact:
            all_owner_Final2: | 
              {% for key,value in allowner_name2.items()%}
              {{ key }} : {{ value }}
              {% endfor %}
          when: content_check_remedy is defined

        - set_fact:
            Requester_group: "OSP000"  #  "Requester_group: {{requester_group}}"
            Requester_name: "K Vance" #  "Requester_name: {{requester_name}}"


        - name: "writing output to File"
          shell: echo -e "{{content_check_remedy}}\n\n{{Requester_group}}\n{{Requester_name}}\n\nOwner group Details below:\n{{all_owner_Final2}}" > groups_ptr.yml
          delegate_to: localhost
          when: content_check_remedy is defined

        - name: Display the JSON file content
          shell: cat groups_ptr.yml
          delegate_to: localhost
          register: result_groups2
          when: content_check_remedy is defined

        - name: save the Json data to a Variable as a Fact
          set_fact:
            support_groups2: "{{ result_groups2.stdout }}" 
          delegate_to: localhost
          when: content_check_remedy is defined

        - name: Create PTR Remedy
          problem_tr:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
            # ptr_title: "PYHSICAL DECO: Service health check BMC remedy(CMDB) referring to failed TR - {{ record_id_healthcheck }}"
            ptr_title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO : BMC remedy(CMDB) referring to failed TR - {{ record_id_healthcheck }}"
            tr_map: "{{ record_id_healthcheck }}"
            assignee_group: "DINFDECO" #"OEA02SNM"  
            ptr_logs: "{{ support_groups2 }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"         
          register: ptr_check_remedy
          until: '"Successfully" in ptr_check_remedy.msg'
          retries: 3
          delay: 10
          when: check_remedy != ""


        - name: Update TR with PTR
          tr_overview:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_healthcheck }}"
            prob_id: "{{ ptr_check_remedy.id }}"                   
          register: update_overview  
          when: check_remedy != "" 

      rescue:
        - debug:
            msg: "Exception occurred PTR service health check - BMC remedy(CMDB)"                               
