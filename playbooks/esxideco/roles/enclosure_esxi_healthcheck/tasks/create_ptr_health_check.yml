    - name: "Handling PTR record for Synergon healthcheck"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck_enclosure.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck == ""           

        - name: Display the Synergon fail file content
          shell: cat check_synergon_fail.yml
          delegate_to: localhost
          register: result_check_synergon

        - name: save the Synergon fail data to a Variable as a Fact
          set_fact:
            check_synergon: "{{ result_check_synergon.stdout }}" 
          delegate_to: localhost        

        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the Synergon error which needs support"
            form3: "***********************************************************************"
        - set_fact:
            content_check_synergon: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_synergon }}"
          when: check_synergon != ""

        - name: Display the JSON file content
          shell: cat record_healthcheck_enclosure.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - name: read yaml file from the specific location 
          set_fact:
            file_content: "{{lookup('file', 'machinegroups.yml')}}"

        - name: split the file content
          set_fact:
            lines: "{{file_content.split('\n')}}"

        - name: convert the lines in the file to dict
          set_fact:
            res_dict: "{{ res_dict | default({}) | combine({ item.split('\t')[0]: item.split('\t')[1] }) }}"
          loop: "{{ lines }}"

        - name: find which key is preset in the log
          set_fact: 
            present_key3: "{{ present_key3 | default([]) + [item] }}"
          loop: "{{ res_dict.keys() }}"
          when: content_check_synergon is defined and item in content_check_synergon

        - name: print the corresponded  value of the key present
          set_fact:
            allowner_name3: "{{ allowner_name3 | default({}) | combine({item:res_dict[item]}) }}"
          loop: "{{ present_key3 }}"
          when: content_check_synergon is defined

        - name: all owners with format
          set_fact:
            all_owner_Final3: | 
              {% for key,value in allowner_name3.items()%}
              {{ key }} : {{ value }}
              {% endfor %}
          when: content_check_synergon is defined

        - set_fact:
            Requester_group: "OSP000"  #  "Requester_group: {{requester_group}}"
            Requester_name: "K Vance" #  "Requester_name: {{requester_name}}"


        - name: "writing output to File"
          shell: echo -e "{{content_check_synergon}}\n\n{{Requester_group}}\n{{Requester_name}}\n\nOwner group Details below:\n{{all_owner_Final3}}" > groups_ptr.yml
          delegate_to: localhost
          when: content_check_synergon is defined

        - name: Display the JSON file content
          shell: cat groups_ptr.yml
          delegate_to: localhost
          register: result_groups3
          when: content_check_synergon is defined

        - name: save the Json data to a Variable as a Fact
          set_fact:
            support_groups3: "{{ result_groups3.stdout }}" 
          delegate_to: localhost
          when: content_check_synergon is defined


        - name: Create PTR Synergon
          problem_tr:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
            # ptr_title: "PHYSICAL DECO: Service health check Synergon validation failed TR - {{ record_id_healthcheck }}"
            ptr_title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO : Synergon validation failed TR - {{ record_id_healthcheck }}"
            tr_map: "{{ record_id_healthcheck }}"
            assignee_group: "OSP000"  
            ptr_logs: "{{ support_groups3 }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"         
          register: ptr_check_synergon
          until: '"Successfully" in ptr_check_synergon.msg'
          retries: 3
          delay: 10  
          when: check_synergon != ""

        - name: Update TR with PTR
          tr_overview:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_healthcheck }}"
            prob_id: "{{ ptr_check_synergon.id }}"                   
          register: update_overview  
          when: check_synergon != "" 

      rescue:
        - debug:
            msg: "Exception occurred PTR service health check - Synergon check"
                              
