---
# - name: "This playbook is to Create TR for service health check SSH"
#   hosts: localhost
#   gather_facts: no

#   vars:
#     graceperiod_flag: False  
           
      #### TR creation  #####  
      
    
  # tasks:    
    - name: "Handling Create TR- Win@proach for health check task "
      block:


        - name: Display the JSON file content
          shell: cat esxi_ssh_fail.yml
          delegate_to: localhost
          register: result_check_linux

        - name: save the Json data to a Variable as a Fact
          set_fact:
            esxi_ssh_fail: "{{ result_check_linux.stdout }}" 
          delegate_to: localhost                                                                    

        - meta: end_host
          when: esxi_ssh_fail == ""     


        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "ESXI DECO : Service health check - SSH connectivity linux"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "3"
            overview: "ESXI DECO - Service health check - SSH connectivity linux"
            parent_id: "{{ cr }}"           
            username: "DecoP112686"     
            password: "opFCtCpIMzmC"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output          

        - set_fact:
            record_id: "{{create_tr_output.record_id}}"
   
    
        - copy:
            content: '{{ record_id|to_json }}'
            dest: record_healthcheck_ssh.json
          delegate_to: localhost

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "{{win_url}}"
            task_id: "{{ record_id }}"
          register: add_document
          delegate_to: localhost

      rescue:
        - debug:
            msg: "Failed to Create ESXI DECO SSH - TR"

