############################################################################################################

    - name: "Handling PTR record for vcenter API healthcheck"
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck == ""       

        - name: Display the JSON file content
          shell: cat vcenter_api_fail.yml
          delegate_to: localhost
          register: result_check_vcenter_api

        - name: save the Json data to a Variable as a Fact
          set_fact:
            check_api_fail: "{{ result_check_vcenter_api.stdout }}" 
          delegate_to: localhost     


        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the Vcenter Api connectivity error which needs support"
            form3: "***********************************************************************"
        - set_fact:
            content_check_api: "{{ form1 +'\n'+ form2 +'\n'+ form3 +'\n'+ check_api_fail }}"
          when: check_api_fail != ""

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

################################################################################

        - name: read yaml file from the specific location 
          set_fact:
            file_content: "{{lookup('file', 'machinegroups.yml')}}"

        - name: split the file content
          set_fact:
            lines: "{{file_content.split('\n')}}"

        - name: convert the lines in the file to dict
          set_fact:
            res_dict: "{{ res_dict | default({}) | combine({ item.split('\t')[0]: item.split('\t')[1] }) }}"
          loop: "{{ lines }}"

        - name: find which key is preset in the log
          set_fact: 
            present_key1: "{{ present_key1 | default([]) + [item] }}"
          loop: "{{ res_dict.keys() }}"
          when: content_check_api is defined and item in content_check_api

        - name: print the corresponded  value of the key present
          set_fact:
            allowner_name1: "{{ allowner_name1 | default({}) | combine({item:res_dict[item]}) }}"
          loop: "{{ present_key1 }}"
          when: content_check_api is defined

        - name: all owners with format
          set_fact:
            all_owner_Final1: | 
              {% for key,value in allowner_name1.items()%}
              {{ key }} : {{ value }}
              {% endfor %}
          when: content_check_api is defined

        - set_fact:
            Requester_group: "OSP000"  #  "Requester_group: {{requester_group}}"
            Requester_name: "K Vance" #  "Requester_name: {{requester_name}}"

        - name: "writing output to File"
          shell: echo -e "{{content_check_api}}\n\n{{Requester_group}}\n{{Requester_name}}\n\nOwner group Details below:\n{{all_owner_Final1}}" > groups_ptr.yml
          delegate_to: localhost
          when: content_check_api is defined

        - name: Display the Groups PTR file content 
          shell: cat groups_ptr.yml
          delegate_to: localhost
          register: result_groups1
          when: content_check_api is defined

        - name: save the Json data to a Variable as a Fact
          set_fact:
            support_groups1: "{{ result_groups1.stdout }}" 
          delegate_to: localhost
          when: content_check_api is defined

        - name: Create PTR vCenter API
          problem_tr:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
            # ptr_title: "PYHSICAL DECO: Service health check Storage SAN Switches referring to failed TR - {{ record_id_healthcheck }}"
            ptr_title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO : Vcenter API Error failed TR - {{ record_id_healthcheck }}"
            tr_map: "{{ record_id_healthcheck }}"
            assignee_group: "OSP000" #"OSX04SMG"  
            ptr_logs: "{{ support_groups1 }}"
            winaproach_category: "{{ win_category }}"
            ptr_system: "{{ ptr_sys }}"         
          register: ptr_check_api_fail
          until: '"Successfully" in ptr_check_api_fail.msg'
          retries: 3
          delay: 10
          when: check_api_fail != ""

        - name: Update TR with PTR
          tr_overview:
            win_url: "{{win_url}}"
            username: "{{ winaproach_username }}"     
            password: "{{ winaproach_password }}"
            task_id: "{{ record_id_healthcheck }}"
            prob_id: "{{ ptr_check_api_fail.id }}"                   
          register: update_overview  
          when: check_api_fail != "" 

      rescue:
        - debug:
            msg: "Exception occurred PTR service health check - Vcenter API"                               
