          set_fact:
            check_final_success: "{{ result_check_final_suc.stdout }}" 
          delegate_to: localhost                                                                                          
        
        - set_fact:
            form1: "***********************************************************************"
            form2: "Below are the ESXI deco API's which are up and running successfully"
