# Update success message in TR

    - name: "Handling add message in TR"
      block: 

        - name: ESXi health check success list
          shell: cat check_final_success.yml
          delegate_to: localhost
          register: esxi_result              

        - name: Save the ESXi health success list to a Variable as a Fact
          set_fact:
            esxi_check_final_suc: "{{ esxi_result.stdout }}" 
          delegate_to: localhost     

        - name: Display the JSON file content
          shell: cat record_healthcheck_enclosure.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck == ""              
     
       
        - name: "Add message to TR"
          add_message_to_tr:
            record_id: "{{ record_id_healthcheck }}"
            message: "{{ content_check_final_suc }}"             
            username: "DecoP112686"     
            password: "opFCtCpIMzmC" 
          delegate_to: localhost
          register: add_msg_output
          when: esxi_check_final_suc != ""
                                

      rescue:
        - debug:
            var: add_msg_output            


  
