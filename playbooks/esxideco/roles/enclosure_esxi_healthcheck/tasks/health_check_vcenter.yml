---
# =========================================================================================================
# vCenter Api Status
# =========================================================================================================

- name: "Check vCenter API Status"
  block:

    - name: Display the JSON file content
      shell: cat record_healthcheck.json
      delegate_to: localhost
      register: TR_result_healthcheck_esxi

    - name: save the Json data to a Variable as a Fact
      set_fact:
        record_id_healthcheck_esxi: "{{ TR_result_healthcheck_esxi.stdout[1:-1] }}"
      delegate_to: localhost         

    - meta: end_host
      when: record_id_healthcheck_esxi == ""   

    - name: "Construct vCenter FQDN for standard cases"
      set_fact:
        fqdn_vc: ".muc.msp.net"
      when: 
        - vcenter is not search("mucvcdts02|mucvcdts01|fracol1vcsa1|mucvcsacb01|mucamnaz1|mucamnvcpa1|mucamnvcpa2|mucamnaz2|mucamnvcpb1|mucamnvcpb2|mucamnaz3|mucamnvcpc1|mucamnvcpc2")
        - vcenter is not search(".muc.msp.net")

    - name: "Construct vCenter FQDN for specific cases"
      set_fact:
        fqdn_vc: ".vclassic.net"
      when:
        - vcenter is search("mucvcdts02|mucvcdts01|fracol1vcsa1|mucvcsacb01|mucamnaz1|mucamnvcpa1|mucamnvcpa2|mucamnaz2|mucamnvcpb1|mucamnvcpb2|mucamnaz3|mucamnvcpc1|mucamnvcpc2")
        - vcenter is not search(".vclassic.net")

    - name: "Ensure fqdn_vc is set"
      set_fact:
        fqdn_vc: "{{ fqdn_vc | default('.muc.msp.net') }}"

    - name: "Define protocol for vCenter URL"
      set_fact:
        proto: "https://"

    - name: "Construct the complete vCenter URL"
      set_fact:
        vcenter_url: "{{ proto ~ vcenter ~ fqdn_vc }}"

    - name: Debug vCenter URL
      debug:
        msg: "Checking vCenter API at {{ vcenter_url }}"

    - name: Perform vCenter API Health Check
      uri:
        url: "{{ vcenter_url }}"
        validate_certs: no
      delegate_to: localhost
      register: vcenter_result
      until: "vcenter_result.status == 200"
      retries: 3
      delay: 10

    - name: Debug API status
      debug:
        msg: >
          API connectivity check:
          - URL: {{ vcenter_url }}
          - Status Code: {{ vcenter_result.status }}
          - Response Time: {{ vcenter_result.elapsed }}
          - Content: {{ vcenter_result.content | default('No content returned') }}

    - name: Get timestamp from the system (success)
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      register: tstamp_success

    - name: Set timestamp fact (success)
      set_fact:
        time: "{{ tstamp_success.stdout }}"

    - name: Log API connectivity success to a file
      shell: echo "#vCenter API - {{ time }}, [INFO], Successfully connected to {{ vcenter_url }}" >> vcenter_api_success.yml
      delegate_to: localhost

    - name: Unset rescue_triggered fact
      set_fact:
        api_rescue_triggered: false

  rescue:

    - name: Set rescue_triggered fact
      set_fact:
        api_rescue_triggered: true

    - name: Debug API connectivity failure
      debug:
        msg: "Failed to connect to the vCenter API after 3 retries."

    - name: Get timestamp from the system (rescue)
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      register: tstamp_failure

    - name: Set timestamp fact (rescue)
      set_fact:
        time: "{{ tstamp_failure.stdout }}"

    - name: Log API connectivity failure to a file
      shell: echo "!vCenter API - {{ time }}, [ERROR], Unable to connect to {{ vcenter_url }} after 3 retries" >> vcenter_api_fail.yml
      delegate_to: localhost


