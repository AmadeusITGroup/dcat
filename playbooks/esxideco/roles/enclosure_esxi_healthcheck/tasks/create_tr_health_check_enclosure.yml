---
- name: Execute Create TR task
  block:

    # - name: esxi_host list
    #   shell: cat host_list_blades_health_check.yml
    #   delegate_to: localhost
    #   register: hostlist_esxi             

    # - name: save the esxi list to a Variable as a Fact
    #   set_fact:
    #     esxi_hostlist: "{{ hostlist_esxi.stdout[:-1] }}" 
    #   delegate_to: localhost 

    # - meta: end_host
    #   when: esxi_hostlist == ""    
      

    - name: "Custom module [CREATE TR]"
      create_tr:
        record_type: "TR"
        title: "CSTY:DECO:DCAT: ESXI ENCLOSURE/ BLADES DECO : Service health check ESXi"
        assignee_name: "DecoP112686"
        assignee_group: "DINFDECO"
        severity: "3"
        overview: "CSTY:DECO:DCAT: ESXi DECO - Service health check"
        parent_id: "{{ cr }}"
        username: "{{ winaproach_username }}"     
        password: "{{ winaproach_password }}"
      delegate_to: localhost
      no_log: False
      register: create_tr_output

    - set_fact:
        record_id: "{{ create_tr_output.record_id }}"

    - copy:
        content: '{{ record_id | to_json }}'
        dest: record_healthcheck_enclosure.json
      delegate_to: localhost

    - name: Adding documentation tag
      tr_documentation:
        username: "{{ winaproach_username }}"
        password: "{{ winaproach_password }}"
        win_url: "{{win_url}}"
        task_id: "{{ record_id }}"
      register: add_document
      delegate_to: localhost

  rescue:
    - debug:
        msg: "Failed to Create ESXi healthcheck DECO - TR"



