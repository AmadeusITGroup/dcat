    - name: "Handling Start Implementation- Win@proach "
      block:

        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""

        - name: ESXI_host list
          shell: cat host_list_shutdown.yml
          delegate_to: localhost
          register: hostlist_esxi    
                 
        - name: save the ESXI list to a Variable as a Fact
          set_fact:
            esxi_hostlist: "{{ hostlist_esxi.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: esxi_hostlist == ""  

        - name: Display the JSON file content
          shell: cat record_shutdown.json
          delegate_to: localhost
          register: TR_result
    
        - name: save the Json data to a Variable as a Fact
          set_fact:
            shutdown_record_id: "{{ TR_result.stdout[1:-1] }}" 
          delegate_to: localhost         

        - meta: end_host
          when: shutdown_record_id == ""                            

        - name: Sleep for 62 seconds and continue with play
          ansible.builtin.wait_for:
            timeout: 62
          delegate_to: localhost           

        - name: Start Implementation
          winaproach:
            system: prod
            type: task_record
            operation: start_implementation
            username: "{{ winAproach_username }}"
            password: "{{ winAproach_password }}"
            fields:
              task_id: "{{ shutdown_record_id }}"
          register: start_implementation
          delegate_to: localhost
          
    
      rescue:
        - debug:
            msg: "Failed to Start Implementation on PHYSICAL DECO - Server Shutdown TR :'{{ shutdown_record_id }}'"
       
