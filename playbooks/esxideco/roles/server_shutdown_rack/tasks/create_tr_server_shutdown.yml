---    
    - name: "Handling Create TR- Win@proach "
      block:
        - name: Display the JSON file content
          shell: cat record_healthcheck.json
          delegate_to: localhost
          register: TR_result_healthcheck  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_healthcheck: "{{ TR_result_healthcheck.stdout[1:-1] }}"
          delegate_to: localhost

        - meta: end_host
          when: record_id_healthcheck != ""

        # - name: Display the JSON file content
        #   shell: cat idem_server_shutdown_pre.json
        #   delegate_to: localhost
        #   register: result_disable_monitoring

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     idem_dns_check_network_flag: "{{ result_disable_monitoring.stdout }}" 
        #   delegate_to: localhost

        # - meta: end_host
        #   when: idem_dns_check_network_flag == false
  

        # - name: Display the JSON file content
        #   shell: cat idem_server_shutdown.json
        #   delegate_to: localhost
        #   register: result_app_cmdb

        # - name: save the Json data to a Variable as a Fact
        #   set_fact:
        #     idem_dns_check_flag: "{{ result_app_cmdb.stdout }}" 
        #   delegate_to: localhost

        # - meta: end_host
        #   when: idem_dns_check_flag == true       

        - name: ESXI_host list
          shell: cat host_list_shutdown.yml
          delegate_to: localhost
          register: hostlist_esxi              

        - name: save the ESXI list to a Variable as a Fact
          set_fact:
            esxi_hostlist: "{{ hostlist_esxi.stdout[:-1] }}" 
          delegate_to: localhost 

        - meta: end_host
          when: esxi_hostlist == ""

        - name: Display the JSON file content
          shell: cat winaproach_category.yml
          delegate_to: localhost
          register: result_winaproach_category

        - name: save the Json data to a Variable as a Fact
          set_fact:
            win_category: "{{ result_winaproach_category.stdout }}" 
          delegate_to: localhost

        - name: Display the JSON file content
          shell: cat bird_api.yml
          delegate_to: localhost
          register: result_bird

        - name: save the Json data to a Variable as a Fact
          set_fact:
            bird_api: "{{ result_bird.stdout }}" 
          delegate_to: localhost                    

        - name: TR creation for Server Shutdown task  
          create_tr_bird:
            username: "{{ btmp_user }}"
            password: "{{ btmp_password }}"
            bird: "{{ bird_api }}"
            template_name: "server shutdown"
            cr_id: "{{ cr }}"
            ticket_title: "CSTY:DECO:DCAT: ESXI RACK DECO : Server Shutdown"
            ci: "{{ esxi_hostlist }}"
            winaproach_category: "{{ win_category }}" 
          register: ticket_id
          delegate_to: localhost
        
        - set_fact:
            shutdown_record_id: "{{ticket_id.id.ticketId}}"
    

        - copy:
            content: '{{ shutdown_record_id|to_json }}'
            dest: record_shutdown.json
          delegate_to: localhost

    
      rescue:
        - debug:
            msg: "Failed to Create - Server Shutdown TR"

