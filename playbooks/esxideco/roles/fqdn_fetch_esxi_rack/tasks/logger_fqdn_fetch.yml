    - name: "Logger and Create/Update TR- Win@proach "
      block:

        - set_fact:
            final_cmdb_stat_log: "final_cmdb_stat_log.yml"

        - name: Display the JSON file content
          shell: cat record_cmdb_stat.json
          delegate_to: localhost
          register: TR_result_cmdb_stat  

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id_cmdb_stat: "{{ TR_result_cmdb_stat.stdout[1:-1] }}"
          delegate_to: localhost         

        - meta: end_host
          when: record_id_cmdb_stat == ""           

        - name: VM_host list
          shell: cat final_cmdb_stat_log.yml
          delegate_to: localhost
          register: vm_result_cmdb             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            vm: "{{ vm_result_cmdb.stdout }}" 
          delegate_to: localhost


        - meta: end_host
          when: vm == ""

        - name: VM_host list
          shell: cat record_vm_logger.json
          delegate_to: localhost
          register: record_result              

        - name: save the Json data to a Variable as a Fact
          set_fact:
            record_id: "{{ record_result.stdout }}" 
          delegate_to: localhost          


################# CREATE TR ################
        - name: "Custom module [CREATE TR]"
          create_tr:
            record_type: "TR"
            title: "VM DECO -LOGGER BEFORE GRACE PERIOD"
            assignee_name: "DecoP112686"
            assignee_group: "DINFDECO"            
            severity: "4"
            overview: "VM DECO -LOGGER BEFORE GRACE PERIOD"
            parent_id: "{{ cr }}"            
            username: "{{ winAproach_username }}"
            password: "{{ winAproach_password }}"
          delegate_to: localhost  
          no_log: False
          register: create_tr_output
          when: record_id == ""
        
        - set_fact:
            record_vm_logger: "{{create_tr_output.record_id}}"
          when: record_id == ""  
       
        - copy:
            content: '{{ record_vm_logger|to_json }}'
            dest: record_vm_logger.json
          delegate_to: localhost 
          when: record_id == "" 

        - name: adding documentation tag
          tr_documentation:
            username: "{{ winaproach_username }}"    
            password: "{{ winaproach_password }}"
            win_url: "{{win_url}}"
            task_id: "{{ record_vm_logger }}"
          register: add_document
          delegate_to: localhost  
          when: record_id == ""           
                   
################# LOGGER ###################
        - name: VM_host list
          shell: cat record_vm_logger.json
          delegate_to: localhost
          register: vm_result             

        - name: save the vm list to a Variable as a Fact
          set_fact:
            record_vm_logger: "{{ vm_result.stdout[1:-1] }}"  
          delegate_to: localhost


        - name: logger data
          shell: cat final_cmdb_stat_log.yml
          delegate_to: localhost
          register: cmdb_log 
                    

        - name: save the vm list to a Variable as a Fact
          set_fact:
            log_cmdb_stat: "{{ cmdb_log.stdout }}" 
          delegate_to: localhost
       

        # - name: "Test custom module Logger."
