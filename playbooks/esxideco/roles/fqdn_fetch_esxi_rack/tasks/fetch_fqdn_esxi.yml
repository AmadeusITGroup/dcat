---
- name: Handle the error
  throttle: 1
  block:
    - set_fact:
        file_failure_fqdn: "fqdn_failure_esxi.yml"
        file_suc_fqdn: "fqdn_success_esxi.yml"

    - name: Display the JSON file content
      shell: cat record_for_fetch_fqdn_esxi.json
      delegate_to: localhost
      register: TR_result_fqdn_fetch

    - name: Save the JSON data to a variable as a fact
      set_fact:
        record_id_fqdn_fetch: "{{ TR_result_fqdn_fetch.stdout[1:-1] }}"
      delegate_to: localhost

    - meta: end_host
      when: record_id_fqdn_fetch == ""

    - name: Display the JSON file content
      shell: cat private_endpoint_connection_string.yml
      delegate_to: localhost
      register: result_private_endpoint_connection_string

    - name: Save the JSON data to a variable as a fact
      set_fact:
        private_endpoint_connection_string: "{{ result_private_endpoint_connection_string.stdout }}"
      delegate_to: localhost

####################################################################################################################
########################################### FQDN Fetch #############################################################
####################################################################################################################

    - name: Fetch FQDN From CMDB
      fqdn_fetch_cmdb:
        conn_str: "{{ private_endpoint_connection_string }}"
        server_name: '{{ inventory_hostname | lower }}'
        cmdb_server: "{{ cmdb_url_update }}"
        user_name: "{{ emdb_username }}"
        pass_word: "{{ emdb_password }}"
      delegate_to: localhost
      register: output_fqdn
      until: '"Exception" not in output_fqdn.cmdb_result_fqdn'
      retries: 3
      delay: 30

    - set_fact:
        esxi_cmdb_status: "{{ output_fqdn.cmdb_result_fqdn }}"
        
    - set_fact:
        esxi_fqdn: "{{ inventory_hostname }}.{{ esxi_cmdb_status }}"
      when: esxi_cmdb_status is not search("Exception|Unable")

    - debug:
        var: esxi_fqdn

    - name: Get timestamp from the system
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      register: tstamp

    - set_fact:
        time: "{{ tstamp.stdout }}"

    - name: Log success for FQDN Fetch in CMDB
      shell: echo "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully fetched fqdn of the server from synergon {{ esxi_fqdn }} ." >> {{ file_suc_fqdn }}
      delegate_to: localhost
      when: esxi_fqdn is not search("Exception|Unable")

    - name: Log failure for FQDN Fetch in CMDB
      shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{ output_fqdn }}" >> {{ file_failure_fqdn }}
      delegate_to: localhost
      when: esxi_fqdn is search("Exception|Unable")

#################################### Updating statefile for FQDN value ###############################################

    - name: Update entry for DECO server for FQDN
      azure_update_module_vals_esxi:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{ inventory_hostname }}"
        module_name: "fqdn_info"
        status: "{{ esxi_fqdn }}"
      register: update_status
      delegate_to: localhost
      when: esxi_fqdn is not search("Exception|Unable")

####################################################################################################################
########################################### ESXi Type Fetch ########################################################
####################################################################################################################

    - name: Check entries for Enclosure in CMDB and fetch ESXi Type
      get_esxi_type_cmdb:
        conn_str: "{{ private_endpoint_connection_string }}"
        server_name: "{{ inventory_hostname | lower }}"
        cmdb_server: "{{ cmdb_url_update }}"
        user_name: "{{ emdb_username }}"
        pass_word: "{{ emdb_password }}"
      delegate_to: localhost
      register: rack_cmdb_check
      retries: 3
      delay: 1
      ignore_errors: yes

    - name: Debug server_type from CMDB check
      debug:
        msg: "Server Type: {{ rack_cmdb_check.server_type }}"

    - name: Get timestamp from the system
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      register: tstamp

    - set_fact:
        time: "{{ tstamp.stdout }}"

    - name: Log failure for ESXi type in CMDB
      shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], {{ rack_cmdb_check.server_type }}" >> {{ file_failure_fqdn }}
      delegate_to: localhost
      when: >
        rack_cmdb_check is defined and
        (rack_cmdb_check.cmdb_check_result is not defined or
        'Successfully' not in rack_cmdb_check.cmdb_check_result)

    - name: Log success for ESXi type in CMDB
      shell: echo "{{ inventory_hostname }}, {{ time }}, [SUCCESS], {{ rack_cmdb_check.server_type }}" >> {{ file_suc_fqdn }}
      delegate_to: localhost
      when: >
        rack_cmdb_check is defined and
        rack_cmdb_check.cmdb_check_result is defined and
        'Successfully' in rack_cmdb_check.cmdb_check_result

########################### Updating Statefile for ESXi Type value ###############################################

    - name: Update entry for DECO server for ESXi Type
      azure_update_module_vals_esxi:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{ inventory_hostname }}"
        module_name: "esxi_type"
        status: "{{ rack_cmdb_check.server_type }}"
      register: update_status
      delegate_to: localhost
      when: >
        rack_cmdb_check is defined and
        rack_cmdb_check.cmdb_check_result is defined and
        'Successfully' in rack_cmdb_check.cmdb_check_result

#######################################################################################################################
########################################### VCenter Info Fetch ########################################################
#######################################################################################################################

    - name: Fetch ESXi details for Vcenter
      enclosure_synergon_data_fetch:
        enclosure: "{{ inventory_hostname }}"
        synergon_api: "{{ synergon_url }}"
      delegate_to: localhost
      register: esxi_data

    - name: Debug ESXi data
      debug:
        var: esxi_data

    - name: Debug Vcenter value
      debug:
        msg: "Vcenter: {{ esxi_data.esxi_details[0].vcenter }}"

    - name: Get timestamp from the system
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      register: tstamp

    - set_fact:
        time: "{{ tstamp.stdout }}"

    - name: Log failure for Vcenter using lineinfile (append)
      lineinfile:
        path: "{{ file_failure_fqdn }}"
        line: "{{ inventory_hostname }}, {{ time }}, [ERROR], Failed to fetch Vcenter for the server from Synergon. Details: {{ esxi_data | to_json }}"
        create: yes
        insertafter: EOF
        mode: '0644'
      delegate_to: localhost
      when: >
        (esxi_data.skipped is not defined or not esxi_data.skipped) and
        (
          esxi_data.failed is defined and esxi_data.failed or
          esxi_data.esxi_details is not defined or
          esxi_data.esxi_details | length == 0 or
          esxi_data.esxi_details[0].vcenter is not defined or
          esxi_data.esxi_details[0].vcenter | trim == "" or
          esxi_data.esxi_details[0].vcenter in ['Exception', 'Unable']
        )

    - name: Log success for Vcenter using lineinfile
      lineinfile:
        path: "{{ file_suc_fqdn }}"
        line: "{{ inventory_hostname }}, {{ time }}, [INFO], Successfully fetched Vcenter for the server from Synergon: {{ esxi_data.esxi_details[0].vcenter }}"
        create: yes
        insertafter: EOF
        mode: '0644'
      delegate_to: localhost
      when: >
        esxi_data is defined and
        esxi_data.esxi_details is defined and
        esxi_data.esxi_details | length > 0 and
        esxi_data.esxi_details[0].vcenter is defined and
        esxi_data.esxi_details[0].vcenter | trim != "" and
        esxi_data.esxi_details[0].vcenter not in ['Exception', 'Unable']

################################# Updating Statefile with Vcenter info ###########################################

    - name: Update entry for DECO server for Vcenter Info
      azure_update_module_vals_esxi:
        connection_string: "{{ private_endpoint_connection_string }}"
        hostname: "{{ inventory_hostname }}"
        module_name: "vcenter_info"
        status: "{{ esxi_data.esxi_details[0].vcenter }}"
      register: update_status
      delegate_to: localhost
      when: >
        esxi_data is defined and
        esxi_data.esxi_details is defined and
        esxi_data.esxi_details | length > 0 and
        esxi_data.esxi_details[0].vcenter is defined and
        esxi_data.esxi_details[0].vcenter | trim != "" and
        esxi_data.esxi_details[0].vcenter not in ['Exception', 'Unable']

# Rescue block to handle any exceptions that occur during the tasks during BMC fetch
  rescue:
    - name: When above one throws error the below task should execute
      debug:
        msg: "Exception occurred but rescued - check errors for CMDB_Fetch module"

    - name: Get timestamp from the system
      shell: "date +%Y-%m-%d/%H:%M"
      delegate_to: localhost
      register: tstamp

    - set_fact:
        time: "{{ tstamp.stdout }}"

    - name: ESXi failure host list
      shell: echo "{{ inventory_hostname }}, {{ time }}, [ERROR], fetch cmdb module failed while fetching server name. Either connection or access issue or server not found " >> {{ file_failure_fqdn }}
      delegate_to: localhost

